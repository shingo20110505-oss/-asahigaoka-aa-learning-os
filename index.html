(()=>{'use strict';const errors=[];window.__RISE_RUNTIME_ERRORS__=errors;const record=(type,value)=>{try{const text=String(value?.stack||value?.message||value||type).slice(0,700);errors.push(`${type}:${text}`);if(errors.length>8)errors.shift();document.documentElement.dataset.riseRuntimeError=text.replace(/[\r\n]+/g,' ').slice(0,280)}catch(_){}};addEventListener('error',e=>record('error',e.error||e.message));addEventListener('unhandledrejection',e=>record('rejection',e.reason))})();
</script>

<script id="aa-app-boot-guard-script">
(()=>{'use strict';const root=document.documentElement;let done=false,timer=0;const core=new Set(['home','subjects','analytics','settings']);const panel={home:'.riseHomeV4',subjects:'.riseSubjectsV4',analytics:'.riseAnalyticsV4',settings:'.riseSettingsV4'};const ready=()=>{if(!window.__RISE_UI_V4__||!document.querySelector('#app main'))return false;const route=window.AA_APP?.get?.('state')?.get?.()?.route||root.dataset.riseRoute||'home';if(!core.has(route))return true;return !!document.querySelector(`#app main ${panel[route]}[data-ui-ver="4.2.0"]`)};const reveal=()=>{if(done)return;done=true;if(timer)clearInterval(timer);root.classList.remove('aa-app-booting','aa-app-boot-slow')};const check=()=>{if(ready())requestAnimationFrame(reveal)};document.addEventListener('DOMContentLoaded',check);addEventListener('pageshow',check);document.addEventListener('rise:navigation',()=>requestAnimationFrame(check));timer=setInterval(check,80);setTimeout(()=>{if(!done)root.classList.add('aa-app-boot-slow')},6000);setTimeout(reveal,15000)})();
</script>
