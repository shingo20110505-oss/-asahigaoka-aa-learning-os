<script id="rise-runtime-diagnostics">
(()=>{'use strict';const errors=[];window.__RISE_RUNTIME_ERRORS__=errors;const record=(type,value)=>{try{const text=String(value?.stack||value?.message||value||type).slice(0,700);errors.push(`${type}:${text}`);if(errors.length>8)errors.shift();document.documentElement.dataset.riseRuntimeError=text.replace(/[\r\n]+/g,' ').slice(0,280)}catch(_){}};addEventListener('error',e=>record('error',e.error||e.message));addEventListener('unhandledrejection',e=>record('rejection',e.reason))})();
</script>

<style id="aa-app-boot-guard">
html.aa-app-booting body>*{visibility:hidden!important}

</style>
<script id="aa-app-boot-guard-script">
(()=>{'use strict';
const root=document.documentElement,core=new Set(['home','subjects','analytics','settings']),panel={home:'.riseHomeV4',subjects:'.riseSubjectsV4',analytics:'.riseAnalyticsV4',settings:'.riseSettingsV4'},expectedTabs=['ホーム','入試','学習','復習'];
let blockedAt=Date.now(),observer=null,checkRaf=0,recoveryToken=0,recoveryTimers=[];
const state=()=>{try{return window.AA_APP?.get?.('state')?.get?.()||null}catch(_){return null}},route=()=>state()?.route||root.dataset.riseRoute||'home';
const canonicalizeBrand=()=>{const brand=document.querySelector('#app .brand');if(!brand)return false;const mark=brand.querySelector('.mark'),h=brand.querySelector('h1'),p=brand.querySelector('p');if(!h)return false;if(mark&&mark.textContent!=='R')mark.textContent='R';if(h.textContent.trim()!=='Rise')h.textContent='Rise';if(p&&p.textContent!=='旭丘合格のための学習OS')p.textContent='旭丘合格のための学習OS';return true};
const canonicalizePublicNav=()=>{const nav=document.querySelector('#app .nav .navin');if(!nav||!String(nav.dataset?.riseNav||'').startsWith('complete:'))return false;const h=nav.querySelector('[data-route="home"]'),e=nav.querySelector('[data-route="subjects"]'),l=nav.querySelector('[data-route="analytics"]'),r=nav.querySelector('a[href*="review"]');if(!h||!e||!l||!r)return false;const label=(x,text)=>{if(x.getAttribute('aria-label')!==text)x.setAttribute('aria-label',text);const s=x.querySelector('span');if(s&&s.textContent!==text)s.textContent=text};label(h,'ホーム');label(e,'入試');label(l,'学習');label(r,'復習');const wanted=[h,e,l,r],current=[...nav.children];if(current.length!==wanted.length||wanted.some((x,i)=>current[i]!==x))nav.replaceChildren(...wanted);return true};
const publicNavReady=()=>{if(!canonicalizePublicNav())return false;const nav=document.querySelector('#app .nav .navin'),tabs=[...nav.children];if(tabs.length!==expectedTabs.length)return false;const labels=tabs.map(x=>(x.querySelector('span')?.textContent||x.getAttribute('aria-label')||'').trim());return expectedTabs.every((label,i)=>labels[i]===label)};
const chromeReady=r=>canonicalizeBrand()&&(!core.has(r)||publicNavReady());
const contentReady=(main,r)=>{const p=main.querySelector(`${panel[r]}[data-ui-ver="4.2.0"]`);if(!p)return false;if(r==='home')return p.querySelector('.rv4Welcome h2')?.textContent?.trim()==='今日やることを、迷わない。'&&p.querySelector('.rv4Plan .rv4CardHead h3')?.textContent?.trim()==='次の一手';if(r==='subjects')return p.dataset.riseIa==='exam-priority';if(r==='analytics')return p.dataset.riseIa==='learn-priority';return true};
const ready=()=>{const main=document.querySelector('#app main');if(!window.__RISE_UI_V4__||!main)return false;const r=route();return chromeReady(r)&&(!core.has(r)||contentReady(main,r))};
const conceal=()=>{if(!blockedAt)blockedAt=Date.now();root.classList.add('aa-app-booting')};
const clearRefreshMarker=()=>{try{const u=new URL(location.href);if(!u.searchParams.has('rise_refresh'))return;u.searchParams.delete('rise_refresh');history.replaceState(history.state,'',u.href)}catch(_){} };
const reveal=()=>{blockedAt=0;root.classList.remove('aa-app-booting','aa-app-boot-slow','aa-app-boot-error');clearRefreshMarker()};
const updateBootState=()=>{if(ready()){reveal();return true}conceal();const age=Date.now()-(blockedAt||Date.now());root.classList.toggle('aa-app-boot-slow',age>=4000);root.classList.toggle('aa-app-boot-error',age>=20000);return false};
const nudge=()=>{try{document.dispatchEvent(new Event('aa:v23ready'))}catch(_){}};
const scheduleCheck=()=>{if(checkRaf)return;checkRaf=requestAnimationFrame(()=>{checkRaf=0;updateBootState()})};
const stopRecoveryTimers=()=>{for(const id of recoveryTimers)clearTimeout(id);recoveryTimers=[]};
const startRecoveryWindow=()=>{stopRecoveryTimers();const token=++recoveryToken;blockedAt=Date.now();conceal();for(const delay of [0,80,240,700,1600,3200,6000,12000,20000]){recoveryTimers.push(setTimeout(()=>{if(token!==recoveryToken)return;if(updateBootState())return;if(delay<20000)nudge()},delay))}};
const attach=()=>{const app=document.getElementById('app');if(app&&!observer){observer=new MutationObserver(scheduleCheck);observer.observe(app,{childList:true,subtree:true})}if(ready())reveal();else startRecoveryWindow()};
async function refreshLatest(){const btn=document.getElementById('riseBootRetry');if(btn){btn.disabled=true;btn.textContent='最新版を取得中…'}try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.allSettled(regs.map(r=>r.update()));for(const r of regs){try{r.waiting?.postMessage?.({type:'SKIP_WAITING'})}catch(_){}}await new Promise(resolve=>setTimeout(resolve,450))}}catch(_){}const u=new URL(location.href);u.searchParams.set('rise_refresh',Date.now().toString(36));location.replace(u.href)}
document.addEventListener('DOMContentLoaded',attach,{once:true});
addEventListener('pageshow',()=>{if(ready())reveal();else attach()});
document.addEventListener('rise:navigation',()=>{conceal();startRecoveryWindow()});
document.addEventListener('click',e=>{if(e.target?.closest?.('#riseBootRetry'))void refreshLatest()});
})();
</script>
