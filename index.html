<script id="aa-app-boot-guard-script">
(()=>{'use strict';let done=false;const reveal=()=>{if(done)return;done=true;document.documentElement.classList.remove('aa-app-booting','aa-app-boot-slow')};document.addEventListener('aa:v23ready',()=>requestAnimationFrame(reveal),{once:true});addEventListener('pageshow',()=>{if(window.__AA_AI_READING_V1__)requestAnimationFrame(reveal)});setTimeout(()=>{if(window.__AA_AI_READING_V1__)reveal();else document.documentElement.classList.add('aa-app-boot-slow')},8000);setTimeout(reveal,15000)})();
</script>

<script id="rise-critical-shell">
(()=>{'use strict';
 const root=document.documentElement;
 root.dataset.riseUi='4';root.dataset.riseSkin='v4';
 const labels={home:'HOME',mission:'今日',subjects:'演習',exam:'入試',mock:'入試',tests:'入試',analytics:'分析',settings:'設定'};
 function apply(){
  const app=document.getElementById('app');if(!app)return;
  const active=app.querySelector('.nav button.active[data-route]');const route=active?.dataset?.route||root.dataset.riseRoute||'home';root.dataset.riseRoute=route;
  const brand=app.querySelector('.brand');if(brand){const mark=brand.querySelector('.mark'),h=brand.querySelector('h1'),p=brand.querySelector('p');if(mark)mark.textContent='R';if(h)h.textContent='Rise';if(p)p.textContent='旭丘合格のための学習OS'}
  app.querySelectorAll('.nav button[data-route]').forEach(btn=>{const t=labels[btn.dataset.route];if(!t)return;btn.setAttribute('aria-label',t);const nodes=[...btn.childNodes].filter(n=>n.nodeType===3);nodes.forEach(n=>n.remove());let s=btn.querySelector(':scope > span');if(!s){s=document.createElement('span');btn.appendChild(s)}s.textContent=t});
  const main=app.querySelector('main');if(route==='home'&&main&&!main.querySelector('.riseHomeV4')){main.insertAdjacentHTML('afterbegin','<section class="riseHomeV4" data-hydrated="0"><header class="rv4Welcome"><div><span>RISE / LEARNING OS</span><h2>今日の一歩を、合格力に。</h2><p>学習データを準備しています</p></div></header><div class="rv4Metrics"><article class="rv4Card rv4Metric"><div class="rv4CardHead"><h3>旭丘 Readiness</h3><span>総合指標</span></div><div class="rv4MetricBody"><strong>--</strong><small>/100</small><div class="rv4Ring" style="--v:0"></div></div><p>測定準備中</p></article><article class="rv4Card rv4Metric"><div class="rv4CardHead"><h3>記憶の定着度</h3><span>現在</span></div><div class="rv4MetricBody"><strong>--</strong><small></small><div class="rv4Donut" style="--a:0;--b:0"></div></div><div class="rv4Legend"><span><i></i>学習履歴を確認中</span></div></article></div></section>')}
 }
 const mo=new MutationObserver(()=>requestAnimationFrame(apply));mo.observe(document.documentElement,{childList:true,subtree:true});
 document.addEventListener('DOMContentLoaded',apply);addEventListener('pageshow',apply);requestAnimationFrame(apply);
 setTimeout(()=>{if(!window.__RISE_UI_V4__){const s=document.createElement('script');s.src='./app/ui/rise-ui-v4.js?v=4.0.2-retry-'+Date.now();s.async=false;document.body.appendChild(s)}},900);
})();
</script>
