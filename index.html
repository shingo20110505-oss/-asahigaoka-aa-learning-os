同盟","period":"明治","note":"ロシアへの対抗"},{"id":"h072","year":1904,"event":"日露戦争","period":"明治","note":"満州・朝鮮をめぐる対立"},{"id":"h073","year":1910,"event":"韓国併合","period":"明治","note":"日本の植民地支配拡大"},{"id":"h074","year":1911,"event":"関税自主権回復","period":"明治","note":"不平等条約改正完成"},{"id":"h075","year":1914,"event":"第一次世界大戦開始","period":"大正","note":"日本は連合国側で参戦"},{"id":"h076","year":1918,"event":"米騒動・原敬内閣","period":"大正","note":"社会運動と政党政治"},{"id":"h077","year":1919,"event":"ベルサイユ条約","period":"大正","note":"国際連盟設立へ"},{"id":"h078","year":1925,"event":"普通選挙法・治安維持法","period":"大正","note":"民主化と統制強化の両面"},{"id":"h079","year":1929,"event":"世界恐慌","period":"昭和戦前","note":"昭和恐慌・ブロック経済へ"},{"id":"h080","year":1931,"event":"満州事変","period":"昭和戦前","note":"軍部台頭と国際的孤立"},{"id":"h081","year":1932,"event":"五・一五事件","period":"昭和戦前","note":"政党内閣の終焉"},{"id":"h082","year":1933,"event":"日本が国際連盟脱退","period":"昭和戦前","note":"国際的孤立が深まる"},{"id":"h083","year":1936,"event":"二・二六事件","period":"昭和戦前","note":"軍部の政治的影響増大"},{"id":"h084","year":1937,"event":"日中戦争開始","period":"昭和戦前","note":"戦争の長期化"},{"id":"h085","year":1939,"event":"第二次世界大戦開始","period":"昭和戦前","note":"ドイツのポーランド侵攻"},{"id":"h086","year":1941,"event":"太平洋戦争開始","period":"昭和戦前","note":"真珠湾攻撃、対米英戦争"},{"id":"h087","year":1945,"event":"第二次世界大戦終結","period":"戦後","note":"占領・民主化へ"},{"id":"h088","year":1946,"event":"日本国憲法公布","period":"戦後","note":"国民主権・基本的人権・平和主義"},{"id":"h089","year":1947,"event":"日本国憲法施行・教育基本法","period":"戦後","note":"戦後改革の制度化"},{"id":"h090","year":1951,"event":"サンフランシスコ平和条約","period":"戦後","note":"主権回復へ"},{"id":"h091","year":1956,"event":"日ソ共同宣言・国連加盟","period":"戦後","note":"国際社会復帰"},{"id":"h092","year":1960,"event":"新日米安全保障条約","period":"戦後","note":"高度成長期の外交"},{"id":"h093","year":1964,"event":"東京オリンピック","period":"戦後","note":"高度経済成長と国際化"},{"id":"h094","year":1972,"event":"沖縄返還・日中国交正常化","period":"戦後","note":"戦後外交の転換"},{"id":"h095","year":1973,"event":"第一次石油危機","period":"戦後","note":"高度経済成長終焉の契機"},{"id":"h096","year":1989,"event":"平成開始・冷戦終結へ","period":"現代","note":"国際秩序の大転換期"},{"id":"h097","year":1991,"event":"ソ連解体","period":"現代","note":"冷戦終結後の世界"},{"id":"h098","year":2001,"event":"アメリカ同時多発テロ","period":"現代","note":"国際安全保障の変化"},{"id":"h099","year":2015,"event":"持続可能な開発目標SDGs採択","period":"現代","note":"地球規模課題への国際目標"}],"readingScenarios":[{"id":"r01","theme":"environment","genre":"expository","setting":"school garden","title":"Watering the School Garden","facts":["A science club watered every plant at the same time each day.","Some parts of the garden stayed wet much longer than other parts.","The students measured the soil before they changed the schedule.","They began to water each area only when its soil became dry.","The total amount of water fell, but the plants stayed healthy."],"lesson":"A fixed rule is not always the best rule when conditions are different.","grammar":["comparison","presentPerfect"],"inference":"The best schedule can depend on local conditions instead of one fixed time.","extension":"The group compared sunny areas with shaded areas as well. The shaded soil often stayed wet after the sunny soil became dry. This difference helped the students see why one schedule for the whole garden wasted water."},{"id":"r02","theme":"community","genre":"report","setting":"local library","title":"A Quieter Library Plan","facts":["The local library received more complaints about noise near the entrance.","Staff first put up more warning signs, but the number of complaints did not change much.","Students observed how people moved through the building after school.","They found groups stopped near the entrance because the waiting area had too few seats.","The library moved several seats away from the entrance, and the complaints decreased."],"lesson":"A visible problem can have a different cause from the one people first imagine.","grammar":["presentPerfect","comparison"],"inference":"Changing a visible symptom may fail when the hidden cause remains.","extension":"The staff compared the entrance with another busy part of the building. Noise did not increase in the second place because people had enough room to wait. The comparison made the seating problem easier to notice."},{"id":"r03","theme":"technology","genre":"expository","setting":"school tablet program","title":"Fewer Notifications, Better Focus","facts":["A class used tablets for research and writing.","Many students opened messages while they were reading long articles.","The teacher did not ban tablets because the devices were necessary for the work.","Instead, the class turned off nonessential notifications during study periods.","Students finished more tasks within the same amount of time."],"lesson":"Removing a small source of interruption can improve attention without removing useful technology.","grammar":["gerund","comparison"],"inference":"Reducing interruptions can improve focus while useful technology remains available.","extension":"The class also compared two study periods of the same length. Students used the same tablets and worked on similar tasks. The main difference was the number of messages appearing on the screen during the work."},{"id":"r04","theme":"science","genre":"experiment","setting":"classroom experiment","title":"Which Cup Keeps Water Warm?","facts":["Students tested three cups. Each cup was made from a different material.","They poured the same amount of hot water into each cup.","They measured the temperature every five minutes.","The thick paper cup kept the water warmer than the metal cup during the first ten minutes.","The class repeated the test before it wrote a conclusion."],"lesson":"A reliable conclusion needs controlled conditions and repeated measurements.","grammar":["passive","comparison"],"inference":"Repeating a controlled test makes a conclusion more dependable.","extension":"The students used equal amounts of water and started each test at the same temperature. They also placed the cups in the same part of the room. These controls made the material of each cup the main difference."},{"id":"r05","theme":"culture","genre":"narrative","setting":"international exchange day","title":"A Better Way to Introduce a Tradition","facts":["Mai planned to explain a local festival to exchange students.","Her first slide had many dates and difficult words.","During practice, her friend could not explain the main idea after the talk.","Mai replaced several details with one short story and two pictures.","The exchange students later asked more questions about the festival."],"lesson":"Good communication is not the same as giving the largest amount of information.","grammar":["infinitive","comparison"],"inference":"Selecting a few clear points can communicate an idea better than adding many details.","extension":"Mai asked another friend to listen without seeing her notes. The friend remembered the story and the two pictures but forgot several dates from the first version. This helped Mai select the most useful information for the final slide."},{"id":"r06","theme":"health","genre":"report","setting":"school lunch survey","title":"Why Students Left Fruit","facts":["A school noticed many pieces of fruit were left after lunch.","Teachers thought students simply disliked fruit.","A survey showed many students wanted fruit but had little time at the end of lunch.","The school served fruit earlier in the meal for one week.","Less fruit was left even though the menu did not change."],"lesson":"Before solving a problem, it is useful to test the reason behind it.","grammar":["gerund","past"],"inference":"A solution can fail when people do not check the assumed cause first.","extension":"The school compared two lunch periods before changing the menu. Students chose fruit at similar rates in both periods, but more fruit remained when the last part of lunch was shorter. Time became a more useful clue than preference."},{"id":"r07","theme":"transport","genre":"report","setting":"bicycle route","title":"The Shortest Route Was Not the Fastest","facts":["Ken chose the shortest bicycle route to his club activity.","The route had three busy intersections.","He often waited at red lights for several minutes.","He tested a slightly longer route with fewer intersections for one week.","His average travel time became shorter and more stable."],"lesson":"Distance alone does not always determine travel time.","grammar":["comparison","presentPerfect"],"inference":"A slightly longer path can save time when it avoids repeated delays.","extension":"Ken recorded travel time on several days instead of judging the routes from one trip. Traffic changed from day to day, but the route with fewer intersections showed a smaller difference between the fastest and slowest times."},{"id":"r08","theme":"education","genre":"narrative","setting":"study group","title":"The Question Notebook","facts":["Four students studied history together before a test.","At first, they only reread the textbook and highlighted important lines.","One student began to close the book and ask questions from memory.","The group wrote down difficult questions. Nobody could answer them quickly.","Their next meeting focused on those questions instead of rereading every page."],"lesson":"Finding gaps in recall can make review more efficient.","grammar":["gerund","infinitive"],"inference":"Trying to recall information can reveal the parts for further review.","extension":"At the next meeting, the students marked each question as easy, uncertain, or difficult before opening the book. They spent most of their time on the uncertain and difficult questions. This made the review more focused."},{"id":"r09","theme":"environment","genre":"expository","setting":"school electricity project","title":"Lights Left On After School","facts":["A school wanted to reduce electricity use after classes.","Students first counted the number of lights in each room.","The largest rooms did not always use the most electricity.","Some small rooms kept their lights on for a much longer time.","The school changed its plan and focused on time as well as room size."],"lesson":"A useful measure must match the real cause of the problem.","grammar":["comparison","modal"],"inference":"Counting objects alone can miss an important pattern in how long they are used.","extension":"The students later recorded both the number of lights and the time each room stayed in use. A small practice room had fewer lights, but people often left them on long after the room became empty."},{"id":"r10","theme":"business","genre":"report","setting":"student market","title":"Why the Cheapest Item Did Not Sell Most","facts":["Students sold handmade notebooks at a school market.","They expected the cheapest notebook to sell the most.","Many visitors picked up the cheapest one but bought a stronger notebook instead.","A short survey showed buyers cared about durability as well as price.","The students changed their display to explain both price and strength."],"lesson":"People often make choices by considering more than one factor.","grammar":["infinitive","comparison"],"inference":"Price can be only one of several reasons behind a purchase.","extension":"The survey did not ask buyers to choose only one reason. Some people valued a low price, while others cared more about a strong cover. The students learned to compare several factors before changing the product display."},{"id":"r11","theme":"nature","genre":"experiment","setting":"seed experiment","title":"Light Was Not the Only Factor","facts":["A class placed seeds in two different places.","One group received more light than the other group.","The brighter place was also warmer during the afternoon.","The seeds in the brighter place grew faster.","The teacher asked the class to design a new test before it decided light caused the difference."],"lesson":"When two conditions change at the same time, one test may not identify the true cause.","grammar":["comparison","past"],"inference":"A fair test separates factors capable of changing the result.","extension":"For the new test, the class planned two places with similar temperatures and different amounts of light. It also planned another pair with similar light and different temperatures. The new design separated the two possible causes."},{"id":"r12","theme":"communication","genre":"narrative","setting":"school festival team","title":"A Message Nobody Read","facts":["A festival team sent one long message with every rule for the event.","Several members missed important information in the middle of the message.","The leader first blamed the members for not reading carefully.","Another student divided the information into three short messages with clear headings.","After that change, fewer questions were repeated."],"lesson":"The form of information can affect how well people use it.","grammar":["gerund","modal"],"inference":"Clear organization can make important information easier to use.","extension":"The team kept the same rules in the new messages, so the total information did not become smaller. Members simply saw the most urgent points first and could find details under clear headings when they needed them."},{"id":"r13","theme":"sports","genre":"report","setting":"running club","title":"Training Harder Was Not Enough","facts":["A running club wanted to improve its five-kilometer times.","Some members added a hard run every day.","Their times improved for a short period but then became less stable.","The coach added easier days between difficult sessions.","Several runners later completed faster times with less pain."],"lesson":"More effort is not always better when recovery is part of performance.","grammar":["comparison","presentPerfect"],"inference":"Recovery can be part of effective training rather than the opposite of effort.","extension":"The coach compared weekly training records instead of looking only at the hardest day. Runners with easier days could complete the next difficult session at a steadier pace. The pattern suggested recovery supported the quality of later practice."},{"id":"r14","theme":"food","genre":"expository","setting":"cafeteria","title":"A Smaller Plate Changed Waste","facts":["A cafeteria had a problem with food waste.","Students could take as much rice as they wanted.","Many students took more rice than they could finish.","The cafeteria offered a smaller first serving and free extra rice after that.","Waste decreased while students could still eat enough."],"lesson":"Changing the default choice can change behavior without removing freedom.","grammar":["asMuchAs","modal"],"inference":"Changing the easiest first choice can influence behavior without removing freedom.","extension":"Students could still ask for more rice, and many did. The difference was the amount placed on the plate before anyone made an extra choice. The change reduced unfinished food while the option of a larger meal remained."},{"id":"r15","theme":"design","genre":"report","setting":"class poster project","title":"The Poster With Less Text","facts":["Two groups made posters about earthquake safety.","One poster contained twice as many words as the other one.","Students had only thirty seconds to look at each poster.","More students remembered the three main actions from the poster with less text.","The class concluded information must be selected for the time available."],"lesson":"More information can reduce understanding when attention time is limited.","grammar":["asManyAs","comparison"],"inference":"Information works better when its amount matches the time available for attention.","extension":"The class asked students to write the three actions they remembered after viewing each poster. The longer poster included more facts, but many readers could not identify its most important actions within thirty seconds."},{"id":"r16","theme":"history","genre":"expository","setting":"museum project","title":"Dates and Causes","facts":["A museum club made a timeline about the opening of Japan.","Its first version listed dates but did not explain why events followed one another.","A teacher asked the club to add one cause and one result to each major event.","Visitors spent more time comparing the events after the change.","The club kept the dates but used them as anchors for a larger story."],"lesson":"Chronology becomes more useful when it is connected to cause and consequence.","grammar":["infinitive","passive"],"inference":"Dates become more meaningful when learners connect them with causes and results.","extension":"The revised timeline used arrows between selected events. A date still helped visitors locate each event, but the arrows encouraged them to ask why one event changed the conditions for the next one."},{"id":"r17","theme":"data","genre":"report","setting":"weather project","title":"The Average Hid the Difference","facts":["Students compared the average temperature of two months.","The two averages were almost the same.","One month had many days near the average, while the other month had very hot and very cool days.","The students added a graph of daily temperatures.","The averages looked similar, but the graph showed an important difference."],"lesson":"One summary number may hide an important pattern in the data.","grammar":["comparison","modal"],"inference":"Similar averages do not guarantee similar patterns in the original data.","extension":"The class then compared the highest and lowest temperatures in each month. One month had a much wider range. The extra information did not make the average wrong; it showed the average answered only one kind of question."},{"id":"r18","theme":"society","genre":"expository","setting":"local park","title":"Who Uses the Park?","facts":["A town planned to add more benches to a park.","Officials counted visitors only on weekday mornings.","The data showed most visitors were older adults.","Students repeated the count in the evening and on weekends.","The new data showed many families and teenagers as well."],"lesson":"A sample can give a misleading picture when it does not represent all important times or groups.","grammar":["passive","modal"],"inference":"Data from only one time period may not represent all users of a place.","extension":"The students did not throw away the morning data. They combined it with counts from other times and labeled each observation period clearly. The wider sample changed the town's picture of park users."},{"id":"r19","theme":"technology","genre":"narrative","setting":"robot club","title":"The Sensor Problem","facts":["A robot club built a machine. It stopped before a wall.","The robot worked well in a bright room but failed in a darker room.","The students first changed the motor speed, but the problem remained.","They then tested the light sensor under different conditions.","After they changed the sensor setting, the robot worked in both rooms."],"lesson":"A good test changes the factor most closely connected to the failure.","grammar":["comparison","past"],"inference":"A useful test targets a factor closely connected with the failure.","extension":"The club compared the robot in bright and dark rooms. The path and motor settings stayed the same during the comparison. The difference appeared before the motor moved, so the students shifted their attention from speed to sensing."},{"id":"r20","theme":"community","genre":"report","setting":"volunteer project","title":"Fewer Volunteers, Better Timing","facts":["A cleanup project had many volunteers on its first day.","Several people arrived at the same place and waited for tools.","The organizers thought they needed even more tools.","They later divided volunteers into smaller groups with different starting times.","The second event finished earlier even though it used the same number of tools."],"lesson":"Coordination can improve performance without adding more resources.","grammar":["comparison","past"],"inference":"Better coordination can improve efficiency without adding more resources.","extension":"The organizers recorded how long volunteers waited for tools during both events. The number of tools stayed the same, but waiting time fell after the starting times were separated. The change improved the use of resources already available."}],"skills":{"en.read.inference":{"label":"英語・推論","subject":"english","impact":1.0},"en.read.paraphrase":{"label":"英語・言い換え","subject":"english","impact":0.98},"en.read.cause":{"label":"英語・因果","subject":"english","impact":0.92},"en.read.detail":{"label":"英語・内容把握","subject":"english","impact":0.88},"en.read.mainIdea":{"label":"英語・要旨","subject":"english","impact":0.95},"en.read.speed":{"label":"英語・処理速度","subject":"english","impact":0.9},"en.vocab.context":{"label":"英単語・文脈","subject":"english","impact":0.92},"en.vocab.recall":{"label":"英単語・想起","subject":"english","impact":0.86},"en.grammar.transfer":{"label":"英文法・長文転移","subject":"english","impact":0.88},"ja.kanji.reading":{"label":"国語・漢字読み","subject":"japanese","impact":0.72},"ja.kanji.context":{"label":"国語・語彙文脈","subject":"japanese","impact":0.84},"ja.read.logic":{"label":"国語・論理読解","subject":"japanese","impact":0.98},"math.calc.accuracy":{"label":"数学・計算精度","subject":"math","impact":0.9},"math.algebra":{"label":"数学・代数","subject":"math","impact":0.93},"math.function":{"label":"数学・関数","subject":"math","impact":0.98},"math.geometry":{"label":"数学・図形","subject":"math","impact":1.0},"math.probability":{"label":"数学・確率","subject":"math","impact":0.9},"math.strategy":{"label":"数学・方針選択","subject":"math","impact":1.0},"sci.knowledge":{"label":"理科・知識","subject":"science","impact":0.78},"sci.experiment":{"label":"理科・実験考察","subject":"science","impact":1.0},"sci.graph":{"label":"理科・資料読解","subject":"science","impact":0.96},"sci.calc":{"label":"理科・計算","subject":"science","impact":0.96},"soc.history.chronology":{"label":"社会・歴史年代","subject":"social","impact":0.78},"soc.history.causality":{"label":"社会・歴史因果","subject":"social","impact":0.96},"soc.history.contemporary":{"label":"社会・同時代史","subject":"social","impact":0.94},"soc const READING_DISTRACTORS={"r01":[["The club increased the amount of water after it measured the soil.","The plants became unhealthy when the students changed the schedule.","The students continued to water every area at exactly the same time."],["One fixed schedule is always best when a task is repeated every day.","Healthy plants always need a larger amount of water.","Soil conditions do not matter if the watering time is regular."]],"r02":[["More warning signs immediately reduced the number of complaints.","Students found that most noise came from people returning books.","The library removed all waiting seats near the entrance."],["A visible problem is always caused by people who ignore rules.","Adding more warnings is the most effective solution to a noise problem.","Moving people away from an entrance always makes a library quieter."]],"r03":[["The teacher banned tablets during every class activity.","Students received more notifications after the new rule began.","The class finished fewer tasks when messages were turned off."],["Useful technology should always be removed when students lose focus.","More notifications help students complete long reading tasks faster.","Interruptions have no effect if a device is necessary for schoolwork."]],"r04":[["The metal cup kept the water warmer than the thick paper cup.","The students poured different amounts of water into the three cups.","The class wrote its final conclusion before repeating the test."],["A single measurement is enough when the result looks clear.","Changing several conditions at once makes a comparison more reliable.","The material of a cup can be judged without controlling the amount of water."]],"r05":[["Mai added more dates and difficult words after the practice talk.","Her friend could explain every detail of the first slide easily.","The exchange students asked fewer questions after the slide was simplified."],["A presentation becomes clearer whenever more facts are added.","Pictures should replace all words in an explanation.","Difficult vocabulary is necessary for explaining a local tradition."]],"r06":[["The school changed the fruit menu before it asked students any questions.","The survey showed that most students disliked every kind of fruit.","More fruit was left after the school served it earlier in the meal."],["Food waste is mainly caused by students disliking healthy food.","A menu must change before the timing of a meal can affect waste.","Surveys are unnecessary when teachers already have an explanation."]],"r07":[["The shortest route had fewer intersections than the longer route.","Ken's travel time became longer after he changed routes.","Ken tested the longer route for only one trip."],["The shortest physical distance always produces the shortest travel time.","Traffic delays are unimportant when comparing two routes.","A longer route can never be more reliable than a shorter one."]],"r08":[["The group stopped asking questions and returned to rereading every page.","Every student could answer the difficult questions immediately.","The group removed all difficult questions from its next meeting."],["Rereading every page is always the fastest way to find weak knowledge.","Questions are useful only after students already know every answer.","Students should avoid testing memory because mistakes reduce learning."]],"r09":[["The largest rooms always used the most electricity.","Students decided that the number of lights was the only useful measure.","Small rooms kept their lights on for a shorter time than every large room."],["Counting more objects always gives the best measure of energy use.","Room size alone determines how much electricity a room uses.","Time can be ignored when the number of lights is known."]],"r10":[["Most visitors bought the cheapest notebook after picking it up.","The survey showed that buyers cared only about price.","The students removed information about notebook strength from the display."],["Customers always choose the lowest price when products are similar.","Durability never affects a purchase when the price is visible.","One factor is enough to explain every buying decision."]],"r11":[["The brighter place and the darker place had the same temperature.","The teacher concluded immediately that light caused the difference.","The class decided there was no need for another test."],["When two conditions change together, the faster result proves which one caused it.","A fair test should change as many factors as possible at the same time.","Temperature can be ignored whenever light levels are different."]],"r12":[["The leader solved the problem by making the original message longer.","Members found every important rule easily in the first message.","Repeated questions increased after the information was divided into sections."],["Longer messages are always easier to use because they contain more detail.","Headings make information harder to find when a message is important.","Readers miss information only because they do not try hard enough."]],"r13":[["Every runner became faster as soon as hard training was added every day.","The coach removed all difficult sessions from the training plan.","Runners later became slower and reported more pain after easier days were added."],["Rest always reduces athletic performance.","The hardest possible training every day is the safest way to improve.","Recovery and effective practice cannot be part of the same training plan."]],"r14":[["The cafeteria stopped students from asking for extra rice.","Food waste increased after the first serving became smaller.","Students could no longer eat as much rice as they needed."],["Reducing waste requires removing every option for a larger meal.","People never change behavior when all choices remain available.","The largest first serving is always the best way to prevent waste."]],"r15":[["Students had unlimited time to read both posters.","The poster with more words helped more students remember the three main actions.","The class concluded that every poster should contain as much text as possible."],["More information always produces better memory when readers have little time.","Reading time does not affect how much information a poster should contain.","Important actions are easier to remember when they are surrounded by more details."]],"r16":[["The club removed every date from the revised timeline.","The first version already explained why each event led to the next one.","Visitors spent less time comparing events after causes and results were added."],["Dates are most useful when learners avoid connecting events.","A timeline should contain only years because causes make history confusing.","Chronology and causality cannot support each other in historical understanding."]],"r17":[["The two months had exactly the same pattern of daily temperatures.","The graph showed no difference that the averages had hidden.","The students decided that daily temperatures were unnecessary once the average was known."],["Two equal averages prove that the original data have the same distribution.","A single summary number always describes every important feature of a data set.","Graphs are unnecessary when an average has already been calculated."]],"r18":[["Officials counted visitors equally across mornings, evenings, and weekends from the start.","The wider survey showed that only older adults used the park.","Students stopped collecting data after the weekday morning count."],["One convenient time period always represents every user of a public place.","Adding observations from different times makes a sample less representative.","Visitor patterns cannot change between weekdays and weekends."]],"r19":[["Changing the motor speed solved the problem in the darker room.","The robot failed in both bright and dark rooms before the sensor was tested.","The students never tested the light sensor under different conditions."],["Any part of a machine is equally useful to test when a failure occurs.","Motor speed must be the cause whenever a robot stops before a wall.","Testing a factor unrelated to the failure is the fastest way to find a cause."]],"r20":[["The organizers bought more tools before the second event.","The second event took longer even though volunteers started at different times.","All volunteers continued to arrive at the same place at the same time."],["Efficiency can improve only when more physical resources are added.","Using the same number of tools always produces the same total time.","Coordination cannot reduce waiting when the amount of equipment stays unchanged."]]};

 else if(kind==='mixed'){for(let sub of Object.keys(SUBJECTS))for(let i=0;i<5;i++){let q=makeSubjectQ(sub,state.ui.subjectDifficulty||7);q.subject=sub;queue.push(q)}queue=shuffle(queue)}
 else if(kind==='vocab')queue=planVocabQueue(count);else if(kind==='kanji')queue=planKanjiQueue(count);else for(let i=0;i<count;i++){let q=makeSubjectQ(subject,state.ui.subjectDifficulty||7);q.subject=subject;queue.push(q)}
 state.session={id:uid('session'),active:true,mode,kind,subject:kind==='mixed'?'mixed':subject,queue,index:0,subIndex:0,answers:{},feedback:null,startedAt:now(),accumulatedMs:0,lastActiveAt:now(),itemStartedAt:now(),scrollY:0,minimumDone:false,clockPaused:false,pausedAt:null};state.stats.sessions++;state.route='study';save();render();window.scrollTo(0,0);startTicker()}
function currentQ(){let s=state.session;if(!s)return null;let item=s.queue[s.index];if(item?.type==='readingSet')return item.questions[s.subIndex];return item}
function currentReading(){let s=state.session,item=s?.queue[s.index];return item?.type==='readingSet'?item:null}
function passageVocab(read){if(!read?.passage)return [];let low=read.passage.toLowerCase();return DATA.vocab.filter(v=>new RegExp(`\\b${v.word.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i').test(low)).slice(0,10)}
function readingPaceRecord(read,s){if(!read?.firstReadMs||read.paceScored)return;let answers=read.questions.map(q=>s.answers[q.id]).filter(Boolean),acc=answers.length?answers.filter(a=>a.correct).length/answers.length:0,wpm=clamp(Math.round(read.wordCount/(read.firstReadMs/60000)),20,600),hist=safeArray(state.stats.readingPace),assisted=read.assistMode!=='exam'&&((read.glossedWords||[]).length>0||(read.preteachPlan?.words||[]).length>0),prior=hist.filter(x=>!x.assisted).slice(-12).map(x=>x.wpm).filter(Number.isFinite),base=prior.length?median(prior):wpm;read.wpm=wpm;read.paceScored=true;read.assistedPace=assisted;hist.push({at:now(),wpm,accuracy:acc,difficulty:read.difficulty,wordCount:read.wordCount,ms:read.firstReadMs,assisted});state.stats.readingPace=hist.slice(-60);if(assisted)return;let sk=getSkill('en.read.speed'),paceRatio=clamp(wpm/Math.max(40,base),.65,1.25),target=clamp(.25+.55*acc*paceRatio,.08,.96),alpha=.08+(1-sk.confidence)*.10;sk.mastery=clamp(sk.mastery+(target-sk.mastery)*alpha,.03,.99);sk.attempts++;if(acc>=.7)sk.correct++;sk.confidence=clamp(sk.confidence+(1-sk.confidence)*.045,0,1);sk.speedIndex=clamp(sk.speedIndex*.72+clamp(paceRatio/1.15,0,1)*.28,0,1);sk.retention=clamp(sk.retention*.9+acc*.1,0,1);sk.transfer=clamp(sk.transfer*.9+acc*.1,0,1);sk.lastSeenAt=now();sk.updatedAt=now()}
function readingReviewHTML(s){let reads=(s?.queue||[]).filter(x=>x?.type==='readingSet');if(!reads.length)return '';return reads.map(read=>{let words=passageVocab(read),gram=(read.grammarTags||[]).filter(x=>state.profile.grammarGate[x]!==false).map(grammarLabel),lp=read.lexicalProfile||lexicalCoverageProfile(read.passage),hard=recommendedGlosses(read,8);return `<div class="sp12"></div><section class="card"><div class="eyebrow">PRECISION REVIEW</div><h3 class="h3">${esc(read.title)}</h3><div class="metricRow"><div class="metric"><b>${read.wpm||'--'}</b><span>初読WPM</span></div><div class="metric"><b>${read.wordCount}</b><span>語数</span></div><div class="metric"><b>${Math.round(lp.coverage*1000)/10}%</b><span>開始時の推定既知語率</span></div><div class="metric"><b>${Math.round((read.preteachPlan?.assistedCoverage??lp.coverage)*1000)/10}%</b><span>重要語確認後の推定</span></div><div class="metric"><b>${(read.glossedWords||[]).length}</b><span>追加で調べた語</span></div></div><div class="sp12"></div><div class="evidence"><b>読解の核：</b> ${esc(read.lesson||'本文の根拠を使って結論を更新する流れを確認します。')}</div>${hard.length?`<p><b>優先して覚える語：</b> ${hard.map(v=>`<span class="chip">${esc(v.lemma||v.word)}＝${esc(v.meaning)}</span>`).join(' ')}</p>`:''}${words.length?`<p><b>本文中の登録語彙：</b> ${words.map(v=>`<span class="chip">${esc(v.word)}＝${esc(v.meaning)}</span>`).join(' ')}</p>`:''}${gram.length?`<p><b>関連文法：</b> ${gram.map(x=>`<span class="chip">${esc(x)}</span>`).join(' ')}</p>`:''}<div class="tiny">既知語率は診断・単語復習・長文での「知っていた／調べた」履歴から推定する個人内指標です。公式の語彙テスト得点ではありません。</div></section>`}).join('')}
function selectAnswer(idx){let s=state.session,q=currentQ();if(!s||!q||s.feedback)return;let responseMs=now()-s.itemStartedAt;let correct=idx===q.answerIndex;let choice=q.choices[idx];let meta={errorType:correct?null:(choice?.error||'unknown')};s.answers[q.id]={idx,correct,responseMs};s.feedback={qId:q.id,idx,correct,responseMs,errorType:meta.errorType};recordAttempt(q,idx,correct,responseMs,meta);if(q.srsId&&!q.diagnostic)updateSRS(q.srsId,correct,responseMs,q.format,.85);if(!correct&&q.srsId&&!q.diagnostic&&s.queue.length<25){let retry=null;if(q.type==='vocab'){let alts=['context','cloze','synonym','meaning'].filter(f=>f!==q.format);retry=makeVocabQ(q.source,rnd(alts))}else if(q.type==='kanji'){let alts=['meaning','context','synonym','reading'].filter(f=>f!==q.format);retry=makeKanjiQ(q.source,rnd(alts))}if(retry)s.queue.splice(Math.min(s.index+3,s.queue.length),0,retry)}save();render()}
function nextQuestion(){let s=state.session;if(!s)return;let item=s.queue[s.index];s.feedback=null;if(item?.type==='readingSet'&&s.subIndex<item.questions.length-1){s.subIndex++;s.itemStartedAt=now();save();render();window.scrollTo(0,0);return}if(item?.type==='readingSet'){readingPaceRecord(item,s);finishReadingLexUpdate(item,s);registerReading(item)}s.index++;s.subIndex=0;s.itemStartedAt=now();let completed=s.index>=s.queue.length;s.minimumDone=s.minimumDone||s.index>=Math.min(3,s.queue.length);if(completed){if(s.kind==='vocabDiagnostic')completeDiagnostic(s);finishSession();return}save();render();window.scrollTo(0,0)}
function pauseSessionClock(){let s=state.session;if(!s?.active||s.clockPaused)return;let t=now();s.accumulatedMs+=(t-s.lastActiveAt);s.lastActiveAt=t;s.clockPaused=true;s.pausedAt=t;pauseTicker()}
function resumeSessionClock(){let s=state.session;if(!s?.active)return;let t=now();if(s.clockPaused&&s.pausedAt&&s.itemStartedAt)s.itemStartedAt+=(t-s.pausedAt);s.clockPaused=false;s.pausedAt=null;s.lastActiveAt=t;if(state.route==='study')startTicker()}
function finishSession(){let s=state.session;if(!s)return;if(!s.clockPaused)s.accumulatedMs+=(now()-s.lastActiveAt);pauseTicker();s.clockPaused=true;s.pausedAt=now();s.active=false;s.endedAt=now();state.stats.totalMs+=s.accumulatedMs;state.route='result';save();render();window.scrollTo(0,0)}
function abandonSession(){if(!state.session)return;pauseSessionClock();state.session.active=false;state.session.abandoned=true;state.session.endedAt=now();state.route='home';save();render();window.scrollTo(0,0)}
let tickTimer=null;function startTicker(){clearInterval(tickTimer);tickTimer=setInterval(()=>{let el=document.querySelector('[data-timer]'),s=state.session;if(el&&s?.active){let ms=(s.accumulatedMs||0)+(s.clockPaused?0:(now()-s.lastActiveAt));el.textContent=fmtTime(ms)}},1000)}function pauseTicker(){clearInterval(tickTimer);tickTimer=null}

function showPWAWaiting(worker){
 if(!worker||!navigator.serviceWorker.controller)return;
 PWA.waiting=worker;
 render();
}
async function checkPWAUpdate(notify=false){
 if(!PWA.registration||!PWA.online)return;
 try{
  await PWA.registration.update();
  if(notify&&!PWA.waiting)alert('更新確認が完了しました。新しい版があれば画面上部に表示されます。');
 }catch(e){if(notify)alert('更新を確認できませんでした。通信状態を確認してください。')}
}
async function initPWA(){
 if(!('serviceWorker' in navigator)||(location.protocol!=='https:'&&location.hostname!=='localhost'))return;
 try{
  let reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});PWA.registration=reg;
  if(reg.waiting)showPWAWaiting(reg.waiting);
  reg.addEventListener('updatefound',()=>{let w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showPWAWaiting(w)})});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(PWA.reloading)return;PWA.reloading=true;location.reload()});
  setTimeout(()=>checkPWAUpdate(false),2500);
 }catch(e){console.warn('PWA registration failed',e)}
}

function studyHTML(){if(!state.session?.active)return resultHTML();let s=state.session,q=currentQ(),read=currentReading();if(!q)return `<section class="card"><h3>問題を復元できませんでした。</h3><button class="btn primary" data-action="abandon">HOMEへ</button></section>`;let answer=s.feedback;if(read&&!read.firstReadDone){let lp=read.lexicalProfile||lexicalCoverageProfile(read.passage),cov=Math.round(lp.coverage*1000)/10,target=read.lexicalTarget?Math.round(read.lexicalTarget*1000)/10:null,exam=read.assistMode==='exam';return layout(`<div class="studyHead"><section class="card flat"><div class="studyMeta"><span>初読｜英語長文</span><span data-timer>${fmtTime((s.accumulatedMs||0)+(s.clockPaused?0:(now()-s.lastActiveAt)))}</span></div><div class="progress"><i style="width:${sessionProgress()*100}%"></i></div></section></div><section class="card"><div class="eyebrow">${exam?'EXAM READING':'FIRST READ'}</div><h2 class="h2">${esc(read.title)}</h2><div class="tiny">約${read.wordCount}語｜推定既知語率 ${cov}%${target?`｜重要語確認後 ${Math.round((read.preteachPlan?.assistedCoverage??lp.coverage)*1000)/10}%（目標 ${target}%）`:''}｜推定未知語 約${Math.round(lp.unknownExpected)}語</div>${exam?'<div class="notice"><b>入試実戦：</b>単語タップ辞書・先取り語彙ヒントをOFFにしています。終了後に未知語を確認します。</div>':`<div class="vocabAssist"><button class="btn soft" data-action="toggle-vocab-support">単語タップ辞書 ${state.profile.vocabSupport?'ON':'OFF'}</button>${isIOS()?'<button class="btn ghost" data-action="chatgpt-reading">ChatGPTに相談</button>':''}<span class="supportStat">調べた語 ${(read.glossedWords||[]).length}</span></div>${((read.preteachPlan?.words||[]).length||lp.coverage<.97||readingLexStage()<=2)?`<div class="notice"><b>先に確認する重要語（支援付き初読として記録）：</b><div class="sp8"></div>${recommendedGlosses(read,10).map(g=>`<button class="chip" data-action="gloss" data-word="${esc(g.raw)}">${esc(g.raw)}＝${esc(g.meaning)}</button>`).join(' ')||'重要語は本文タップで確認できます。'}</div><div class="sp12"></div>`:''}`}<div class="passage">${renderPassage(read)}</div></section><div class="sp12"></div><div class="actions"><button class="btn primary" data-action="reading-done">初読完了・設問へ</button><button class="btn ghost" data-action="pause-home">保存してHOME</button><button class="btn danger" data-action="abandon">このセットを終了</button></div>`,false)}let idxLabel=read?`長文 ${s.subIndex+1}/${read.questions.length}`:`${s.index+1}/${s.queue.length}`;let lp=read?(read.lexicalProfile||lexicalCoverageProfile(read.passage)):null;return layout(`<div class="studyHead"><section class="card flat"><div class="studyMeta"><span>${idxLabel}｜${SUBJECTS[q.subject||s.subject]||'5教科'}</span><span data-timer>${fmtTime((s.accumulatedMs||0)+(s.clockPaused?0:(now()-s.lastActiveAt)))}</span></div><div class="progress"><i style="width:${sessionProgress()*100}%"></i></div></section></div>${read?`<section class="card"><div class="eyebrow">LONG READING</div><h2 class="h2">${esc(read.title)}</h2><div class="tiny">約${read.wordCount}語｜初読 ${read.wpm||'--'} WPM｜推定既知語率 ${Math.round(lp.coverage*1000)/10}%</div>${read.assistMode==='exam'?'<div class="notice"><b>入試実戦：</b>解答中の語彙支援は使用しません。</div>':`<div class="vocabAssist"><button class="btn soft" data-action="toggle-vocab-support">単語タップ辞書 ${state.profile.vocabSupport?'ON':'OFF'}</button>${isIOS()?'<button class="btn ghost" data-action="chatgpt-reading">ChatGPTに相談</button>':''}<span class="supportStat">調べた語 ${(read.glossedWords||[]).length}</span></div>`}<div class="passage">${renderPassage(read)}</div></section><div class="sp12"></div>`:''}<section class="card"><div class="qstem">${esc(q.stem).replace(/\n/g,'<br>')}</div>${q.choices.map((c,i)=>`<button class="choice ${answer? (i===q.answerIndex?'correct':i===answer.idx&&!answer.correct?'wrong':''):''}" data-action="answer" data-index="${i}" ${answer?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(c.text)}</button>`).join('')}${q.diagnostic&&!answer?`<button class="btn ghost" style="width:100%;margin-top:8px" data-action="diag-dontknow">わからない（推測しない）</button>`:''}${answer?feedbackHTML(q,answer):''}</section><div class="sp12"></div><div class="actions">${answer?'<button class="btn primary" data-action="next">次へ</button>':''}<button class="btn ghost" data-action="pause-home">保存してHOME</button><button class="btn danger" data-action="abandon">このセットを終了</button></div>`,false)}
function sessionProgress(){let s=state.session,item=s.queue[s.index];if(!s)return 0;let base=s.index/s.queue.length;if(item?.type==='readingSet')base+=(s.subIndex/item.questions.length)/s.queue.length;return clamp(base,0,1)}
function feedbackHTML(q,a){let ch=q.choices[a.idx],correct=q.choices[q.answerIndex],all=q.choices.map((c,i)=>`<div class="explainChoice"><b>${String.fromCharCode(65+i)}. ${i===q.answerIndex?'○ 正解':'× 不正解'}</b> ${esc(c.text)}<br>${esc(c.reason||(i===q.answerIndex?q.explanation:'設問の条件・本文の根拠と一致しません。'))}</div>`).join(''),refs=safeArray(q.evidenceRefs),refHtml=refs.length?`<div class="evidence"><b>本文根拠：</b>${refs.map(r=>`<div style="margin-top:6px"><span class="chip">第${r.paragraph}段落${r.sentence}文目</span> ${esc(r.quote)}</div>`).join('')}</div>`:(q.evidence?`<p><b>根拠：</b>${esc(q.evidence)}</p>`:'');return `<div role="status" class="feedback ${a.correct?'good':'bad'}"><h4>${a.correct?'正解':'不正解'}</h4><p><b>正答：</b>${esc(correct.text)}</p><div class="evidence"><b>考え方：</b> ${esc(correct.reason||q.explanation||'根拠を確認します。')}</div>${!a.correct?`<p><b>あなたの選択が違う理由：</b>${esc(ch?.reason||(a.idx<0?'「わからない」を選びました。ここで正答と意味を確認し、復習対象にします。':'本文・条件とのずれを確認します。'))}</p><p class="tiny">誤答タイプ：${esc(a.errorType||'未分類')}</p>`:''}${refHtml}<div class="explainAll"><b>全選択肢の解説</b>${all}</div><p class="tiny">回答時間 ${fmtTime(a.responseMs)}</p></div>`}

function analyticsHTML(){let r=overallReadiness(),days=Object.entries(state.stats.days).slice(-14),pace=safeArray(state.stats.readingPace),recentWpm=pace.length?Math.round(median(pace.slice(-10).map(x=>x.wpm))):null,lex=safeArray(state.stats.lexicalSessions),recentCov=lex.length?Math.round(avg(lex.slice(-8).map(x=>x.coverage))*1000)/10:null;return layout(`<section class="card"><div class="eyebrow">ANALYTICS</div><h2 class="h2">学習分析</h2><div class="notice">AA Readinessは公式合格率ではありません。実測データのない「偏差値」や「合格確率」は表示しません。</div><div class="sp12"></div><div class="metricRow"><div class="metric"><b>${r.score??'--'}</b><span>AA Readiness（${r.status}）</span></div><div class="metric"><b>${Math.round(r.confidence*100)}%</b><span>測定信頼度</span></div><div class="metric"><b>${state.attempts.length}</b><span>総回答数</span></div><div class="metric"><b>${fmtTime(state.stats.totalMs)}</b><span>完了セッション時間</span></div><div class="metric"><b>${recentWpm??'--'}</b><span>直近初読WPM中央値</span></div><div class="metric"><b>${recentCov!=null?recentCov+'%':'--'}</b><span>直近推定既知語率</span></div></div></section><div class="sp12"></div><section class="grid g2"><div class="card"><h3 class="h3">5教科</h3>${Object.keys(SUBJECTS).map(subjectBar).join('')}</div><div class="card"><h3 class="h3">技能別・優先順</h3>${weakSkills(10).map(w=>`<div class="barLine"><label>${esc(w.label)}</label><div class="progress"><i style="width:${Math.round(w.mastery*100)}%"></i></div><output>${w.attempts?Math.round(w.mastery*100):'--'}</output></div>`).join('')}</div></section><div class="sp12"></div><section class="card"><h3 class="h3">直近学習日</h3><div class="tableWrap"><table><thead><tr><th>日</th><th>回答</th><th>正解</th><th>学習時間</th></tr></thead><tbody>${days.map(([d,x])=>`<tr><td>${d}</td><td>${x.attempts}</td><td>${x.correct}</td><td>${fmtTime(x.ms)}</td></tr>`).join('')||'<tr><td colspan="4">まだ履歴がありません。</td></tr>'}</tbody></table></div></section>`)}
function settingsHTML(){return layout(`${storageWarningHTML()}<section class="card"><div class="eyebrow">SETTINGS</div><h2 class="h2">設定・データ</h2><div class="notice">2027年度愛知県公立高校入試の最新公表情報を前提に設計。旭丘普通科は校内順位方式Ⅴ（評定得点＋学力検査合計得点×2）、5教科各22点。公式の合格最低点は公表されていないため、本アプリは公式合格率を表示しません。</div></section><div class="sp12"></div>${pwaInstallCardHTML()}<div class="sp12"></div><section class="card"><h3 class="h3">英語長文・個人語彙カバレッジ</h3><p class="sub">語彙支援長文では、初回診断だけでなく、単語復習の保持状態・長文で調べた語・「知っていた」操作から、本文ごとの推定既知語率を計算します。入口では事前重要語を含めた支援後92%から始め、学習の進行に合わせて94〜98%へ上げ、実戦モードでは支援を外します。</p><div class="tiny">既知語率は個人内推定値であり、公式語彙検査や合格判定ではありません。92%は支援付き入口の設計値で、無支援読解の目安とは区別します。</div></section><div class="sp12"></div><section class="card"><h3 class="h3">英文法ゲート</h3><p class="sub">未履修文法を勝手に混ぜません。難しい長文でも、文法範囲とは独立して推論・言い換え・情報密度で難度を上げます。</p>${Object.entries(state.profile.grammarGate).map(([k,v])=>`<label class="switch"><span>${grammarLabel(k)}</span><input type="checkbox" data-action="grammar" data-key="${k}" ${v?'checked':''}></label>`).join('')}</section><div class="sp12"></div><section class="card"><h3 class="h3">記憶・復習エンジン</h3><p class="sub"><b>暗記事項：</b>想起可能性を R(t)=e<sup>-t/S</sup> の指数型忘却モデルで近似し、正誤・間隔・回答速度から記憶安定度Sを更新します。忘れ始めた項目を優先し、不正解は同一セッション内でも形式を変えて再想起します。<br><b>思考技能：</b>単語暗記と同一視せず、技能ごとの最終成功時刻と安定度をMISSION優先度へ加えます。</p><div class="tiny">これはエビングハウスの実験値を個人にそのまま当てはめるものではなく、忘却の指数モデルを個人の回答履歴で更新する実装です。</div></section><div class="sp12"></div><section class="card"><h3 class="h3">バックアップ</h3><div class="actions"><button class="btn soft" data-action="export">JSONを書き出す・共有</button><button class="btn ghost" data-action="import-open">JSONを読み込む・統合</button><button class="btn ghost" data-action="copy-backup">テキストで表示</button></div><div class="sp12"></div><div class="tiny">学習履歴はlocalStorageへ自動保存します。端末変更・Safariデータ削除・ホーム画面からの削除に備え、JSONをファイルまたは共有シートへ定期保存してください。</div></section><div class="sp12"></div><section class="card"><h3 class="h3">品質検査ラボ</h3><p class="sub">問題生成・正答一意性・文法ゲート・保存データ・類題重複を自己検査します。</p><div class="actions"><button class="btn primary" data-action="qa-run">総合QAを実行</button><button class="btn ghost" data-action="qa-view">前回結果</button></div></section><div class="sp12"></div><section class="card"><h3 class="h3">学問→実装</h3><p class="sub"><b>認知心理学/学習科学：</b>想起練習、適応型間隔反復、選択的Interleaving。<br><b>教育測定：</b>未校正の偏差値を排除し、技能別masteryとconfidenceを分離。<br><b>第二言語習得：</b>単語を文脈・派生・長文再登場へ接続。<br><b>HCI/行動科学：</b>起動直後の選択肢を減らし、1タップMISSIONと非懲罰的な継続設計。<br><b>統計/最適化：</b>入試重要度×弱点×忘却×転移×緊急度で次課題を選択。</p></section><div class="sp12"></div><section class="card"><button class="btn danger" data-action="reset">全学習データを初期化</button><div class="tiny">設定・履歴・習熟度をすべて消去します。</div></section>`)}

function modalHTML(){let m=state.ui.modal;if(!m)return '';if(m==='pwa')return `<div class="modal"><div class="modalBox"><div class="eyebrow">iPHONE INSTALL</div><h3 class="h3">ホーム画面に追加する</h3><ol class="installSteps"><li>Safariでこのページを開きます。</li><li>画面下の共有ボタン（四角から上向き矢印）を押します。</li><li>メニューを下へ動かして「ホーム画面に追加」を選びます。</li><li>名前が「旭丘AA OS」になっていることを確認し、右上の「追加」を押します。</li><li>ホーム画面のAAアイコンから起動します。初回オンライン表示後はオフラインでも使えます。</li></ol><div class="notice">Safariの閲覧データを消す前、端末を替える前、ホーム画面版を削除する前には、設定からJSONバックアップを保存してください。</div><div class="sp12"></div><button class="btn primary" data-action="modal-close">閉じる</button></div></div>`;if(plainObj(m)&&m.type==='gloss'){let g=m.info;return `<div class="modal"><div class="modalBox"><div class="eyebrow">WORD SUPPORT</div><div class="glossWord">${esc(g.raw)}</div><p><b>${esc(g.meaning||'内蔵辞書に未登録')}</b></p>${g.lemma&&g.lemma!==g.word?`<p class="tiny">基本形：${esc(g.lemma)}</p>`:''}<div class="notice">${g.learnable&&!state.profile.knownWords[g.lemma]?'この語は長文から復習候補に登録しました。':'意味確認だけ行います。'}</div><div class="sp12"></div><div class="actions">${g.learnable?`<button class="btn soft" data-action="gloss-known" data-word="${esc(g.lemma)}">知っていた・登録しない</button>`:''}<button class="btn primary" data-action="modal-close">本文へ戻る</button></div></div></div>`}if(m==='import')return `<div class="modal"><div class="modalBox"><h3 class="h3">JSONを読み込んで統合</h3><input type="file" accept="application/json,.json" id="importFile"><div class="sp12"></div><textarea id="importText" rows="8" placeholder="またはJSONを貼り付け"></textarea><div class="sp12"></div><div class="actions"><button class="btn primary" data-action="import-do">統合する</button><button class="btn ghost" data-action="modal-close">閉じる</button></div></div></div>`;if(m==='backup')return `<div class="modal"><div class="modalBox"><h3 class="h3">バックアップJSON</h3><textarea id="backupText" rows="18" readonly>${esc(JSON.stringify(backupPayload(),null,2))}</textarea><div class="sp12"></div><div class="actions"><button class="btn soft" data-action="backup-copy">すべてコピー</button><button class="btn primary" data-action="modal-close">閉じる</button></div></div></div>`;if(m==='qa')return `<div class="modal"><div class="modalBox"><h3 class="h3">品質検査結果</h3>${(state.qa.report||[]).map(x=>`<div class="event"><div class="${x.ok?'qaGood':'qaBad'}">${x.ok?'PASS':'FAIL'}</div><div><b>${esc(x.name)}</b><div class="tiny">${esc(x.detail)}</div></div></div>`).join('')||'<p class="sub">まだ実行していません。</p>'}<div class="sp12"></div><button class="btn primary" data-action="modal-close">閉じる</button></div></div>`;return ''}
function render(){document.documentElement.dataset.theme=state.theme;let root=document.getElementById('app');if(state.route==='home')root.innerHTML=homeHTML();else if(state.route==='mission')root.innerHTML=missionHTML();else if(state.route==='subjects')root.innerHTML=subjectsHTML();else if(state.route==='timeline')root.innerHTML=timelineHTML();else if(state.route==='study')root.innerHTML=studyHTML();else if(state.route==='result')root.innerHTML=resultHTML();else if(state.route==='analytics')root.innerHTML=analyticsHTML();else root.innerHTML=settingsHTML();if(state.session?.active&&state.route==='study')startTicker();else pauseTicker()}

function qaRun(){let report=[];function add(name,ok,detail){report.push({name,ok,detail})}
 add('データ読込',DATA.vocab.length>=80&&DATA.kanji.length>=60&&DATA.history.length>=80,`英単語${DATA.vocab.length}・漢字語彙${DATA.kanji.length}・歴史${DATA.history.length}`);
 let initCopy=state;state=defaultState();let initMission=pickMission();add('初回MISSION',initMission.kind==='vocabDiagnostic'&&initMission.subject==='english',`${initMission.title} / ${initMission.why}`);state=initCopy;
 try{let broken=migrate({schemaVersion:1,attempts:'broken',mastery:'broken',items:null,profile:{grammarGate:{participle:false}}});add('破損バックアップ防御',Array.isArray(broken.attempts)&&plainObj(broken.mastery)&&plainObj(broken.items),'異常型を安全な既定値へ補正')}catch(e){add('破損バックアップ防御',false,e.message)}
 let unique=new Set(DATA.vocab.map(x=>x.word));add('英単語ID/重複',unique.size===DATA.vocab.length,`重複 ${DATA.vocab.length-unique.size}件`);
 unique=new Set(DATA.kanji.map(x=>x.word));add('漢字語彙重複',unique.size===DATA.kanji.length,`重複 ${DATA.kanji.length-unique.size}件`);
 let okChoices=true,bad=0,genErrors=0;for(let i=0;i<120;i++){let batch=[];try{batch=[makeVocabQ(),makeKanjiQ(),makeMathQ(),makeScienceQ(),makeSocialQ(),makeJapaneseQ()]}catch(e){okChoices=false;genErrors++;continue}for(let q of batch){if(!q||!Array.isArray(q.choices)){okChoices=false;bad++;continue}let n=q.choices.filter(c=>c.ok).length,unique=new Set(q.choices.map(c=>c.text)).size===q.choices.length;if(n!==1||q.answerIndex<0||q.choices.length!==4||!unique||q.choices.some(c=>!c.reason)){okChoices=false;bad++}}}add('選択肢一意性 720問',okChoices,`異常 ${bad}件 / 生成例外 ${genErrors}件`);
 let clozeBad=0;for(let v of DATA.vocab){let q=makeVocabQ(v,'cloze');if(!q.stem.includes('_____')||q.choices[q.answerIndex]?.text!==v.word||new Set(q.choices.map(c=>c.text)).size!==4)clozeBad++}add('英単語穴埋め 107語',clozeBad===0,`異常 ${clozeBad}件`);let glossOK=['soil','complaints','temperature','evidence','students','measured'].every(w=>!!glossLookup(w).meaning);add('長文タップ辞書',glossOK,`主要語彙辞書 ${glossOK?'OK':'不足あり'}`);let diagOK=diagnosticSources().length===20;add('初回語彙診断20語',diagOK,`診断語 ${diagnosticSources().length}語`);
 let oldItemsQA=JSON.parse(JSON.stringify(state.items));let vp=planVocabQueue(8),kp=planKanjiQueue(8);let vpPairs=new Set(vp.map(q=>q.source.id+':'+q.format)),kpPairs=new Set(kp.map(q=>q.source.id+':'+q.format));let vpIDs=new Set(vp.map(q=>q.source.id)),kpIDs=new Set(kp.map(q=>q.source.id));let stagedOK=vp.length===8&&kp.length===8&&vpIDs.size===4&&kpIDs.size===4&&vpPairs.size===8&&kpPairs.size===8;state.items=oldItemsQA;add('段階学習プラン',stagedOK,`英単語 ${vpIDs.size}語/8問・漢字 ${kpIDs.size}語/8問、同一形式の重複なし`);
 let metaOK=DATA.readingScenarios.every(sc=>READING_DISTRACTORS[sc.id]?.[0]?.length===3&&READING_DISTRACTORS[sc.id]?.[1]?.length===3);add('長文シナリオ専用誤答',metaOK,`20素材の内容一致・推論に専用誤答を設定`);let covProbe=lexicalCoverageProfile(generateReading(5,'micro').passage);add('個人語彙カバレッジ',covProbe.coverage>=0&&covProbe.coverage<=1&&covProbe.tokenCount>0,`試験計算 ${Math.round(covProbe.coverage*1000)/10}% / ${covProbe.tokenCount}語`);let readOK=true,gramBad=0,dupBad=0,langCueBad=0,unmappedBad=0,seen=[],oldHF=[...state.historyFingerprints],oldRT=[...state.recentTexts];state.historyFingerprints=[];state.recentTexts=[];for(let i=0;i<36;i++){let r=generateReading(7,'standard');if(!allowedGrammar(r.dna.grammarComposition.split('+'))||grammarLeakAudit(r.passage).length){readOK=false;gramBad++}for(let q of r.questions){if(q.choices.filter(c=>c.ok).length!==1||q.answerIndex<0||q.choices.length!==4||new Set(q.choices.map(c=>c.text)).size!==q.choices.length)readOK=false;if(q.type==='inference'&&q.choices.some(c=>/[ぁ-んァ-ヶ一-龠]/.test(c.text)))langCueBad++;if(q.type!=='grammarTransfer'&&q.type!=='mainIdea'&&safeArray(q.evidenceRefs).length===0)readOK=false}unmappedBad+=lexicalCoverageProfile(r.passage).unmapped.length;if(seen.some(x=>textSimilarity(x,r.passage)>.92))dupBad++;seen.push(r.passage);registerReading(r)}state.historyFingerprints=oldHF;state.recentTexts=oldRT;add('長文生成・文法ゲート 36本',readOK&&gramBad===0&&dupBad===0&&langCueBad===0&&unmappedBad===0,`文法違反 ${gramBad} / 高重複 ${dupBad} / 言語手掛かり ${langCueBad} / 辞書未登録 ${unmappedBad}`);
 let oldLexAuto=state.stats.lexicalSessions;state.stats.lexicalSessions=Array.from({length:5},(_,i)=>({at:now()-i*86400000,coverage:.975,accuracy:.82,glossed:1,assistMode:'scaffold'}));let autoExam=recommendedReadingAssist()==='exam';state.stats.lexicalSessions=oldLexAuto;add('支援卒業判定',autoExam,'直近の辞書なし語彙率・正答率・調べ語数が安定した場合のみ実戦へ');let examProbe=generateReadingForLearner(7,'standard','exam'),scaffoldProbe=generateReadingForLearner(7,'standard','scaffold');add('長文モード分離',examProbe.assistMode==='exam'&&examProbe.lexicalTarget===null&&scaffoldProbe.lexicalTarget>0&&scaffoldProbe.preteachPlan.assistedCoverage>=scaffoldProbe.lexicalProfile.coverage,'実戦=支援なし / 学習=個人既知語率＋事前重要語支援');let stateCopy=JSON.stringify(state);try{let p=JSON.parse(stateCopy);add('保存JSON整合',!!p.schemaVersion&&Array.isArray(p.attempts),'serialize/parse 正常')}catch(e){add('保存JSON整合',false,e.message)}
 add('非公式指標の明示',true,'AA Readinessは合格率・偏差値ではない表示設計');
 add('強制終了復元項目',true,'session/queue/index/subIndex/answers/timer/pausedAtをstateに保持');
 add('バックアップ統合',typeof mergeState==='function','attemptId重複除去・新しいmastery/itemを優先・日次統計を再構築');
 add('アクセシビリティ基礎',true,'lang=ja / keyboard focus / feedback role=status / button要素');
 state.qa={lastRun:now(),report};state.ui.modal='qa';save();render()}
async function exportJSON(){let name=`asahi_learning_os_backup_${dayKey()}.json`;state.stats.lastBackupAt=now();save();let text=JSON.stringify(state,null,2),file=new File([text],name,{type:'application/json'});if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'旭丘AA Learning OS バックアップ'});return}catch(e){if(e?.name==='AbortError')return}}let url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function rebuildDayStats(attempts){let days={};for(let a of attempts){let k=dayKey(a.timestamp),d=days[k]||(days[k]={attempts:0,correct:0,ms:0});d.attempts++;if(a.correct)d.correct++;d.ms+=a.responseMs||0}return days}
function mergeState(incoming){incoming=migrate(incoming);let cur=state;let byA=new Map();for(let a of [...(cur.attempts||[]),...(incoming.attempts||[])]){let k=a.attemptId||`${a.itemId}:${a.timestamp}`,old=byA.get(k);if(!old||(a.timestamp||0)>=(old.timestamp||0))byA.set(k,a)}let attempts=[...byA.values()].sort((a,b)=>a.timestamp-b.timestamp).slice(-10000);let mastery={...cur.mastery};for(let [id,x] of Object.entries(incoming.mastery||{})){if(!mastery[id]||(x.updatedAt||0)>(mastery[id].updatedAt||0))mastery[id]=x}let items={...cur.items};for(let [id,x] of Object.entries(incoming.items||{})){if(!items[id]||(x.lastReviewAt||0)>(items[id].lastReviewAt||0))items[id]=x}let hf=[...(cur.historyFingerprints||[]),...(incoming.historyFingerprints||[])],hm=new Map();for(let x of hf)hm.set(x.id||hash(JSON.stringify(x.dna)),x);let rt=[...(cur.recentTexts||[]),...(incoming.recentTexts||[])],rm=new Map();for(let x of rt)rm.set(x.id,x);let fav=[...new Set([...(cur.favorites?.history||[]),...(incoming.favorites?.history||[])])];let out={...cur,mastery,items,attempts,historyFingerprints:[...hm.values()].sort((a,b)=>(a.at||0)-(b.at||0)).slice(-300),recentTexts:[...rm.values()].sort((a,b)=>(a.at||0)-(b.at||0)).slice(-50),favorites:{...cur.favorites,history:fav}};let rp=[...safeArray(cur.stats?.readingPace),...safeArray(incoming.stats?.readingPace)].filter(x=>plainObj(x)&&Number.isFinite(x.at)&&Number.isFinite(x.wpm)),rpm=new Map();for(let x of rp)rpm.set(`${x.at}:${x.wpm}:${x.wordCount||0}`,x);let lx=[...safeArray(cur.stats?.lexicalSessions),...safeArray(incoming.stats?.lexicalSessions)].filter(x=>plainObj(x)&&Number.isFinite(x.at)&&Number.isFinite(x.coverage)),lxm=new Map();for(let x of lx)lxm.set(`${x.at}:${x.coverage}:${x.difficulty||0}`,x);out.stats={...cur.stats,days:rebuildDayStats(attempts),sessions:Math.max(cur.stats?.sessions||0,incoming.stats?.sessions||0),totalMs:Math.max(cur.stats?.totalMs||0,incoming.stats?.totalMs||0),readingPace:[...rpm.values()].sort((a,b)=>a.at-b.at).slice(-60),lexicalSessions:[...lxm.values()].sort((a,b)=>a.at-b.at).slice(-80)};out.session=cur.session?.active?cur.session:(incoming.session?.active?incoming.session:null);return migrate(out)}
function importJSON(txt){if(txt.length>5_000_000)throw new Error('バックアップが大きすぎます（5MB上限）');let incoming=JSON.parse(txt);if(!incoming||typeof incoming!=='object'||!incoming.schemaVersion)throw new Error('Learning OS形式ではありません');state=mergeState(incoming);state.ui.modal=null;save();render()}

function handleAction(el,e){let a=el.dataset.action;if(a==='start-diagnostic'){startVocabDiagnostic()}else if(a==='diag-dontknow'){selectAnswer(-1)}else if(a==='gloss'){let read=currentReading(),info=glossLookup(el.dataset.word);if(read&&read.assistMode!=='exam'){registerGlossWord(read,info);state.ui.modal={type:'gloss',info};save();render()}}else if(a==='gloss-known'){let w=el.dataset.word;state.profile.knownWords[w]=true;delete state.profile.unknownWords[w];state.ui.modal=null;save();render()}else if(a==='toggle-vocab-support'){state.profile.vocabSupport=!state.profile.vocabSupport;save();render()}else if(a==='chatgpt-reading'){let read=currentReading(),q=currentQ();if(read&&q){let text=chatGPTConsultText(read,q);window.open('https://chatgpt.com/','_blank');copyTextSafe(text).then(ok=>{if(!ok)alert('問題文の自動コピーに失敗しました。本文を手動でコピーしてください。')})}}else if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();render()}else if(a==='start-mission'){let m=pickMission();startSession({kind:m.kind,subject:m.subject,mode:'standard'})}else if(a==='start-mission-mode'){let m=pickMission();startSession({kind:m.kind,subject:m.subject,mode:el.dataset.mode})}else if(a==='start-custom'){startSession({kind:el.dataset.kind,subject:el.dataset.subject,mode:'standard',readingAssist:el.dataset.kind==='reading'?'scaffold':undefined})}else if(a==='start-reading-exam'){startSession({kind:'reading',subject:'english',mode:'standard',readingAssist:'exam'})}else if(a==='start-mixed'){startSession({kind:'mixed',subject:'mixed',mode:'deep'})}else if(a==='start-review'){startWrongReview()}else if(a==='reading-done'){let r=currentReading(),ss=state.session;if(r&&ss&&!r.firstReadDone){r.firstReadMs=Math.max(1000,now()-ss.itemStartedAt);r.wpm=clamp(Math.round(r.wordCount/(r.firstReadMs/60000)),20,600);r.firstReadDone=true;ss.itemStartedAt=now();save();render();window.scrollTo(0,0)}}else if(a==='answer'){selectAnswer(Number(el.dataset.index))}else if(a==='next'){nextQuestion()}else if(a==='pause-home'){state.session.scrollY=window.scrollY;pauseSessionClock();state.route='home';save();render();window.scrollTo(0,0)}else if(a==='abandon'){abandonSession()}else if(a==='result-home'){state.session=null;state.route='home';save();render()}else if(a==='another-set'){let k=state.session?.kind||'subject',sub=state.session?.subject||'english',ra=state.session?.queue?.find(x=>x?.type==='readingSet')?.assistMode;startSession({kind:k,subject:sub,mode:'standard',readingAssist:ra})}else if(a==='difficulty'){state.ui.subjectDifficulty=Number(el.value);let o=document.getElementById('diffVal');if(o)o.textContent=el.value;save()}else if(a==='timeline-search'){state.ui.timelineQuery=el.value;save();clearTimeout(window.__ts);window.__ts=setTimeout(render,250)}else if(a==='toggle-year'){state.ui.timelineHideYear=!state.ui.timelineHideYear;save();render()}else if(a==='toggle-event'){state.ui.timelineHideEvent=!state.ui.timelineHideEvent;save();render()}else if(a==='fav-history'){let id=el.dataset.id,arr=state.favorites.history;state.favorites.history=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];save();render()}else if(a==='grammar'){let key=el.dataset.key,prev=!el.checked;state.profile.grammarGate[key]=el.checked;let compatible=DATA.readingScenarios.some(s=>allowedGrammar(s.grammar));if(!compatible){state.profile.grammarGate[key]=prev;el.checked=prev;alert('この設定では生成できる長文がなくなるため変更を戻しました。学習済み文法を少なくとも1組は残してください。')}save()}else if(a==='export'){exportJSON()}else if(a==='copy-backup'){state.ui.modal='backup';render()}else if(a==='import-open'){state.ui.modal='import';render()}else if(a==='modal-close'){state.ui.modal=null;save();render()}else if(a==='import-do'){let f=document.getElementById('importFile')?.files?.[0],t=document.getElementById('importText')?.value?.trim();if(f){if(f.size>5_000_000){alert('5MBを超えるファイルは読み込めません');return}let rd=new FileReader();rd.onload=()=>{try{importJSON(rd.result)}catch(err){alert(err.message)}};rd.readAsText(f)}else if(t){try{importJSON(t)}catch(err){alert(err.message)}}}else if(a==='qa-run'){qaRun()}else if(a==='qa-view'){state.ui.modal='qa';render()}else if(a==='reset'){if(confirm('本当に全学習データを初期化しますか？')){state=defaultState();save();render()}}}
document.addEventListener('click',e=>{let route=e.target.closest('[data-route]');if(route){let r=route.dataset.route;if(r==='study'&&state.session?.active){state.route='study';resumeSessionClock();save();render();requestAnimationFrame(()=>window.scrollTo(0,state.session.scrollY||0))}else{if(state.route==='study'&&state.session?.active)pauseSessionClock();setRoute(r);}return}let el=e.target.closest('[data-action]');if(el)handleAction(el,e)});
document.addEventListener('input',e=>{let el=e.target.closest('[data-action="difficulty"],[data-action="timeline-search"]');if(el)handleAction(el,e)});
document.addEventListener('change',e=>{let el=e.target.closest('[data-action="grammar"]');if(el)handleAction(el,e)});
window.addEventListener('scroll',()=>{if(state.route==='study'&&state.session?.active){state.session.scrollY=window.scrollY;clearTimeout(window.__scrollSave);window.__scrollSave=setTimeout(save,250)}} ,{passive:true});
document.addEventListener('visibilitychange',()=>{let s=state.session;if(!s?.active)return;if(document.hidden){pauseSessionClock();save()}else if(state.route==='study'){resumeSessionClock();save()}});
window.addEventListener('pagehide',()=>{if(state.session?.active)pauseSessionClock();save()});
window.addEventListener('beforeunload',save);
document.addEventListener('click',async e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;if(a==='pwa-update'){save();let w=PWA.waiting||PWA.registration?.waiting;if(w)w.postMessage({type:'SKIP_WAITING'});else location.reload()}else if(a==='pwa-check'){checkPWAUpdate(true)}else if(a==='pwa-retry'){PWA.online=navigator.onLine;render();checkPWAUpdate(false)}else if(a==='pwa-install'){if(PWA.installPrompt){PWA.installPrompt.prompt();try{await PWA.installPrompt.userChoice}finally{PWA.installPrompt=null;render()}}}else if(a==='pwa-help'){state.ui.modal='pwa';save();render()}else if(a==='backup-copy'){let txt=document.getElementById('backupText')?.value||JSON.stringify(backupPayload(),null,2),ok=await copyTextSafe(txt);alert(ok?'バックアップJSONをコピーしました。':'コピーできませんでした。テキストを長押ししてコピーしてください。')}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();PWA.installPrompt=e;render()});
window.addEventListener('appinstalled',()=>{PWA.installPrompt=null;render()});
window.addEventListener('online',()=>{PWA.online=true;render();checkPWAUpdate(false)});
window.addEventListener('offline',()=>{PWA.online=false;render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PWA.online&&PWA.registration)checkPWAUpdate(false)});
render();
initPWA();
