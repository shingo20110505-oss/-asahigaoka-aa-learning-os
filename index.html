(()=>{'use strict';const errors=[];window.__RISE_RUNTIME_ERRORS__=errors;const record=(type,value)=>{try{const text=String(value?.stack||value?.message||value||type).slice(0,700);errors.push(`${type}:${text}`);if(errors.length>8)errors.shift();document.documentElement.dataset.riseRuntimeError=text.replace(/[\r\n]+/g,' ').slice(0,280)}catch(_){}};addEventListener('error',e=>record('error',e.error||e.message));addEventListener('unhandledrejection',e=>record('rejection',e.reason))})();

<script id="aa-app-boot-guard-script">
(()=>{'use strict';const root=document.documentElement;const core=new Set(['home','subjects','analytics','settings']);const panel={home:'.riseHomeV4',subjects:'.riseSubjectsV4',analytics:'.riseAnalyticsV4',settings:'.riseSettingsV4'};const expectedTabs=['ホーム','入試','学習','復習'];let blockedAt=Date.now(),observer=null;const state=()=>{try{return window.AA_APP?.get?.('state')?.get?.()||null}catch(_){return null}};const route=()=>state()?.route||root.dataset.riseRoute||'home';const publicNavReady=()=>{const nav=document.querySelector('#app .nav .navin');if(!nav||!String(nav.dataset?.riseNav||'').startsWith('complete:'))return false;if(window.__RISE_INFORMATION_ARCHITECTURE_V1__?.version!=='1.0.1')return false;const tabs=[...nav.children];if(tabs.length!==expectedTabs.length)return false;const labels=tabs.map(x=>(x.querySelector('span')?.textContent||x.getAttribute('aria-label')||'').trim());return expectedTabs.every((label,i)=>labels[i]===label)};const chromeReady=r=>{const h=document.querySelector('#app .brand h1');if(h&&h.textContent.trim()!=='Rise')return false;if(core.has(r)&&!publicNavReady())return false;return true};const ready=()=>{const main=document.querySelector('#app main');if(!window.__RISE_UI_V4__||!main)return false;const r=route();if(!chromeReady(r))return false;if(!core.has(r))return true;return !!main.querySelector(`${panel[r]}[data-ui-ver="4.2.0"]`)};const conceal=()=>{if(!blockedAt)blockedAt=Date.now();root.classList.add('aa-app-booting')};const reveal=()=>{blockedAt=0;root.classList.remove('aa-app-booting','aa-app-boot-slow','aa-app-boot-error')};const nudge=()=>{try{document.dispatchEvent(new Event('aa:v23ready'))}catch(_){}};const check=()=>{if(ready()){reveal();return true}conceal();const age=Date.now()-(blockedAt||Date.now());root.classList.toggle('aa-app-boot-slow',age>=3000);root.classList.toggle('aa-app-boot-error',age>=8000);nudge();return false};const protect=()=>{if(!ready())conceal();requestAnimationFrame(check)};const attach=()=>{const app=document.getElementById('app');if(app&&!observer){observer=new MutationObserver(protect);observer.observe(app,{childList:true,subtree:true})}check()};document.addEventListener('DOMContentLoaded',attach,{once:true});addEventListener('pageshow',()=>{if(!ready())conceal();attach()});document.addEventListener('rise:navigation',protect);setInterval(check,250);document.addEventListener('click',e=>{if(e.target?.closest?.('#riseBootRetry'))location.reload()})})();
</script>
