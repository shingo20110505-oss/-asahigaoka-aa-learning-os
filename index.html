<script id="rise-runtime-diagnostics">
(()=>{'use strict';const errors=[];window.__RISE_RUNTIME_ERRORS__=errors;const record=(type,value)=>{try{const text=String(value?.stack||value?.message||value||type).slice(0,700);errors.push(`${type}:${text}`);if(errors.length>8)errors.shift();document.documentElement.dataset.riseRuntimeError=text.replace(/[\r\n]+/g,' ').slice(0,280)}catch(_){}};addEventListener('error',e=>record('error',e.error||e.message));addEventListener('unhandledrejection',e=>record('rejection',e.reason))})();
</script>
<script id="aa-visual-verification-setup-bypass">
(()=>{'use strict';const p=new URLSearchParams(location.search);if(p.get('visual_verify')!=='1'||!p.has('verify'))return;try{localStorage.setItem('aa-login-visual-setup-v1','1')}catch(_){}})();
</script>
<style id="aa-app-boot-guard">
html.aa-app-booting body>*{visibility:hidden!important}
html.aa-app-booting body:before{content:"最新版を準備中…";position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:#0c1832;color:#f7f9ff;visibility:visible!important;text-align:center;font:800 15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}

</style>
<script id="aa-app-boot-guard-script">
(()=>{'use strict';let done=false;const reveal=()=>{if(done)return;done=true;document.documentElement.classList.remove('aa-app-booting','aa-app-boot-slow')};document.addEventListener('aa:v23ready',()=>requestAnimationFrame(reveal),{once:true});addEventListener('pageshow',()=>{if(window.__AA_AI_READING_V1__)requestAnimationFrame(reveal)});setTimeout(()=>{if(window.__AA_AI_READING_V1__)reveal();else document.documentElement.classList.add('aa-app-boot-slow')},8000);setTimeout(reveal,15000)})();
</script>
<link rel="stylesheet" href="./app/ui/base.css">

<script id="rise-critical-shell">
(()=>{'use strict';
 const root=document.documentElement;root.dataset.riseUi='4';root.dataset.riseSkin='v4';root.dataset.riseStructure='optimized-4';
 function navMarkup(route){const r=['subjects','mission','study','timeline'].includes(route)?'subjects':route;const a=x=>r===x?'active':'';return `<button class="${a('home')}" data-route="home" aria-label="ホーム"><b>⌂</b><span>ホーム</span></button><button class="${a('subjects')}" data-route="subjects" aria-label="学習"><b>▦</b><span>学習</span></button><a href="./review/" aria-label="復習"><b>↻</b><span>復習</span></a><button class="${a('analytics')}" data-route="analytics" aria-label="記録"><b>▥</b><span>記録</span></button>`}
 function apply(){
  const app=document.getElementById('app');if(!app)return;
  const active=document.querySelector('.nav [data-route].active');const route=active?.dataset?.route||root.dataset.riseRoute||'home';root.dataset.riseRoute=route;
  const brand=app.querySelector('.brand');if(brand){const mark=brand.querySelector('.mark'),h=brand.querySelector('h1'),p=brand.querySelector('p');if(mark)mark.textContent='R';if(h)h.textContent='Rise';if(p)p.textContent='旭丘合格のための学習OS'}
  const nav=document.querySelector('.nav');if(nav){let inner=nav.querySelector('.navin');if(!inner){inner=document.createElement('div');inner.className='navin';nav.replaceChildren(inner)}const sig='critical:'+route;if(inner.dataset.riseCritical!==sig){inner.dataset.riseCritical=sig;inner.innerHTML=navMarkup(route)}}
  const main=app.querySelector('main');if(route==='home'&&main&&!main.querySelector('.riseHomeV4')){main.insertAdjacentHTML('afterbegin','<section class="riseHomeV4" data-hydrated="0"><header class="rv4Welcome"><span>RISE / LEARNING DASHBOARD</span><h2>今日の一歩を、合格力に。</h2><p>学習データを準備しています</p></header><article class="rv4Card"><div class="rv4CardHead"><h3>今日の学習</h3><span>準備中</span></div><p class="sub">最優先の学習を選んでいます。</p></article></section>')}
 }
 const mo=new MutationObserver(()=>requestAnimationFrame(apply));mo.observe(document.documentElement,{childList:true,subtree:true});document.addEventListener('DOMContentLoaded',apply);addEventListener('pageshow',apply);requestAnimationFrame(apply);
 let retries=0;
 function recoverHydration(){
  const panel=document.querySelector('.riseHomeV4[data-ui-ver="4.2.0"] .rv4Dashboard');
  if(panel){root.dataset.riseHydrated='1';delete root.dataset.riseRuntimeError;return}
  const errors=window.__RISE_RUNTIME_ERRORS__||[];if(errors.length)root.dataset.riseRuntimeError=String(errors[errors.length-1]).replace(/[\r\n]+/g,' ').slice(0,280);else root.dataset.riseRuntimeError='Rise 4.2 dashboard not hydrated';
  if(retries>=3)return;retries++;window.__RISE_UI_V4__=null;const s=document.createElement('script');s.src=`./app/ui/rise-ui-v4.js?v=4.2.0-retry-${retries}-${Date.now()}`;s.async=false;s.dataset.riseRecovery=String(retries);document.body.appendChild(s);setTimeout(recoverHydration,1200);
 }
 setTimeout(recoverHydration,1200);
})();
</script>
