<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1024">
<meta name="description" content="古文700語・漢文300語を、読みと意味に集中して覚えるRiseの単語帳。">
<title>古文・漢文 単語帳｜Rise</title>
<style>
:root{color-scheme:dark;--bg:#070b18;--panel:#111d3c;--panel2:#0a142b;--line:rgba(169,189,255,.17);--text:#f7f8ff;--sub:#aebbd4;--blue:#86a4ff;--violet:#b092ff;--pink:#f39ac9;--green:#70ddb5;--red:#ff909c;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0,rgba(91,121,255,.22),transparent 28rem),radial-gradient(circle at 94% 2%,rgba(239,137,196,.15),transparent 25rem),linear-gradient(180deg,#0b1127,var(--bg) 65%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(980px,100%);margin:auto;padding:18px 14px calc(76px + var(--safe))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back,.quiz-link{display:inline-flex;align-items:center;min-height:42px;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:rgba(17,30,61,.75);color:#eef2ff;text-decoration:none;font-size:13px;font-weight:900}.quiz-link{color:#d9e2ff}.glass{border:1px solid var(--line);background:linear-gradient(145deg,rgba(24,39,78,.84),rgba(9,19,42,.88));box-shadow:0 28px 80px rgba(0,0,0,.28);backdrop-filter:blur(18px)}.hero{position:relative;overflow:hidden;margin-top:15px;padding:28px;border-radius:28px}.hero:after{content:"";position:absolute;width:330px;height:330px;right:-140px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(176,146,255,.25),transparent 67%);pointer-events:none}.eyebrow{position:relative;z-index:1;color:#cad5ff;font-size:11px;font-weight:950;letter-spacing:.17em}.hero h1{position:relative;z-index:1;margin:8px 0 9px;font-size:clamp(31px,6vw,50px);line-height:1.08;letter-spacing:-.035em}.hero p{position:relative;z-index:1;max-width:720px;margin:0;color:var(--sub);font-size:14px;line-height:1.8}.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.stat{padding:13px;border:1px solid var(--line);border-radius:16px;background:rgba(6,14,32,.48)}.stat b{display:block;font-size:25px}.stat span{display:block;margin-top:2px;color:#93a3c3;font-size:10px;font-weight:800}.controls{margin-top:13px;padding:17px;border-radius:22px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:5px;border:1px solid var(--line);border-radius:15px;background:rgba(5,13,31,.58)}.tab{min-height:46px;border:0;border-radius:11px;background:transparent;color:#9cacca;font-weight:900}.tab.on{background:linear-gradient(135deg,rgba(125,154,255,.25),rgba(235,138,196,.17));color:white;box-shadow:inset 0 0 0 1px rgba(163,185,255,.22)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 100px;gap:8px;margin-top:11px}.filters input,.filters select{width:100%;min-height:46px;padding:0 11px;border:1px solid var(--line);border-radius:12px;background:#0a1731;color:#f6f8ff}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tool{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#0d1934;color:#cdd7eb;font-size:12px;font-weight:900}.tool.on{border-color:rgba(241,148,196,.5);background:rgba(241,148,196,.12);color:#ffd9ed}.tool.primary{border-color:rgba(126,158,255,.32);background:rgba(126,158,255,.12);color:#dce5ff}.status{margin:12px 2px 0;color:#91a2c2;font-size:12px}.list{display:grid;gap:9px;margin-top:12px}.row{display:grid;grid-template-columns:70px minmax(120px,1.05fr) minmax(110px,.9fr) minmax(240px,2fr) 125px;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,rgba(17,30,61,.9),rgba(8,18,39,.9))}.cell{padding:13px;border-right:1px solid var(--line)}.cell:last-child{border:0}.rank{display:grid;place-items:center;color:var(--blue);font-size:13px;font-weight:950}.rank small{display:block;color:#798cac;font-size:9px;text-align:center}.word{font-size:18px;font-weight:950}.reading{color:#bac7df;font-size:13px}.meaning{color:#eef2ff;font-size:13px;line-height:1.65}.meaning.covered{color:transparent;text-shadow:0 0 9px #9aa9c8;background:rgba(116,137,180,.11);cursor:pointer;user-select:none}.area{display:block;margin-top:5px;color:#8fa1c2;font-size:10px}.states{display:flex;align-items:center;gap:5px}.state{flex:1;min-height:35px;padding:0 5px;border:1px solid var(--line);border-radius:9px;background:#0d1933;color:#aebbd3;font-size:10px;font-weight:900}.state.learned{background:rgba(112,221,181,.12);border-color:rgba(112,221,181,.35);color:#a8f0d6}.state.review{background:rgba(255,144,156,.11);border-color:rgba(255,144,156,.35);color:#ffc4ca}.pager{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px}.pager button{min-height:41px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:#0d1934;color:#e9edfb;font-weight:900}.pager button:disabled{opacity:.38}.pager input{width:58px;min-height:39px;border:1px solid var(--line);border-radius:10px;background:#09152c;color:#fff;text-align:center;font-weight:900}.empty{padding:35px;border:1px solid var(--line);border-radius:17px;background:rgba(12,23,48,.72);color:var(--sub);text-align:center}
.filters{grid-template-columns:2fr 1fr 1fr 1fr 92px}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.row{grid-template-columns:52px minmax(90px,.85fr) minmax(0,1.6fr);grid-template-rows:auto auto}.cell{border-right:1px solid var(--line)}.rank{grid-row:1/3}.word{grid-column:2}.reading{grid-column:2;font-size:11px;border-top:1px solid var(--line)}.meaning{grid-column:3;grid-row:1/3}.states{grid-column:1/-1;border-top:1px solid var(--line)}.hero{padding:23px}.quiz-link{font-size:11px}}
@media(max-width:430px){.tabs{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.row{grid-template-columns:46px minmax(86px,.85fr) minmax(0,1.55fr)}.cell{padding:10px 8px}.word{font-size:16px}}
</style>
</head>
<body>
<main class="wrap">
 <header class="top"><a class="back" href="../">← Rise</a><a class="quiz-link" href="../quiz/">統合クイズへ</a></header>
 <section class="hero glass">
  <div class="eyebrow">CLASSICS VOCABULARY</div><h1>古文・漢文 単語帳</h1>
  <p>問題を解かず、語句・読み・意味だけを一覧で確認できます。同じ語の再演習カードはまとめ、古文700語・漢文300語を重複なしで収録しています。</p>
  <div class="stats"><div class="stat"><b id="totalCount">1,000</b><span>重複なし</span></div><div class="stat"><b id="classicalCount">700</b><span>古文単語</span></div><div class="stat"><b id="kanbunCount">300</b><span>漢文語句</span></div><div class="stat"><b id="reviewCount">0</b><span>未克服の間違い</span></div></div>
 </section>
 <section class="controls glass">
  <nav class="tabs" aria-label="範囲"><button class="tab on" data-kind="all">すべて 1,000</button><button class="tab" data-kind="classical">古文単語 700</button><button class="tab" data-kind="kanbun">漢文語句 300</button></nav>
  <div class="filters"><input id="search" type="search" placeholder="語句・読み・意味を検索"><select id="domain" aria-label="分野"><option value="all">全分野</option></select><select id="level" aria-label="レベル"><option value="all">全レベル</option></select><select id="sort" aria-label="並び順"><option value="rank">出る順</option><option value="kana">五十音順</option></select><select id="per" aria-label="表示件数"><option>30</option><option selected>50</option><option>100</option></select></div>
  <div class="tools"><button class="tool primary" id="toggleMeanings">意味を隠す</button><button class="tool" id="shuffle">シャッフル</button><button class="tool" id="reviewOnly">間違えた単語だけ</button><button class="tool" id="reset">条件を戻す</button></div>
  <div class="status" id="status">単語データを読み込み中…</div>
 </section>
 <section class="list" id="rows" aria-live="polite"></section><nav class="pager" id="pager" aria-label="ページ移動"></nav>
</main>
