<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1832"><title>高校数学｜Rise</title><style>:root{color-scheme:dark;--bg:#08142b;--panel:#102347;--line:#29446f;--text:#f5f8ff;--sub:#b9c6df;--accent:#7898ff;--ok:#72d7b0;--bad:#ff8f9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#19315f 0,#08142b 48%,#061022 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:18px 16px 80px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.back{color:#dce7ff;text-decoration:none;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#0d1c39}.hero,.card{background:linear-gradient(145deg,rgba(24,49,91,.94),rgba(12,29,59,.96));border:1px solid rgba(137,166,231,.22);border-radius:22px;box-shadow:0 18px 45px rgba(0,0,0,.18)}.hero{padding:24px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#a9bfff;font-weight:900}.hero h1{font-size:clamp(26px,6vw,42px);margin:7px 0}.hero p{margin:0;color:var(--sub);line-height:1.75}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{padding:14px;border-radius:17px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--sub)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button,.btn{border:1px solid var(--line);background:#10264e;color:#eef4ff;border-radius:999px;padding:10px 14px;font-weight:800}.filters button.on,.btn.primary{background:#718cf0;border-color:#8da5ff;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{padding:18px}.card h2{font-size:17px;margin:0 0 7px}.formula{font-weight:900;font-size:16px;padding:12px;border-radius:14px;background:#091a38;border:1px solid #213d69;overflow-wrap:anywhere}.desc{color:var(--sub);line-height:1.65;font-size:13px;margin:10px 0 0}.quiz{margin-top:20px;padding:20px}.quiz h2{margin-top:0}.choice{width:100%;text-align:left;margin:7px 0;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#0e2247;color:var(--text);font-size:14px}.choice.ok{border-color:var(--ok);background:rgba(114,215,176,.12)}.choice.bad{border-color:var(--bad);background:rgba(255,143,157,.1)}.feedback{margin-top:12px;padding:13px;border-radius:14px;background:#091a38;color:var(--sub);line-height:1.65}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.hero{padding:20px}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../">← Rise</a><strong>高校数学</strong></div><section class="hero"><div class="eyebrow">ADVANCED MATHEMATICS</div><h1>高校数学・発展</h1><p>Riseにすでに入っている発展数学データをそのまま使い、公式→意味→確認問題の順で学びます。既存の中学数学データは変更しません。</p><div class="stats"><div class="stat"><b id="total">—</b><span>発展項目</span></div><div class="stat"><b id="seen">0</b><span>確認済み</span></div><div class="stat"><b id="rate">—</b><span>正答率</span></div></div></section><div class="filters" id="filters"><button class="on" data-f="all">すべて</button><button data-f="algebra">式・関数</button><button data-f="coordinate">座標</button><button data-f="geometry">図形</button><button data-f="count">場合の数</button><button data-f="sequence">数列</button></div><section class="grid" id="grid"></section><section class="card quiz"><h2>確認クイズ</h2><p id="q" class="formula">読み込み中…</p><div id="choices"></div><div id="feedback" class="feedback hidden"></div><button class="btn primary" id="next" type="button">次の問題</button></section></main><script src="../curriculum-v2-data.js"></script><script>(()=>{'use strict';const KEY='rise-high-school-math-v1';const rows=(window.AA_V2_CURRICULUM?.math||[]).filter(r=>r[1]==='advanced'&&parseInt(String(r[0]).replace(/\D/g,''),10)>=35);let state={seen:0,correct:0,items:{}};try{state=Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(_){}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){}};const cat=r=>{const t=r[2];if(/数列/.test(t))return'sequence';if(/順列|組合せ/.test(t))return'count';if(/座標|直線|円の方程式|平方完成|判別式|解と係数/.test(t))return'coordinate';if(/三角|円|方べき|トレミー|ヘロン|中線|内接|高さ|角/.test(t))return'geometry';return'algebra'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let filter='all',current=null,locked=false;function stats(){document.querySelector('#total').textContent=rows.length;document.querySelector('#seen').textContent=Object.keys(state.items||{}).length;document.querySelector('#rate').textContent=state.seen?Math.round(state.correct/state.seen*100)+'%':'—'}function render(){const a=rows.filter(r=>filter==='all'||cat(r)===filter);document.querySelector('#grid').innerHTML=a.map(r=>`<article class="card"><h2>${esc(r[2])}</h2><div class="formula">${esc(r[3])}</div><p class="desc">${esc(r[4])}</p></article>`).join('')||'<article class="card">該当項目はありません。</article>'}function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function next(){if(!rows.length)return;locked=false;document.querySelector('#feedback').classList.add('hidden');current=rows[Math.floor(Math.random()*rows.length)];document.querySelector('#q').textContent=`「${current[2]}」として正しいものは？`;let pool=rows.filter(r=>r[0]!==current[0]&&r[3]);const opts=shuffle([current,...shuffle(pool).slice(0,3)]);document.querySelector('#choices').innerHTML=opts.map(r=>`<button class="choice" data-id="${esc(r[0])}">${esc(r[3])}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b))}function answer(btn){if(locked)return;locked=true;const ok=btn.dataset.id===current[0];document.querySelectorAll('.choice').forEach(b=>{if(b.dataset.id===current[0])b.classList.add('ok')});if(!ok)btn.classList.add('bad');state.seen=(+state.seen||0)+1;if(ok)state.correct=(+state.correct||0)+1;state.items=state.items||{};state.items[current[0]]={last:Date.now(),ok};save();stats();const f=document.querySelector('#feedback');f.innerHTML=`<b>${ok?'正解':'要確認'}</b><br>${esc(current[2])}：${esc(current[3])}<br>${esc(current[4])}`;f.classList.remove('hidden')}document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));filter=b.dataset.f;render()});document.querySelector('#next').onclick=next;stats();render();next()})();</script></body></html>
