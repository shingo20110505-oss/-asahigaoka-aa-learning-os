<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">メネラウスの定理とチェバの定理</title>
  <desc id="desc">左はDをBCの延長上、FをAB上、EをAC上に置き、D・F・Eが一直線になる正しいメネラウスの図。右は3本の線が1点Pで交わるチェバの図。</desc>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" font-size="48" font-weight="700" fill="#102a56" font-family="Noto Sans JP, Yu Gothic, sans-serif">高校数学　比の定理</text>

  <rect x="35" y="130" width="550" height="690" rx="26" fill="#f8fbff" stroke="#4a9df8" stroke-width="4"/>
  <rect x="35" y="130" width="550" height="88" rx="26" fill="#e8f4ff"/>
  <text x="310" y="188" text-anchor="middle" font-size="34" font-weight="700" fill="#0f2d5c" font-family="Noto Sans JP, Yu Gothic, sans-serif">メネラウスの定理</text>

  <line x1="50" y1="700" x2="550" y2="700" stroke="#111827" stroke-width="5"/>
  <path d="M330 280 L150 700 L550 700 Z" fill="none" stroke="#111827" stroke-width="5"/>
  <line x1="50" y1="700" x2="366.667" y2="350" stroke="#ef4444" stroke-width="6"/>

  <circle cx="330" cy="280" r="9" fill="#111827"/><text x="317" y="258" font-size="28" font-weight="700">A</text>
  <circle cx="150" cy="700" r="9" fill="#111827"/><text x="120" y="742" font-size="28" font-weight="700">B</text>
  <circle cx="550" cy="700" r="9" fill="#111827"/><text x="558" y="742" font-size="28" font-weight="700">C</text>
  <circle cx="50" cy="700" r="10" fill="#ef4444"/><text x="27" y="742" font-size="28" font-weight="700">D</text>
  <circle cx="240" cy="490" r="10" fill="#ef4444"/><text x="210" y="482" font-size="28" font-weight="700">F</text>
  <circle cx="366.667" cy="350" r="10" fill="#ef4444"/><text x="382" y="355" font-size="28" font-weight="700">E</text>

  <rect x="100" y="748" width="420" height="48" rx="18" fill="#ffe8ea"/>
  <text x="310" y="781" text-anchor="middle" font-size="25" font-weight="700" fill="#8a1538" font-family="Noto Sans JP, Yu Gothic, sans-serif">D・F・E が一直線</text>
  <text x="310" y="810" text-anchor="middle" font-size="24" font-weight="700" fill="#111827" font-family="Noto Sans JP, Yu Gothic, sans-serif">BD/DC × CE/EA × AF/FB = 1</text>

  <rect x="615" y="130" width="550" height="690" rx="26" fill="#f8fff9" stroke="#42a865" stroke-width="4"/>
  <rect x="615" y="130" width="550" height="88" rx="26" fill="#e9f9ed"/>
  <text x="890" y="188" text-anchor="middle" font-size="34" font-weight="700" fill="#164c2b" font-family="Noto Sans JP, Yu Gothic, sans-serif">チェバの定理</text>

  <path d="M900 280 L720 700 L1100 700 Z" fill="none" stroke="#111827" stroke-width="5"/>
  <line x1="900" y1="280" x2="910" y2="700" stroke="#ef4444" stroke-width="5"/>
  <line x1="720" y1="700" x2="1000" y2="490" stroke="#ef4444" stroke-width="5"/>
  <line x1="1100" y1="700" x2="810" y2="490" stroke="#ef4444" stroke-width="5"/>

  <circle cx="900" cy="280" r="9" fill="#111827"/><text x="887" y="258" font-size="28" font-weight="700">A</text>
  <circle cx="720" cy="700" r="9" fill="#111827"/><text x="690" y="742" font-size="28" font-weight="700">B</text>
  <circle cx="1100" cy="700" r="9" fill="#111827"/><text x="1108" y="742" font-size="28" font-weight="700">C</text>
  <circle cx="910" cy="700" r="9" fill="#111827"/><text x="898" y="742" font-size="28" font-weight="700">D</text>
  <circle cx="1000" cy="490" r="9" fill="#111827"/><text x="1015" y="495" font-size="28" font-weight="700">E</text>
  <circle cx="810" cy="490" r="9" fill="#111827"/><text x="779" y="495" font-size="28" font-weight="700">F</text>
  <circle cx="906.667" cy="560" r="10" fill="#ef4444"/><text x="922" y="566" font-size="28" font-weight="700">P</text>

  <rect x="680" y="748" width="420" height="48" rx="18" fill="#ffe8ea"/>
  <text x="890" y="781" text-anchor="middle" font-size="25" font-weight="700" fill="#8a1538" font-family="Noto Sans JP, Yu Gothic, sans-serif">AD・BE・CF が1点 P で交わる</text>
  <text x="890" y="810" text-anchor="middle" font-size="24" font-weight="700" fill="#111827" font-family="Noto Sans JP, Yu Gothic, sans-serif">BD/DC × CE/EA × AF/FB = 1</text>

  <rect x="180" y="842" width="840" height="42" rx="18" fill="#fff5cc"/>
  <text x="600" y="871" text-anchor="middle" font-size="24" font-weight="700" fill="#5b3b00" font-family="Noto Sans JP, Yu Gothic, sans-serif">覚え方：一直線 → メネラウス　／　1点で交わる → チェバ</text>
</svg>
