<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">三角形ABCの面積比問題</title>
  <desc id="desc">三角形ABCの面積は20平方センチメートル。DはAB上でAD対DBが1対3、EはAC上でAEイコールEC。三角形ADEが灰色で示されている。</desc>
  <rect width="900" height="700" fill="#ffffff"/>
  <text x="62" y="76" font-family="sans-serif" font-size="34" fill="#111">(4)</text>
  <polygon points="450,110 175,505 730,505" fill="none" stroke="#171717" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="450,110 381.25,208.75 590,307.5" fill="#777777" stroke="#171717" stroke-width="5" stroke-linejoin="round"/>
  <line x1="381.25" y1="208.75" x2="590" y2="307.5" stroke="#171717" stroke-width="5"/>
  <text x="435" y="92" font-family="sans-serif" font-size="34" fill="#111">A</text>
  <text x="140" y="535" font-family="sans-serif" font-size="34" fill="#111">B</text>
  <text x="740" y="535" font-family="sans-serif" font-size="34" fill="#111">C</text>
  <text x="345" y="216" font-family="sans-serif" font-size="31" fill="#111">D</text>
  <text x="603" y="313" font-family="sans-serif" font-size="31" fill="#111">E</text>
  <text x="210" y="590" font-family="sans-serif" font-size="34" fill="#111">△ABC = 20 cm²</text>
  <text x="185" y="642" font-family="sans-serif" font-size="32" fill="#111">( AD : DB = 1 : 3,  AE = EC )</text>
</svg>
