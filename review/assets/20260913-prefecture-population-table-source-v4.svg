  <text x="52" y="662" font-family="sans-serif" font-size="22" font-weight="700" fill="#111">ポイント：人口 5,103千人の「う」＝福岡県</text>
  <text x="52" y="696" font-family="sans-serif" font-size="18" fill="#444">復習カードでは、この表と全国の人口上位10都道府県をセットで確認します。</text>
