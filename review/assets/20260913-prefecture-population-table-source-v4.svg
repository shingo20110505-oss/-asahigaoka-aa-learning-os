      <rect x="222" y="347" width="131" height="66" fill="#fff3bf" stroke="none"/>
      <text x="70" y="391">う</text><text x="160" y="391">4,988</text><text x="287" y="391" font-weight="700">5,103</text><text x="407" y="391">328</text><text x="512" y="391">696</text><text x="617" y="391">266</text><text x="722" y="391">402</text><text x="847" y="391">125</text><text x="1040" y="391">103,313</text>
