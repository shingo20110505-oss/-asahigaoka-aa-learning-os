      <text x="1040" y="171">製造品出荷額等</text><text x="1040" y="195">(億円)</text>
    </g>

    <g stroke="none" text-anchor="middle" font-size="22">
      <text x="70" y="255">あ</text><text x="160" y="255">2,441</text><text x="287" y="255">795</text><text x="407" y="255">229</text><text x="512" y="255">415</text><text x="617" y="255">183</text><text x="722" y="255">363</text><text x="847" y="255">54</text><text x="1040" y="255">22,944</text>
