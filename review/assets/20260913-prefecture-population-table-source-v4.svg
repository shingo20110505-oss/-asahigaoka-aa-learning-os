<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">九州地方の県別データ表（復習用再構成）</title>
  <desc id="desc">元写真の表を復習用に再構成。面積、人口、農業産出額、海面漁業漁獲量、製造品出荷額を示し、人口5103千人の行を含む。</desc>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="52" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#111">九州地方の県別データ（元写真の表を復習用に再構成）</text>
  <text x="52" y="96" font-family="sans-serif" font-size="19" fill="#333">面積・人口は2023年、農業産出額・海面漁業漁獲量・製造品出荷額は2022年</text>

  <g font-family="sans-serif" fill="#111" stroke="#555" stroke-width="1.5">
    <rect x="40" y="130" width="1120" height="490" fill="#fff"/>
    <rect x="40" y="130" width="1120" height="80" fill="#f3f3f3"/>
    <rect x="355" y="130" width="420" height="40" fill="#ededed"/>

    <!-- vertical lines -->
    <path d="M100 130V620 M220 130V620 M355 130V620 M460 170V620 M565 170V620 M670 170V620 M775 130V620 M920 130V620" fill="none"/>
    <!-- horizontal lines -->
    <path d="M355 170H775 M40 210H1160 M40 278H1160 M40 346H1160 M40 414H1160 M40 482H1160 M40 550H1160 M40 620H1160" fill="none"/>

