<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>復習ノート｜旭丘AA Learning OS</title>
<style>
:root{--bg:#edf1f6;--card:#fff;--ink:#172033;--sub:#667085;--line:#d9e0ea;--navy:#101828;--navy2:#24324b;--blue:#2458d3;--blue2:#eaf0ff;--green:#177a4b;--green2:#e9f7ef;--amber:#a96800;--amber2:#fff4d8;--red:#b42318;--red2:#fee4e2;--shadow:0 14px 34px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--bg),#f8fafc);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}.app{max-width:860px;margin:0 auto;padding-bottom:40px}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;box-shadow:0 8px 24px rgba(0,0,0,.16)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-weight:900;background:rgba(255,255,255,.08)}.brand h1{margin:0;font-size:16px}.brand p{margin:2px 0 0;font-size:11px;color:#cbd5e1}.topBtns{display:flex;gap:7px}.topBtn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:8px 10px;text-decoration:none;font-size:12px;font-weight:800}main{padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}.hero{background:linear-gradient(145deg,var(--card),var(--blue2))}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--blue);font-weight:900}.h2{font-size:22px;margin:5px 0 7px}.sub{color:var(--sub);font-size:13px;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--sub)}.filters{display:flex;gap:7px;overflow:auto;padding:10px 1px 3px}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.filter.active{background:var(--blue2);color:var(--blue);border-color:var(--blue)}input{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink);font:inherit}.item{margin-top:12px}.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chip{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--blue2);color:var(--blue);border:1px solid var(--line)}.chip.warn{background:var(--amber2);color:var(--amber)}.chip.good{background:var(--green2);color:var(--green)}h3{font-size:17px;margin:10px 0 8px}.q{font-size:17px;line-height:1.7;font-weight:800}.answer{margin-top:10px;padding:13px;border-radius:13px;background:var(--green2);line-height:1.75;font-size:14px}.why{margin-top:10px;padding:12px;border-left:4px solid var(--blue);border-radius:10px;background:var(--blue2);font-size:13px;line-height:1.7}.memory{margin-top:10px;padding:11px;border-radius:11px;background:var(--amber2);font-size:13px;line-height:1.6}.examples{padding-left:20px;font-size:13px;line-height:1.8}.actions{display:flex;gap:8px;margin-top:12px}.btn{flex:1;border:0;border-radius:13px;padding:12px 14px;font-weight:800;font:inherit}.primary{background:var(--navy);color:#fff}.good{background:var(--green);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.done{opacity:.72}.empty{text-align:center;color:var(--sub);padding:28px}.tiny{font-size:11px;color:var(--sub)}.error{background:var(--red2);border-color:#fecdca;color:var(--red)}@media(max-width:520px){.stat b{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div class="brand"><div class="mark">復</div><div><h1>復習ノート</h1><p>Review v2・データ一元管理</p></div></div><div class="topBtns"><button class="topBtn" type="button" id="refreshBtn">更新</button><a class="topBtn" href="../index.html">戻る</a></div></div></header>
<main id="root"><section class="card"><p class="sub">最新の復習データを確認しています。</p></section></main>
</div>
<script>
(()=>{'use strict';
const root=document.getElementById('root');
const KEY='asahi_review_progress_v1';
let ui={status:'要復習',subject:'全部',query:'',revealed:new Set()};
let progress=readProgress();
function readProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?{done:x.done||{},seen:x.seen||{}}:{done:{},seen:{}}}catch(_){return{done:{},seen:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(_){}}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function bank(){return Array.isArray(window.AA_REVIEW_BANK)?window.AA_REVIEW_BANK:[]}
function isDone(id){return !!progress.done[id]}
function subjects(){return ['全部',...new Set(bank().map(x=>x.subject).filter(Boolean))]}
function rows(){const q=ui.query.trim().toLowerCase();return bank().filter(x=>{if(ui.subject!=='全部'&&x.subject!==ui.subject)return false;if(ui.status==='要復習'&&isDone(x.id))return false;if(ui.status==='復習済み'&&!isDone(x.id))return false;if(!q)return true;return [x.subject,x.unit,x.title,x.question,x.answer,x.why,x.memory,...(x.examples||[]),...(x.tags||[])].join(' ').toLowerCase().includes(q)})}
function item(x){const done=isDone(x.id),show=ui.revealed.has(x.id);return `<section class="card item ${done?'done':''}" data-id="${esc(x.id)}"><div class="meta"><span class="chip">${esc(x.subject)}</span><span class="chip">${esc(x.unit||'')}</span><span class="chip ${done?'good':'warn'}">${done?'復習済み':'要復習'}</span><span class="tiny">${esc(x.createdAt||'')}</span></div><h3>${esc(x.title)}</h3><div class="q">${esc(x.question)}</div>${show?`<div class="answer"><b>答え</b><br>${esc(x.answer)}</div>${x.why?`<div class="why"><b>なぜ？</b><br>${esc(x.why)}</div>`:''}${x.memory?`<div class="memory"><b>覚え方：</b> ${esc(x.memory)}</div>`:''}${x.examples?.length?`<ul class="examples">${x.examples.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:''}`:''}<div class="actions"><button class="btn ${show?'ghost':'primary'}" data-reveal="${esc(x.id)}">${show?'答えを隠す':'答えを見る'}</button><button class="btn ${done?'ghost':'good'}" data-done="${esc(x.id)}">${done?'もう一度復習する':'覚えた'}</button></div></section>`}
function render(){const all=bank(),completed=all.filter(x=>isDone(x.id)).length,list=rows().slice().reverse();root.innerHTML=`<section class="card hero"><div class="eyebrow">PERSONAL REVIEW</div><h2 class="h2">あとで必ず見直すページ</h2><p class="sub">「復習に入れて」と指定した内容だけを表示します。復習データは main の1ファイルだけを正本として管理し、公開側へ自動同期します。</p><div class="meta"><span class="chip good">データ版 ${esc(window.AA_REVIEW_BANK_VERSION||'unknown')}</span><span class="chip">登録 ${all.length}件</span><span class="chip">UI v2</span></div><div class="stats"><div class="stat"><b>${all.length}</b><span>登録</span></div><div class="stat"><b>${all.length-completed}</b><span>要復習</span></div><div class="stat"><b>${completed}</b><span>復習済み</span></div></div><input type="search" placeholder="復習項目を検索" value="${esc(ui.query)}" data-search><div class="filters">${['要復習','全部','復習済み'].map(s=>`<button class="filter ${ui.status===s?'active':''}" data-status="${s}">${s}</button>`).join('')}</div><div class="filters">${subjects().map(s=>`<button class="filter ${ui.subject===s?'active':''}" data-subject="${esc(s)}">${esc(s)}</button>`).join('')}</div></section>${list.length?list.map(item).join(''):'<section class="card empty item">条件に合う復習項目はありません。</section>'}`}
async function loadLatest(){root.innerHTML='<section class="card"><p class="sub">最新の復習データを確認しています。</p></section>';try{const res=await fetch('../review-bank-v1.js',{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const code=await res.text();Function(code)();if(!Array.isArray(window.AA_REVIEW_BANK))throw new Error('review bank is invalid');render()}catch(err){root.innerHTML=`<section class="card error"><b>復習データを読み込めませんでした。</b><p class="sub">通信を確認して「更新」を押してください。</p><div class="tiny">${esc(err.message||err)}</div></section>`}}
document.addEventListener('click',e=>{const r=e.target.closest('[data-reveal]');if(r){const id=r.dataset.reveal;ui.revealed.has(id)?ui.revealed.delete(id):ui.revealed.add(id);progress.seen[id]=Date.now();save();render();return}const d=e.target.closest('[data-done]');if(d){const id=d.dataset.done;if(isDone(id))delete progress.done[id];else progress.done[id]=Date.now();save();render();return}const s=e.target.closest('[data-status]');if(s){ui.status=s.dataset.status;render();return}const sub=e.target.closest('[data-subject]');if(sub){ui.subject=sub.dataset.subject;render();return}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){ui.query=e.target.value;render()}});
document.getElementById('refreshBtn').addEventListener('click',()=>loadLatest());
loadLatest();
})();
</script>
</body>
</html>
