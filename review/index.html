<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17345f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rise｜復習</title>
<style>
:root{--ink:#f8f9ff;--sub:rgba(239,243,255,.76);--muted:rgba(226,233,251,.54);--line:rgba(255,255,255,.15);--card:linear-gradient(145deg,rgba(31,49,84,.68),rgba(17,34,64,.54));--card2:linear-gradient(145deg,rgba(48,60,103,.75),rgba(24,39,74,.62));--blue:#7db0ff;--violet:#9b7cff;--pink:#f19bcf;--green:#64d8b8;--amber:#ffb46f;--red:#ff8f9b;--shadow:0 24px 64px rgba(5,13,35,.28),inset 0 1px 0 rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;background:radial-gradient(56rem 42rem at 86% 2%,rgba(242,165,203,.32),transparent 57%),radial-gradient(48rem 38rem at 13% 12%,rgba(126,157,239,.29),transparent 58%),linear-gradient(180deg,#5f75a6 0%,#7c78a7 24%,#94768f 43%,#31567f 64%,#0a2040 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 44%)}.app{max-width:980px;margin:0 auto;padding-bottom:46px}.top{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;background:rgba(10,26,55,.80);border-bottom:1px solid rgba(255,255,255,.10);box-shadow:0 10px 30px rgba(5,14,34,.15);backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%)}.toprow{max-width:948px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.mark{width:38px;height:38px;border-radius:13px;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font-weight:850;background:linear-gradient(145deg,#6d93ff,#9e79ff 58%,#e993c9);box-shadow:0 9px 24px rgba(70,86,205,.30)}.brand h1{margin:0;font-size:19px;letter-spacing:-.03em}.brand p{margin:3px 0 0;font-size:9px;color:rgba(238,243,255,.70)}.topBtns{display:flex;gap:7px}.topBtn{min-height:40px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;border-radius:13px;padding:8px 11px;text-decoration:none;font-size:10px;font-weight:850}.topBtn.primary{background:linear-gradient(135deg,#678dff,#8c72ff 58%,#aa7fff)}main{padding:18px 16px}.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow);padding:18px;backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%)}.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 34%)}.card>*{position:relative;z-index:1}.hero{background:radial-gradient(30rem 18rem at 90% 0%,rgba(240,152,207,.26),transparent 58%),var(--card2);padding:22px}.eyebrow{font-size:9px;letter-spacing:.18em;color:#c4d5ff;font-weight:900}.h2{font-size:clamp(25px,4vw,36px);letter-spacing:-.05em;margin:7px 0 8px}.sub{color:var(--sub);font-size:11px;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{padding:12px 8px;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:rgba(8,27,58,.28);text-align:center}.stat b{display:block;font-size:24px;font-weight:350}.stat span{font-size:8px;color:var(--muted)}.filters{display:flex;gap:7px;overflow:auto;padding:10px 1px 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);color:var(--sub);border-radius:999px;padding:8px 11px;font-size:10px;font-weight:850}.filter.active{background:linear-gradient(135deg,rgba(103,141,255,.45),rgba(157,114,255,.34));color:#fff;border-color:rgba(183,198,255,.30)}input{width:100%;margin-top:13px;border:1px solid rgba(255,255,255,.13);border-radius:13px;padding:12px 13px;background:rgba(7,24,52,.35);color:#fff;font:inherit;outline:none}input::placeholder{color:rgba(237,242,255,.42)}input:focus{border-color:rgba(145,174,255,.55);box-shadow:0 0 0 3px rgba(123,151,255,.10)}.item{margin-top:12px}.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.chip{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:9px;font-weight:850;background:rgba(113,149,255,.13);color:#c9d9ff;border:1px solid rgba(255,255,255,.09)}.chip.warn{background:rgba(255,180,111,.12);color:#ffd0a5}.chip.good{background:rgba(100,216,184,.12);color:#a9efd9}h3{font-size:17px;margin:11px 0 8px}.q{font-size:17px;line-height:1.7;font-weight:800}.reviewImageWrap{margin-top:12px;border:1px solid rgba(255,255,255,.12);border-radius:15px;overflow:hidden;background:rgba(255,255,255,.06)}.reviewImage{display:block;width:100%;height:auto}.answer{margin-top:11px;padding:14px;border:1px solid rgba(100,216,184,.17);border-radius:14px;background:rgba(100,216,184,.10);line-height:1.75;font-size:13px}.why{margin-top:10px;padding:13px;border-left:3px solid var(--blue);border-radius:11px;background:rgba(125,176,255,.09);font-size:12px;line-height:1.7}.memory{margin-top:10px;padding:12px;border-radius:11px;background:rgba(255,180,111,.10);font-size:12px;line-height:1.65}.examples{padding-left:20px;font-size:12px;line-height:1.8}.actions{display:flex;gap:8px;margin-top:13px}.btn{flex:1;min-height:44px;border:1px solid transparent;border-radius:13px;padding:11px 13px;font-weight:850;font:inherit;font-size:11px}.btn.primary{background:linear-gradient(135deg,#678dff,#8c72ff 58%,#aa7fff);color:#fff;border-color:rgba(255,255,255,.16)}.btn.good{background:rgba(70,179,143,.22);border-color:rgba(100,216,184,.22);color:#d8fff2}.btn.ghost{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#fff}.done{opacity:.65}.empty{text-align:center;color:var(--sub);padding:30px}.tiny{font-size:9px;color:var(--muted)}.error{background:rgba(180,53,66,.20);border-color:rgba(255,143,155,.25);color:#ffe3e6}@media(max-width:520px){main{padding:14px 12px}.hero{padding:18px}.h2{font-size:27px}.brand h1{font-size:17px}.brand p{font-size:8px}.mark{display:none}.topBtn{padding:8px 9px}.stats b{font-size:21px}.q{font-size:16px}.actions{flex-direction:column}.btn{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div class="brand"><div class="mark">R</div><div><h1>Rise / 復習</h1><p>Review v2・データ一元管理</p></div></div><div class="topBtns"><button class="topBtn" type="button" id="refreshBtn">更新</button><a class="topBtn primary" href="../index.html">Riseへ戻る</a></div></div></header>
<main id="root"><section class="card"><p class="sub">最新の復習データを確認しています。</p></section></main>
</div>
<script>
(()=>{'use strict';
const root=document.getElementById('root');
const KEY='asahi_review_progress_v1';
let ui={status:'要復習',subject:'全部',query:'',revealed:new Set()};
let progress=readProgress();
function readProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?{done:x.done||{},seen:x.seen||{}}:{done:{},seen:{}}}catch(_){return{done:{},seen:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(_){}}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function bank(){return Array.isArray(window.AA_REVIEW_BANK)?window.AA_REVIEW_BANK:[]}
function isDone(id){return !!progress.done[id]}
function subjects(){return ['全部',...new Set(bank().map(x=>x.subject).filter(Boolean))]}
function rows(){const q=ui.query.trim().toLowerCase();return bank().filter(x=>{if(ui.subject!=='全部'&&x.subject!==ui.subject)return false;if(ui.status==='要復習'&&isDone(x.id))return false;if(ui.status==='復習済み'&&!isDone(x.id))return false;if(!q)return true;return [x.subject,x.unit,x.title,x.question,x.answer,x.why,x.memory,x.imageAlt,...(x.examples||[]),...(x.tags||[])].join(' ').toLowerCase().includes(q)})}
function item(x){const done=isDone(x.id),show=ui.revealed.has(x.id);return `<section class="card item ${done?'done':''}" data-id="${esc(x.id)}"><div class="meta"><span class="chip">${esc(x.subject)}</span><span class="chip">${esc(x.unit||'')}</span><span class="chip ${done?'good':'warn'}">${done?'復習済み':'要復習'}</span><span class="tiny">${esc(x.createdAt||'')}</span></div><h3>${esc(x.title)}</h3><div class="q">${esc(x.question)}</div>${x.image?`<div class="reviewImageWrap"><img class="reviewImage" src="${esc(x.image)}" alt="${esc(x.imageAlt||x.title||'復習画像')}" loading="lazy"></div>`:''}${show?`<div class="answer"><b>答え</b><br>${esc(x.answer)}</div>${x.why?`<div class="why"><b>なぜ？</b><br>${esc(x.why)}</div>`:''}${x.memory?`<div class="memory"><b>覚え方：</b> ${esc(x.memory)}</div>`:''}${x.examples?.length?`<ul class="examples">${x.examples.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:''}`:''}<div class="actions"><button class="btn ${show?'ghost':'primary'}" data-reveal="${esc(x.id)}">${show?'答えを隠す':'答えを見る'}</button><button class="btn ${done?'ghost':'good'}" data-done="${esc(x.id)}">${done?'もう一度復習する':'覚えた'}</button></div></section>`}
function resultsHtml(){const list=rows().slice().reverse();return list.length?list.map(item).join(''):'<section class="card empty item">条件に合う復習項目はありません。</section>'}
function renderResults(){const host=document.getElementById('reviewResults');if(!host){render();return}host.innerHTML=resultsHtml()}
function render(){const all=bank(),completed=all.filter(x=>isDone(x.id)).length;root.innerHTML=`<section class="card hero"><div class="eyebrow">RISE / REVIEW</div><h2 class="h2">忘れる前に、取り戻す。</h2><p class="sub">「復習に入れて」と指定した内容だけを、ここで確実に回収します。</p><div class="meta"><span class="chip good">データ ${esc(window.AA_REVIEW_BANK_VERSION||'unknown')}</span><span class="chip">登録 ${all.length}件</span><span class="chip">Review v2</span></div><div class="stats"><div class="stat"><b>${all.length}</b><span>登録</span></div><div class="stat"><b>${all.length-completed}</b><span>要復習</span></div><div class="stat"><b>${completed}</b><span>復習済み</span></div></div><input type="search" placeholder="復習項目を検索" value="${esc(ui.query)}" data-search autocomplete="off"><div class="filters">${['要復習','全部','復習済み'].map(s=>`<button class="filter ${ui.status===s?'active':''}" data-status="${s}">${s}</button>`).join('')}</div><div class="filters">${subjects().map(s=>`<button class="filter ${ui.subject===s?'active':''}" data-subject="${esc(s)}">${esc(s)}</button>`).join('')}</div></section><div id="reviewResults">${resultsHtml()}</div>`}
async function loadLatest(){root.innerHTML='<section class="card"><p class="sub">最新の復習データを確認しています。</p></section>';try{const res=await fetch('../review-bank-v1.js',{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const code=await res.text();Function(code)();if(!Array.isArray(window.AA_REVIEW_BANK))throw new Error('review bank is invalid');render()}catch(err){root.innerHTML=`<section class="card error"><b>復習データを読み込めませんでした。</b><p class="sub">通信を確認して「更新」を押してください。</p><div class="tiny">${esc(err.message||err)}</div></section>`}}
document.addEventListener('click',e=>{const r=e.target.closest('[data-reveal]');if(r){const id=r.dataset.reveal;ui.revealed.has(id)?ui.revealed.delete(id):ui.revealed.add(id);progress.seen[id]=Date.now();save();render();return}const d=e.target.closest('[data-done]');if(d){const id=d.dataset.done;if(isDone(id))delete progress.done[id];else progress.done[id]=Date.now();save();render();return}const s=e.target.closest('[data-status]');if(s){ui.status=s.dataset.status;render();return}const sub=e.target.closest('[data-subject]');if(sub){ui.subject=sub.dataset.subject;render();return}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){ui.query=e.target.value;renderResults()}});
document.getElementById('refreshBtn').addEventListener('click',()=>loadLatest());
loadLatest();
})();
</script>
</body>
</html>
