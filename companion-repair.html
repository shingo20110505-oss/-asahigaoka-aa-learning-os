<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>相棒 修復</title><style>body{margin:0;background:#eef1f6;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}.card{max-width:520px;background:#fff;border:1px solid #d9deea;border-radius:22px;padding:24px;box-shadow:0 18px 60px rgba(24,34,58,.12)}h1{margin:0 0 10px;font-size:24px}p{line-height:1.7;color:#667085}.ok{color:#18794e;font-weight:800}.bad{color:#b42318;font-weight:800}</style></head><body><div class="card"><h1>学習相棒を修復中</h1><p id="msg">古いPWAキャッシュと旧相棒を削除しています…</p></div><script>(async()=>{const m=document.getElementById('msg');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/-asahigaoka-aa-learning-os/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('asahigaoka-aa-os-')).map(k=>caches.delete(k)))}localStorage.removeItem('companion7-aftercheck');sessionStorage.setItem('companion-repair','done-'+Date.now());m.className='ok';m.textContent='修復完了。最新版のChronologiaを開きます…';setTimeout(()=>location.replace('./chronologia.html?c7=740&fresh='+Date.now()),650)}catch(e){m.className='bad';m.textContent='自動修復の途中でエラーが出ました。ページを再読み込みしてください。';console.error(e)}})();</script></body></html>
