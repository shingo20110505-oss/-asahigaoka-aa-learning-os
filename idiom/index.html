<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>慣用句・四字熟語 年表式一覧</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;margin:0;background:#f4f6f8;color:#182230}.wrap{max-width:980px;margin:auto;padding:14px}.top{position:sticky;top:0;background:#111827;color:white;padding:14px;border-radius:0 0 16px 16px;z-index:10}.top h1{font-size:19px;margin:0 0 8px}.bar{display:grid;grid-template-columns:1fr 130px 130px;gap:8px}.bar input,.bar select,.bar button{padding:10px;border-radius:10px;border:1px solid #cfd6df;background:white}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls button{padding:9px 12px;border:1px solid #cfd6df;border-radius:999px;background:white;font-weight:700}.controls button.on{background:#172033;color:white}.meta{font-size:12px;color:#667085;margin:6px 0 12px}.table{background:white;border:1px solid #d8dee8;border-radius:14px;overflow:hidden}.head,.row{display:grid;grid-template-columns:46px minmax(135px,1.1fr) minmax(110px,.9fr) minmax(230px,2fr) 74px;align-items:stretch}.head{background:#eef2f6;font-size:12px;font-weight:800}.head>div,.row>div{padding:10px;border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb}.row:last-child>div{border-bottom:0}.cellTap{cursor:pointer;user-select:none}.hiddenCell{color:transparent;text-shadow:0 0 8px #8792a2;background:#f3f4f6}.rank{font-weight:900;text-align:center}.rank.A{color:#b42318}.rank.B{color:#b54708}.rank.C{color:#344054}.kind{font-size:11px;color:#667085}.word{font-weight:850}.reading{font-size:11px;color:#667085;margin-top:2px}.empty{padding:30px;text-align:center}.pager{display:flex;justify-content:center;gap:8px;margin:14px}.pager button{padding:9px 14px;border:1px solid #cfd6df;border-radius:10px;background:white}@media(max-width:700px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}.head,.row{grid-template-columns:38px 1fr 74px}.head .r,.head .m,.row .r,.row .m{display:none}.row>div{padding:9px}.row .w{grid-column:2}.row .m2{grid-column:2/-1;border-top:0}.row{position:relative}.row .rk{grid-column:3;grid-row:1}.table{border-radius:10px}}</style></head><body><div class="top"><div class="wrap" style="padding:0"><h1>慣用句・四字熟語｜年表式一覧</h1><div class="bar"><input id="q" placeholder="語句・読み・意味を検索"><select id="kind"><option value="">すべて</option><option>慣用句</option><option>四字熟語</option></select><select id="rank"><option value="">全ランク</option><option value="A">A 入試頻出</option><option value="B">B 重要</option><option value="C">C 発展</option></select></div></div></div><main class="wrap"><div class="controls"><button id="both" class="on">語句＋意味</button><button id="hideWord">語句を隠す</button><button id="hideMeaning">意味を隠す</button><button id="shuffle">シャッフル</button></div><div class="meta" id="meta">読み込み中...</div><div class="table"><div class="head"><div>#</div><div>語句</div><div class="r">読み</div><div class="m">意味</div><div>入試</div></div><div id="rows"></div></div><div class="pager"><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></div></main><script src="./idiom-bank.js"></script><script>(()=>{let all=window.AA_IDIOM_BANK||[],view=[],page=0,per=100,mode='both';const $=s=>document.querySelector(s);function apply(){let q=$('#q').value.trim().toLowerCase(),k=$('#kind').value,r=$('#rank').value;view=all.filter(x=>(!k||x.kind===k)&&(!r||x.rank===r)&&(!q||(x.word+x.reading+x.meaning).toLowerCase().includes(q)));page=0;render()}function render(){const st=page*per,ar=view.slice(st,st+per);$('#meta').textContent=`${view.length.toLocaleString()}語 / 全${all.length.toLocaleString()}語　A=高校入試頻出・B=重要・C=発展`;$('#rows').innerHTML=ar.map((x,i)=>`<div class="row"><div>${st+i+1}</div><div class="w cellTap ${mode==='word'?'hiddenCell':''}" data-t="w"><div class="word">${x.word}</div><div class="kind">${x.kind}</div></div><div class="r">${x.reading}</div><div class="m m2 cellTap ${mode==='meaning'?'hiddenCell':''}" data-t="m">${x.meaning}</div><div class="rk rank ${x.rank}">${x.rank}</div></div>`).join('')||'<div class="empty">該当なし</div>';$('#page').textContent=`${Math.min(page+1,Math.max(1,Math.ceil(view.length/per)))} / ${Math.max(1,Math.ceil(view.length/per))}`;$('#prev').disabled=page===0;$('#next').disabled=(page+1)*per>=view.length}function setMode(m){mode=m;['both','hideWord','hideMeaning'].forEach(id=>$('#'+id).classList.remove('on'));$('#'+(m==='both'?'both':m==='word'?'hideWord':'hideMeaning')).classList.add('on');render()}$('#q').oninput=apply;$('#kind').onchange=apply;$('#rank').onchange=apply;$('#both').onclick=()=>setMode('both');$('#hideWord').onclick=()=>setMode('word');$('#hideMeaning').onclick=()=>setMode('meaning');$('#shuffle').onclick=()=>{view.sort(()=>Math.random()-.5);page=0;render()};$('#prev').onclick=()=>{if(page){page--;render();scrollTo(0,0)}};$('#next').onclick=()=>{if((page+1)*per<view.length){page++;render();scrollTo(0,0)}};$('#rows').onclick=e=>{const c=e.target.closest('.cellTap');if(c)c.classList.toggle('hiddenCell')};apply()})();</script></body></html>
