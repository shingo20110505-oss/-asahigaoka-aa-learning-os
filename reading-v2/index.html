<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5368a8">
<title>英語長文 V2｜Rise</title>
<style>
:root{color-scheme:light dark;--bg:#0b1530;--card:rgba(23,37,78,.78);--line:rgba(255,255,255,.14);--text:#f7f9ff;--sub:#cbd5ee;--accent:#91a8ff;--accent2:#e5a7d5;--ok:#8ee0bb;--ng:#ffb0bb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,rgba(105,123,210,.35),transparent 30%),radial-gradient(circle at 95% 5%,rgba(203,113,176,.24),transparent 26%),linear-gradient(160deg,#0b1530,#101c3e 55%,#181b42);color:var(--text)}button,a,input{font:inherit}button,a{touch-action:manipulation}.shell{width:min(940px,calc(100% - 28px));margin:auto;padding:20px 0 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#7b8fe9,#d08dbf);box-shadow:0 10px 30px rgba(0,0,0,.18)}.back{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.06);font-weight:800;font-size:13px}.hero,.card{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.2)}.hero{border-radius:24px;padding:22px;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#cfd8ff;font-weight:900}.hero h1{font-size:clamp(24px,5vw,34px);margin:8px 0}.hero p{color:var(--sub);line-height:1.7;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{padding:12px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.05)}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--sub)}.card{border-radius:20px;padding:20px;margin-top:14px}.controls h2,.reading h2{font-size:17px;margin:0 0 12px}.levels{display:flex;gap:8px;flex-wrap:wrap}.level{position:relative}.level input{position:absolute;opacity:0;pointer-events:none}.level span{display:grid;place-items:center;min-width:52px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.05);font-weight:900;cursor:pointer}.level input:checked+span{border-color:#a9b9ff;background:rgba(128,149,238,.28);box-shadow:0 0 0 2px rgba(145,168,255,.13) inset}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{min-height:48px;border:0;border-radius:14px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#8298f1,#c789bd);color:white}.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text)}.btn:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:12px;color:var(--sub);font-size:13px;line-height:1.6}.reading{display:none}.reading.active{display:block}.readingMeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{font-size:11px;font-weight:900;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:#e9eeff;background:rgba(255,255,255,.05)}.passage{white-space:pre-line;font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,2.2vw,20px);line-height:1.85;letter-spacing:.005em;color:#fff}.question{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.question h3{font-size:15px;line-height:1.6;margin:0 0 10px}.choice{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;margin:8px 0;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.04);cursor:pointer}.choice input{margin-top:3px;accent-color:#91a8ff}.choice.correct{border-color:rgba(142,224,187,.65);background:rgba(70,164,122,.15)}.choice.wrong{border-color:rgba(255,176,187,.7);background:rgba(190,70,86,.14)}.result{display:none;margin-top:18px}.result.active{display:block}.score{font-size:28px;font-weight:950}.translation{white-space:pre-line;color:#e9edfa;line-height:1.8}.explanation{margin:10px 0;padding:12px 14px;border-radius:13px;background:rgba(255,255,255,.05);color:var(--sub);line-height:1.65;font-size:13px}.empty{display:none;text-align:center}.empty.active{display:block}.error{color:#ffc0c9}.footer{margin-top:18px;color:#9faaca;font-size:11px;text-align:center}@media(max-width:620px){.shell{width:min(100% - 20px,940px);padding-top:12px}.hero,.card{padding:17px;border-radius:18px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.top{margin-bottom:12px}.passage{font-size:17px}.btn{width:100%}}
</style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand"><span class="mark">R</span><span>Rise</span></div><a class="back" href="../">Riseへ戻る</a></header>
  <section class="hero">
    <div class="eyebrow">ENGLISH READING V2</div>
    <h1>新しい長文を、次々に。</h1>
    <p>未回答の問題だけから出題します。同じ問題を繰り返さず、初見英文にたくさん触れるための独立ページです。</p>
    <div class="stats"><div class="stat"><b id="totalCount">—</b><span>収録長文</span></div><div class="stat"><b id="doneCount">—</b><span>回答済み</span></div><div class="stat"><b id="remainCount">—</b><span>未回答</span></div></div>
  </section>
  <section class="card controls" aria-labelledby="levelTitle">
    <h2 id="levelTitle">難度を選ぶ</h2>
    <div class="levels" id="levels"></div>
    <div class="actions"><button class="btn primary" id="newButton" type="button">新しい長文を解く</button></div>
    <div class="status" id="status" role="status" aria-live="polite">問題データを読み込んでいます…</div>
  </section>
  <section class="card reading" id="readingCard" aria-live="polite">
    <div class="readingMeta"><span class="pill" id="readingLevel"></span><span class="pill" id="readingId"></span></div>
    <h2 id="readingTitle"></h2>
    <div class="passage" id="passage"></div>
    <div id="questions"></div>
    <div class="actions"><button class="btn primary" id="submitButton" type="button">採点する</button></div>
    <div class="result" id="result"><div class="score" id="score"></div><h2>全文和訳</h2><div class="translation" id="translation"></div><h2>解説</h2><div id="explanations"></div><div class="actions"><button class="btn primary" id="nextButton" type="button">次の新しい長文</button></div></div>
  </section>
  <section class="card empty" id="emptyCard"><h2>選択した難度の未回答問題をすべて解きました</h2><p class="status">別のLevelを選ぶか、今後追加される新しい長文を利用してください。既出問題への自動リピートはしません。</p></section>
  <div class="footer">進捗はこの端末だけに保存されます。旧AI長文の認証・履歴には依存しません。</div>
</main>
<script src="./app.js?v=1.0.0" defer></script>
</body>
</html>
