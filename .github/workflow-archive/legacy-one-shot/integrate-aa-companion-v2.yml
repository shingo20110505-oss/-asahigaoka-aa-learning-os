name: Integrate AA Companion V2

on:
  push:
    paths:
      - '.aa-companion-v2-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix and integrate shared companion
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('aa-companion-v2.js')
          c=p.read_text(encoding='utf-8')
          c=c.replace("motion:lowPower?.55:1", "motion:lowPower ? .55 : 1")
          p.write_text(c,encoding='utf-8')

          main_tag = '<script src="./aa-companion-v2.js?v=6.5.2"></script>'
          fix_tag = '<script src="./aa-companion-mobile-fix.js?v=6.5.2"></script>'
          marker = '<!-- AA-COMPANION-V2 -->'

          def install_tags(path):
              p=Path(path)
              h=p.read_text(encoding='utf-8')
              h=re.sub(r'\s*<!-- AA-COMPANION-V2 -->', '', h)
              h=re.sub(r'\s*<script\s+src="\./aa-companion-v2\.js\?v=[^"]+"></script>', '', h)
              h=re.sub(r'\s*<script\s+src="\./aa-companion-mobile-fix\.js\?v=[^"]+"></script>', '', h)
              repl=f'\n{marker}\n{main_tag}\n{fix_tag}\n</body>\n</html>'
              h,n=re.subn(r'</body>\s*</html>\s*$', repl, h, count=1, flags=re.I)
              if n!=1:
                  raise RuntimeError(f'final body/html not found in {path}')
              p.write_text(h,encoding='utf-8')

          install_tags('index.html')

          p=Path('chronologia.html')
          h=p.read_text(encoding='utf-8')
          h=re.sub(r'<title>Chronologia 6\.[0-9]+｜','<title>Chronologia 6.5｜',h)
          h=re.sub(r'const VERSION = "6\.[0-9]+(?:\.[0-9]+)?";','const VERSION = "6.5.2";',h)
          h=re.sub(r'<script src="\./chronologia-daily-companion\.js\?v=[^"]+"></script>','<script src="./chronologia-daily-companion.js?v=6.5.2"></script>',h)
          h=re.sub(r'\s*<!-- CHRONOLOGIA-LIVE-COMPANION-LOADER -->','',h)
          h=re.sub(r'\s*<script\s+src="\./chronologia-live-companion\.js\?v=[^"]+"></script>','',h)
          p.write_text(h,encoding='utf-8')
          install_tags('chronologia.html')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CACHE_NAME = `asahigaoka-aa-os-\$\{VERSION\}-[^`]+`;","const CACHE_NAME = `asahigaoka-aa-os-${VERSION}-c652`;",s)
          s=s.replace("  new URL('chronologia-live-companion.js', BASE).href,\n",'')
          if "new URL('aa-companion-v2.js', BASE).href" not in s:
              needle="  new URL('chronologia-daily-companion.js', BASE).href,\n"
              s=s.replace(needle,needle+"  new URL('aa-companion-v2.js', BASE).href,\n")
          if "new URL('aa-companion-mobile-fix.js', BASE).href" not in s:
              needle="  new URL('aa-companion-v2.js', BASE).href,\n"
              s=s.replace(needle,needle+"  new URL('aa-companion-mobile-fix.js', BASE).href,\n")
          p.write_text(s,encoding='utf-8')
      - name: Validate integration and JavaScript syntax
        run: |
          node --check aa-companion-v2.js
          node --check aa-companion-mobile-fix.js
          python - <<'PY'
          from pathlib import Path
          import re
          i=Path('index.html').read_text(encoding='utf-8')
          h=Path('chronologia.html').read_text(encoding='utf-8')
          s=Path('sw.js').read_text(encoding='utf-8')
          c=Path('aa-companion-v2.js').read_text(encoding='utf-8')
          for doc in (i,h):
              assert len(re.findall(r'<script\s+src="\./aa-companion-v2\.js\?v=6\.5\.2"></script>',doc)) == 1
              assert len(re.findall(r'<script\s+src="\./aa-companion-mobile-fix\.js\?v=6\.5\.2"></script>',doc)) == 1
          assert not re.search(r'<script\s+src="\./chronologia-live-companion\.js\?v=',h)
          assert 'motion:lowPower ? .55 : 1' in c
          assert "new URL('aa-companion-mobile-fix.js', BASE).href" in s
          assert 'c652' in s
          print('AA companion 6.5.2 mobile sheet fix PASS')
          PY
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html chronologia.html sw.js aa-companion-v2.js aa-companion-mobile-fix.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix iPhone companion settings sheet and publish 6.5.2"
          git push
