name: Add review item - to for 20260831

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-review-to-for-20260831.yml'

permissions:
  contents: write
  actions: write

jobs:
  add-review-item:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append review item safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          path = Path('review-bank-v1.js')
          text = path.read_text(encoding='utf-8')
          expected_blob = '013a1e51b309f02de99f2aa9895633053459aaaa'
          actual_blob = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'review-bank-v1.js changed unexpectedly: {actual_blob} != {expected_blob}')

          item_id = 'en-to-for-person-destination-beneficiary-20260831'
          if f"id:'{item_id}'" in text:
              raise SystemExit('duplicate id detected')

          item = "  {id:'en-to-for-person-destination-beneficiary-20260831',subject:'英語',unit:'前置詞・to / for',title:'「〜に」と訳す to / for の見分け',question:'日本語ではどちらも「〜に」と訳せるとき、to と for はどう見分ける？ 例：a letter ___ my teacher / a present ___ Tom',answer:'簡単には、to＝「その人へ」、for＝「その人用」で見分ける。a letter to my teacher / a present for Tom。',why:'to は相手を「向かう先」として表し、for は相手を「その人向け・その人用」として表す。日本語では両方とも「〜に」になることがあるので、日本語訳だけでなく「へ」か「用」かで考えると見分けやすい。',examples:['a letter to my teacher（先生への手紙）','a message to you（あなたへのメッセージ）','a present for Tom（トム用のプレゼント）','a seat for me（私用の席）','a ticket for my mother（母用のチケット）'],memory:'to＝その人へ / for＝その人用',tags:['英語','前置詞','to','for','見分け','語法'],createdAt:'2026-08-31'},\n"
          marker = "\n];\nfunction normalize"
          if text.count(marker) != 1:
              raise SystemExit('review bank insertion marker not found uniquely')
          text = text.replace(marker, "\n" + item + "];\nfunction normalize", 1)

          m = re.search(r"window\.AA_REVIEW_BANK_VERSION='(\d+)\.(\d+)\.(\d+)';", text)
          if not m:
              raise SystemExit('AA_REVIEW_BANK_VERSION not found')
          major, minor, patch = map(int, m.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          text = text[:m.start()] + f"window.AA_REVIEW_BANK_VERSION='{new_version}';" + text[m.end():]
          path.write_text(text, encoding='utf-8')
          print('new_version=' + new_version)
          PY

          node --check review-bank-v1.js
          node scripts/validate-review-bank.mjs
          grep -Fq "id:'en-to-for-person-destination-beneficiary-20260831'" review-bank-v1.js
          grep -Fq "window.AA_REVIEW_BANK_VERSION='1.0.57'" review-bank-v1.js

      - name: Commit review bank update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-bank-v1.js
          git commit -m 'Add review item: to と for の見分け'
          git push origin HEAD:main

      - name: Dispatch production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref main
