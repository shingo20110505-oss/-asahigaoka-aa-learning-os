name: Roll Back Bad Kokugo Machine Japanese

on:
  push:
    paths:
      - '.rollback-bad-kokugo-machine-ja-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore trustworthy pre-machine dataset
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git show 3e6a996ceb9ebb939b9f458677ff936db51603ae:kokugo-chronologia/data.jsonl > kokugo-chronologia/data.jsonl
      - name: Mark quality reset and bust cache
        shell: python
        run: |
          import json,re
          from pathlib import Path
          status={
            'state':'quality_reset',
            'total_rows':15000,
            'machine_translation_accepted':False,
            'reason':'Automated English-to-Japanese output failed semantic quality checks; restored the pre-machine dataset. Directly reviewed Japanese overrides remain separate.',
            'next_step':'Rebuild Japanese meanings from verified definitions in reviewed batches.'
          }
          Path('kokugo-chronologia/JA_TRANSLATION_STATUS.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('kokugo-chronologia/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"fetch\('./data\.jsonl[^']*'\s*,\s*\{cache:'no-cache'\}\)","fetch('./data.jsonl?v=quality-reset-20260812',{cache:'no-cache'})",s)
          s=s.replace('意味欄は日本語で表示します。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分も日本語化しています。','意味欄は品質を優先して再整備中です。確認済みの日本語意味を優先し、未確認の機械訳は採用しません。')
          s=s.replace('意味欄は日本語化を順次反映しています。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分は直接わかりやすい日本語へ直していきます。','意味欄は品質を優先して再整備中です。確認済みの日本語意味を優先し、未確認の機械訳は採用しません。')
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=re.sub(r"const VERSION='[^']+';","const VERSION='2.5.3-quality2-chronologia1000-kokugo-quality-reset';",t,count=1)
          assert 'quality2-chronologia1000' in t
          sw.write_text(t,encoding='utf-8')
      - name: Validate rollback
        shell: python
        run: |
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('kokugo-chronologia/data.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==15000,len(rows)
          status=json.loads(Path('kokugo-chronologia/JA_TRANSLATION_STATUS.json').read_text(encoding='utf-8'))
          assert status['state']=='quality_reset'
          assert status['machine_translation_accepted'] is False
          print('QUALITY_RESET_OK rows=15000')
      - name: Commit and push
        run: |
          git add kokugo-chronologia/data.jsonl kokugo-chronologia/index.html kokugo-chronologia/JA_TRANSLATION_STATUS.json sw.js
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Roll back inaccurate Kokugo machine translations'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
