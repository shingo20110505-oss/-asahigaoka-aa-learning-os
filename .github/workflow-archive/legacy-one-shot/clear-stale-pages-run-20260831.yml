name: Clear stale Pages workflow state 20260831

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clear-stale-pages-run-20260831.yml'

permissions:
  actions: write
  contents: read

jobs:
  clear-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale Pages run state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          stale_run=31608131245
          current=$(gh api "repos/${REPO}/actions/runs/${stale_run}" --jq '.status')
          echo "stale_run_status=${current}"
          if [ "${current}" = "in_progress" ] || [ "${current}" = "queued" ] || [ "${current}" = "waiting" ]; then
            gh api --method POST "repos/${REPO}/actions/runs/${stale_run}/force-cancel" || \
              gh api --method POST "repos/${REPO}/actions/runs/${stale_run}/cancel" || true
          fi
          sleep 2
          gh api "repos/${REPO}/actions/runs/${stale_run}" --jq '{id,status,conclusion}'
