name: Reading Audit Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reading-audit-diagnostic.js'
      - '.github/workflows/reading-audit-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect production reading questions
        run: node scripts/reading-audit-diagnostic.js > READING_AUDIT_DIAGNOSTIC.txt
      - name: Show diagnostic
        run: cat READING_AUDIT_DIAGNOSTIC.txt
      - name: Persist diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add READING_AUDIT_DIAGNOSTIC.txt
          git diff --cached --quiet || git commit -m "Record reading audit diagnostic"
          git push
