name: Chronologia Live Companion Patch

on:
  push:
    paths:
      - '.chronologia-live-companion-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject live companion loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('chronologia.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- CHRONOLOGIA-LIVE-COMPANION-LOADER -->'
          loader=marker+'\n<script src="./chronologia-live-companion.js"></script>'
          if marker not in s:
              pos=s.rfind('</body>')
              if pos<0: raise SystemExit('chronologia.html has no </body>')
              s=s[:pos]+loader+'\n'+s[pos:]
          s=s.replace('<title>Chronologia 6.2','<title>Chronologia 6.3',1)
          s=s.replace('const VERSION = "6.2.0";','const VERSION = "6.3.0";',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chronologia.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load pseudo Live2D companion engine"
          git push
