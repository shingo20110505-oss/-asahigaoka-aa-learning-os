name: Add review item - sasu 20260830

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-review-sasu-20260830.yml'

permissions:
  contents: write
  actions: write

jobs:
  add-review-item:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append review item safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          path = Path('review-bank-v1.js')
          text = path.read_text(encoding='utf-8')
          expected_blob = '210bf0b02b3698fbd20747b7b504948187221255'
          actual_blob = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'review-bank-v1.js changed unexpectedly: {actual_blob} != {expected_blob}')

          item_id = 'ja-koten-sasu-causative-honorific-20260830'
          if f"id:'{item_id}'" in text:
              raise SystemExit('duplicate id detected')

          item = "  {id:'ja-koten-sasu-causative-honorific-20260830',subject:'国語',unit:'古文・助動詞',title:'助動詞「さす」：使役・尊敬',question:'古文の助動詞「さす」は何形に接続し、どんな意味を表す？ 使役と尊敬の例文も答えなさい。',answer:'未然形に接続し、意味は使役「〜させる」と尊敬「〜なさる・お〜になる」。接続上、「さす」は四段・ナ変・ラ変以外の未然形につき、四段・ナ変・ラ変には「す」がつく。',why:'「す・さす・しむ」はいずれも使役・尊敬を表す助動詞。尊敬語が一緒に使われていなければ基本は使役。尊敬語が一緒にある場合は尊敬になることがあり、「おはす・おはします」が続けば尊敬、「給ふ・らる」が続く場合は文脈で使役か尊敬かを判断する。',examples:['あげさす。→ あげさせる。（使役）','（帝が自分で）草子をひろげさせ給ひて、〜。→ 帝が草子をお広げになって、〜。（尊敬）','鞍を（別の馬に）置きかへさせけり。→ 鞍を別の馬に置き換えさせた。（使役）'],memory:'さす＝未然形接続／使役「〜させる」・尊敬「〜なさる」。尊敬語なし→まず使役、尊敬語あり→文脈確認。四・ナ・ラには「す」、それ以外には「さす」。',tags:['国語','古文','助動詞','さす','す','しむ','使役','尊敬','未然形','判別','例文'],createdAt:'2026-08-30'},\n"
          marker = "\n];\nfunction normalize"
          if text.count(marker) != 1:
              raise SystemExit('review bank insertion marker not found uniquely')
          text = text.replace(marker, "\n" + item + "];\nfunction normalize", 1)

          m = re.search(r"window\.AA_REVIEW_BANK_VERSION='(\d+)\.(\d+)\.(\d+)';", text)
          if not m:
              raise SystemExit('AA_REVIEW_BANK_VERSION not found')
          major, minor, patch = map(int, m.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          text = text[:m.start()] + f"window.AA_REVIEW_BANK_VERSION='{new_version}';" + text[m.end():]
          path.write_text(text, encoding='utf-8')
          print('new_version=' + new_version)
          PY

          node --check review-bank-v1.js
          node scripts/validate-review-bank.mjs
          grep -Fq "id:'ja-koten-sasu-causative-honorific-20260830'" review-bank-v1.js
          grep -Fq "window.AA_REVIEW_BANK_VERSION='1.0.56'" review-bank-v1.js

      - name: Commit review bank update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-bank-v1.js
          git commit -m 'Add review item: 古文の助動詞さす'
          git push origin HEAD:main

      - name: Dispatch production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref main
