name: Verify area-ratio review production 20260825

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-review-area-ratio-production-20260825.yml'

permissions:
  contents: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify public Review v2 card, answer, image, and exact bank hash
        id: verify
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os
          ITEM_ID: math-area-ratio-two-sides-product-20260825
          IMAGE_PATH: review/assets/20260825-math-area-ratio-two-sides-v2.svg
          BANK_IMAGE_PATH: assets/20260825-math-area-ratio-two-sides-v2.svg
        run: |
          set +e
          release_match=fail
          review_ui=fail
          bank_item=fail
          bank_answer=fail
          bank_image_reference=fail
          bank_version=fail
          bank_exact_hash=fail
          image_fetch=fail
          image_type=fail
          image_hash_match=fail
          image_decode=fail
          image_dimensions=fail
          card_dom_reference=fail
          image_width=0
          image_height=0

          SOURCE_BANK_SHA256=$(sha256sum review-bank-v1.js | awk '{print $1}')
          SOURCE_IMAGE_SHA256=$(sha256sum "$IMAGE_PATH" | awk '{print $1}')

          for n in $(seq 1 96); do
            curl -fsSL --connect-timeout 10 --max-time 25 "$BASE/release.json?verify=$SOURCE_SHA-$n" -o /tmp/release.json
            if grep -q "$SOURCE_SHA" /tmp/release.json 2>/dev/null; then release_match=success; break; fi
            sleep 5
          done

          curl -fsSL "$BASE/review/?verify=$SOURCE_SHA" -o /tmp/review.html
          grep -q 'Review v2' /tmp/review.html && grep -q 'reviewImage' /tmp/review.html && review_ui=success

          curl -fsSL "$BASE/review-bank-v1.js?verify=$SOURCE_SHA" -o /tmp/public-bank.js
          grep -Fq "$ITEM_ID" /tmp/public-bank.js && bank_item=success
          grep -Fq '△ADE＝5/2 cm²＝2.5 cm²' /tmp/public-bank.js && bank_answer=success
          grep -Fq "$BANK_IMAGE_PATH" /tmp/public-bank.js && bank_image_reference=success
          grep -Fq "window.AA_REVIEW_BANK_VERSION='1.0.52';" /tmp/public-bank.js && bank_version=success
          PUBLIC_BANK_SHA256=$(sha256sum /tmp/public-bank.js 2>/dev/null | awk '{print $1}')
          cmp -s review-bank-v1.js /tmp/public-bank.js && test "$PUBLIC_BANK_SHA256" = "$SOURCE_BANK_SHA256" && bank_exact_hash=success

          curl -fsSL -D /tmp/image.headers "$BASE/$IMAGE_PATH?verify=$SOURCE_SHA" -o /tmp/public-image.svg
          test -s /tmp/public-image.svg && image_fetch=success
          grep -Fq '<svg' /tmp/public-image.svg && image_type=success
          PUBLIC_IMAGE_SHA256=$(sha256sum /tmp/public-image.svg 2>/dev/null | awk '{print $1}')
          cmp -s "$IMAGE_PATH" /tmp/public-image.svg && test "$PUBLIC_IMAGE_SHA256" = "$SOURCE_IMAGE_SHA256" && image_hash_match=success

          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if test -n "$CHROME"; then
            cat >/tmp/image-check.html <<EOF
          <!doctype html><html><body data-image-decode="WAIT"><img id="target" src="$BASE/$IMAGE_PATH?browser=$SOURCE_SHA"><script>
          const img=document.getElementById('target');
          const done=()=>{if(img.complete){document.body.dataset.imageDecode=(img.naturalWidth>0&&img.naturalHeight>0)?'PASS':'FAIL';document.body.dataset.width=img.naturalWidth;document.body.dataset.height=img.naturalHeight;}};
          img.addEventListener('load',done);img.addEventListener('error',done);setInterval(done,100);
          </script></body></html>
          EOF
            timeout 60s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom file:///tmp/image-check.html >/tmp/image-check-dom.html 2>/tmp/chrome-image.err
            grep -q 'data-image-decode="PASS"' /tmp/image-check-dom.html && image_decode=success
            image_width=$(grep -o 'data-width="[0-9]*"' /tmp/image-check-dom.html | head -1 | tr -cd '0-9')
            image_height=$(grep -o 'data-height="[0-9]*"' /tmp/image-check-dom.html | head -1 | tr -cd '0-9')
            test -n "$image_width" || image_width=0
            test -n "$image_height" || image_height=0
            test "$image_width" = 900 && test "$image_height" = 700 && image_dimensions=success

            timeout 60s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=25000 --dump-dom "$BASE/review/?domverify=$SOURCE_SHA" >/tmp/review-dom.html 2>/tmp/chrome-review.err
            grep -Fq "data-id=\"$ITEM_ID\"" /tmp/review-dom.html && grep -Fq "src=\"$BANK_IMAGE_PATH\"" /tmp/review-dom.html && card_dom_reference=success
          fi

          result=success
          for v in "$release_match" "$review_ui" "$bank_item" "$bank_answer" "$bank_image_reference" "$bank_version" "$bank_exact_hash" "$image_fetch" "$image_type" "$image_hash_match" "$image_decode" "$image_dimensions" "$card_dom_reference"; do
            test "$v" = success || result=fail
          done

          cat > /tmp/REVIEW_AREA_RATIO_VERIFY_STATUS.txt <<EOF
          result=$result
          source_sha=$SOURCE_SHA
          item_id=$ITEM_ID
          review_version=1.0.52
          image_path=$IMAGE_PATH
          release_match=$release_match
          review_ui=$review_ui
          review_bank_item=$bank_item
          review_bank_answer=$bank_answer
          review_bank_reference=$bank_image_reference
          review_bank_version=$bank_version
          source_bank_sha256=$SOURCE_BANK_SHA256
          public_bank_sha256=$PUBLIC_BANK_SHA256
          review_bank_exact_hash=$bank_exact_hash
          image_fetch=$image_fetch
          image_type=$image_type
          source_image_sha256=$SOURCE_IMAGE_SHA256
          public_image_sha256=$PUBLIC_IMAGE_SHA256
          image_hash_match=$image_hash_match
          image_decode=$image_decode
          image_dimensions=$image_dimensions
          image_width=$image_width
          image_height=$image_height
          card_dom_reference=$card_dom_reference
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Record verification status
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/REVIEW_AREA_RATIO_VERIFY_STATUS.txt REVIEW_AREA_RATIO_VERIFY_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REVIEW_AREA_RATIO_VERIFY_STATUS.txt
          git commit -m 'Record area-ratio production verification'
          git pull --rebase origin main
          git push origin main

      - name: Enforce success
        shell: bash
        run: grep -q '^result=success$' /tmp/REVIEW_AREA_RATIO_VERIFY_STATUS.txt
