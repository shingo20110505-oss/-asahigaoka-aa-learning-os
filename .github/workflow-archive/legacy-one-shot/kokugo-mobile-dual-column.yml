name: "Keep Kokugo Term Meaning and Rank Visible"

"on":
  workflow_run:
    workflows:
      - "Convert Kokugo Meanings to Japanese Fast"
      - "Convert Kokugo Meanings to Japanese"
    types:
      - completed

permissions:
  contents: write

jobs:
  apply-mobile-layout:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply mobile term meaning rank layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('kokugo-chronologia/index.html')
          s = page.read_text(encoding='utf-8')
          css = r'''/* KOKUGO_MOBILE_DUAL_COLUMN_V2_RANK */
          @media(max-width:760px){
            .tableWrap{overflow:visible;border:0;background:transparent;border-radius:0}
            .table{min-width:0;width:100%}
            .tr{grid-template-columns:minmax(112px,34%) minmax(0,1fr) 42px;grid-template-rows:auto auto auto;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
            .tr>div{min-height:0;border:0;padding:8px 9px}
            .tr>div:nth-child(1),.tr>div:nth-child(5){display:none}
            .tr>div:nth-child(2){grid-column:1;grid-row:1;border-right:1px solid #e5e9ef;padding-bottom:3px}
            .tr>div:nth-child(3){grid-column:1;grid-row:2;border-right:1px solid #e5e9ef;padding-top:2px}
            .tr>div:nth-child(4){grid-column:2;grid-row:1 / span 2;align-self:stretch;border-right:1px solid #e5e9ef}
            .tr>div:nth-child(6){display:flex;grid-column:3;grid-row:1 / span 2;align-items:center;justify-content:center;padding:6px 3px;background:#fafbfc}
            .tr>div:nth-child(7){grid-column:1 / -1;grid-row:3;border-top:1px solid #eef1f5;padding:6px 8px}
            .th{position:sticky;top:0;z-index:15;display:grid;grid-template-columns:minmax(112px,34%) minmax(0,1fr) 42px;grid-template-rows:auto;background:#edf1f6;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden;box-shadow:0 1px 0 #d9e1ec}
            .th>div{display:none!important}
            .th>div:nth-child(2),.th>div:nth-child(4),.th>div:nth-child(6){display:block!important;padding:8px 7px;border:0}
            .th>div:nth-child(2){grid-column:1;border-right:1px solid #d9e1ec}
            .th>div:nth-child(4){grid-column:2;border-right:1px solid #d9e1ec}
            .th>div:nth-child(6){grid-column:3;text-align:center;padding-left:2px;padding-right:2px}
            .word{font-size:14px;line-height:1.35}
            .reading{font-size:10px;line-height:1.35}
            .meaning{font-size:12px;line-height:1.5;word-break:break-word}
            .rank{font-size:15px;font-weight:1000}
            .states{justify-content:flex-end;gap:6px}
            .mini{padding:6px 9px}
          }
          @media(max-width:420px){
            .tr,.th{grid-template-columns:minmax(108px,35%) minmax(0,1fr) 38px}
          }'''
          s = re.sub(r'/\* KOKUGO_MOBILE_DUAL_COLUMN_V1 \*/.*?(?=</style>)', '', s, count=1, flags=re.S)
          s = re.sub(r'/\* KOKUGO_MOBILE_DUAL_COLUMN_V2_RANK \*/.*?(?=</style>)', '', s, count=1, flags=re.S)
          s = s.replace('</style>', css + '</style>', 1)
          page.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t = re.sub(r"const VERSION='[^']+';", "const VERSION='2.4.2-quality2-chronologia1000-kokugo-mobile-rank';", t, count=1)
          sw.write_text(t, encoding='utf-8')
          PY

      - name: Validate mobile layout
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('kokugo-chronologia/index.html').read_text(encoding='utf-8')
          assert 'KOKUGO_MOBILE_DUAL_COLUMN_V2_RANK' in s
          assert 'grid-template-columns:minmax(112px,34%) minmax(0,1fr) 42px' in s
          assert '.tr>div:nth-child(6){display:flex;grid-column:3;grid-row:1 / span 2' in s
          assert '.tr>div:nth-child(1),.tr>div:nth-child(5){display:none}' in s
          assert '.th>div:nth-child(2),.th>div:nth-child(4),.th>div:nth-child(6)' in s
          t = Path('sw.js').read_text(encoding='utf-8')
          assert "2.4.2-quality2-chronologia1000-kokugo-mobile-rank" in t
          print('mobile term + meaning + rank layout OK')
          PY

      - name: Commit and push safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/index.html sw.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Show Kokugo term meaning and rank together on mobile'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
