name: Observe Pages Deployment

on:
  workflow_run:
    workflows: ["Deploy AA Learning OS to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record workflow result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cat > PAGES_RUN_STATUS.txt <<EOF
          workflow=Deploy AA Learning OS to GitHub Pages
          run_id=${RUN_ID}
          run_number=${RUN_NUMBER}
          head_sha=${HEAD_SHA}
          conclusion=${CONCLUSION}
          event=${EVENT_NAME}
          run_url=${RUN_URL}
          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAGES_RUN_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record GitHub Pages deployment run"
            git push origin main
          fi
