name: Add review item - invite 20260901

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-review-invite-20260901.yml'

permissions:
  contents: write
  actions: write

jobs:
  add-review-item:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append review item safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          path = Path('review-bank-v1.js')
          text = path.read_text(encoding='utf-8')
          expected_blob = '2582f46052a19471b7b0e60b0de8f372565c7a1f'
          actual_blob = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'review-bank-v1.js changed unexpectedly: {actual_blob} != {expected_blob}')

          item_id = 'en-invite-meaning-usage-20260901'
          if f"id:'{item_id}'" in text:
              raise SystemExit('duplicate id detected')

          item = "  {id:'en-invite-meaning-usage-20260901',subject:'英語',unit:'語彙・invite',title:'invite の意味と使い方',question:'invite はどういう意味？ また、invite + 人 + to ～ はどのように使う？',answer:'invite は動詞で「招待する・誘う」。invite + 人 + to + 場所／行事 で「人を～に招待する」、invite + 人 + to do で「人を～するよう誘う」という意味になる。名詞は invitation（招待・招待状）。',why:'invite は「人をある場所・行事・行動へ招く」という動詞。to の後ろに場所や行事を置けば「～に招待する」、to + 動詞の原形なら「～するよう誘う」と考えると分かりやすい。',examples:['I invited him to my party.（私は彼をパーティーに招待した）','She invited me to have dinner.（彼女は私を夕食に誘った）','invite + 人 + to + 場所／行事','invite + 人 + to do','invitation＝招待・招待状'],memory:'invite＝招待する・誘う / invite + 人 + to ～ / 名詞は invitation',tags:['英語','invite','invitation','語彙','招待する','誘う'],createdAt:'2026-09-01'},\n"
          marker = "\n];\nfunction normalize"
          if text.count(marker) != 1:
              raise SystemExit('review bank insertion marker not found uniquely')
          text = text.replace(marker, "\n" + item + "];\nfunction normalize", 1)

          m = re.search(r"window\.AA_REVIEW_BANK_VERSION='(\d+)\.(\d+)\.(\d+)';", text)
          if not m:
              raise SystemExit('AA_REVIEW_BANK_VERSION not found')
          major, minor, patch = map(int, m.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          text = text[:m.start()] + f"window.AA_REVIEW_BANK_VERSION='{new_version}';" + text[m.end():]
          path.write_text(text, encoding='utf-8')
          print('new_version=' + new_version)
          PY

          node --check review-bank-v1.js
          node scripts/validate-review-bank.mjs
          grep -Fq "id:'en-invite-meaning-usage-20260901'" review-bank-v1.js
          grep -Fq "window.AA_REVIEW_BANK_VERSION='1.0.60'" review-bank-v1.js

      - name: Commit review bank update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-bank-v1.js
          git commit -m 'Add review item: invite'
          git push origin HEAD:main

      - name: Dispatch production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref main
