name: Add review items - passive prepositions 20260831

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-review-passive-prepositions-20260831.yml'

permissions:
  contents: write
  actions: write

jobs:
  add-review-items:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append review items safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          path = Path('review-bank-v1.js')
          text = path.read_text(encoding='utf-8')
          expected_blob = '1d8cf0167eb319082e9c8ed226a39161dc4dbf6f'
          actual_blob = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'review-bank-v1.js changed unexpectedly: {actual_blob} != {expected_blob}')

          item_ids = [
              'en-passive-prepositions-common-20260831',
              'en-known-to-for-as-20260831',
              'en-made-in-place-20260831',
          ]
          for item_id in item_ids:
              if f"id:'{item_id}'" in text:
                  raise SystemExit(f'duplicate id detected: {item_id}')

          items = [
              "  {id:'en-passive-prepositions-common-20260831',subject:'英語',unit:'受け身・前置詞',title:'受け身で by 以外を使う重要表現',question:'受け身や過去分詞を使う表現で、by ではなく決まった前置詞を使う代表例を答えなさい。',answer:'be interested in（〜に興味がある）、be surprised at（〜に驚く）、be pleased with（〜を喜ぶ・〜に満足する）、be satisfied with（〜に満足している）、be covered with（〜で覆われている）、be filled with（〜でいっぱいである）、be crowded with（〜で混雑している）、be worried about（〜を心配している）、be born in（〜で・〜に生まれる）を重要表現として覚えます。',why:'受け身の by は基本的に「その動作をした人・もの」を示します。一方、これらは過去分詞と特定の前置詞がまとまって意味を作る定番表現です。日本語だけから前置詞を決めず、be interested in のようにセットで覚えるのが安全です。',examples:['I am interested in music.（私は音楽に興味があります）','I was surprised at the news.（私はその知らせに驚きました）','The mountain is covered with snow.（その山は雪で覆われています）','The box is filled with books.（その箱は本でいっぱいです）','The station was crowded with people.（その駅は人で混雑していました）','I am worried about the test.（私はテストを心配しています）','I was born in Japan.（私は日本で生まれました）'],memory:'in＝interested / at＝surprised / with＝pleased・satisfied・covered・filled・crowded / about＝worried / in＝born',tags:['英語','受け身','過去分詞','前置詞','by以外','interested in','surprised at','with','worried about','born in'],createdAt:'2026-08-31'},\n",
              "  {id:'en-known-to-for-as-20260831',subject:'英語',unit:'受け身・前置詞',title:'be known to / for / as の使い分け',question:'be known to / be known for / be known as は、それぞれどう使い分ける？',answer:'be known to + 人＝「〜に知られている」、be known for + 特徴・理由＝「〜で有名だ」、be known as + 名前・立場＝「〜として知られている」です。',why:'同じ known でも、後ろに何を置くかで前置詞が変わります。to は「知られている相手」、for は「有名な理由・特徴」、as は「呼ばれ方・立場」を表します。',examples:['He is known to everyone.（彼はみんなに知られています）','Kyoto is known for its temples.（京都は寺で有名です）','He is known as a great scientist.（彼は偉大な科学者として知られています）'],memory:'known to＝人に / known for＝理由・特徴で / known as＝〜として',tags:['英語','受け身','known','known to','known for','known as','前置詞','見分け'],createdAt:'2026-08-31'},\n",
              "  {id:'en-made-in-place-20260831',subject:'英語',unit:'受け身・前置詞',title:'be made in は「作られた場所」',question:'be made in は何を表す？ すでに学んだ be made of / be made from とどう区別する？',answer:'be made in + 場所 は「〜で作られる・作られた」と製造場所を表します。made of は見て元の材料が分かる材料、made from は加工されて元の形が分かりにくい材料を表します。',why:'in は場所を表す前置詞なので made in Japan のように製造場所を示します。of / from は材料について説明するため、in とは役割が違います。',examples:['This car was made in Japan.（この車は日本で作られました）','This desk is made of wood.（この机は木でできています）','Wine is made from grapes.（ワインはぶどうから作られます）'],memory:'made in＝場所 / made of＝見て分かる材料 / made from＝変化した材料',tags:['英語','受け身','made in','made of','made from','前置詞','場所','材料'],createdAt:'2026-08-31'},\n",
          ]

          marker = "\n];\nfunction normalize"
          if text.count(marker) != 1:
              raise SystemExit('review bank insertion marker not found uniquely')
          text = text.replace(marker, "\n" + ''.join(items) + "];\nfunction normalize", 1)

          m = re.search(r"window\.AA_REVIEW_BANK_VERSION='(\d+)\.(\d+)\.(\d+)';", text)
          if not m:
              raise SystemExit('AA_REVIEW_BANK_VERSION not found')
          current_version = '.'.join(m.groups())
          if current_version != '1.0.57':
              raise SystemExit(f'unexpected review version: {current_version}')
          major, minor, patch = map(int, m.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          text = text[:m.start()] + f"window.AA_REVIEW_BANK_VERSION='{new_version}';" + text[m.end():]
          path.write_text(text, encoding='utf-8')
          print('new_version=' + new_version)
          PY

          node --check review-bank-v1.js
          node scripts/validate-review-bank.mjs
          grep -Fq "id:'en-passive-prepositions-common-20260831'" review-bank-v1.js
          grep -Fq "id:'en-known-to-for-as-20260831'" review-bank-v1.js
          grep -Fq "id:'en-made-in-place-20260831'" review-bank-v1.js
          grep -Fq "window.AA_REVIEW_BANK_VERSION='1.0.58'" review-bank-v1.js

      - name: Commit review bank update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-bank-v1.js
          git commit -m 'Add review items: passive prepositions beyond by'
          git push origin HEAD:main

      - name: Dispatch production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref main
