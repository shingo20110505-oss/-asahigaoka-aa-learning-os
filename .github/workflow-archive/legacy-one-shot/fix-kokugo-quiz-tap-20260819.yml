name: Fix Kokugo Quiz Tap 20260819

on:
  push:
    paths:
      - '.github/workflows/fix-kokugo-quiz-tap-20260819.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore direct iPhone tap fix loader
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path('kokugo-chronologia/index.html')
          s = p.read_text(encoding='utf-8')

          # The dedicated touch fix already exists. Make the page load it directly
          # instead of depending on another bridge/script being present.
          include = '<script src="./quiz-interaction-fix.js?v=20260819-1"></script>'
          pattern = r'<script src="\./quiz-interaction-fix\.js(?:\?v=[^"]*)?"></script>'
          if re.search(pattern, s):
              s = re.sub(pattern, include, s, count=1)
          else:
              marker = re.search(r'<script src="\./jukugo-extension\.js(?:\?v=[^"]*)?"></script>', s)
              if not marker:
                  raise SystemExit('jukugo-extension loader not found')
              s = s[:marker.end()] + include + s[marker.end():]

          if s.count('quiz-interaction-fix.js') != 1:
              raise SystemExit('quiz interaction fix loader count is not 1')
          if 'koten-kanbun-extension.js?v=20260819-1' not in s:
              raise SystemExit('current Koten loader unexpectedly changed')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate repair target
        shell: bash
        run: |
          test -f kokugo-chronologia/quiz-interaction-fix.js
          grep -Fq '<script src="./jukugo-extension.js?v=20260815-2"></script><script src="./quiz-interaction-fix.js?v=20260819-1"></script>' kokugo-chronologia/index.html
          grep -Fq "pointer-events','auto','important'" kokugo-chronologia/quiz-interaction-fix.js
          grep -Fq "window.addEventListener('touchend',captureTouch" kokugo-chronologia/quiz-interaction-fix.js
          grep -Fq "window.addEventListener('pointerup',capturePointer" kokugo-chronologia/quiz-interaction-fix.js
          grep -Fq "STATE_KEY='kokugoChronologiaStateV2'" kokugo-chronologia/jukugo-extension.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kokugo-chronologia/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: restore Kokugo quiz iPhone tap loader'
            git push origin HEAD:main
          fi
