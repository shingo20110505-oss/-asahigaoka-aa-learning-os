name: Convert All 15000 Kokugo Meanings to Japanese Continuously V2

on:
  push:
    paths:
      - '.kokugo-ja-all-continuous-v2-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kokugo-ja-all-continuous
  cancel-in-progress: false

jobs:
  translate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 --version

      - name: Install local English-to-Japanese model runtime
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python3 -m pip install 'transformers==4.56.2' sentencepiece sacremoses

      - name: Translate all remaining meanings with 1000-row checkpoints
        shell: python
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          import json,re,os,subprocess,time,hashlib
          from datetime import datetime,timezone
          from pathlib import Path
          import torch
          from transformers import MarianMTModel, MarianTokenizer

          DATA=Path('kokugo-chronologia/data.jsonl')
          STATUS=Path('kokugo-chronologia/JA_TRANSLATION_STATUS.json')
          OV=Path('kokugo-chronologia/meaning-overrides-ja.json')
          MODEL='Helsinki-NLP/opus-mt-en-jap'
          CHECKPOINT=1000
          BATCH=32

          def now(): return datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          def jp(s): return len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]',str(s or '')))
          def latin(s): return len(re.findall(r'[A-Za-z]',str(s or '')))
          def needs(s):
              s=str(s or '').strip()
              return bool(s) and latin(s)>=3 and jp(s)==0

          rows=[json.loads(x) for x in DATA.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==15000,len(rows)
          overrides=json.loads(OV.read_text(encoding='utf-8')) if OV.exists() else {}
          byid={str(r.get('id')):r for r in rows}
          for k,v in overrides.items():
              assert k in byid,k
              byid[k]['meaning']=v

          pending=[i for i,r in enumerate(rows) if needs(r.get('meaning'))]
          total_pending=len(pending)
          status={
            'state':'running','total_rows':15000,'started_at':now(),'model':MODEL,
            'direct_override_count':len(overrides),'initial_pending':total_pending,
            'translated_this_run':0,'remaining_english_only':total_pending,'checkpoint_every':CHECKPOINT
          }
          print(f'INITIAL total=15000 direct={len(overrides)} pending={total_pending}',flush=True)

          def save():
              DATA.write_text('\n'.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in rows)+'\n',encoding='utf-8')
              STATUS.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def push_checkpoint(message):
              save()
              subprocess.run(['git','add',str(DATA),str(STATUS)],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode==0:
                  return
              subprocess.run(['git','commit','-m',message],check=True)
              for attempt in range(1,8):
                  if subprocess.run(['git','push','origin','HEAD:main']).returncode==0:
                      print('PUSH_OK',message,flush=True); return
                  subprocess.run(['git','fetch','origin','main'],check=True)
                  subprocess.run(['git','rebase','origin/main'],check=True)
                  time.sleep(2*attempt)
              raise SystemExit('checkpoint push failed')

          if pending:
              print('Loading model',MODEL,flush=True)
              tok=MarianTokenizer.from_pretrained(MODEL)
              model=MarianMTModel.from_pretrained(MODEL)
              model.eval()
              torch.set_num_threads(max(1,min(4,os.cpu_count() or 2)))

              def trans(texts,beams=4):
                  enc=tok(texts,return_tensors='pt',padding=True,truncation=True,max_length=192)
                  with torch.inference_mode():
                      out=model.generate(**enc,max_new_tokens=128,num_beams=beams,early_stopping=True)
                  return [re.sub(r'\s+',' ',x).strip().replace(' / ','・') for x in tok.batch_decode(out,skip_special_tokens=True)]

              translated=0
              last_cp=0
              unresolved=[]
              for start in range(0,total_pending,BATCH):
                  inds=pending[start:start+BATCH]
                  eng=[str(rows[i].get('meaning','')).strip() for i in inds]
                  out=trans(eng,4)
                  for idx,en,ja in zip(inds,eng,out):
                      if jp(ja)==0:
                          retry=trans([en],6)[0]
                          if jp(retry)>0: ja=retry
                      if jp(ja)==0:
                          unresolved.append({'id':str(rows[idx].get('id')),'term':rows[idx].get('term'),'meaning_en':en,'model_output':ja})
                          continue
                      rows[idx]['meaning']=ja
                      translated+=1

                  status['translated_this_run']=translated
                  status['remaining_english_only']=sum(1 for r in rows if needs(r.get('meaning')))
                  status['last_progress_at']=now()

                  if translated-last_cp>=CHECKPOINT:
                      last_cp=translated
                      status['last_checkpoint_translated']=translated
                      push_checkpoint(f'Kokugo JA checkpoint {translated}/{total_pending}')
                      print(f'PROGRESS {translated}/{total_pending} remaining={status["remaining_english_only"]}',flush=True)

              remaining=[(r.get('id'),r.get('term'),r.get('meaning')) for r in rows if needs(r.get('meaning'))]
              if remaining:
                  status.update({'state':'needs_review','remaining_english_only':len(remaining),'unresolved_sample':unresolved[:100],'failed_at':now()})
                  push_checkpoint(f'Record {len(remaining)} unresolved Kokugo meanings')
                  raise SystemExit(f'{len(remaining)} English-only meanings remain: {remaining[:10]}')

          status.update({'state':'complete','remaining_english_only':0,'completed_at':now()})
          save()
          status['data_sha256']=hashlib.sha256(DATA.read_bytes()).hexdigest()
          STATUS.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          push_checkpoint('Complete Japanese meanings for all 15000 Kokugo entries')
          print('TRANSLATION_COMPLETE 15000/15000',flush=True)

      - name: Finalize page, cache version, and validate all 15000
        shell: python
        run: |
          import json,re,hashlib,subprocess,time
          from pathlib import Path
          data=Path('kokugo-chronologia/data.jsonl')
          rows=[json.loads(x) for x in data.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==15000,len(rows)
          def jp(s): return len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]',str(s or '')))
          def latin(s): return len(re.findall(r'[A-Za-z]',str(s or '')))
          bad=[(r.get('id'),r.get('term'),r.get('meaning')) for r in rows if latin(r.get('meaning'))>=3 and jp(r.get('meaning'))==0]
          assert not bad,bad[:20]

          ov=json.loads(Path('kokugo-chronologia/meaning-overrides-ja.json').read_text(encoding='utf-8'))
          byid={str(r.get('id')):r for r in rows}
          for k,v in ov.items(): assert byid[k].get('meaning')==v,(k,byid[k].get('meaning'),v)

          page=Path('kokugo-chronologia/index.html')
          s=page.read_text(encoding='utf-8')
          s=s.replace("fetch('./data.jsonl',{cache:'force-cache'})","fetch('./data.jsonl?v=ja-all-15000-20260812',{cache:'no-cache'})")
          s=s.replace("fetch('./data.jsonl?v=direct-ja-1',{cache:'no-cache'})","fetch('./data.jsonl?v=ja-all-15000-20260812',{cache:'no-cache'})")
          s=s.replace('辞書拡張分の意味はJMdict由来の英語gloss、手作業確認済み語は日本語意味を優先します。','意味欄は日本語で表示します。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分も日本語化しています。')
          s=s.replace('意味欄は日本語で統一しています。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分も日本語化して表示します。','意味欄は日本語で表示します。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分も日本語化しています。')
          page.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=re.sub(r"const VERSION='[^']+';","const VERSION='2.5.0-quality2-chronologia1000-kokugo-ja-all-15000';",t,count=1)
          assert 'quality2-chronologia1000' in t
          sw.write_text(t,encoding='utf-8')

          st=Path('kokugo-chronologia/JA_TRANSLATION_STATUS.json')
          o=json.loads(st.read_text(encoding='utf-8'))
          o.update({'state':'complete','final_rows':15000,'remaining_english_only':0,'data_sha256':hashlib.sha256(data.read_bytes()).hexdigest()})
          st.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          subprocess.run(['git','add',str(page),str(sw),str(st)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','Finalize all 15000 Kokugo Japanese meanings'],check=True)
              for attempt in range(1,8):
                  if subprocess.run(['git','push','origin','HEAD:main']).returncode==0: break
                  subprocess.run(['git','fetch','origin','main'],check=True)
                  subprocess.run(['git','rebase','origin/main'],check=True)
                  time.sleep(2*attempt)
              else: raise SystemExit('final push failed')
          print(f'FINAL_VALIDATION_OK rows=15000 english_only=0 direct={len(ov)}')

      - name: Dispatch final Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo 'Final Pages deployment dispatched.'
