name: Emergency Restore Index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-restore-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Restore known-good index.html
        run: |
          git fetch origin 5ad20b5bb4b662941ed91369d0c130a40170f4d9 --depth=1
          git show 5ad20b5bb4b662941ed91369d0c130a40170f4d9:index.html > index.html
          test "$(wc -c < index.html)" -gt 10000
          grep -q 'function evidenceRefs' index.html
      - name: Commit restore
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Restore index after accidental replacement"
          git pull --rebase origin main
          git push origin main
