name: Convert All 15000 Kokugo Meanings to Japanese Continuously

on:
  push:
    paths:
      - '.kokugo-ja-all-continuous-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kokugo-ja-all-continuous
  cancel-in-progress: false

jobs:
  translate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install offline translation model runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install 'transformers<5' sentencepiece sacremoses

      - name: Translate every remaining English-only meaning and checkpoint continuously
        shell: python
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          import json, re, os, subprocess, time, hashlib
          from datetime import datetime, timezone
          from pathlib import Path

          import torch
          from transformers import MarianMTModel, MarianTokenizer

          DATA = Path('kokugo-chronologia/data.jsonl')
          STATUS = Path('kokugo-chronologia/JA_TRANSLATION_STATUS.json')
          OVERRIDES = Path('kokugo-chronologia/meaning-overrides-ja.json')
          MODEL_NAME = 'Helsinki-NLP/opus-mt-en-jap'
          CHECKPOINT_EVERY = 1000
          INFER_BATCH = 32

          def now():
              return datetime.now(timezone.utc).isoformat().replace('+00:00','Z')

          def japanese_chars(s):
              return len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]', str(s or '')))

          def latin_chars(s):
              return len(re.findall(r'[A-Za-z]', str(s or '')))

          def needs_ja(s):
              s = str(s or '').strip()
              return bool(s) and latin_chars(s) >= 3 and japanese_chars(s) == 0

          def run(cmd, check=True):
              return subprocess.run(cmd, check=check, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)

          rows = [json.loads(x) for x in DATA.read_text(encoding='utf-8').splitlines() if x.strip()]
          if len(rows) != 15000:
              raise SystemExit(f'Expected exactly 15000 rows, got {len(rows)}')

          overrides = json.loads(OVERRIDES.read_text(encoding='utf-8')) if OVERRIDES.exists() else {}
          by_id = {str(r.get('id')): r for r in rows}
          for k, v in overrides.items():
              if k not in by_id:
                  raise SystemExit(f'Direct Japanese override ID missing: {k}')
              if by_id[k].get('meaning') != v:
                  by_id[k]['meaning'] = v

          initial_pending = [i for i, r in enumerate(rows) if needs_ja(r.get('meaning'))]
          initial_done = len(rows) - len(initial_pending)
          print(f'Rows={len(rows)} already-Japanese/mixed={initial_done} pending-English-only={len(initial_pending)}', flush=True)

          status = {
              'state': 'running',
              'total_rows': len(rows),
              'started_at': now(),
              'model': MODEL_NAME,
              'direct_override_count': len(overrides),
              'initial_pending': len(initial_pending),
              'translated_this_run': 0,
              'remaining_english_only': len(initial_pending),
              'checkpoint_every': CHECKPOINT_EVERY,
          }

          def write_files():
              DATA.write_text('\n'.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) for r in rows) + '\n', encoding='utf-8')
              STATUS.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def checkpoint(message):
              write_files()
              subprocess.run(['git','add',str(DATA),str(STATUS)], check=True)
              diff = subprocess.run(['git','diff','--cached','--quiet'])
              if diff.returncode == 0:
                  print('checkpoint: no changes', flush=True)
                  return
              subprocess.run(['git','commit','-m',message], check=True)
              for attempt in range(1, 8):
                  cp = subprocess.run(['git','push','origin','HEAD:main'])
                  if cp.returncode == 0:
                      print(f'checkpoint push success attempt={attempt}', flush=True)
                      return
                  print(f'checkpoint push retry attempt={attempt}', flush=True)
                  subprocess.run(['git','fetch','origin','main'], check=True)
                  subprocess.run(['git','rebase','origin/main'], check=True)
                  time.sleep(2 * attempt)
              raise SystemExit('Could not push checkpoint after retries')

          if not initial_pending:
              status.update({'state':'complete','translated_this_run':0,'remaining_english_only':0,'completed_at':now()})
              checkpoint('Confirm all 15000 Kokugo meanings are Japanese')
          else:
              print('Loading offline Marian English-to-Japanese model...', flush=True)
              tokenizer = MarianTokenizer.from_pretrained(MODEL_NAME)
              model = MarianMTModel.from_pretrained(MODEL_NAME)
              model.eval()
              torch.set_num_threads(max(1, min(4, os.cpu_count() or 2)))

              translated = 0
              unresolved = []

              def translate_batch(texts, beams=4):
                  enc = tokenizer(texts, return_tensors='pt', padding=True, truncation=True, max_length=192)
                  with torch.inference_mode():
                      out = model.generate(**enc, max_new_tokens=128, num_beams=beams, early_stopping=True)
                  return [x.strip() for x in tokenizer.batch_decode(out, skip_special_tokens=True)]

              for start in range(0, len(initial_pending), INFER_BATCH):
                  indices = initial_pending[start:start+INFER_BATCH]
                  texts = [str(rows[i].get('meaning','')).strip() for i in indices]
                  results = translate_batch(texts, beams=4)
                  for idx, original, ja in zip(indices, texts, results):
                      ja = re.sub(r'\s+', ' ', ja).strip().replace(' / ', '・')
                      if japanese_chars(ja) == 0:
                          # One slower retry for stubborn proper nouns / short glosses.
                          retry = translate_batch([original], beams=6)[0]
                          retry = re.sub(r'\s+', ' ', retry).strip().replace(' / ', '・')
                          if japanese_chars(retry) > 0:
                              ja = retry
                      if japanese_chars(ja) == 0:
                          unresolved.append({'id':str(rows[idx].get('id')),'term':rows[idx].get('term'),'meaning_en':original,'model_output':ja})
                          continue
                      rows[idx]['meaning'] = ja
                      translated += 1

                  status['translated_this_run'] = translated
                  status['remaining_english_only'] = sum(1 for r in rows if needs_ja(r.get('meaning')))
                  status['last_progress_at'] = now()

                  if translated and (translated % CHECKPOINT_EVERY < INFER_BATCH or start + INFER_BATCH >= len(initial_pending)):
                      status['last_checkpoint_translated'] = translated
                      checkpoint(f'Kokugo Japanese translation checkpoint {translated}/{len(initial_pending)}')
                      print(f'PROGRESS translated={translated} remaining={status["remaining_english_only"]}', flush=True)

              remaining = [(r.get('id'), r.get('term'), r.get('meaning')) for r in rows if needs_ja(r.get('meaning'))]
              if remaining:
                  status.update({
                      'state': 'needs_review',
                      'remaining_english_only': len(remaining),
                      'unresolved_sample': unresolved[:50],
                      'failed_at': now(),
                  })
                  checkpoint(f'Record {len(remaining)} unresolved Kokugo Japanese meanings')
                  raise SystemExit(f'{len(remaining)} English-only meanings still remain: {remaining[:10]}')

              status.update({
                  'state': 'complete',
                  'remaining_english_only': 0,
                  'completed_at': now(),
                  'data_sha256': hashlib.sha256(DATA.read_bytes()).hexdigest(),
              })
              checkpoint(f'Complete Japanese meanings for all {len(rows)} Kokugo entries')

      - name: Final page/cache update and validation
        shell: python
        run: |
          import json,re,hashlib,subprocess,time
          from pathlib import Path

          data=Path('kokugo-chronologia/data.jsonl')
          rows=[json.loads(x) for x in data.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==15000, len(rows)
          def jp(s): return len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]',str(s or '')))
          def latin(s): return len(re.findall(r'[A-Za-z]',str(s or '')))
          bad=[(r.get('id'),r.get('term'),r.get('meaning')) for r in rows if latin(r.get('meaning'))>=3 and jp(r.get('meaning'))==0]
          assert not bad, bad[:20]

          ov=json.loads(Path('kokugo-chronologia/meaning-overrides-ja.json').read_text(encoding='utf-8'))
          byid={str(r.get('id')):r for r in rows}
          for k,v in ov.items(): assert byid[k].get('meaning')==v,(k,byid[k].get('meaning'),v)

          page=Path('kokugo-chronologia/index.html')
          s=page.read_text(encoding='utf-8')
          s=s.replace("fetch('./data.jsonl',{cache:'force-cache'})", "fetch('./data.jsonl?v=ja-all-15000-20260812',{cache:'no-cache'})")
          s=s.replace("fetch('./data.jsonl?v=direct-ja-1',{cache:'no-cache'})", "fetch('./data.jsonl?v=ja-all-15000-20260812',{cache:'no-cache'})")
          s=s.replace('辞書拡張分の意味はJMdict由来の英語gloss、手作業確認済み語は日本語意味を優先します。','意味欄は日本語で表示します。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分も日本語化しています。')
          s=s.replace('意味欄は日本語で統一しています。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分も日本語化して表示します。','意味欄は日本語で表示します。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分も日本語化しています。')
          page.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=re.sub(r"const VERSION='[^']+';", "const VERSION='2.5.0-quality2-chronologia1000-kokugo-ja-all-15000';", t, count=1)
          assert 'quality2-chronologia1000' in t
          sw.write_text(t,encoding='utf-8')

          status=Path('kokugo-chronologia/JA_TRANSLATION_STATUS.json')
          obj=json.loads(status.read_text(encoding='utf-8'))
          obj['state']='complete'
          obj['remaining_english_only']=0
          obj['final_rows']=15000
          obj['data_sha256']=hashlib.sha256(data.read_bytes()).hexdigest()
          status.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          subprocess.run(['git','add',str(page),str(sw),str(status)],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','Finalize all 15000 Kokugo Japanese meanings'],check=True)
              for attempt in range(1,8):
                  if subprocess.run(['git','push','origin','HEAD:main']).returncode==0: break
                  subprocess.run(['git','fetch','origin','main'],check=True)
                  subprocess.run(['git','rebase','origin/main'],check=True)
                  time.sleep(2*attempt)
              else: raise SystemExit('final push failed')

          print('FINAL_VALIDATION_OK rows=15000 english_only=0 direct_overrides_preserved='+str(len(ov)))

      - name: Deploy final completed dataset to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo 'Final Pages deployment dispatched.'
