name: Add Koten Kanbun 1000
on:
  push:
    paths:
      - '.koten-kanbun-1000-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ranked Koten Kanbun bank and quiz UI
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            cat tools/koten-kanbun-payload/part*.txt | tr -d '\n\r' | base64 -d > /tmp/koten.tgz
            test "$(sha256sum /tmp/koten.tgz | awk '{print $1}')" = "35cf833b277d1f5aec10db1af6d8e8cfbb28b0a11472a2f79994905dc6efd01a"
            tar -xzf /tmp/koten.tgz -C kokugo-chronologia/
            python - <<'PY'
          from pathlib import Path
          import re
          p=Path('kokugo-chronologia/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="./jukugo-extension.js?v=20260812-1"></script>', '<script src="./jukugo-extension.js?v=20260815-2"></script>')
          tag='<script src="./koten-kanbun-extension.js?v=20260815-1"></script>'
          if tag not in s:
              marker='<!-- KOKUGO_DIRECT_MEANING_OVERRIDE_V1 -->'
              if marker in s:
                  s=s.replace(marker,tag+marker,1)
              elif '</body>' in s:
                  s=s.replace('</body>',tag+'</body>',1)
              else:
                  raise SystemExit('index insertion point not found')
          p.write_text(s,encoding='utf-8')
          pairs=[]
          for n in range(1,5):
              t=Path(f'kokugo-chronologia/koten-kanbun-bank-{n}.js').read_text(encoding='utf-8')
              pairs += [(int(a),b) for a,b in re.findall(r'^\[(\d+),"(古文|漢文)",',t,re.M)]
          assert len(pairs)==1000, len(pairs)
          assert [a for a,_ in pairs]==list(range(1,1001))
          assert sum(b=='古文' for _,b in pairs)==700
          assert sum(b=='漢文' for _,b in pairs)==300
          assert tag in p.read_text(encoding='utf-8')
          PY
            node --check kokugo-chronologia/koten-kanbun-extension.js
            for f in kokugo-chronologia/koten-kanbun-bank-*.js; do node --check "$f"; done
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add kokugo-chronologia/index.html kokugo-chronologia/koten-kanbun-*.js
            if git diff --cached --quiet; then
              echo 'Koten Kanbun 1000 already installed'
              exit 0
            fi
            git commit -m 'Add ranked 1000 classical Japanese and kanbun terms with quiz'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Could not push after conflict-safe retries' >&2
          exit 1
