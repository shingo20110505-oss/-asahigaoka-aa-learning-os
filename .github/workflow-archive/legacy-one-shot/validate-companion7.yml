name: Validate Companion 7
on:
  push:
    paths:
      - 'aa-avatar-v7.js'
      - 'companion7.html'
      - 'companion7-model-spec.json'
      - '.github/workflows/validate-companion7.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: JavaScript syntax
        run: node --check aa-avatar-v7.js
      - name: Model specification
        shell: python
        run: |
          import json
          from pathlib import Path
          s=json.loads(Path('companion7-model-spec.json').read_text())
          assert s['version'].startswith('7.0')
          assert len(s['parts']) == 28
          ids=[p['id'] for p in s['parts']]
          assert len(ids)==len(set(ids))
          required={'face','front_hair','back_hair','eye_white_l','eye_white_r','iris_l','iris_r','lid_l','lid_r','mouth','mouth_inside','body'}
          assert required.issubset(ids)
          h=Path('companion7.html').read_text()
          assert 'aa-avatar-v7.js?v=7.0.0-dev1' in h
          c=Path('aa-avatar-v7.js').read_text()
          for token in ['indexedDB','Spring1D','autoBlink','autoGaze','voiceLevel','AAAvatar7','requestAnimationFrame']:
              assert token in c
          print('Companion 7 validation PASS')
