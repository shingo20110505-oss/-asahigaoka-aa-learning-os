name: Convert Kokugo Meanings to Japanese
on:
  push:
    paths:
      - '.japanese-meanings-kokugo-trigger'
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Translate English glosses into Japanese
        shell: python
        run: |
          import json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          src = Path('kokugo-chronologia/data.jsonl')
          rows = [json.loads(line) for line in src.read_text(encoding='utf-8').splitlines() if line.strip()]

          def needs_ja(s):
              s = str(s or '').strip()
              if not s:
                  return False
              jp = len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]', s))
              latin = len(re.findall(r'[A-Za-z]', s))
              return latin >= 3 and jp == 0

          def google_translate(text):
              data = urllib.parse.urlencode({
                  'client':'gtx','sl':'en','tl':'ja','dt':'t','q':text
              }).encode('utf-8')
              req = urllib.request.Request(
                  'https://translate.googleapis.com/translate_a/single',
                  data=data,
                  headers={'User-Agent':'Mozilla/5.0'}
              )
              last = None
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          obj = json.loads(r.read().decode('utf-8'))
                      return ''.join(part[0] for part in obj[0] if part and part[0]).strip()
                  except Exception as e:
                      last = e
                      time.sleep(min(8, 0.8 * (2 ** attempt)))
              raise RuntimeError(f'translation failed: {last}')

          targets = [(i, r['meaning']) for i, r in enumerate(rows) if needs_ja(r.get('meaning'))]
          print(f'targets={len(targets)} total={len(rows)}')
          cache = {}
          translated = 0
          failed = []

          # Keep requests small and deterministic. A unique marker lets us split one translated batch safely.
          pos = 0
          while pos < len(targets):
              batch = []
              chars = 0
              while pos + len(batch) < len(targets) and len(batch) < 28:
                  idx, text = targets[pos + len(batch)]
                  item = f'[[[AA{len(batch):02d}]]] {text}'
                  if batch and chars + len(item) > 3600:
                      break
                  batch.append((idx, text, item))
                  chars += len(item) + 1
              block = '\n'.join(x[2] for x in batch)
              try:
                  out = google_translate(block)
                  marker = re.compile(r'\[\[\[AA(\d{2})\]\]\]\s*')
                  matches = list(marker.finditer(out))
                  parsed = {}
                  for m_i, m in enumerate(matches):
                      n = int(m.group(1))
                      start = m.end()
                      end = matches[m_i+1].start() if m_i+1 < len(matches) else len(out)
                      parsed[n] = out[start:end].strip()
                  if len(parsed) != len(batch):
                      raise RuntimeError(f'batch marker mismatch {len(parsed)}/{len(batch)}')
                  for n, (idx, eng, _) in enumerate(batch):
                      ja = parsed[n].replace(' / ', '・').strip()
                      if not ja or needs_ja(ja):
                          raise RuntimeError(f'bad translated text at {idx}: {ja[:80]}')
                      rows[idx]['meaning'] = ja
                      translated += 1
              except Exception as batch_err:
                  print('batch fallback:', batch_err)
                  for idx, eng, _ in batch:
                      try:
                          ja = cache.get(eng)
                          if ja is None:
                              ja = google_translate(eng).replace(' / ', '・').strip()
                              cache[eng] = ja
                          if not ja or needs_ja(ja):
                              raise RuntimeError('still English')
                          rows[idx]['meaning'] = ja
                          translated += 1
                      except Exception as e:
                          failed.append((idx, eng, str(e)))
              pos += len(batch)
              if pos % 280 == 0:
                  print(f'progress={pos}/{len(targets)} translated={translated} failed={len(failed)}')
              time.sleep(0.08)

          if failed:
              print('failures sample:', failed[:20])
              raise SystemExit(f'{len(failed)} meanings could not be translated')

          remaining = [(i, r.get('term'), r.get('meaning')) for i, r in enumerate(rows) if needs_ja(r.get('meaning'))]
          if remaining:
              print('remaining sample:', remaining[:20])
              raise SystemExit(f'{len(remaining)} English-only meanings remain')

          src.write_text('\n'.join(json.dumps(r, ensure_ascii=False, separators=(',',':')) for r in rows) + '\n', encoding='utf-8')

          page = Path('kokugo-chronologia/index.html')
          s = page.read_text(encoding='utf-8')
          s = s.replace('辞書拡張分の意味はJMdict由来の英語gloss、手作業確認済み語は日本語意味を優先します。','意味欄は日本語で統一しています。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分も日本語化して表示します。')
          page.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t = re.sub(r"const VERSION='[^']+';", "const VERSION='2.4.0-quality2-chronologia1000-kokugo-ja-meanings';", t, count=1)
          sw.write_text(t, encoding='utf-8')

          print(f'translated={translated}; all meanings now Japanese')
      - name: Validate Japanese meanings
        shell: python
        run: |
          import json,re
          from pathlib import Path
          rows=[json.loads(x) for x in Path('kokugo-chronologia/data.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows) >= 10000, len(rows)
          bad=[]
          for r in rows:
            m=str(r.get('meaning',''))
            latin=len(re.findall(r'[A-Za-z]',m)); jp=len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]',m))
            if latin>=3 and jp==0: bad.append((r.get('term'),m))
          assert not bad, bad[:10]
          assert "const VERSION='2.4.0-quality2-chronologia1000-kokugo-ja-meanings';" in Path('sw.js').read_text(encoding='utf-8')
          print(f'OK rows={len(rows)}')
      - name: Commit and push safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/data.jsonl kokugo-chronologia/index.html sw.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Convert Kokugo Chronologia meanings to Japanese'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
