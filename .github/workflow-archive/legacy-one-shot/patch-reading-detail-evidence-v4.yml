name: Patch Reading Detail Evidence V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-reading-detail-evidence-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add concrete prior fact to detail evidence candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="evidenceNeedles:[facts[4]]});"
          new="evidenceNeedles:[facts[3],facts[4]]});"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one detail evidence target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          grep -Fq 'evidenceNeedles:[facts[3],facts[4]]});' index.html
          test "$(wc -c < index.html)" -gt 10000
      - name: Commit patch safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Strengthen detail question evidence refs"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
