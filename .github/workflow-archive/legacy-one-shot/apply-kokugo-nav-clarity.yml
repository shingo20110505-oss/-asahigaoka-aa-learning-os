name: Apply Kokugo Navigation Clarity
on:
  push:
    paths:
      - '.ui-nav-clarity-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair Kokugo extension and navigation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python .github/scripts/repair_kokugo_nav.py
          node --check kokugo-chronologia/jukugo-extension.js
          node --check kokugo-chronologia/koten-kanbun-extension.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/index.html kokugo-chronologia/jukugo-extension.js
          if git diff --cached --quiet; then
            echo 'Kokugo navigation already repaired'
            exit 0
          fi
          git commit -m 'Repair Kokugo quiz UI and add clear navigation'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 2
          done
          echo 'Could not push Kokugo navigation repair' >&2
          exit 1
