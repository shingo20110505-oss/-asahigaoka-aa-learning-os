name: Convert Kokugo Meanings to Japanese Fast
on:
  push:
    paths:
      - '.japanese-meanings-kokugo-fast-trigger'
permissions:
  contents: write
jobs:
  translate-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Translate English glosses concurrently
        shell: python
        run: |
          import json,re,time,urllib.parse,urllib.request,concurrent.futures,threading
          from pathlib import Path
          src=Path('kokugo-chronologia/data.jsonl')
          rows=[json.loads(x) for x in src.read_text(encoding='utf-8').splitlines() if x.strip()]
          def needs_ja(s):
              s=str(s or '').strip(); jp=len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]',s)); latin=len(re.findall(r'[A-Za-z]',s)); return bool(s) and latin>=3 and jp==0
          lock=threading.Lock(); done=0
          def tr(text):
              data=urllib.parse.urlencode({'client':'gtx','sl':'en','tl':'ja','dt':'t','q':text}).encode('utf-8')
              for attempt in range(5):
                  try:
                      req=urllib.request.Request('https://translate.googleapis.com/translate_a/single',data=data,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=12) as r: obj=json.loads(r.read().decode('utf-8'))
                      ja=''.join(p[0] for p in obj[0] if p and p[0]).replace(' / ','・').strip()
                      if ja and not needs_ja(ja): return ja
                  except Exception:
                      pass
                  time.sleep(0.4*(attempt+1))
              raise RuntimeError('translation failed')
          targets=[(i,r.get('meaning','')) for i,r in enumerate(rows) if needs_ja(r.get('meaning'))]
          print('targets',len(targets),'total',len(rows),flush=True)
          cache={}; cache_lock=threading.Lock(); failures=[]
          def work(pair):
              global done
              i,text=pair
              with cache_lock: ja=cache.get(text)
              if ja is None:
                  ja=tr(text)
                  with cache_lock: cache[text]=ja
              with lock:
                  rows[i]['meaning']=ja
                  done+=1
                  if done%250==0: print('progress',done,'/',len(targets),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
              futs={ex.submit(work,p):p for p in targets}
              for f in concurrent.futures.as_completed(futs):
                  try: f.result()
                  except Exception as e: failures.append((futs[f][0],futs[f][1],str(e)))
          if failures:
              print('failures',len(failures),failures[:10],flush=True)
              # one final slower retry for failures
              still=[]
              for i,text,_ in failures:
                  try: rows[i]['meaning']=tr(text)
                  except Exception as e: still.append((i,text,str(e)))
              if still: raise SystemExit(f'{len(still)} translations failed: {still[:10]}')
          bad=[(r.get('term'),r.get('meaning')) for r in rows if needs_ja(r.get('meaning'))]
          if bad: raise SystemExit(f'English-only meanings remain: {len(bad)} {bad[:10]}')
          src.write_text('\n'.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in rows)+'\n',encoding='utf-8')
          page=Path('kokugo-chronologia/index.html'); s=page.read_text(encoding='utf-8')
          s=s.replace('辞書拡張分の意味はJMdict由来の英語gloss、手作業確認済み語は日本語意味を優先します。','意味欄は日本語で統一しています。手作業確認済み語は確認済みの日本語意味を優先し、辞書拡張分も日本語化して表示します。')
          page.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); t=sw.read_text(encoding='utf-8'); t=re.sub(r"const VERSION='[^']+';","const VERSION='2.4.0-quality2-chronologia1000-kokugo-ja-meanings';",t,count=1); sw.write_text(t,encoding='utf-8')
          print('translated OK',len(targets),flush=True)
      - name: Validate Japanese meanings
        shell: python
        run: |
          import json,re
          from pathlib import Path
          rows=[json.loads(x) for x in Path('kokugo-chronologia/data.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)>=10000
          bad=[]
          for r in rows:
            m=str(r.get('meaning','')); latin=len(re.findall(r'[A-Za-z]',m)); jp=len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]',m))
            if latin>=3 and jp==0: bad.append((r.get('term'),m))
          assert not bad,bad[:10]
          assert "const VERSION='2.4.0-quality2-chronologia1000-kokugo-ja-meanings';" in Path('sw.js').read_text(encoding='utf-8')
          print('OK rows',len(rows))
      - name: Commit and push safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/data.jsonl kokugo-chronologia/index.html sw.js
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'Convert Kokugo meanings to Japanese fast'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
