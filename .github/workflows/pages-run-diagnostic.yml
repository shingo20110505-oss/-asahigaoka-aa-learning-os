name: Pages Run Diagnostic

on:
  push:
    paths:
      - '.pages-run-diagnostic-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch deploy workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/deploy-pages.yml/runs?per_page=10" > /tmp/runs.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/runs.json'))
          with open('PAGES_RUN_STATUS.txt','w') as f:
              for r in x.get('workflow_runs',[]):
                  f.write(f"id={r.get('id')} status={r.get('status')} conclusion={r.get('conclusion')} event={r.get('event')} head_sha={r.get('head_sha')} created={r.get('created_at')} url={r.get('html_url')}\n")
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAGES_RUN_STATUS.txt
          git commit -m "Record GitHub Pages deployment runs" || exit 0
          git push
