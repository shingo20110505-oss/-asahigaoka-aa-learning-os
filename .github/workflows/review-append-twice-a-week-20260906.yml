name: One-time append twice-a-week review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-append-twice-a-week-20260906.yml'

permissions:
  contents: write

jobs:
  append-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source SHA and append exactly one review item
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='ae8b8473ecd80f47c8acb7e1d04294948a3cf1ef'
          actual_sha="$(git hash-object review-bank-v1.js)"
          echo "expected=$expected_sha"
          echo "actual=$actual_sha"
          test "$actual_sha" = "$expected_sha"

          python - <<'PY'
          from pathlib import Path

          path = Path('review-bank-v1.js')
          text = path.read_text(encoding='utf-8')
          new_id = 'en-twice-a-week-20260906'
          if new_id in text:
              raise SystemExit(f'duplicate id: {new_id}')

          marker = "\n];\nfunction normalize"
          if text.count(marker) != 1:
              raise SystemExit('review-bank array closing marker not unique')

          item = """
  {id:'en-twice-a-week-20260906',subject:'英語',unit:'頻度・回数表現',title:'twice a week＝週2回',question:'「週2回」を自然な英語で言うと？ また、なぜその形になる？',answer:'twice a week。「twice＝2回」「a week＝1週間につき」なので、twice a week＝1週間につき2回＝週2回。',why:'回数は once＝1回、twice＝2回、three times＝3回 のように表します。そこに a week（1週間につき）をつけるので、once a week＝週1回、twice a week＝週2回、three times a week＝週3回となります。two times a week でも意味は通じますが、通常は twice a week のほうが自然です。',examples:['I study English twice a week.（私は週2回英語を勉強します）','once a week＝週1回','twice a week＝週2回','three times a week＝週3回'],memory:'once＝1回 / twice＝2回 / three times＝3回。a week＝1週間につき → twice a week＝週2回',tags:['英語','twice','twice a week','once','回数','頻度表現','週2回'],createdAt:'2026-09-06'},
"""
          text = text.replace(marker, item + marker, 1)

          old_version = "window.AA_REVIEW_BANK_VERSION='1.0.62';"
          new_version = "window.AA_REVIEW_BANK_VERSION='1.0.63';"
          if text.count(old_version) != 1:
              raise SystemExit('expected AA_REVIEW_BANK_VERSION 1.0.62 exactly once')
          text = text.replace(old_version, new_version, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check review-bank-v1.js
          grep -Fq "id:'en-twice-a-week-20260906'" review-bank-v1.js
          grep -Fq "window.AA_REVIEW_BANK_VERSION='1.0.63';" review-bank-v1.js

      - name: Commit review-bank change and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-bank-v1.js
          git rm .github/workflows/review-append-twice-a-week-20260906.yml
          git commit -m 'Add twice a week to review bank'
          git push origin HEAD:main
