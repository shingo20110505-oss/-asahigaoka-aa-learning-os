name: Repair Kokugo Nav V2
on:
  push:
    paths:
      - '.kokugo-nav-v2-trigger'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python .github/scripts/repair_kokugo_nav.py
          node --check kokugo-chronologia/jukugo-extension.js
          node --check kokugo-chronologia/koten-kanbun-extension.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/index.html kokugo-chronologia/jukugo-extension.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Kokugo navigation and quiz entry points'
          git push origin HEAD:main
