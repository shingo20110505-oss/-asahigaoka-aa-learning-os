name: Add two proverbs to Review v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-add-kotowaza-20260824b.yml'

permissions:
  contents: write

jobs:
  update-review-bank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main and verify source blob
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD:review-bank-v1.js)" = "a255ecff83e7e6164e244b10546b9232744c96e6"

      - name: Append 2 review cards and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('review-bank-v1.js')
          s=p.read_text(encoding='utf-8')
          ids=[
            'ja-kotowaza-issun-no-mushi-gobu-no-tamashii-20260824',
            'ja-kotowaza-uogokoro-areba-mizugokoro-20260824',
          ]
          for i in ids:
              if f"id:'{i}'" in s:
                  raise SystemExit(f'duplicate id: {i}')
          if "title:'一寸の虫にも五分の魂'" in s or "title:'魚心あれば水心'" in s:
              raise SystemExit('target proverb already exists')
          expected="window.AA_REVIEW_BANK_VERSION='1.0.49';"
          replacement="window.AA_REVIEW_BANK_VERSION='1.0.50';"
          if expected not in s:
              raise SystemExit('expected review version 1.0.49 not found')
          items=[
          "  {id:'ja-kotowaza-issun-no-mushi-gobu-no-tamashii-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'一寸の虫にも五分の魂',question:'「一寸の虫にも五分の魂」の意味は？',answer:'どんなに小さく弱い者にも、それなりの意地や誇りがあるので、侮ってはいけないということ。',why:'一寸ほどの小さな虫にも五分ほどの魂がある、というたとえから、弱そうに見える相手にも意地や誇りがあることを表します。',examples:['相手が年下だからと軽く見るのはよくない。「一寸の虫にも五分の魂」だ。'],memory:'小さな虫にも魂 → 弱そうな相手でも侮らない',tags:['国語','ことわざ','一寸の虫にも五分の魂','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kotowaza-uogokoro-areba-mizugokoro-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'魚心あれば水心',question:'「魚心あれば水心」の意味は？',answer:'相手が好意を示せば、自分もそれに応じて好意を返すということ。',why:'魚に水を求める心があれば、水も魚を受け入れる心をもつ、というたとえから、相手の出方に応じてこちらも好意を示すことを表します。',examples:['相手が親切にしてくれたので、こちらも助けようと思った。まさに「魚心あれば水心」だ。'],memory:'相手が好意 → こちらも好意で応える',tags:['国語','ことわざ','魚心あれば水心','意味'],createdAt:'2026-08-24'},",
          ]
          marker='\n];\nfunction normalize'
          if marker not in s:
              raise SystemExit('items end marker not found')
          s=s.replace(marker,'\n'+'\n'.join(items)+marker,1)
          s=s.replace(expected,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check review-bank-v1.js
          node scripts/validate-review-bank.mjs
          grep -q "title:'一寸の虫にも五分の魂'" review-bank-v1.js
          grep -q "title:'魚心あれば水心'" review-bank-v1.js
          grep -q "AA_REVIEW_BANK_VERSION='1.0.50'" review-bank-v1.js

      - name: Commit review update and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/review-add-kotowaza-20260824b.yml
          git add review-bank-v1.js .github/workflows/review-add-kotowaza-20260824b.yml
          git commit -m "Add two proverbs to Review v2"
          git push origin main
