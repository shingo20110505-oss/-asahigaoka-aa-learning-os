name: Fill Verified Question Pool

on:
  schedule:
    - cron: '15 6 * * *'   # 15:15 JST Math
    - cron: '45 6 * * *'   # 15:45 JST Science
    - cron: '15 7 * * *'   # 16:15 JST Social
    - cron: '45 7 * * *'   # 16:45 JST English
    - cron: '15 8 * * *'   # 17:15 JST Japanese
  workflow_dispatch:
    inputs:
      subject:
        description: Subject to refill
        required: true
        type: choice
        options: [math, science, social, english, japanese]
      max_per_run:
        description: Maximum new verified items
        required: false
        default: '3'

permissions:
  contents: write
  actions: write

concurrency:
  group: verified-question-pool-${{ github.event.schedule || inputs.subject || 'manual' }}
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RISE_AI_WORKER_URL: https://asahigaoka-aa-ai-reading.shingo-20110505.workers.dev
      PUBLIC_POOL_URL: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/verified-question-pool-v1.json
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve subject and batch size
        id: resolve
        shell: bash
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_SUBJECT: ${{ inputs.subject }}
          MANUAL_MAX: ${{ inputs.max_per_run }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SUBJECT="$MANUAL_SUBJECT"
            MAX_PER_RUN="${MANUAL_MAX:-3}"
          else
            case "$SCHEDULE_EXPR" in
              '15 6 * * *') SUBJECT=math ;;
              '45 6 * * *') SUBJECT=science ;;
              '15 7 * * *') SUBJECT=social ;;
              '45 7 * * *') SUBJECT=english ;;
              '15 8 * * *') SUBJECT=japanese ;;
              *) echo "Unknown schedule: $SCHEDULE_EXPR" >&2; exit 2 ;;
            esac
            MAX_PER_RUN=3
          fi
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "max_per_run=$MAX_PER_RUN" >> "$GITHUB_OUTPUT"
          echo "AUTO_REFILL_SUBJECT=$SUBJECT"
          echo "AUTO_REFILL_MAX=$MAX_PER_RUN"

      - name: Validate current pool
        run: node scripts/validate-verified-question-pool.mjs

      - name: Generate only independently verified questions
        env:
          RISE_SUBJECT: ${{ steps.resolve.outputs.subject }}
          RISE_MAX_PER_RUN: ${{ steps.resolve.outputs.max_per_run }}
        run: node scripts/fill-verified-question-pool.mjs

      - name: Validate updated pool
        run: node scripts/validate-verified-question-pool.mjs

      - name: Commit verified pool only when changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- verified-question-pool-v1.json; then
            echo 'Pool unchanged; nothing to publish.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXPECTED_SHA256=$(sha256sum verified-question-pool-v1.json | awk '{print $1}')
          git config user.name 'rise-verified-pool-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add verified-question-pool-v1.json
          git commit -m "chore(pool): refill ${{ steps.resolve.outputs.subject }} verified questions"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha256=$EXPECTED_SHA256" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deployment for updated pool
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref main
          echo 'PAGES_DEPLOY_DISPATCHED=PASS'

      - name: Verify exact pool published on GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.commit.outputs.sha256 }}
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 36); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${PUBLIC_POOL_URL}?verify=${GITHUB_RUN_ID}-${n}" -o /tmp/public-pool.json; then
              ACTUAL_SHA256=$(sha256sum /tmp/public-pool.json | awk '{print $1}')
              if [ "$ACTUAL_SHA256" = "$EXPECTED_SHA256" ]; then
                node scripts/validate-verified-question-pool.mjs /tmp/public-pool.json
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" = 1

      - name: Refill summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Rise verified question pool refill'
            echo
            echo "- Subject: ${{ steps.resolve.outputs.subject }}"
            echo "- Maximum new items this run: ${{ steps.resolve.outputs.max_per_run }}"
            echo "- Worker: shingo-20110505 production Worker"
            echo "- Policy: Gemini authoring + deterministic checks + Groq blind verification only"
            echo "- Paid fallback: disabled"
            echo "- Pages publish: explicit workflow_dispatch after pool commit"
          } >> "$GITHUB_STEP_SUMMARY"
