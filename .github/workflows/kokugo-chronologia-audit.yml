name: Audit Kokugo Chronologia 10000+

on:
  push:
    paths:
      - '.kokugo-chronologia-audit-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify independent page exists
        run: |
          test -f kokugo-chronologia/index.html
          grep -q '国語 語彙クロノロジア' kokugo-chronologia/index.html

      - name: Count eligible JMdict vocabulary
        run: |
          python - <<'PY'
          import json, re, urllib.request, sys, traceback

          urls = [
              'https://raw.githubusercontent.com/jpndium/jmdict/main/data/001.jsonl',
              'https://raw.githubusercontent.com/jpndium/jmdict/main/data/002.jsonl',
              'https://raw.githubusercontent.com/jpndium/jmdict/main/data/003.jsonl',
          ]
          target = 10000
          seen = set()
          strict_yoji = idiom = four_word = 0

          def text(x):
              if isinstance(x, str): return x
              if isinstance(x, dict): return str(x.get('text') or x.get('value') or x.get('keb') or x.get('reb') or '')
              return ''
          def arr(o, *keys):
              if not isinstance(o, dict): return []
              for k in keys:
                  if isinstance(o.get(k), list): return o[k]
              return []
          def is_han(c):
              n=ord(c)
              return (0x3400<=n<=0x4DBF or 0x4E00<=n<=0x9FFF or 0xF900<=n<=0xFAFF or 0x20000<=n<=0x2FA1F)
          def is_four_han(s): return len(s)==4 and all(is_han(c) for c in s)

          try:
              for url in urls:
                  req=urllib.request.Request(url,headers={'User-Agent':'AA-Learning-OS-Kokugo-Audit/1.0'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      for raw in r:
                          line=raw.decode('utf-8').strip()
                          if not line: continue
                          e=json.loads(line)
                          ks=[text(x) for x in arr(e,'kanji','kanjiElements')]; ks=[x for x in ks if x]
                          rs=[text(x) for x in arr(e,'kana','kanaElements','reading')]; rs=[x for x in rs if x]
                          term=ks[0] if ks else (rs[0] if rs else text(e.get('word')) or text(e.get('term')))
                          if not term: continue
                          reading=rs[0] if rs else ''
                          labels=[]
                          for sense in arr(e,'sense','senses'):
                              labels.extend(text(x) for x in arr(sense,'misc','miscellaneous'))
                          m=' | '.join(x for x in labels if x).lower()
                          strict=bool('four-character idiomatic' in m or 'yojijukugo' in m or re.search(r'(^|[^a-z])yoji([^a-z]|$)',m))
                          idi=bool('idiomatic expression' in m or 'idiom' in m)
                          four=is_four_han(term)
                          if not (strict or idi or four): continue
                          key=(term,reading)
                          if key in seen: continue
                          seen.add(key); strict_yoji+=int(strict); idiom+=int(idi); four_word+=int(four)
              total=len(seen)
              summary=f'eligible_total={total}; strict_yojijukugo={strict_yoji}; idiomatic_expression={idiom}; four_han_headword={four_word}; required={target}'
              print(summary)
              if total < target:
                  print(f'::error title=Kokugo Chronologia count::{summary}')
                  raise SystemExit(1)
              print(f'::notice title=Kokugo Chronologia count::{summary}')
          except Exception as e:
              print(f'::error title=Kokugo Chronologia audit exception::{type(e).__name__}: {e}')
              traceback.print_exc()
              raise
          PY

      - name: Verify public page
        run: |
          url='https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/kokugo-chronologia/'
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 20 "$url" | grep -q '国語 語彙クロノロジア'; then
              echo '::notice title=Kokugo Chronologia public page::public_page=success'
              exit 0
            fi
            sleep 10
          done
          echo '::error title=Kokugo Chronologia public page::public_page=failed'
          exit 1
