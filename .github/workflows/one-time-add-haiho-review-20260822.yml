name: One-time add haiho review card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-add-haiho-review-20260822.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify current review source
        run: |
          set -euo pipefail
          test "$(git hash-object review-bank-v1.js)" = "199a8b56b88c1b4431045dfbcbdcbf49fcb63a75"

      - name: Add 肺胞 review card and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('review-bank-v1.js')
          s = p.read_text(encoding='utf-8')
          item_id = 'ja-kanji-haiho-20260822'
          assert item_id not in s, 'review item already exists'
          marker = "];\nfunction normalize"
          assert s.count(marker) == 1, 'unexpected review bank structure'
          oldv = "window.AA_REVIEW_BANK_VERSION='1.0.39';"
          newv = "window.AA_REVIEW_BANK_VERSION='1.0.40';"
          assert s.count(oldv) == 1, 'unexpected review version'
          item = "  {id:'ja-kanji-haiho-20260822',subject:'国語',unit:'漢字・理科用語',title:'肺胞（はいほう）の漢字',question:'「はいほう」を漢字で書きなさい。',answer:'肺胞',why:'「肺胞」は、肺の中にある小さな袋状のつくりで、毛細血管との間で酸素と二酸化炭素の交換を行います。漢字は「肺」＋「胞」です。',examples:['はいほう → 肺胞','肺胞では、酸素と二酸化炭素の交換が行われる。'],memory:'はいほう＝肺胞。「肺」＋「胞」をセットで覚える',tags:['漢字','肺胞','はいほう','理科用語','呼吸','肺'],createdAt:'2026-08-22'},\n"
          s = s.replace(marker, item + marker, 1)
          s = s.replace(oldv, newv, 1)
          p.write_text(s, encoding='utf-8')
          PY
          test "$(git hash-object review-bank-v1.js)" = "e6d60e4dc64b6a202f8e666ffe5801acb84a3574"

      - name: Commit review update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-bank-v1.js
          git commit -m "Add 肺胞 kanji review card"
          git push origin HEAD:main
