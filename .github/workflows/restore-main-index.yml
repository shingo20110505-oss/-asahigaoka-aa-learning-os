name: Restore Main Index
on:
  push:
    paths:
      - '.restore-main-index-trigger'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good app shell
        run: |
          git fetch --all --tags --prune
          git cat-file -p b3e3c3ff58322a634f3b1bcd7c3ab6f91c1528bd > index.html
          test -s index.html
          grep -Fq '<title>旭丘AA Learning OS｜PWA完全版</title>' index.html
          grep -Fq 'kokugoChronologiaQuickLink' index.html
          grep -Fq './kokugo-chronologia/' index.html
      - name: Commit and push safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then
            echo 'No restore needed'
            exit 0
          fi
          git commit -m 'Restore main app after index regression'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
