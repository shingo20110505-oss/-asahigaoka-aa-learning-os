name: Apply Kokugo Mobile Design Now
on:
  push:
    paths:
      - '.apply-kokugo-mobile-design-now-trigger-2'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply design patch
        run: python3 .github/scripts/apply_kokugo_mobile_design.py
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply Kokugo mobile term meaning rank layout'
          git push origin HEAD:main
