name: RISE tests and Pages

on:
  push:
    branches: [main, codex/rise-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run domain, preservation and bridge isolation tests
        run: npm test
      - name: Check fixed-destination gateway boundaries
        run: python3 -m unittest discover -s gateway -p 'test_*.py'
      - name: Build and validate the public asset allowlist
        run: npm run build
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix test-results/ui-runtime --no-audit --no-fund playwright@1.62.1
          node test-results/ui-runtime/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify workspace interactions, responsive UI and offline history
        env:
          RISE_PLAYWRIGHT_MODULE: ${{ github.workspace }}/test-results/ui-runtime/node_modules/playwright/index.mjs
        run: |
          node scripts/test-workspace-ui.mjs
          node scripts/test-geography-ui.mjs
          node scripts/test-rag-lab-ui.mjs
      - name: Save workspace screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-checks
          path: |
            test-results/workspace/*.png
            test-results/workspace/result.json
            test-results/rag/phone.png
            test-results/rag/search-final.json
          if-no-files-found: ignore
      - name: Upload only the built static app
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
