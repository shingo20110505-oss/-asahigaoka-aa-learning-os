name: RISE tests and Pages

on:
  push:
    branches: [main, codex/rise-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rise-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run domain, preservation and bridge isolation tests
        run: npm test
      - name: Check fixed-destination gateway boundaries
        run: python3 -m unittest discover -s gateway -p 'test_*.py'
      - name: Build and validate the public asset allowlist
        run: npm run build
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix test-results/ui-runtime --no-audit --no-fund playwright@1.62.1
          node test-results/ui-runtime/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify workspace interactions, responsive UI and offline history
        env:
          RISE_PLAYWRIGHT_MODULE: ${{ github.workspace }}/test-results/ui-runtime/node_modules/playwright/index.mjs
        run: |
          node scripts/test-workspace-ui.mjs
          node scripts/test-geography-ui.mjs
          node scripts/test-science-memory-ui.mjs
          node scripts/test-material-search-ui.mjs
          node scripts/test-rag-lab-ui.mjs
      - name: Save workspace screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-checks
          path: |
            test-results/workspace/*.png
            test-results/workspace/result.json
            test-results/science-memory/*.png
            test-results/science-memory/result.json
            test-results/material-search/*.png
            test-results/material-search/result.json
            test-results/rag/phone.png
            test-results/rag/search-final.json
          if-no-files-found: ignore
      - name: Upload only the built static app
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-review-public:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify published review data SHA-256
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request, re
          base = 'https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/'
          source = pathlib.Path('review-bank-v1.js').read_bytes()
          expected = hashlib.sha256(source).hexdigest()
          published = None
          for n in range(24):
              try:
                  req = urllib.request.Request(base + 'review-bank-v1.js?verify=' + str(n) + '-' + expected[:16], headers={'Cache-Control': 'no-cache', 'User-Agent': 'rise-public-review-verify'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      published = response.read()
                  if published == source:
                      break
                  print('Public review bank not yet current; attempt', n + 1, flush=True)
              except Exception as exc:
                  print('Fetch failed:', repr(exc), flush=True)
              time.sleep(10)
          assert published == source, 'Published review bank does not match source'
          assert b'en-in-the-sky-over-place-20261123' in published, 'Review item is missing'
          print('public_review_exact_match=success')
          print('source_sha256=' + expected)
          print('public_sha256=' + hashlib.sha256(published).hexdigest())
          for file in ('DEPLOY_STATUS.txt','PUBLIC_VERIFY_STATUS.txt'):
              with urllib.request.urlopen(base + file + '?verify=' + expected[:16], timeout=20) as res:
                  remote = res.read()
              local = pathlib.Path(file).read_bytes()
              assert remote == local, file + ' differs from public site'
              print(file + '_public_exact_match=success')
          deployment = pathlib.Path('DEPLOY_STATUS.txt').read_text()
          verification = pathlib.Path('PUBLIC_VERIFY_STATUS.txt').read_text()
          assert 'public_verify=success' in deployment
          assert 'public_verify_stage=complete' in deployment
          assert 'result=success' in verification
          print('review_status_files_success=success')
          PY
