name: Verify Exam Math Formula Lab on Pages

on:
  workflow_run:
    workflows: ["Deploy AA Learning OS to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Validate formula lab contracts
        run: |
          set -euo pipefail
          node tests/exam-math-formula-bank.mjs
          node --check high-school-math/formulas.js
          node --check high-school-math/visuals.js
          node --check high-school-math/practice.js
          node --check high-school-math/sw.js

      - name: Verify exact public files
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BASE="https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/high-school-math"
          verify_file(){
            local path="$1"
            local expected actual ok=0
            expected=$(sha256sum "high-school-math/${path}" | awk '{print $1}')
            for n in $(seq 1 30); do
              if curl -fsSL --connect-timeout 10 --max-time 20 "${BASE}/${path}?verify=${SOURCE_SHA}-${n}" -o "/tmp/${path//\//_}"; then
                actual=$(sha256sum "/tmp/${path//\//_}" | awk '{print $1}')
                if [ "$actual" = "$expected" ]; then ok=1; break; fi
              fi
              sleep 4
            done
            test "$ok" = 1
          }
          verify_file index.html
          verify_file formulas.js
          verify_file visuals.js
          verify_file practice.js
          verify_file sw.js
          grep -q '入試数学 便利公式' /tmp/index.html
          grep -q '実戦ミニ問題' /tmp/index.html
          grep -q 'serviceWorker.register' /tmp/index.html
          grep -q 'RISE_EXAM_MATH_VISUALS' /tmp/visuals.js
          grep -q 'RISE_EXAM_MATH_PRACTICE' /tmp/practice.js
          echo "Exam math formula lab public verification succeeded for ${SOURCE_SHA}."