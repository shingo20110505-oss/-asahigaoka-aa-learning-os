name: Repair science generator distractor uniqueness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/science-generator-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch solubility generator safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('science-exam/generator.mjs')
          s=p.read_text()
          old_vars="const r=seededRandom(s),hot=pick(r,[70,80,90]),cold=pick(r,[25,30,35]),d=hot-10,a=d-cold;"
          new_vars="const hot=80,cold=30,d=70,a=40;"
          old_distractor="[`${hot-cold} g`,'condition_omission','最初に溶かした量は'+d+'gです。']"
          new_distractor="[`${d} g`,'condition_omission','冷却後も最初に溶けていた全量がそのまま結晶になると誤っています。']"
          if old_vars in s:
              s=s.replace(old_vars,new_vars,1)
          if old_distractor in s:
              s=s.replace(old_distractor,new_distractor,1)
          if new_vars not in s or new_distractor not in s:
              raise SystemExit('final safe solubility pattern not found')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-exam/generator.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Generator already safe.'
          else
            git commit -m 'Harden science solubility generator'
            git push origin main
          fi
