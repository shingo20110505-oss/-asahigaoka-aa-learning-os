name: Repair science generator distractor uniqueness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/science-generator-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch solubility distractor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('science-exam/generator.mjs')
          s=p.read_text()
          old="[`${hot-cold} g`,'condition_omission','最初に溶かした量は'+d+'gです。']"
          new="[`${d} g`,'condition_omission','冷却後も最初に溶けていた全量がそのまま結晶になると誤っています。']"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-exam/generator.mjs
          git diff --cached --check
          git commit -m 'Fix science solubility distractor uniqueness'
          git push origin main
