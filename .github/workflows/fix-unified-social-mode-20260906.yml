name: Fix unified social quiz mode 20260906

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-unified-social-mode-20260906.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix-social-mode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce selected Social Studies question mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          unified = Path('quiz/unified-native-v1.js')
          infinite = Path('quiz/infinite-course-v1.js')

          expected = {
              unified: '6a0819f227fdd4db462fcb556af2034f0a9a2faf',
              infinite: 'd2669da44980e5ab614cc3fea653a50ef4b54b6f',
          }
          for path, blob in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              if actual != blob:
                  raise SystemExit(f'{path} changed unexpectedly: {actual} != {blob}')

          text = unified.read_text(encoding='utf-8')
          text = text.replace("const VERSION='1.2.0';", "const VERSION='1.2.1';", 1)
          old = """function socialPool(level,period,weakOnly=false){return data.social.filter(x=>{const r=x.raw;if(period!=='all'&&r.period!==period)return false;if(level==='SA'&&!['S','A'].includes(r.level))return false;if(level==='S'&&r.level!=='S')return false;if(weakOnly&&progressForSocial(x).status!=='weak')return false;return true})}\nfunction normalizeYearInput(v){return text(v).normalize('NFKC').toLowerCase().replace(/[\\s,，]/g,'').replace(/年$/g,'').replace(/^bc/g,'紀元前')}\nfunction acceptedYear(item,input){const a=normalizeYearInput(input);if(item.raw.sort<0){const n=String(Math.abs(item.raw.sort));return['紀元前'+n,'-'+n,n+'bc'].includes(a)}return a===String(item.raw.sort)}\nfunction socialQuestion(item,mode,pool){\n let actual=mode;if(actual==='mixed')actual=/^(紀元前)?\\d+年$/.test(item.raw.date)&&Math.random()<.52?'eventToYear':'yearToEvent';if(actual==='eventToYear'&&!/^(紀元前)?\\d+年$/.test(item.raw.date))actual='yearToEvent';\n if(actual==='eventToYear')return{subject:'social',actual,prompt:item.raw.event,hint:'年号を入力してください（例：645 / 645年 / 紀元前221）',answer:item.raw.date,choices:null,input:true,inputMode:'year',item,explanation:item.raw.detail||`${item.raw.event}｜${item.raw.date}`,check:v=>acceptedYear(item,v),commit(ok){socialApi.record(item.raw.id,ok);refreshSocial()}};\n const same=pool.filter(x=>x!==item&&x.raw.period===item.raw.period&&x.raw.sort!==item.raw.sort),vals=pickValues(same,item,'event');if(vals.length<3)return null;return{subject:'social',actual,prompt:item.raw.date,hint:'この年の出来事を選んでください',answer:item.raw.event,choices:shuffle([item.raw.event,...vals]),input:false,item,explanation:item.raw.detail||`${item.raw.date}｜${item.raw.event}`,check:v=>text(v)===item.raw.event,commit(ok){socialApi.record(item.raw.id,ok);refreshSocial()}};\n}\nfunction buildSocialQuestions(count,mode,level,period,weakOnly=false){let pool=socialPool(level,period,weakOnly);if(pool.length<4&&!weakOnly)pool=socialPool('all','all',false);return shuffle(pool).map(x=>socialQuestion(x,mode,pool)).filter(Boolean).slice(0,count)}"""
          new = """function socialPool(level,period,weakOnly=false){return data.social.filter(x=>{const r=x.raw;if(period!=='all'&&r.period!==period)return false;if(level==='SA'&&!['S','A'].includes(r.level))return false;if(level==='S'&&r.level!=='S')return false;if(weakOnly&&progressForSocial(x).status!=='weak')return false;return true})}\nfunction socialHasExactYear(item){return /^(紀元前)?\\d+年$/.test(item.raw.date)}\nfunction normalizeYearInput(v){return text(v).normalize('NFKC').toLowerCase().replace(/[\\s,，]/g,'').replace(/年$/g,'').replace(/^bc/g,'紀元前')}\nfunction acceptedYear(item,input){const a=normalizeYearInput(input);if(item.raw.sort<0){const n=String(Math.abs(item.raw.sort));return['紀元前'+n,'-'+n,n+'bc'].includes(a)}return a===String(item.raw.sort)}\nfunction socialQuestion(item,mode,pool){\n let actual=mode;if(actual==='mixed')actual=socialHasExactYear(item)&&Math.random()<.52?'eventToYear':'yearToEvent';if(actual==='eventToYear'&&!socialHasExactYear(item))return null;\n if(actual==='eventToYear')return{subject:'social',actual,prompt:item.raw.event,hint:'年号を入力してください（例：645 / 645年 / 紀元前221）',answer:item.raw.date,choices:null,input:true,inputMode:'year',item,explanation:item.raw.detail||`${item.raw.event}｜${item.raw.date}`,check:v=>acceptedYear(item,v),commit(ok){socialApi.record(item.raw.id,ok);refreshSocial()}};\n const same=pool.filter(x=>x!==item&&x.raw.period===item.raw.period&&x.raw.sort!==item.raw.sort),vals=pickValues(same,item,'event');if(vals.length<3)return null;return{subject:'social',actual,prompt:item.raw.date,hint:'この年の出来事を選んでください',answer:item.raw.event,choices:shuffle([item.raw.event,...vals]),input:false,item,explanation:item.raw.detail||`${item.raw.date}｜${item.raw.event}`,check:v=>text(v)===item.raw.event,commit(ok){socialApi.record(item.raw.id,ok);refreshSocial()}};\n}\nfunction buildSocialQuestions(count,mode,level,period,weakOnly=false){let pool=socialPool(level,period,weakOnly);if(mode==='eventToYear')pool=pool.filter(socialHasExactYear);if(pool.length<4&&!weakOnly){pool=socialPool('all','all',false);if(mode==='eventToYear')pool=pool.filter(socialHasExactYear)}return shuffle(pool).map(x=>socialQuestion(x,mode,pool)).filter(Boolean).slice(0,count)}"""
          if old not in text:
              raise SystemExit('unified social block not found exactly')
          text = text.replace(old, new, 1)
          unified.write_text(text, encoding='utf-8')

          text = infinite.read_text(encoding='utf-8')
          old = """function socialWeak(x){const p=x.progress||{};return (p.wrong||0)>0&&((p.wrong||0)>=(p.correct||0)||(+p.nextReview||0)<=Date.now())}\nfunction normalizeYear(v){return text(v).normalize('NFKC').toLowerCase().replace(/[\\s,，]/g,'').replace(/年$/,'').replace(/^bc/,'紀元前')}\nfunction socialQuestion(){const api=getSocialApi();if(!api?.list)return null;let pool=api.list().filter(x=>x?.id&&x.event&&x.date),level=ui.filterA.value,period=ui.filterB.value,mode=ui.mode.value;if(activeSubject()==='mixed'){level=ui.filterB.value==='exam'?'SA':'all';period='all';mode='mixed'}if(period!=='all')pool=pool.filter(x=>x.period===period);if(level==='SA')pool=pool.filter(x=>['S','A'].includes(x.level));else if(level==='S')pool=pool.filter(x=>x.level==='S');if(ui.focus.classList.contains('on')){const weak=pool.filter(socialWeak);if(weak.length>=4)pool=weak}if(pool.length<4)return null;const item=pool[Math.floor(Math.random()*pool.length)];let actual=mode;if(actual==='mixed'||actual==='auto')actual=/^(紀元前)?\\d+年$/.test(item.date)&&Math.random()<.52?'eventToYear':'yearToEvent';if(actual==='eventToYear'&&!/^(紀元前)?\\d+年$/.test(item.date))actual='yearToEvent';if(actual==='eventToYear'){return{subject:'社会',mode:'出来事→年号',prompt:item.event,hint:'年号を入力してください',answer:item.date,input:true,inputMode:'year',choices:null,check:v=>{const a=normalizeYear(v);if(item.sort<0){const n=String(Math.abs(item.sort));return['紀元前'+n,'-'+n,n+'bc'].includes(a)}return a===String(item.sort)},explanation:item.detail||`${item.event}｜${item.date}`,commit(ok){api.record(item.id,ok)}}}const same=pool.filter(x=>x.id!==item.id&&x.period===item.period&&x.sort!==item.sort);const vals=pickDistinct(same,item,'event');if(vals.length<3)return null;return{subject:'社会',mode:'年号→出来事',prompt:item.date,hint:'この年の出来事を選んでください',answer:item.event,choices:shuffle([item.event,...vals]),input:false,check:v=>text(v)===item.event,explanation:item.detail||`${item.date}｜${item.event}`,commit(ok){api.record(item.id,ok)}}}"""
          new = """function socialWeak(x){const p=x.progress||{};return (p.wrong||0)>0&&((p.wrong||0)>=(p.correct||0)||(+p.nextReview||0)<=Date.now())}\nfunction socialHasExactYear(x){return /^(紀元前)?\\d+年$/.test(x.date)}\nfunction normalizeYear(v){return text(v).normalize('NFKC').toLowerCase().replace(/[\\s,，]/g,'').replace(/年$/,'').replace(/^bc/,'紀元前')}\nfunction socialQuestion(){const api=getSocialApi();if(!api?.list)return null;let pool=api.list().filter(x=>x?.id&&x.event&&x.date),level=ui.filterA.value,period=ui.filterB.value,mode=ui.mode.value;if(activeSubject()==='mixed'){level=ui.filterB.value==='exam'?'SA':'all';period='all';mode='mixed'}if(period!=='all')pool=pool.filter(x=>x.period===period);if(level==='SA')pool=pool.filter(x=>['S','A'].includes(x.level));else if(level==='S')pool=pool.filter(x=>x.level==='S');if(ui.focus.classList.contains('on')){const weak=pool.filter(socialWeak);if(weak.length>=4)pool=weak}if(mode==='eventToYear')pool=pool.filter(socialHasExactYear);if(pool.length<4)return null;const item=pool[Math.floor(Math.random()*pool.length)];let actual=mode;if(actual==='mixed'||actual==='auto')actual=socialHasExactYear(item)&&Math.random()<.52?'eventToYear':'yearToEvent';if(actual==='eventToYear'&&!socialHasExactYear(item))return null;if(actual==='eventToYear'){return{subject:'社会',mode:'出来事→年号',prompt:item.event,hint:'年号を入力してください',answer:item.date,input:true,inputMode:'year',choices:null,check:v=>{const a=normalizeYear(v);if(item.sort<0){const n=String(Math.abs(item.sort));return['紀元前'+n,'-'+n,n+'bc'].includes(a)}return a===String(item.sort)},explanation:item.detail||`${item.event}｜${item.date}`,commit(ok){api.record(item.id,ok)}}}const same=pool.filter(x=>x.id!==item.id&&x.period===item.period&&x.sort!==item.sort);const vals=pickDistinct(same,item,'event');if(vals.length<3)return null;return{subject:'社会',mode:'年号→出来事',prompt:item.date,hint:'この年の出来事を選んでください',answer:item.event,choices:shuffle([item.event,...vals]),input:false,check:v=>text(v)===item.event,explanation:item.detail||`${item.date}｜${item.event}`,commit(ok){api.record(item.id,ok)}}}"""
          if old not in text:
              raise SystemExit('infinite social block not found exactly')
          text = text.replace(old, new, 1)
          text = text.replace("document.documentElement.dataset.riseInfiniteCourse='1.0.0';", "document.documentElement.dataset.riseInfiniteCourse='1.0.1';", 1)
          infinite.write_text(text, encoding='utf-8')

          checks = [
              (unified, "const VERSION='1.2.1';"),
              (unified, "if(mode==='eventToYear')pool=pool.filter(socialHasExactYear)"),
              (infinite, "if(mode==='eventToYear')pool=pool.filter(socialHasExactYear)"),
              (infinite, "dataset.riseInfiniteCourse='1.0.1'"),
          ]
          for path, needle in checks:
              if needle not in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'missing expected fix in {path}: {needle}')
          PY

          node --check quiz/unified-native-v1.js
          node --check quiz/infinite-course-v1.js
          ! grep -Fq "if(actual==='eventToYear'&&!/^(紀元前)?\\d+年$/.test(item.raw.date))actual='yearToEvent'" quiz/unified-native-v1.js
          ! grep -Fq "if(actual==='eventToYear'&&!/^(紀元前)?\\d+年$/.test(item.date))actual='yearToEvent'" quiz/infinite-course-v1.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quiz/unified-native-v1.js quiz/infinite-course-v1.js
          git commit -m 'Fix Social quiz mode enforcement'
          git push origin HEAD:main

      - name: Dispatch production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --ref main
