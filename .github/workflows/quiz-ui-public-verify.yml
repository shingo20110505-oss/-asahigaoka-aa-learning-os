name: Verify Dedicated Quiz UI

on:
  push:
    branches: [main]
    paths:
      - 'kokugo-chronologia/quiz-interaction-fix.js'
      - 'wrong-answer-history-v1.js'
      - 'chronologia-force1000-v1.js'
      - '.github/workflows/quiz-ui-public-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-ui-public-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Static integrity checks
        run: |
          set -euo pipefail
          node --check kokugo-chronologia/quiz-interaction-fix.js
          node --check wrong-answer-history-v1.js
          node --check chronologia-force1000-v1.js
          grep -q "2026-08-16.1" kokugo-chronologia/quiz-interaction-fix.js
          grep -q "quiz-interaction-fix.js?v=20260815-2" wrong-answer-history-v1.js
          grep -q "aaKokugoQuizUi" kokugo-chronologia/quiz-interaction-fix.js
          grep -q "realTouchCapture" kokugo-chronologia/quiz-interaction-fix.js
          grep -q "chronologiaQuizNavFix" chronologia-force1000-v1.js
          grep -q "aaSocialQuizUi" chronologia-force1000-v1.js

      - name: Wait for exact Pages release
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 48); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${BASE}release.json?quiz_ui_verify=${SOURCE_SHA}-${n}" -o /tmp/release.json && grep -q "${SOURCE_SHA}" /tmp/release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Verify public asset hashes
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
        run: |
          set -euo pipefail
          curl -fsSL "${BASE}kokugo-chronologia/quiz-interaction-fix.js?quiz_ui_verify=${SOURCE_SHA}" -o /tmp/kokugo-fix.js
          curl -fsSL "${BASE}wrong-answer-history-v1.js?quiz_ui_verify=${SOURCE_SHA}" -o /tmp/wrong-history.js
          curl -fsSL "${BASE}chronologia-force1000-v1.js?quiz_ui_verify=${SOURCE_SHA}" -o /tmp/chrono-fix.js
          test "$(sha256sum kokugo-chronologia/quiz-interaction-fix.js | awk '{print $1}')" = "$(sha256sum /tmp/kokugo-fix.js | awk '{print $1}')"
          test "$(sha256sum wrong-answer-history-v1.js | awk '{print $1}')" = "$(sha256sum /tmp/wrong-history.js | awk '{print $1}')"
          test "$(sha256sum chronologia-force1000-v1.js | awk '{print $1}')" = "$(sha256sum /tmp/chrono-fix.js | awk '{print $1}')"
          grep -q "2026-08-16.1" /tmp/kokugo-fix.js
          grep -q "quiz-interaction-fix.js?v=20260815-2" /tmp/wrong-history.js
          grep -q "次の問題へ" /tmp/chrono-fix.js

      - name: Run live Kokugo touch audit
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          rm -rf "/tmp/aa-kokugo-quiz-ui-${SOURCE_SHA}"
          timeout 150s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --user-data-dir="/tmp/aa-kokugo-quiz-ui-${SOURCE_SHA}" \
            --virtual-time-budget=90000 \
            --dump-dom "${BASE}kokugo-chronologia/?aa_quiz_ui_ci=1&verify=${SOURCE_SHA}" > /tmp/kokugo-runtime.html
          grep -o 'AA_KOKUGO_QUIZ_UI=[^<]*' /tmp/kokugo-runtime.html || true
          grep -q 'data-aa-kokugo-quiz-ui="PASS"' /tmp/kokugo-runtime.html
          grep -q 'AA_KOKUGO_QUIZ_UI=PASS' /tmp/kokugo-runtime.html
          grep -q '"graded":true' /tmp/kokugo-runtime.html
          grep -q '"nextVisible":true' /tmp/kokugo-runtime.html
          grep -q '"realTouchCapture":true' /tmp/kokugo-runtime.html

      - name: Run live Social next-question audit
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          rm -rf "/tmp/aa-social-quiz-ui-${SOURCE_SHA}"
          timeout 150s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --user-data-dir="/tmp/aa-social-quiz-ui-${SOURCE_SHA}" \
            --virtual-time-budget=90000 \
            --dump-dom "${BASE}chronologia.html?aa_quiz_ui_ci=1&verify=${SOURCE_SHA}" > /tmp/social-runtime.html
          grep -o 'AA_SOCIAL_QUIZ_UI=[^<]*' /tmp/social-runtime.html || true
          grep -q 'data-aa-social-quiz-ui="PASS"' /tmp/social-runtime.html
          grep -q 'AA_SOCIAL_QUIZ_UI=PASS' /tmp/social-runtime.html
          grep -q '"before":"1 / 10"' /tmp/social-runtime.html
          grep -q '"after":"2 / 10"' /tmp/social-runtime.html
