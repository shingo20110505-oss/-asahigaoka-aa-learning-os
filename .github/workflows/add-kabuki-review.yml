name: Add Kabuki review item

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-kabuki-review.yml'

permissions:
  contents: write

jobs:
  update-review-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Kabuki kanji review item
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('review-bank-v1.js')
          s = p.read_text(encoding='utf-8')
          item_id = "ja-kanji-kabuki-20260906"
          if f"id:'{item_id}'" in s:
              raise SystemExit('Kabuki review item already exists; refusing duplicate')
          old_version = "window.AA_REVIEW_BANK_VERSION='1.0.64';"
          if old_version not in s:
              raise SystemExit('Unexpected review bank version; refusing unsafe update')
          marker = "},];\nfunction normalize"
          if marker not in s:
              raise SystemExit('Review bank tail marker not found')
          item = "  {id:'ja-kanji-kabuki-20260906',subject:'国語',unit:'漢字・文化',title:'歌舞伎（かぶき）の漢字',question:'「かぶき」を漢字で書きなさい。',answer:'歌舞伎',why:'「歌」「舞」「伎」の3字で「歌舞伎」と書きます。伝統芸能の名称として、読みと漢字をひとかたまりで覚えます。',examples:['かぶき → 歌舞伎','歌舞伎は日本の伝統芸能の一つです。'],memory:'かぶき＝歌舞伎。「歌・舞・伎」の3字をセットで覚える',tags:['国語','漢字','歌舞伎','かぶき','伝統芸能'],createdAt:'2026-09-06'},"
          s = s.replace(marker, "},\n" + item + "];\nfunction normalize", 1)
          s = s.replace(old_version, "window.AA_REVIEW_BANK_VERSION='1.0.65';", 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check review-bank-v1.js
      - name: Commit review bank update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-bank-v1.js
          git commit -m 'Add 歌舞伎 kanji review'
          git push origin HEAD:main
