name: Apply Edo famine review card

on:
  push:
    paths:
      - '.github/workflows/apply-review-famine-20260816.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add famine review card safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('review-bank-v1.js')
          s = p.read_text(encoding='utf-8')
          item_id = "soc-edo-three-famines-20260816"

          if item_id not in s:
              anchor = "\n];\nfunction normalize"
              pos = s.rfind(anchor)
              if pos < 0:
                  raise SystemExit('review bank end marker not found')
              card = """,
            {
              id:'soc-edo-three-famines-20260816',subject:'社会',unit:'江戸時代・飢饉',title:'江戸の三大飢饉：享保・天明・天保',question:'江戸時代の重要な三つの飢饉を、年代・時代背景・その後の出来事と結びつけて答えなさい。',answer:'享保の飢饉＝1732年、徳川吉宗の時代。天明の飢饉＝1782〜1787年ごろ、田沼意次の政治末期で、1783年の浅間山噴火も被害を深刻化させ、その後の寛政の改革につながる。天保の飢饉＝1833〜1839年ごろ、1837年の大塩平八郎の乱など社会不安を招き、その後の天保の改革につながる。',why:'飢饉は単独の年号としてではなく、政治の流れと結びつけると覚えやすいです。享保の飢饉の後には救荒作物としてサツマイモが注目され、青木昆陽が栽培・普及を進めました。天明の飢饉は田沼政治への不満が強まる背景の一つとなり、松平定信の寛政の改革では囲米など飢饉への備えが重視されました。天保の飢饉では米価高騰や救済不足への不満が高まり、大塩平八郎の乱が起こりました。',examples:['享保の飢饉（1732）→ 吉宗の時代 → 青木昆陽・サツマイモ','天明の飢饉（1782〜1787ごろ）→ 田沼政治末期・浅間山噴火 → 寛政の改革','天保の飢饉（1833〜1839ごろ）→ 大塩平八郎の乱（1837）→ 天保の改革'],memory:'享保＝吉宗＋サツマイモ／天明＝田沼→寛政／天保＝大塩→天保の改革',tags:['社会','江戸時代','飢饉','享保の飢饉','天明の飢饉','天保の飢饉','青木昆陽','浅間山','大塩平八郎の乱','寛政の改革','天保の改革'],createdAt:'2026-08-16'
            }"""
              s = s[:pos] + card + s[pos:]

          old = "window.AA_REVIEW_BANK_VERSION='1.0.20';"
          new = "window.AA_REVIEW_BANK_VERSION='1.0.21';"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('unexpected review bank version')

          if s.count("id:'soc-edo-three-famines-20260816'") != 1:
              raise SystemExit('famine review id duplicate/missing')

          p.write_text(s, encoding='utf-8')
          PY

          node --check review-bank-v1.js
          node scripts/validate-review-bank.mjs
          grep -q "id:'soc-edo-three-famines-20260816'" review-bank-v1.js
          grep -q "AA_REVIEW_BANK_VERSION='1.0.21'" review-bank-v1.js

      - name: Commit review update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-bank-v1.js
          if git diff --cached --quiet; then
            echo "No review-bank change needed"
          else
            git commit -m "Add Edo famine review card"
            git push origin HEAD:main
          fi
