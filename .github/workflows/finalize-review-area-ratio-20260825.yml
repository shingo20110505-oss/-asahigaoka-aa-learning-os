name: Finalize review area ratio 20260825

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-review-area-ratio-20260825.yml'

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build stable review image and patch canonical bank
        id: patch
        shell: bash
        env:
          EXPECTED_BANK_BLOB: 7eeb822691d7b0deaa81e20ab7438bb733cc590f
          ITEM_ID: math-area-ratio-two-sides-product-20260825
          OLD_IMAGE: assets/20260825-math-area-ratio-two-sides-original-v1.jpg
          NEW_IMAGE: assets/20260825-math-area-ratio-two-sides-v2.svg
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

          test "$(git hash-object review-bank-v1.js)" = "$EXPECTED_BANK_BLOB"
          test "$(grep -o "$ITEM_ID" review-bank-v1.js | wc -l)" -eq 1
          grep -Fq "window.AA_REVIEW_BANK_VERSION='1.0.51';" review-bank-v1.js
          grep -Fq "$OLD_IMAGE" review-bank-v1.js

          mkdir -p review/assets
          cat > review/assets/20260825-math-area-ratio-two-sides-v2.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
            <title id="title">三角形ABCの面積比問題</title>
            <desc id="desc">三角形ABCの面積は20平方センチメートル。DはAB上でAD対DBが1対3、EはAC上でAEイコールEC。三角形ADEが灰色で示されている。</desc>
            <rect width="900" height="700" fill="#ffffff"/>
            <text x="62" y="76" font-family="sans-serif" font-size="34" fill="#111">(4)</text>
            <polygon points="450,110 175,505 730,505" fill="none" stroke="#171717" stroke-width="6" stroke-linejoin="round"/>
            <polygon points="450,110 381.25,208.75 590,307.5" fill="#777777" stroke="#171717" stroke-width="5" stroke-linejoin="round"/>
            <line x1="381.25" y1="208.75" x2="590" y2="307.5" stroke="#171717" stroke-width="5"/>
            <text x="435" y="92" font-family="sans-serif" font-size="34" fill="#111">A</text>
            <text x="140" y="535" font-family="sans-serif" font-size="34" fill="#111">B</text>
            <text x="740" y="535" font-family="sans-serif" font-size="34" fill="#111">C</text>
            <text x="345" y="216" font-family="sans-serif" font-size="31" fill="#111">D</text>
            <text x="603" y="313" font-family="sans-serif" font-size="31" fill="#111">E</text>
            <text x="210" y="590" font-family="sans-serif" font-size="34" fill="#111">△ABC = 20 cm²</text>
            <text x="185" y="642" font-family="sans-serif" font-size="32" fill="#111">( AD : DB = 1 : 3,  AE = EC )</text>
          </svg>
          SVG

          python - <<'PY'
          from pathlib import Path
          p=Path('review-bank-v1.js')
          s=p.read_text(encoding='utf-8')
          changes={
            "assets/20260825-math-area-ratio-two-sides-original-v1.jpg":"assets/20260825-math-area-ratio-two-sides-v2.svg",
            "三角形ABCの問題写真。Dは辺AB上でAD:DB=1:3、Eは辺AC上でAE=EC、△ABCの面積は20cm²。上部の△ADEが色付き。":"三角形ABCの問題図。Dは辺AB上でAD:DB=1:3、Eは辺AC上でAE=EC、△ABCの面積は20cm²。上部の△ADEが灰色で示されている。",
            "window.AA_REVIEW_BANK_VERSION='1.0.51';":"window.AA_REVIEW_BANK_VERSION='1.0.52';",
          }
          for old,new in changes.items():
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, got {n}: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          rm -f .github/review-image-build/20260825-area-ratio-v2.part0.b64
          rm -f .github/workflows/verify-review-image-20260825-area-ratio.yml
          rm -f .github/workflows/finalize-review-area-ratio-20260825.yml

          test "$(grep -o "$ITEM_ID" review-bank-v1.js | wc -l)" -eq 1
          grep -Fq "$NEW_IMAGE" review-bank-v1.js
          grep -Fq "window.AA_REVIEW_BANK_VERSION='1.0.52';" review-bank-v1.js
          grep -Fq '△ADE＝5/2 cm²＝2.5 cm²' review-bank-v1.js
          grep -Fq '<svg' review/assets/20260825-math-area-ratio-two-sides-v2.svg

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A review-bank-v1.js review/assets .github/review-image-build .github/workflows
          git commit -m 'Use stable SVG for area-ratio review card'
          git pull --rebase origin main
          git push origin main
          PATCH_SHA=$(git rev-parse HEAD)
          BANK_SHA256=$(sha256sum review-bank-v1.js | awk '{print $1}')
          IMAGE_SHA256=$(sha256sum review/assets/20260825-math-area-ratio-two-sides-v2.svg | awk '{print $1}')
          echo "patch_sha=$PATCH_SHA" >> "$GITHUB_OUTPUT"
          echo "bank_sha256=$BANK_SHA256" >> "$GITHUB_OUTPUT"
          echo "image_sha256=$IMAGE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify exact production review card and image
        id: verify
        shell: bash
        env:
          PATCH_SHA: ${{ steps.patch.outputs.patch_sha }}
          EXPECTED_BANK_SHA256: ${{ steps.patch.outputs.bank_sha256 }}
          EXPECTED_IMAGE_SHA256: ${{ steps.patch.outputs.image_sha256 }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os
          ITEM_ID: math-area-ratio-two-sides-product-20260825
          IMAGE_PATH: review/assets/20260825-math-area-ratio-two-sides-v2.svg
          BANK_IMAGE_PATH: assets/20260825-math-area-ratio-two-sides-v2.svg
        run: |
          set +e
          release_match=fail
          review_ui=fail
          bank_item=fail
          bank_answer=fail
          bank_image_reference=fail
          bank_exact_hash=fail
          image_fetch=fail
          image_type=fail
          image_hash_match=fail
          image_decode=fail
          image_dimensions=fail
          card_dom_reference=fail
          image_width=0
          image_height=0

          for n in $(seq 1 72); do
            curl -fsSL --connect-timeout 10 --max-time 25 "$BASE/release.json?verify=$PATCH_SHA-$n" -o /tmp/release.json
            if grep -q "$PATCH_SHA" /tmp/release.json 2>/dev/null; then release_match=success; break; fi
            sleep 5
          done

          curl -fsSL "$BASE/review/?verify=$PATCH_SHA" -o /tmp/review.html
          grep -q 'Review v2' /tmp/review.html && grep -q 'reviewImage' /tmp/review.html && review_ui=success

          curl -fsSL "$BASE/review-bank-v1.js?verify=$PATCH_SHA" -o /tmp/public-bank.js
          grep -Fq "$ITEM_ID" /tmp/public-bank.js && bank_item=success
          grep -Fq '△ADE＝5/2 cm²＝2.5 cm²' /tmp/public-bank.js && bank_answer=success
          grep -Fq "$BANK_IMAGE_PATH" /tmp/public-bank.js && bank_image_reference=success
          PUBLIC_BANK_SHA256=$(sha256sum /tmp/public-bank.js 2>/dev/null | awk '{print $1}')
          test -n "$PUBLIC_BANK_SHA256" && test "$PUBLIC_BANK_SHA256" = "$EXPECTED_BANK_SHA256" && bank_exact_hash=success

          curl -fsSL -D /tmp/image.headers "$BASE/$IMAGE_PATH?verify=$PATCH_SHA" -o /tmp/public-image.svg
          test -s /tmp/public-image.svg && image_fetch=success
          grep -Fq '<svg' /tmp/public-image.svg && image_type=success
          PUBLIC_IMAGE_SHA256=$(sha256sum /tmp/public-image.svg 2>/dev/null | awk '{print $1}')
          test -n "$PUBLIC_IMAGE_SHA256" && test "$PUBLIC_IMAGE_SHA256" = "$EXPECTED_IMAGE_SHA256" && image_hash_match=success

          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if test -n "$CHROME"; then
            cat >/tmp/image-check.html <<EOF
          <!doctype html><html><body data-image-decode="WAIT"><img id="target" src="$BASE/$IMAGE_PATH?browser=$PATCH_SHA"><script>
          const img=document.getElementById('target');
          const done=()=>{if(img.complete){document.body.dataset.imageDecode=(img.naturalWidth>0&&img.naturalHeight>0)?'PASS':'FAIL';document.body.dataset.width=img.naturalWidth;document.body.dataset.height=img.naturalHeight;}};
          img.addEventListener('load',done);img.addEventListener('error',done);setInterval(done,100);
          </script></body></html>
          EOF
            timeout 60s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom file:///tmp/image-check.html >/tmp/image-check-dom.html 2>/tmp/chrome-image.err
            grep -q 'data-image-decode="PASS"' /tmp/image-check-dom.html && image_decode=success
            image_width=$(grep -o 'data-width="[0-9]*"' /tmp/image-check-dom.html | head -1 | tr -cd '0-9')
            image_height=$(grep -o 'data-height="[0-9]*"' /tmp/image-check-dom.html | head -1 | tr -cd '0-9')
            test -n "$image_width" || image_width=0
            test -n "$image_height" || image_height=0
            test "$image_width" = 900 && test "$image_height" = 700 && image_dimensions=success

            timeout 60s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom "$BASE/review/?domverify=$PATCH_SHA" >/tmp/review-dom.html 2>/tmp/chrome-review.err
            grep -Fq "data-id=\"$ITEM_ID\"" /tmp/review-dom.html && grep -Fq "src=\"$BANK_IMAGE_PATH\"" /tmp/review-dom.html && card_dom_reference=success
          fi

          result=success
          for v in "$release_match" "$review_ui" "$bank_item" "$bank_answer" "$bank_image_reference" "$bank_exact_hash" "$image_fetch" "$image_type" "$image_hash_match" "$image_decode" "$image_dimensions" "$card_dom_reference"; do
            test "$v" = success || result=fail
          done

          cat > /tmp/REVIEW_IMAGE_VERIFY_STATUS.txt <<EOF
          result=$result
          source_sha=$PATCH_SHA
          item_id=$ITEM_ID
          review_version=1.0.52
          image_path=$IMAGE_PATH
          release_match=$release_match
          review_ui=$review_ui
          review_bank_item=$bank_item
          review_bank_answer=$bank_answer
          review_bank_reference=$bank_image_reference
          source_bank_sha256=$EXPECTED_BANK_SHA256
          public_bank_sha256=$PUBLIC_BANK_SHA256
          review_bank_exact_hash=$bank_exact_hash
          image_fetch=$image_fetch
          image_type=$image_type
          source_image_sha256=$EXPECTED_IMAGE_SHA256
          public_image_sha256=$PUBLIC_IMAGE_SHA256
          image_hash_match=$image_hash_match
          image_decode=$image_decode
          image_dimensions=$image_dimensions
          image_width=$image_width
          image_height=$image_height
          card_dom_reference=$card_dom_reference
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Record production image verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/REVIEW_IMAGE_VERIFY_STATUS.txt REVIEW_IMAGE_VERIFY_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REVIEW_IMAGE_VERIFY_STATUS.txt
          git commit -m 'Record area-ratio review production verification'
          git pull --rebase origin main
          git push origin main

      - name: Enforce successful verification
        shell: bash
        run: grep -q '^result=success$' /tmp/REVIEW_IMAGE_VERIFY_STATUS.txt
