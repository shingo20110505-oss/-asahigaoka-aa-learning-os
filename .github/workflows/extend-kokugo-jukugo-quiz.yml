name: Extend Kokugo Jukugo Quiz
on:
  push:
    paths:
      - '.extend-kokugo-jukugo-quiz-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch latest main without touching translation files
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('kokugo-chronologia/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./jukugo-extension.js?v=20260812-1"></script>'
          if tag not in s:
              marker='<!-- KOKUGO_DIRECT_MEANING_OVERRIDE_V1 -->'
              if marker in s:
                  s=s.replace(marker,tag+marker,1)
              elif '</body>' in s:
                  s=s.replace('</body>',tag+'</body>',1)
              else:
                  raise SystemExit('index insertion point not found')
              p.write_text(s,encoding='utf-8')
          assert tag in p.read_text(encoding='utf-8')
          assert Path('kokugo-chronologia/jukugo-extension.js').exists()
          assert Path('kokugo-chronologia/jukugo-bank.js').exists()
          PY
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add kokugo-chronologia/index.html
            if git diff --cached --quiet; then
              echo 'Kokugo extension already present'; exit 0
            fi
            git commit -m 'Enable two-character compounds and Kokugo quiz'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Could not push after conflict-safe retries' >&2
          exit 1
