name: Extend Kokugo Jukugo Quiz
on:
  push:
    paths:
      - '.extend-kokugo-jukugo-quiz-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh stored quiz order without resetting progress
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          import re

          index_path=Path('kokugo-chronologia/index.html')
          index=index_path.read_text(encoding='utf-8')
          tag='<script src="./jukugo-extension.js?v=20260826-2"></script>'
          index,n=re.subn(r'<script src="\./jukugo-extension\.js\?v=[^"]+"></script>',tag,index,count=1)
          if not n:
              raise SystemExit('jukugo extension script tag not found')
          index_path.write_text(index,encoding='utf-8')

          p=Path('kokugo-chronologia/jukugo-extension.js')
          s=p.read_text(encoding='utf-8')
          s,n_ver=re.subn(r"const EXT_VERSION='[^']+'","const EXT_VERSION='2026-08-26.2'",s,count=1)

          old="let remaining=(Array.isArray(scope.remaining)?scope.remaining:[]).filter((id,i,a)=>validIds.has(id)&&a.indexOf(id)===i);const newItems="
          new="let remaining=(Array.isArray(scope.remaining)?scope.remaining:[]).filter((id,i,a)=>validIds.has(id)&&a.indexOf(id)===i);if(scope.orderVersion!=='unbiased-20260826'){remaining=shuffle([...remaining]);scope.orderVersion='unbiased-20260826'}const newItems="
          if old in s:
              s=s.replace(old,new,1)
          elif "scope.orderVersion!=='unbiased-20260826'" not in s:
              raise SystemExit('stored-order migration insertion point not found')

          if 'function rankWeight(){return 1}' not in s:
              raise SystemExit('uniform rank weighting missing')
          if 'function priorityShuffle(items){return shuffle([...items])}' not in s:
              raise SystemExit('uniform shuffle missing')
          adaptive_pos=s.find('function makeAdaptiveSet(')
          if adaptive_pos < 0:
              raise SystemExit('adaptive quiz function missing')
          adaptive_end=s.find('\n',adaptive_pos)
          adaptive_line=s[adaptive_pos:adaptive_end if adaptive_end >= 0 else len(s)]
          if 'wrongCandidates' in adaptive_line:
              raise SystemExit('normal quiz still injects wrong answers')
          if 'Aランクを優先して出題します' in s:
              raise SystemExit('old easy-rank note still present')

          p.write_text(s,encoding='utf-8')
          final=p.read_text(encoding='utf-8')
          assert "EXT_VERSION='2026-08-26.2'" in final
          assert "scope.orderVersion!=='unbiased-20260826'" in final
          assert tag in index_path.read_text(encoding='utf-8')
          PY
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add kokugo-chronologia/index.html kokugo-chronologia/jukugo-extension.js
            if git diff --cached --quiet; then
              echo 'Stored Kokugo quiz order already refreshed'; exit 0
            fi
            git commit -m 'Refresh stored Kokugo quiz order without resetting progress'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Could not push after conflict-safe retries' >&2
          exit 1
