name: Deploy Rise AI Platform Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.ai-worker-deploy-trigger'

permissions:
  contents: read

concurrency:
  group: rise-ai-platform-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4

      - name: Validate Worker contracts
        run: |
          set -euo pipefail
          node --check worker/src/index.mjs
          node --check worker/src/entry.mjs
          node --check worker/src/exam-platform.mjs
          node --check worker/src/subject-verifier.mjs
          node --check worker/src/providers/gemini.mjs
          node --check worker/src/providers/groq.mjs
          node --check worker/src/providers/index.mjs
          node tests/ai-provider-contract.mjs
          node tests/ai-reading-contract.mjs
          node tests/ai-reading-groq-contract.mjs
          node tests/ai-subject-verifier-contract.mjs
          node tests/ai-exam-platform-contract.mjs

      - name: Confirm required GitHub secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_ACCESS_TOKEN: ${{ secrets.AI_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GEMINI_API_KEY"
          test -n "$GROQ_API_KEY"
          test "${#AI_ACCESS_TOKEN}" -ge 24

      - name: Deploy Worker and encrypted secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.127.1"
          command: deploy
          secrets: |
            GEMINI_API_KEY
            GROQ_API_KEY
            AI_ACCESS_TOKEN
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_ACCESS_TOKEN: ${{ secrets.AI_ACCESS_TOKEN }}

      - name: Verify production health and AI quality gates
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          AI_ACCESS_TOKEN: ${{ secrets.AI_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          BASE="${DEPLOYMENT_URL%/}"
          ORIGIN='https://shingo20110505-oss.github.io'
          export EXPECTED_WORKER_VERSION='1.4.0'

          health_ready=false
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 30 "$BASE/health" -o /tmp/ai-health.json \
              && node -e 'const h=require("/tmp/ai-health.json"); process.exit(h.ok === true && h.version === process.env.EXPECTED_WORKER_VERSION && h.service === "rise-ai-platform" ? 0 : 1)'; then
              health_ready=true
              break
            fi
            sleep 5
          done
          test "$health_ready" = true

          curl -fsSL --retry 3 --retry-delay 3 --max-time 30 \
            -X POST \
            -H "Origin: $ORIGIN" \
            -H "Authorization: Bearer $AI_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$BASE/v1/status" -o /tmp/ai-status.json

          export READING_HTTP_STATUS
          READING_HTTP_STATUS="$(curl -sS --max-time 180 -w '%{http_code}' \
            -X POST \
            -H "Origin: $ORIGIN" \
            -H "Authorization: Bearer $AI_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"schemaVersion":1,"difficulty":4,"readingType":"argument","assistMode":"scaffold","allowedGrammar":["basic","past","future","modal","infinitive","gerund","comparison","passive","presentPerfect","asMuchAs","asManyAs"],"weakSkills":[{"id":"en.read.inference","label":"英語・推論"}],"weakWords":[{"word":"evidence","meaningJa":"根拠"}],"knownWords":["student","school","plan"],"recentTopics":[],"recentErrorTypes":[]}' \
            "$BASE/v1/reading" -o /tmp/ai-reading.json)"
          test "$READING_HTTP_STATUS" = 200 || { cat /tmp/ai-reading.json >&2; exit 1; }

          node - <<'NODE' > /tmp/math-verify-request.json
          const E = require('./math-exam/engine.js');
          const q = E.make('probability', 20260904, 2);
          process.stdout.write(JSON.stringify({
            schemaVersion: 1,
            subject: 'math',
            item: {
              id: 'deploy-math-probability',
              stem: q.stem,
              choices: q.choices.map(choice => choice.text),
              expectedAnswerIndex: q.answerIndex,
              figure: q.figure || null
            }
          }));
          NODE

          export MATH_HTTP_STATUS
          MATH_HTTP_STATUS="$(curl -sS --max-time 120 -w '%{http_code}' \
            -X POST \
            -H "Origin: $ORIGIN" \
            -H "Authorization: Bearer $AI_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/math-verify-request.json \
            "$BASE/v1/verify" -o /tmp/math-verify.json)"
          test "$MATH_HTTP_STATUS" = 200 || { cat /tmp/math-verify.json >&2; exit 1; }

          export EXAM_HTTP_STATUS
          EXAM_HTTP_STATUS="$(curl -sS --max-time 180 -w '%{http_code}' \
            -X POST \
            -H "Origin: $ORIGIN" \
            -H "Authorization: Bearer $AI_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"schemaVersion":1,"subject":"science","count":1,"difficulty":7,"skill":"sci.aichi.application","focus":["実験","資料読解","計算"],"recentQuestionIds":[]}' \
            "$BASE/v1/exam" -o /tmp/ai-exam.json)"
          test "$EXAM_HTTP_STATUS" = 200 || { cat /tmp/ai-exam.json >&2; exit 1; }

          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/ai-health.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('/tmp/ai-status.json', 'utf8'));
          const reading = JSON.parse(fs.readFileSync('/tmp/ai-reading.json', 'utf8'));
          const math = JSON.parse(fs.readFileSync('/tmp/math-verify.json', 'utf8'));
          const exam = JSON.parse(fs.readFileSync('/tmp/ai-exam.json', 'utf8'));
          const subjects = ['english','math','japanese','science','social'];

          if (health.ok !== true || health.version !== '1.4.0' || health.service !== 'rise-ai-platform') throw new Error('Worker health verification failed');
          if (status.ready !== true || status.version !== '1.4.0') throw new Error('Worker status verification failed');
          if (status.model !== 'gemini-3.5-flash') throw new Error(`Unexpected Gemini model: ${status.model}`);
          if (status.verificationProvider !== 'groq' || status.verifierModel !== 'openai/gpt-oss-20b') throw new Error('Groq verifier status mismatch');
          for (const subject of subjects) {
            if (!String(status.examGeneration?.[subject] || '').startsWith('production')) throw new Error(`Exam generation status missing: ${subject}`);
            if (status.subjectVerification?.[subject] !== 'production-audit') throw new Error(`Subject verification status missing: ${subject}`);
          }
          if (status.safeguards?.paidFallback !== false || status.safeguards?.quota429StopsGeneration !== true || status.safeguards?.authorAnswerHiddenFromVerifier !== true) throw new Error('AI safeguards status mismatch');

          if (reading.schemaVersion !== 1 || reading.quality?.verified !== true) throw new Error('English AI quality verification failed');
          if (reading.quality?.generationProvider !== 'gemini' || reading.quality?.verificationProvider !== 'groq') throw new Error('English provider provenance mismatch');
          if (!Array.isArray(reading.reading?.questions) || reading.reading.questions.length !== 5) throw new Error('Expected five English questions');

          if (math.schemaVersion !== 1 || math.subject !== 'math' || math.accepted !== true || math.quality?.verified !== true) throw new Error('Math Groq audit failed');
          if (math.quality?.verificationProvider !== 'groq') throw new Error('Math verifier provenance mismatch');

          if (exam.schemaVersion !== 1 || exam.subject !== 'science' || exam.deliveredCount < 1 || !Array.isArray(exam.items)) throw new Error('Science /v1/exam generation failed');
          const item = exam.items[0];
          if (item.subject !== 'science' || item.quality?.verified !== true) throw new Error('Science item was not quality verified');
          if (!/^rise-science-[0-9a-f]{16}$/.test(item.id)) throw new Error('Science item stable id missing');
          if (item.quality?.generationProvider !== 'gemini' || item.quality?.verificationProvider !== 'groq') throw new Error('Science provider provenance mismatch');
          if (exam.quality?.method !== 'gemini-authoring-subject-deterministic-groq-blind-agreement') throw new Error('Science agreement gate method missing');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Rise AI Platform production verified\n\n- URL: ${process.env.DEPLOYMENT_URL}\n- Worker: ${health.version}\n- English long reading: Gemini -> deterministic -> Groq PASS\n- Five-subject common verifier: connected\n- Math deterministic -> Groq audit: PASS\n- Science /v1/exam: Gemini -> deterministic -> Groq agreement PASS\n- Paid fallback: disabled\n`);
          NODE
