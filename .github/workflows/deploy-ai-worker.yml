name: Deploy Rise AI Platform Worker

# Management contract: the live production checks are delegated to
# scripts/verify-ai-worker-production.sh and scripts/verify-ai-worker-production-result.mjs.
# Their enforced contract includes EXPECTED_WORKER_VERSION='1.4.0',
# endpoints /v1/verify and /v1/exam, and the quality method
# gemini-authoring-subject-deterministic-groq-blind-agreement.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.ai-worker-deploy-trigger'
      - '.github/workflows/deploy-ai-worker.yml'
      - 'scripts/verify-ai-worker-production.sh'
      - 'scripts/verify-ai-worker-production-result.mjs'

permissions:
  contents: read

concurrency:
  group: rise-ai-platform-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4

      - name: Validate Worker contracts and production gate syntax
        run: |
          set -euo pipefail
          node --check worker/src/index.mjs
          node --check worker/src/entry.mjs
          node --check worker/src/entry-hardened.mjs
          node --check worker/src/exam-platform.mjs
          node --check worker/src/exam-platform-hardened.mjs
          node --check worker/src/subject-verifier.mjs
          node --check worker/src/subject-verifier-hardened.mjs
          node --check worker/src/providers/gemini.mjs
          node --check worker/src/providers/groq.mjs
          node --check worker/src/providers/index.mjs
          node --check scripts/verify-ai-worker-production-result.mjs
          bash -n scripts/verify-ai-worker-production.sh
          node tests/ai-provider-contract.mjs
          node tests/ai-gemini-current-contract.mjs
          node tests/ai-reading-contract.mjs
          node tests/ai-reading-groq-contract.mjs
          node tests/ai-subject-verifier-contract.mjs
          node tests/ai-exam-platform-contract.mjs
          node tests/ai-api-hardening-contract.mjs

      - name: Confirm required GitHub secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_ACCESS_TOKEN: ${{ secrets.AI_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GEMINI_API_KEY"
          test -n "$GROQ_API_KEY"
          test "${#AI_ACCESS_TOKEN}" -ge 24

      - name: Deploy Worker and encrypted secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.127.1"
          command: deploy
          secrets: |
            GEMINI_API_KEY
            GROQ_API_KEY
            AI_ACCESS_TOKEN
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_ACCESS_TOKEN: ${{ secrets.AI_ACCESS_TOKEN }}

      - name: Verify production health and AI quality gates
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          AI_ACCESS_TOKEN: ${{ secrets.AI_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          BASE="${DEPLOYMENT_URL:-https://asahigaoka-aa-ai-reading.shingo-20110505.workers.dev}"
          bash scripts/verify-ai-worker-production.sh "$BASE" "$AI_ACCESS_TOKEN"
