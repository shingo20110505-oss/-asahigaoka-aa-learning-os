name: Fix unified normal session integrity 20260909
on:
  push:
    paths:
      - '.fix-unified-normal-session-integrity-20260909-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock subject and quiz format for normal unified sessions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_js_function(src,name,replacement):
              start=src.find(f'function {name}(')
              if start<0: raise SystemExit(f'{name}: function not found')
              paren=src.find('(',start)
              pdepth=0; close=-1
              for i in range(paren,len(src)):
                  if src[i]=='(': pdepth+=1
                  elif src[i]==')':
                      pdepth-=1
                      if pdepth==0:
                          close=i; break
              if close<0: raise SystemExit(f'{name}: signature close not found')
              op=src.find('{',close)
              if op<0: raise SystemExit(f'{name}: body open not found')
              depth=0
              for i in range(op,len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0:
                          return src[:start]+replacement+src[i+1:]
              raise SystemExit(f'{name}: closing brace not found')

          p=Path('quiz/unified-native-v1.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='1.2.2';","const VERSION='1.2.3';",1)

          build=r'''function captureSessionConfig(){return{subject,mode:ui.mode.value,filterA:ui.filterA.value,filterB:ui.filterB.value,count:Number(ui.count.value)||10,focusWeak:!!focusWeak}}
function buildSession(config=captureSessionConfig()){
 const count=config.count,mode=config.mode,a=config.filterA,b=config.filterB,sub=config.subject,weak=!!config.focusWeak;
 if(sub==='mixed'){const old=focusWeak;focusWeak=weak;try{return buildMixedQuestions(count,a,b)}finally{focusWeak=old}}
 if(sub==='english')return buildEnglishQuestions(count,mode,a,b,weak,false);
 if(sub==='japanese')return buildJapaneseQuestions(count,mode,a,b,weak,false);
 if(sub==='social')return buildSocialQuestions(count,mode,a,b,weak);
 return[];
}
function questionMatchesSession(q,config){if(!q||!config)return false;if(config.subject!=='mixed'&&q.subject!==config.subject)return false;if(config.subject==='english'&&['en-ja','ja-en','spell'].includes(config.mode)&&q.actual!==config.mode)return false;if(config.subject==='japanese'&&['meaning','reading','word'].includes(config.mode)&&q.actual!==config.mode)return false;if(config.subject==='social'&&['eventToYear','yearToEvent'].includes(config.mode)&&q.actual!==config.mode)return false;return true}
function buildLockedSessionQuestions(config){const out=[],seen=new Set();for(let round=0;round<8&&out.length<config.count;round++){for(const q of buildSession(config)){if(!questionMatchesSession(q,config))continue;const itemId=q?.item?.raw?.id??q?.item?.id??'';const key=`${q.subject}|${q.actual}|${itemId}|${q.prompt}`;if(seen.has(key))continue;seen.add(key);out.push(q);if(out.length>=config.count)break}}return out.slice(0,config.count)}'''
          s=replace_js_function(s,'buildSession',build)

          start=r'''function startSession(){
 if(!currentReady())return;const config=captureSessionConfig(),questions=buildLockedSessionQuestions(config);if(!questions.length){ui.status.textContent='この条件では出題できる問題がありません。条件を変更してください。';return}
 session={questions,index:0,score:0,locked:false,config};ui.setup.classList.add('compact');ui.summary.classList.add('hidden');ui.study.classList.remove('hidden');showQuestion();ui.study.scrollIntoView({behavior:'smooth',block:'start'});
}'''
          s=replace_js_function(s,'startSession',start)

          show_start=s.find('function showQuestion()')
          if show_start<0: raise SystemExit('showQuestion not found')
          old="function showQuestion(){\n if(!session)return;if(session.index>=session.questions.length){finishSession();return}\n const q=session.questions[session.index];"
          new="function showQuestion(){\n if(!session)return;if(session.index>=session.questions.length){finishSession();return}\n let q=session.questions[session.index];while(q&&session.config&&!questionMatchesSession(q,session.config)){session.index++;q=session.questions[session.index]}if(!q){finishSession();return}"
          if old not in s: raise SystemExit('showQuestion prologue not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('quiz/index.html')
          html=p.read_text(encoding='utf-8')
          html=re.sub(r'(unified-native-v1\.js\?v=)[^\"\']+',r'\g<1>1.2.3',html)
          p.write_text(html,encoding='utf-8')

          js=Path('quiz/unified-native-v1.js').read_text(encoding='utf-8')
          html=Path('quiz/index.html').read_text(encoding='utf-8')
          assert "const VERSION='1.2.3'" in js
          assert 'function captureSessionConfig()' in js
          assert 'function questionMatchesSession' in js
          assert 'function buildLockedSessionQuestions' in js
          assert 'session={questions,index:0,score:0,locked:false,config}' in js
          assert 'while(q&&session.config&&!questionMatchesSession(q,session.config))' in js
          assert 'unified-native-v1.js?v=1.2.3' in html
          print('unified normal-session integrity contracts ok')
          PY
          node --check quiz/unified-native-v1.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quiz/unified-native-v1.js quiz/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix unified quiz subject and format session integrity'
          git push origin HEAD:main
