name: Temporary final Math runtime ownership patch

on:
  push:
    branches: [fix-math-runtime-ownership-final-20260903]
    paths:
      - '.github/workflows/fix-math-runtime-ownership-temp.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-math-runtime-ownership-final-20260903
          fetch-depth: 0
      - name: Apply final Math ownership guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          q=Path('question-quality-v1.js')
          s=q.read_text()
          old="if(typeof makeMathQ==='function')makeMathQ=(d=7)=>adaptive('math',d);"
          new="if(typeof makeMathQ==='function'&&window.AAMathFullReplacement?.ok!==true)makeMathQ=(d=7)=>adaptive('math',d);"
          if s.count(old)!=1: raise SystemExit(f'question-quality Math hook count={s.count(old)}')
          q.write_text(s.replace(old,new))

          d=Path('difficulty-engine-v1.js')
          s=d.read_text()
          old="if(originals.math)makeMathQ=(d=currentD())=>exactQuestion('math',d)||originals.math(d);"
          new="if(originals.math&&window.AAMathFullReplacement?.ok!==true)makeMathQ=(d=currentD())=>exactQuestion('math',d)||originals.math(d);"
          if s.count(old)!=1: raise SystemExit(f'difficulty Math hook count={s.count(old)}')
          d.write_text(s.replace(old,new))

          t=Path('tests/architecture-boundaries.mjs')
          s=t.read_text()
          anchor="if(!legacyV23.includes(\"typeof makeMathQ==='function'&&window.AAMathFullReplacement?.ok!==true\"))throw new Error('Legacy V23 may override verified mathematics ownership');\n"
          extra="const questionQuality=fs.readFileSync('question-quality-v1.js','utf8');\nif(!questionQuality.includes(\"typeof makeMathQ==='function'&&window.AAMathFullReplacement?.ok!==true\"))throw new Error('Question quality layer may override verified mathematics ownership');\nconst difficultyEngine=fs.readFileSync('difficulty-engine-v1.js','utf8');\nif(!difficultyEngine.includes(\"originals.math&&window.AAMathFullReplacement?.ok!==true\"))throw new Error('Difficulty layer may override verified mathematics ownership');\n"
          if anchor not in s: raise SystemExit('architecture Math ownership anchor missing')
          if 'Question quality layer may override verified mathematics ownership' not in s:
              s=s.replace(anchor,anchor+extra)
          t.write_text(s)
          PY
          node --check question-quality-v1.js
          node --check difficulty-engine-v1.js
          node --check learning-engine-v23.js
          node tests/architecture-boundaries.mjs
          node scripts/validate-math.mjs
      - name: Verify complete browser quality runtime locally
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/aa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          rm -rf /tmp/aa-quality-final
          timeout 120s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/aa-quality-final --virtual-time-budget=60000 --dump-dom 'http://127.0.0.1:8000/?aa_quality_ci=1&verify=math-ownership-final' > /tmp/quality.html
          grep -o 'AA_QUALITY_CI=[^<]*' /tmp/quality.html || true
          grep -q 'data-aa-quality-ci="PASS"' /tmp/quality.html
          grep -q '愛知県型数学・応用検算' /tmp/quality.html
      - name: Commit verified non-workflow patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question-quality-v1.js difficulty-engine-v1.js tests/architecture-boundaries.mjs
          git commit -m 'Protect verified Math from downstream quality overrides'
          git push origin HEAD:fix-math-runtime-ownership-final-20260903
