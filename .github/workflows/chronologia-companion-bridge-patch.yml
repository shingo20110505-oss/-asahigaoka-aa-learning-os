name: Chronologia Companion Bridge Patch

on:
  push:
    paths:
      - '.chronologia-companion-bridge-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch voice-expression bridge
        shell: python
        run: |
          from pathlib import Path
          p=Path('chronologia-daily-companion.js')
          s=p.read_text(encoding='utf-8')
          old="function playVoice(name,opt={}){\n  if(!opt.force&&!modeAllows(name))return false;"
          new="function playVoice(name,opt={}){\n  if(!opt.force&&!modeAllows(name))return false;\n  try{document.dispatchEvent(new CustomEvent('chronologia:voice',{detail:{name}}))}catch(e){}"
          if "chronologia:voice" not in s:
              if old not in s: raise SystemExit('playVoice anchor not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          q=Path('chronologia-live-companion.js')
          t=q.read_text(encoding='utf-8')
          anchor="async function init(){inject();observeAudio();await refreshImages();"
          repl="async function init(){inject();observeAudio();document.addEventListener('chronologia:voice',e=>{const name=e.detail?.name||'';setExpression(VOICE_EXPRESSION[name]||'normal',2600)});await refreshImages();"
          if "e.detail?.name" not in t:
              if anchor not in t: raise SystemExit('live init anchor not found')
              t=t.replace(anchor,repl,1)
              q.write_text(t,encoding='utf-8')
      - name: Commit bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chronologia-daily-companion.js chronologia-live-companion.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync companion expressions with local voice events"
          git push
