name: Rise management contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: management-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate management contract
        run: |
          set -euo pipefail
          node --check scripts/validate-management-contract.mjs
          node scripts/validate-management-contract.mjs
          node --check app/ui/rise-ui-v4.js
          node --check app/ui/rise-stable-root-v4.js
          node --check app/pwa/pwa-runtime.js
          node --check sw.js
          grep -q "version:'2.1.0'" app/ui/rise-stable-root-v4.js
          grep -q "firstLoad:'immediate-capture'" app/ui/rise-stable-root-v4.js
          grep -q 'captureAdded' app/ui/rise-stable-root-v4.js
          grep -q 'rise-stable-root-v4.js?v=2.1.0' index.html
          grep -q 'pwa-runtime.js?v=4.2.1' index.html
          test "$(grep -n 'rise-stable-root-v4.js?v=2.1.0' index.html | cut -d: -f1)" -lt "$(grep -n 'rise-ui-v4.js?v=4.2.0' index.html | tail -1 | cut -d: -f1)"
          grep -q "url('app/ui/rise-stable-root-v4.js')" sw.js
          grep -q "url('app/ui/rise-stable-root-v4.js?v=2.1.0')" sw.js
          grep -q "url('app/pwa/pwa-runtime.js?v=4.2.1')" sw.js
          grep -q "const RISE_BOOT='4.2.1'" app/pwa/pwa-runtime.js
          grep -q "rise:sw-updated" app/pwa/pwa-runtime.js
          grep -q 'firstload-2.1.0' sw.js
          ! grep -q 'client.navigate' sw.js
          ! grep -q 'refreshMainClients' sw.js
