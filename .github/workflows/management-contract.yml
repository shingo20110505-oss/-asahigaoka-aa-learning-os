name: Rise management contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: management-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate management contract
        run: |
          set -euo pipefail
          node --check scripts/validate-management-contract.mjs
          node scripts/validate-management-contract.mjs
          node --check app/ui/rise-ui-v4.js
          node --check app/ui/rise-stable-root-v4.js
          grep -q 'rise-stable-root-v4.js?v=1.0.0' index.html
          grep -q "url('app/ui/rise-stable-root-v4.js')" sw.js
          grep -q "url('app/ui/rise-stable-root-v4.js?v=1.0.0')" sw.js
