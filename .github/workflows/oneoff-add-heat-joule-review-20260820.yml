name: One-off add heat and joule review card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-add-heat-joule-review-20260820.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add heat and joule review card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('review-bank-v1.js')
          s = p.read_text(encoding='utf-8')
          item_id = 'sci-heat-joule-calorie-conversion-20260820'
          if s.count("id:'" + item_id + "'") != 0:
              raise SystemExit('new review id already exists')
          oldv = "window.AA_REVIEW_BANK_VERSION='1.0.35';"
          newv = "window.AA_REVIEW_BANK_VERSION='1.0.36';"
          if s.count(oldv) != 1:
              raise SystemExit('unexpected review version')
          marker = "\n];\nfunction normalize"
          if s.count(marker) != 1:
              raise SystemExit('review insertion marker missing or duplicated')
          item = "  {id:'sci-heat-joule-calorie-conversion-20260820',subject:'理科',unit:'熱量・電気エネルギー',title:'熱量：calとJの変換',question:'熱量の cal と J はどう変換する？ また、水が受け取る熱量と電気エネルギーの基本式は？',answer:'1 cal ≒ 4.2 J。J→cal は J÷4.2、cal→J は cal×4.2。水が受け取る熱量は「質量(g)×温度上昇(℃)」cal。電気エネルギーは「V×I×時間(s)」J（＝電力W×時間s）。',why:'1 cal は、水1 gの温度を約1℃上げるのに必要な熱量をもとにした単位で、約4.2 Jに相当します。電熱線で水を温める実験では、熱の損失を無視すれば、電気エネルギー[J]と水が受け取った熱量[cal]を 1 cal≒4.2 J で換算して比べられます。',examples:['3000 cal → 3000×4.2＝12600 J','12600 J → 12600÷4.2＝3000 cal','水100 gが3℃上昇 → 100×3＝300 cal','電圧6 V・電流2 A・10 s → 6×2×10＝120 J'],memory:'1 cal≒4.2 J／J→cal は÷4.2／cal→J は×4.2／水の熱量＝g×℃／電気エネルギー＝V×I×s',tags:['理科','熱量','ジュール','J','cal','カロリー','電気エネルギー','電力','入試'],createdAt:'2026-08-20'},"
          s = s.replace(marker, '\n' + item + marker, 1)
          s = s.replace(oldv, newv, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check review-bank-v1.js
          node scripts/validate-review-bank.mjs
          test "$(grep -c "id:'sci-heat-joule-calorie-conversion-20260820'" review-bank-v1.js)" -eq 1
          grep -q "1 cal≒4.2 J" review-bank-v1.js
          grep -q "AA_REVIEW_BANK_VERSION='1.0.36'" review-bank-v1.js

      - name: Commit review update and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-add-heat-joule-review-20260820.yml
          git add review-bank-v1.js
          git commit -m "Add heat and joule review card"
          git push origin main

      - name: Dispatch Pages deployment for updated main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -f ref=main
