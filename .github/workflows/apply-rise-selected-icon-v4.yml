name: Apply selected Rise icon v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rise-selected-icon-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render selected Rise artwork
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q cairosvg pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cairosvg, io, hashlib

          src=Path('icons/rise-icon-source-v4.svg').read_bytes()
          outputs=[
            (180,'icons/rise-apple-touch-icon-180-20260905-v4.png'),
            (192,'icons/rise-icon-192-20260905-v4.png'),
            (512,'icons/rise-icon-512-20260905-v4.png'),
            (512,'icons/rise-icon-maskable-512-20260905-v4.png'),
            (32,'icons/rise-favicon-32-20260905-v4.png'),
          ]
          for size,path in outputs:
              raw=cairosvg.svg2png(bytestring=src,output_width=size,output_height=size)
              im=Image.open(io.BytesIO(raw)).convert('RGB')
              im.save(path,'PNG',optimize=True,compress_level=9)
              check=Image.open(path)
              assert check.size==(size,size), (path,check.size)
              assert check.mode=='RGB', (path,check.mode)
              print(path,hashlib.sha256(Path(path).read_bytes()).hexdigest())
          PY

      - name: Wire v4 icon everywhere
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<link rel="manifest" href="\./manifest\.webmanifest\?v=[^"]+">',
                   '<link rel="manifest" href="./manifest.webmanifest?v=4.3.3">',s,count=1)
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>',
                   '<link rel="apple-touch-icon" sizes="180x180" href="./icons/rise-apple-touch-icon-180-20260905-v4.png">',s,count=1)
          s=re.sub(r'<link rel="icon" href="\./icons/[^"]+" type="image/svg\+xml" sizes="any">',
                   '<link rel="icon" href="./icons/rise-icon-source-v4.svg?v=4.0" type="image/svg+xml" sizes="any">',s,count=1)
          s=re.sub(r'<link rel="icon" type="image/png" sizes="32x32" href="\./icons/[^"]+">',
                   '<link rel="icon" type="image/png" sizes="32x32" href="./icons/rise-favicon-32-20260905-v4.png">',s,count=1)
          p.write_text(s)

          p=Path('manifest.webmanifest')
          m=json.loads(p.read_text())
          m['start_url']='./?rise=4.3.3'
          m['icons']=[
            {'src':'./icons/rise-icon-source-v4.svg','sizes':'any','type':'image/svg+xml','purpose':'any'},
            {'src':'./icons/rise-icon-192-20260905-v4.png','sizes':'192x192','type':'image/png','purpose':'any'},
            {'src':'./icons/rise-icon-512-20260905-v4.png','sizes':'512x512','type':'image/png','purpose':'any'},
            {'src':'./icons/rise-icon-maskable-512-20260905-v4.png','sizes':'512x512','type':'image/png','purpose':'maskable'},
          ]
          for item in m.get('shortcuts',[]):
              item['icons']=[{'src':'./icons/rise-icon-192-20260905-v4.png','sizes':'192x192','type':'image/png'}]
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')

          p=Path('sw.js'); s=p.read_text()
          if 'rise-icon-v4' not in s.split('\n',1)[0]:
              s=re.sub(r"const VERSION='([^']+)'",lambda m:f"const VERSION='{m.group(1)}-rise-icon-v4'",s,count=1)
          replacements={
            'icons/rise-apple-touch-icon-180-20260905-v3.png':'icons/rise-apple-touch-icon-180-20260905-v4.png',
            'icons/rise-icon-192-20260905-v3.png':'icons/rise-icon-192-20260905-v4.png',
            'icons/rise-icon-512-20260905-v3.png':'icons/rise-icon-512-20260905-v4.png',
            'icons/rise-icon-maskable-512-20260905-v3.png':'icons/rise-icon-maskable-512-20260905-v4.png',
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          marker="url('icons/rise-icon-512-20260905-v4.png')"
          if marker in s and "url('icons/rise-icon-source-v4.svg')" not in s:
              s=s.replace(marker,marker+",url('icons/rise-icon-source-v4.svg'),url('icons/rise-favicon-32-20260905-v4.png')",1)
          p.write_text(s)
          PY

      - name: Validate selected icon wiring
        run: |
          set -euo pipefail
          python3 -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
          grep -q 'rise-apple-touch-icon-180-20260905-v4.png' index.html
          grep -q 'rise-icon-source-v4.svg' index.html
          grep -q 'rise-icon-192-20260905-v4.png' manifest.webmanifest
          grep -q 'rise-icon-512-20260905-v4.png' manifest.webmanifest
          grep -q 'rise-icon-maskable-512-20260905-v4.png' manifest.webmanifest
          grep -q 'rise-icon-v4' sw.js

      - name: Commit selected Rise icon
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            icons/rise-icon-source-v4.svg \
            icons/rise-apple-touch-icon-180-20260905-v4.png \
            icons/rise-icon-192-20260905-v4.png \
            icons/rise-icon-512-20260905-v4.png \
            icons/rise-icon-maskable-512-20260905-v4.png \
            icons/rise-favicon-32-20260905-v4.png \
            index.html manifest.webmanifest sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Apply selected refined Rise icon v4'
          git pull --rebase origin main
          git push origin HEAD:main

# one-time trigger: selected-refined-R-20260905
