name: Deploy AA Learning OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify AA companion 6.5.1 before publish
        run: |
          node --check aa-companion-v2.js
          python - <<'PY'
          from pathlib import Path
          import re
          i=Path('index.html').read_text(encoding='utf-8')
          h=Path('chronologia.html').read_text(encoding='utf-8')
          d=Path('chronologia-daily-companion.js').read_text(encoding='utf-8')
          c=Path('aa-companion-v2.js').read_text(encoding='utf-8')
          s=Path('sw.js').read_text(encoding='utf-8')
          assert '<title>Chronologia 6.5' in h
          assert 'const VERSION = "6.5.1";' in h
          assert len(re.findall(r'<script\s+src="\./aa-companion-v2\.js\?v=6\.5\.1"></script>', i)) == 1
          assert len(re.findall(r'<script\s+src="\./aa-companion-v2\.js\?v=6\.5\.1"></script>', h)) == 1
          assert h.count('chronologia-daily-companion.js?v=6.5.1') == 1
          assert not re.search(r'<script\s+src="\./chronologia-live-companion\.js\?v=',h)
          assert "const DAILY_KEY='chronologia-daily-v2'" in d
          assert 'motion:lowPower ? .55 : 1' in c
          assert 'motion:lowPower?.55:1' not in c
          assert '01_normal.png' in c and '12_rare.png' in c
          assert 'chronologia-local-voice-v1' in c and 'chronologia-local-companion-v1' in c
          assert 'MutationObserver' in c and 'smartHide' in c and 'playVoice' in c
          assert 'aa-companion-v2.js' in s and 'c651' in s
          print('AA companion 6.5.1 publish guard PASS')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
