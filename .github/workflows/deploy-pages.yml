name: Deploy AA Learning OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify companion runtime before publish
        run: |
          node --check aa-companion-v2.js
          python - <<'PY'
          from pathlib import Path
          import re
          i=Path('index.html').read_text(encoding='utf-8')
          h=Path('chronologia.html').read_text(encoding='utf-8')
          c=Path('aa-companion-v2.js').read_text(encoding='utf-8')
          s=Path('sw.js').read_text(encoding='utf-8')
          pat=r'<script\s+src="\./aa-companion-v2\.js\?v=[^"]+"></script>'
          assert len(re.findall(pat,i)) == 1
          assert len(re.findall(pat,h)) == 1
          assert not re.search(r'<script\s+src="\./chronologia-live-companion\.js\?v=',h)
          assert 'motion:lowPower ? .55 : 1' in c
          assert 'motion:lowPower?.55:1' not in c
          assert '01_normal.png' in c and '12_rare.png' in c
          assert 'chronologia-local-voice-v1' in c and 'chronologia-local-companion-v1' in c
          assert 'MutationObserver' in c and 'smartHide' in c and 'playVoice' in c
          assert "new URL('aa-companion-v2.js', BASE).href" in s
          print('Companion runtime publish guard PASS')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
