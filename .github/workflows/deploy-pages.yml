name: Deploy AA Learning OS to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'PUBLIC_VERIFY_STATUS.txt'
      - 'DEPLOY_STATUS.txt'
      - 'PAGES_RUN_STATUS.txt'
      - 'PAGES_SOURCE_STATUS.txt'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact source commit
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Pages
        id: setup
        uses: actions/configure-pages@v5

      - name: Essential preflight
        id: preflight
        run: |
          set -euo pipefail
          for f in \
            aa-companion-v2.js \
            aa-companion-mobile-fix.js \
            mobile-layout-guard-v1.js \
            companion7-runtime.js \
            login-companion-v1.js \
            login-production-test-v1.js \
            settings-improvements-v1.js \
            review-bank-v1.js \
            review-page-v1.js \
            storage-resilience-v1.js \
            answer-feedback-audio-v1.js \
            v23-loader.js \
            vocab-mobile-card-fix-v1.js \
            quality-repair-v1.js \
            quality-ci-runner-v1.js \
            sw.js; do
            node --check "$f"
          done

          node scripts/validate-review-bank.mjs
          node scripts/validate-review-ui.mjs
          node scripts/validate-runtime-assets.mjs

          grep -q 'AA_REVIEW_BANK_VERSION=' review-bank-v1.js
          grep -q "a.href='./review/'" aa-companion-v2.js
          grep -q 'mobile-layout-guard-v1.js' aa-companion-mobile-fix.js
          grep -q 'body>.nav' mobile-layout-guard-v1.js
          grep -q "document.body.appendChild(fresh)" mobile-layout-guard-v1.js
          grep -q 'ZIPからまとめてインストール' login-companion-v1.js
          grep -q 'setLoginVoices' companion7-runtime.js
          grep -q 'setExplosionVoice' companion7-runtime.js
          grep -q 'quality-repair-v1.js' v23-loader.js
          grep -q 'quality-ci-runner-v1.js' v23-loader.js
          grep -q 'vocab-mobile-card-fix-v1.js' v23-loader.js
          grep -q 'data-aa-vocab-mobile-card-fix' vocab-mobile-card-fix-v1.js
          grep -q 'window.__AA_QUALITY_REPAIR_V1__' quality-repair-v1.js
          grep -q '筆者の中心的な主張' quality-repair-v1.js
          grep -q 'aa_quality_ci' quality-ci-runner-v1.js
          grep -q "const VERSION='" sw.js
          grep -q "url('mobile-layout-guard-v1.js')" sw.js
          grep -q "url('quality-repair-v1.js')" sw.js
          grep -q "url('quality-ci-runner-v1.js')" sw.js
          test -f review/index.html
          test -f diagnostics.html

      - name: Add release marker
        id: release
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          REVIEW_VERSION=$(grep -o "AA_REVIEW_BANK_VERSION='[^']*'" review-bank-v1.js | head -1 | cut -d"'" -f2)
          REVIEW_COUNT=$(node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s={window:{}}; vm.createContext(s);
          vm.runInContext(fs.readFileSync('review-bank-v1.js','utf8'),s);
          process.stdout.write(String((s.window.AA_REVIEW_BANK||[]).length));
          NODE
          )
          REVIEW_SHA256=$(sha256sum review-bank-v1.js | awk '{print $1}')
          SW_VERSION=$(grep -o "const VERSION='[^']*'" sw.js | head -1 | cut -d"'" -f2)
          LAYOUT_SHA256=$(sha256sum mobile-layout-guard-v1.js | awk '{print $1}')
          QUALITY_REPAIR_SHA256=$(sha256sum quality-repair-v1.js | awk '{print $1}')
          QUALITY_CI_SHA256=$(sha256sum quality-ci-runner-v1.js | awk '{print $1}')
          cat > release.json <<EOF
          {
            "sourceBranch": "main",
            "sourceSha": "${SOURCE_SHA}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "reviewVersion": "${REVIEW_VERSION}",
            "reviewCount": ${REVIEW_COUNT},
            "reviewSha256": "${REVIEW_SHA256}",
            "serviceWorkerVersion": "${SW_VERSION}",
            "mobileLayoutGuardSha256": "${LAYOUT_SHA256}",
            "qualityRepairSha256": "${QUALITY_REPAIR_SHA256}",
            "qualityCiSha256": "${QUALITY_CI_SHA256}",
            "management": "validated-main-direct-to-pages"
          }
          EOF
          touch .nojekyll

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify actual public site
        id: verify
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}/"
          stage(){ printf '%s\n' "$1" > "$RUNNER_TEMP/public-verify-stage"; echo "VERIFY_STAGE=$1"; }
          EXPECTED_REVIEW_VERSION=$(grep -o "AA_REVIEW_BANK_VERSION='[^']*'" review-bank-v1.js | head -1 | cut -d"'" -f2)
          EXPECTED_REVIEW_COUNT=$(node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s={window:{}}; vm.createContext(s);
          vm.runInContext(fs.readFileSync('review-bank-v1.js','utf8'),s);
          process.stdout.write(String((s.window.AA_REVIEW_BANK||[]).length));
          NODE
          )
          EXPECTED_REVIEW_SHA256=$(sha256sum review-bank-v1.js | awk '{print $1}')
          EXPECTED_SW_VERSION=$(grep -o "const VERSION='[^']*'" sw.js | head -1 | cut -d"'" -f2)
          EXPECTED_LAYOUT_SHA256=$(sha256sum mobile-layout-guard-v1.js | awk '{print $1}')
          EXPECTED_QUALITY_REPAIR_SHA256=$(sha256sum quality-repair-v1.js | awk '{print $1}')
          EXPECTED_QUALITY_CI_SHA256=$(sha256sum quality-ci-runner-v1.js | awk '{print $1}')

          stage release-json-await
          ok=0
          for n in $(seq 1 24); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${BASE}release.json?verify=${SOURCE_SHA}-${n}" -o /tmp/release.json && grep -q "${SOURCE_SHA}" /tmp/release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

          stage release-json-fields
          grep -q "\"reviewVersion\": \"${EXPECTED_REVIEW_VERSION}\"" /tmp/release.json
          grep -q "\"reviewCount\": ${EXPECTED_REVIEW_COUNT}" /tmp/release.json
          grep -q "\"reviewSha256\": \"${EXPECTED_REVIEW_SHA256}\"" /tmp/release.json
          grep -q "\"serviceWorkerVersion\": \"${EXPECTED_SW_VERSION}\"" /tmp/release.json
          grep -q "\"mobileLayoutGuardSha256\": \"${EXPECTED_LAYOUT_SHA256}\"" /tmp/release.json
          grep -q "\"qualityRepairSha256\": \"${EXPECTED_QUALITY_REPAIR_SHA256}\"" /tmp/release.json
          grep -q "\"qualityCiSha256\": \"${EXPECTED_QUALITY_CI_SHA256}\"" /tmp/release.json

          stage review-ui
          curl -fsSL "${BASE}review/?verify=${SOURCE_SHA}" -o /tmp/review.html
          grep -q 'Review v2' /tmp/review.html
          grep -q "fetch('../review-bank-v1.js'" /tmp/review.html

          stage review-bank
          curl -fsSL "${BASE}review-bank-v1.js?verify=${SOURCE_SHA}" -o /tmp/review-bank.js
          ACTUAL_REVIEW_SHA256=$(sha256sum /tmp/review-bank.js | awk '{print $1}')
          test "$ACTUAL_REVIEW_SHA256" = "$EXPECTED_REVIEW_SHA256"

          stage mobile-layout
          curl -fsSL "${BASE}aa-companion-mobile-fix.js?verify=${SOURCE_SHA}" -o /tmp/mobile-fix.js
          grep -q 'mobile-layout-guard-v1.js' /tmp/mobile-fix.js
          curl -fsSL "${BASE}mobile-layout-guard-v1.js?verify=${SOURCE_SHA}" -o /tmp/layout-guard.js
          ACTUAL_LAYOUT_SHA256=$(sha256sum /tmp/layout-guard.js | awk '{print $1}')
          test "$ACTUAL_LAYOUT_SHA256" = "$EXPECTED_LAYOUT_SHA256"
          grep -q 'body>.nav' /tmp/layout-guard.js
          grep -q 'document.body.appendChild(fresh)' /tmp/layout-guard.js

          stage quality-repair
          curl -fsSL "${BASE}quality-repair-v1.js?verify=${SOURCE_SHA}" -o /tmp/quality-repair.js
          ACTUAL_QUALITY_REPAIR_SHA256=$(sha256sum /tmp/quality-repair.js | awk '{print $1}')
          test "$ACTUAL_QUALITY_REPAIR_SHA256" = "$EXPECTED_QUALITY_REPAIR_SHA256"
          grep -q 'window.__AA_QUALITY_REPAIR_V1__' /tmp/quality-repair.js
          grep -q 'function buildCloze' /tmp/quality-repair.js
          grep -q '筆者の中心的な主張' /tmp/quality-repair.js
          curl -fsSL "${BASE}quality-ci-runner-v1.js?verify=${SOURCE_SHA}" -o /tmp/quality-ci.js
          ACTUAL_QUALITY_CI_SHA256=$(sha256sum /tmp/quality-ci.js | awk '{print $1}')
          test "$ACTUAL_QUALITY_CI_SHA256" = "$EXPECTED_QUALITY_CI_SHA256"
          curl -fsSL "${BASE}v23-loader.js?verify=${SOURCE_SHA}" -o /tmp/v23-loader.js
          grep -q 'quality-repair-v1.js' /tmp/v23-loader.js
          grep -q 'quality-ci-runner-v1.js' /tmp/v23-loader.js
          grep -q 'vocab-mobile-card-fix-v1.js' /tmp/v23-loader.js

          stage login-image
          curl -fsSL "${BASE}login-companion-v1.js?verify=${SOURCE_SHA}" -o /tmp/login-image.js
          grep -q 'ZIPからまとめてインストール' /tmp/login-image.js
          grep -q 'showDailyVisual' /tmp/login-image.js

          stage login-voice
          curl -fsSL "${BASE}companion7-runtime.js?verify=${SOURCE_SHA}" -o /tmp/login-voice.js
          grep -q 'setLoginVoices' /tmp/login-voice.js
          grep -q 'setExplosionVoice' /tmp/login-voice.js
          grep -q 'dailyPending' /tmp/login-voice.js

          stage service-worker
          curl -fsSL "${BASE}sw.js?verify=${SOURCE_SHA}" -o /tmp/sw.js
          grep -q "const VERSION='${EXPECTED_SW_VERSION}'" /tmp/sw.js
          grep -q "url('mobile-layout-guard-v1.js')" /tmp/sw.js
          grep -q "url('quality-repair-v1.js')" /tmp/sw.js
          grep -q "url('quality-ci-runner-v1.js')" /tmp/sw.js
          grep -q 'networkFirst' /tmp/sw.js

          stage quality-runtime
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          rm -rf "/tmp/aa-quality-chrome-${SOURCE_SHA}"
          timeout 120s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir="/tmp/aa-quality-chrome-${SOURCE_SHA}" \
            --virtual-time-budget=60000 \
            --dump-dom "${BASE}?aa_quality_ci=1&verify=${SOURCE_SHA}" > /tmp/quality-runtime.html
          grep -o 'AA_QUALITY_CI=[^<]*' /tmp/quality-runtime.html || true
          grep -q 'data-aa-quality-ci="PASS"' /tmp/quality-runtime.html
          grep -q '英単語穴埋め・答え露出防止' /tmp/quality-runtime.html
          grep -q '段階学習プラン' /tmp/quality-runtime.html
          grep -q '長文生成・文法ゲート 36本' /tmp/quality-runtime.html
          grep -q '専用誤答タイプ' /tmp/quality-runtime.html
          grep -q '数学公式暗記限定' /tmp/quality-runtime.html
          grep -q '長文タイプを出題へ反映' /tmp/quality-runtime.html
          echo 'quality_runtime=success' >> "$GITHUB_OUTPUT"

          stage vocab-mobile-runtime
          rm -rf "/tmp/aa-vocab-mobile-${SOURCE_SHA}"
          timeout 120s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --user-data-dir="/tmp/aa-vocab-mobile-${SOURCE_SHA}" \
            --virtual-time-budget=60000 \
            --dump-dom "${BASE}vocab.html?verify=${SOURCE_SHA}" > /tmp/vocab-mobile-runtime.html
          grep -q 'data-aa-vocab-mobile-card-fix="v1.1"' /tmp/vocab-mobile-runtime.html
          grep -q 'data-aa-vocab-mobile-layout="PASS"' /tmp/vocab-mobile-runtime.html
          grep -q 'data-aa-vocab-rendered-rows="40"' /tmp/vocab-mobile-runtime.html
          echo 'vocab_mobile_runtime=success' >> "$GITHUB_OUTPUT"

          stage diagnostics
          curl -fsSL "${BASE}diagnostics.html?verify=${SOURCE_SHA}" -o /tmp/diagnostics.html
          grep -q '旭丘AA OS 診断' /tmp/diagnostics.html
          grep -q 'ログイン画像' /tmp/diagnostics.html
          grep -q 'ログインボイス' /tmp/diagnostics.html

          stage complete

      - name: Record verified public release
        id: verified_record
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
          QUALITY_RUNTIME: ${{ steps.verify.outputs.quality_runtime }}
          VOCAB_MOBILE_RUNTIME: ${{ steps.verify.outputs.vocab_mobile_runtime }}
        run: |
          REVIEW_VERSION=$(grep -o "AA_REVIEW_BANK_VERSION='[^']*'" review-bank-v1.js | head -1 | cut -d"'" -f2)
          REVIEW_COUNT=$(node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s={window:{}}; vm.createContext(s);
          vm.runInContext(fs.readFileSync('review-bank-v1.js','utf8'),s);
          process.stdout.write(String((s.window.AA_REVIEW_BANK||[]).length));
          NODE
          )
          REVIEW_SHA256=$(sha256sum review-bank-v1.js | awk '{print $1}')
          SW_VERSION=$(grep -o "const VERSION='[^']*'" sw.js | head -1 | cut -d"'" -f2)
          LAYOUT_SHA256=$(sha256sum mobile-layout-guard-v1.js | awk '{print $1}')
          QUALITY_REPAIR_SHA256=$(sha256sum quality-repair-v1.js | awk '{print $1}')
          QUALITY_CI_SHA256=$(sha256sum quality-ci-runner-v1.js | awk '{print $1}')
          git fetch origin main
          git checkout -B main origin/main
          cat > PUBLIC_VERIFY_STATUS.txt <<EOF
          result=success
          source_sha=${SOURCE_SHA}
          page_url=${PAGE_URL}
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          review_version=${REVIEW_VERSION}
          review_count=${REVIEW_COUNT}
          review_sha256=${REVIEW_SHA256}
          service_worker_version=${SW_VERSION}
          mobile_layout_guard_sha256=${LAYOUT_SHA256}
          quality_repair_sha256=${QUALITY_REPAIR_SHA256}
          quality_ci_sha256=${QUALITY_CI_SHA256}
          quality_runtime=${QUALITY_RUNTIME}
          vocab_mobile_runtime=${VOCAB_MOBILE_RUNTIME}
          checks=public-release,review-v2,review-bank-exact-hash,mobile-layout-exact-hash,quality-repair-exact-hash,quality-browser-runtime,vocab-mobile-runtime,login-image,login-voice,service-worker,diagnostics
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PUBLIC_VERIFY_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record verified public Pages release"
            git push origin main
          fi

      - name: Record deployment outcome
        if: always() && steps.checkout.outcome == 'success'
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFIED_RECORD_OUTCOME: ${{ steps.verified_record.outcome }}
        run: |
          VERIFY_STAGE=$(cat "$RUNNER_TEMP/public-verify-stage" 2>/dev/null || echo not-started)
          git fetch origin main
          git checkout -B main origin/main
          cat > DEPLOY_STATUS.txt <<EOF
          source_sha=${SOURCE_SHA}
          page_url=${PAGE_URL}
          checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          setup=${SETUP_OUTCOME}
          preflight=${PREFLIGHT_OUTCOME}
          release_marker=${RELEASE_OUTCOME}
          upload=${UPLOAD_OUTCOME}
          deploy=${DEPLOY_OUTCOME}
          public_verify=${VERIFY_OUTCOME}
          public_verify_stage=${VERIFY_STAGE}
          verified_record=${VERIFIED_RECORD_OUTCOME}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOY_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Pages deployment outcome"
            git push origin main
          fi