name: Deploy AA Learning OS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate Review v2
        run: |
          node scripts/validate-review-bank.mjs
          node scripts/validate-review-ui.mjs

      - name: Validate login voice, images and runtime wiring
        run: node scripts/validate-runtime-assets.mjs

      - name: Syntax-check critical runtime JavaScript
        run: |
          for f in \
            aa-companion-v2.js \
            aa-companion-mobile-fix.js \
            companion7-runtime.js \
            login-companion-v1.js \
            login-production-test-v1.js \
            settings-improvements-v1.js \
            review-bank-v1.js \
            review-page-v1.js \
            storage-resilience-v1.js \
            answer-feedback-audio-v1.js \
            sw.js; do
            node --check "$f"
          done

      - name: Run learning-content regression audits
        run: |
          node scripts/content-v24-audit.js > /tmp/content-v24-audit.txt
          cat /tmp/content-v24-audit.txt
          grep -q '"pass":true' /tmp/content-v24-audit.txt

          node scripts/reading-1000-audit.js > /tmp/reading-1000-audit.txt
          cat /tmp/reading-1000-audit.txt
          grep -q 'READING_1000_VERDICT PASS' /tmp/reading-1000-audit.txt

          node scripts/difficulty-5subject-audit.js > /tmp/difficulty-5subject-audit.txt
          cat /tmp/difficulty-5subject-audit.txt
          grep -q '"pass":true' /tmp/difficulty-5subject-audit.txt

      - name: Build immutable Pages artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='scripts/' \
            --exclude='*.md' \
            --exclude='PAGES_RUN_STATUS.txt' \
            --exclude='PAGES_SOURCE_STATUS.txt'
          touch _site/.nojekyll

          REVIEW_VERSION=$(grep -o "AA_REVIEW_BANK_VERSION='[^']*'" review-bank-v1.js | head -1 | cut -d"'" -f2)
          REVIEW_COUNT=$(node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s={window:{}}; vm.createContext(s);
          vm.runInContext(fs.readFileSync('review-bank-v1.js','utf8'),s);
          process.stdout.write(String((s.window.AA_REVIEW_BANK||[]).length));
          NODE
          )
          SW_VERSION=$(grep -o "const VERSION='[^']*'" sw.js | head -1 | cut -d"'" -f2)
          PUBLISHED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > _site/release.json <<EOF
          {
            "sourceBranch": "main",
            "sourceSha": "${SOURCE_SHA}",
            "publishedAt": "${PUBLISHED_AT}",
            "reviewVersion": "${REVIEW_VERSION}",
            "reviewCount": ${REVIEW_COUNT},
            "serviceWorkerVersion": "${SW_VERSION}",
            "management": "validated-main-direct-to-pages"
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
