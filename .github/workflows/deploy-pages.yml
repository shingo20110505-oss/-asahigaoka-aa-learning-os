name: Deploy AA Learning OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify AA companion 6.5 before publish
        shell: python
        run: |
          from pathlib import Path
          i=Path('index.html').read_text(encoding='utf-8')
          h=Path('chronologia.html').read_text(encoding='utf-8')
          d=Path('chronologia-daily-companion.js').read_text(encoding='utf-8')
          c=Path('aa-companion-v2.js').read_text(encoding='utf-8')
          s=Path('sw.js').read_text(encoding='utf-8')
          assert '<title>Chronologia 6.5' in h
          assert 'const VERSION = "6.5.0";' in h
          assert i.count('aa-companion-v2.js?v=6.5.0') == 1
          assert h.count('aa-companion-v2.js?v=6.5.0') == 1
          assert h.count('chronologia-daily-companion.js?v=6.5.0') == 1
          assert 'chronologia-live-companion.js?v=' not in h
          assert "const DAILY_KEY='chronologia-daily-v2'" in d
          assert "const VERSION='6.5.0'" in c
          assert '01_normal.png' in c and '12_rare.png' in c
          assert 'chronologia-local-voice-v1' in c and 'chronologia-local-companion-v1' in c
          assert 'MutationObserver' in c and 'smartHide' in c and 'playVoice' in c
          assert 'aa-companion-v2.js' in s and 'c650' in s
          print('AA companion 6.5 publish guard PASS')

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
