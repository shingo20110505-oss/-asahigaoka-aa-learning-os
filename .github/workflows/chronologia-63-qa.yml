name: Chronologia 6.3 Integration QA

on:
  push:
    paths:
      - 'chronologia.html'
      - 'chronologia-daily-companion.js'
      - 'chronologia-live-companion.js'
      - 'chronologia-force1000-v1.js'
      - 'learning-engine-v22.js'
      - 'sw.js'
      - '.github/workflows/chronologia-63-qa.yml'
      - '.chronologia-63-qa-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check chronologia-daily-companion.js
          node --check chronologia-live-companion.js
          node --check chronologia-force1000-v1.js
          node --check sw.js

      - name: Chronologia and PWA invariants
        shell: python
        run: |
          from pathlib import Path
          h=Path('chronologia.html').read_text(encoding='utf-8')
          m=Path('learning-engine-v22.js').read_text(encoding='utf-8')
          d=Path('chronologia-daily-companion.js').read_text(encoding='utf-8')
          l=Path('chronologia-live-companion.js').read_text(encoding='utf-8')
          f=Path('chronologia-force1000-v1.js').read_text(encoding='utf-8')
          s=Path('sw.js').read_text(encoding='utf-8')
          checks={
            'Chronologia 6.3.1 page':'const VERSION = "6.3.1";' in h,
            'Chronologia 1000 card':'1000件の統合年表' in m and '385件の統合年表' not in m,
            'force1000 loader once':h.count('chronologia-force1000-v1.js?v=20260812a')==1,
            'force1000 final pack':"if(current>=1000)" in f and 'chronologia-curated-901-1000.js' in f,
            'daily voice bridge':"new CustomEvent('chronologia:voice'" in d,
            'live expression bridge':"document.addEventListener('chronologia:voice'" in l,
            'PWA chronology':"url('chronologia.html')" in s and "url('chronologia-curated-901-1000.js')" in s,
            'PWA quality repair':"url('quality-repair-v1.js')" in s,
            'managed cache generation':"quality-chronologia1000" in s,
          }
          for name,ok in checks.items(): print(('PASS' if ok else 'FAIL'),name)
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('Failed: '+', '.join(failed))
