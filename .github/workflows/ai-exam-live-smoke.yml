name: AI exam live smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-exam-live-smoke.yml'
      - 'worker/src/providers/gemini.mjs'
      - 'worker/src/exam-platform-hardened.mjs'
      - 'worker/src/entry-hardened.mjs'
      - 'worker/wrangler.toml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Call public production exam endpoint for all 3 subjects
        shell: bash
        run: |
          set -u
          BASE='https://asahigaoka-aa-ai-reading.shingo-20110505.workers.dev'
          ORIGIN='https://shingo20110505-oss.github.io'
          overall=0
          for subject in math science social; do
            echo "=== SUBJECT=${subject} ==="
            code="$(curl -sS --connect-timeout 10 --max-time 210 -o "/tmp/${subject}.json" -w '%{http_code}' \
              -X POST "${BASE}/v1/exam" \
              -H "Origin: ${ORIGIN}" \
              -H 'Content-Type: application/json' \
              --data "{\"schemaVersion\":2,\"subject\":\"${subject}\",\"count\":3,\"difficulty\":8,\"skill\":\"aichi.exam.application\",\"focus\":[],\"recentQuestionIds\":[]}" || true)"
            echo "HTTP=${code}"
            if [ "$code" = '200' ]; then
              SUBJECT="$subject" node - <<'NODE'
          const fs=require('fs');
          const subject=process.env.SUBJECT;
          const p=JSON.parse(fs.readFileSync(`/tmp/${subject}.json`,'utf8'));
          const items=Array.isArray(p.items)?p.items:[];
          const ok=p.schemaVersion===1 && p.subject===subject && p.quality?.verified===true && items.length>0 && items.every(x=>x?.quality?.verified===true && x?.quality?.generationProvider==='gemini' && x?.quality?.verificationProvider==='groq');
          if(!ok){console.error(`LIVE_${subject.toUpperCase()}=INVALID`);process.exit(1)}
          console.log(`LIVE_${subject.toUpperCase()}=PASS delivered=${items.length} requested=${p.requestedCount} partial=${Boolean(p.partial)} model=${items[0]?.quality?.generationModel||'-'}`);
          NODE
              if [ "$?" != '0' ]; then overall=1; fi
            else
              cat "/tmp/${subject}.json" || true
              echo
              overall=1
            fi
          done
          exit "$overall"
