name: AI exam live smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-exam-live-smoke.yml'
      - 'worker/src/providers/gemini.mjs'
      - 'worker/src/exam-platform-hardened.mjs'
      - 'worker/src/entry-hardened.mjs'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose exact Gemini exam schema
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { callGeminiJson } from './worker/src/providers/gemini.mjs';
          import { HARDENED_EXAM_GENERATION_SCHEMA } from './worker/src/exam-platform-hardened.mjs';
          try {
            const result = await callGeminiJson(process.env, {
              input: 'Create exactly one original junior-high mathematics four-choice item. Return only schema JSON.',
              schema: HARDENED_EXAM_GENERATION_SCHEMA,
              schemaName: 'rise_math_exam_hardened_v2',
              maxOutputTokens: 3000,
              thinkingLevel: 'low'
            });
            console.log('GEMINI_EXAM_SCHEMA=PASS mode='+result.mode);
          } catch (error) {
            console.log('GEMINI_EXAM_SCHEMA=FAIL');
            console.log('code='+String(error?.code||''));
            console.log('status='+String(error?.status||''));
            console.log('message='+String(error?.message||'').replace(/\s+/g,' ').slice(0,1200));
            console.log('diagnostic='+String(error?.diagnostic||''));
            process.exitCode=1;
          }
          NODE

      - name: Call public production exam endpoint for all 3 subjects
        shell: bash
        run: |
          set -u
          BASE='https://asahigaoka-aa-ai-reading.shingo-20110505.workers.dev'
          overall=0
          for subject in math science social; do
            echo "=== SUBJECT=${subject} ==="
            code="$(curl -sS --connect-timeout 10 --max-time 210 -o "/tmp/${subject}.json" -w '%{http_code}' \
              -X POST "${BASE}/v1/exam" \
              -H 'Origin: https://shingo20110505-oss.github.io' \
              -H 'Content-Type: application/json' \
              --data "{\"schemaVersion\":2,\"subject\":\"${subject}\",\"count\":1,\"difficulty\":8,\"skill\":\"aichi.exam.application\",\"focus\":[],\"recentQuestionIds\":[]}" || true)"
            echo "HTTP=${code}"
            cat "/tmp/${subject}.json" || true
            echo
            if [ "$code" != '200' ]; then overall=1; fi
          done
          exit "$overall"
