name: Verify Kokugo Quiz Category on Pages

on:
  push:
    paths:
      - '.kokugo-quiz-public-verify-trigger*'
      - '.github/workflows/verify-kokugo-quiz-public.yml'
      - 'scripts/verify-kokugo-quiz-public.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-kokugo-quiz-public
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch production Kokugo assets
        id: fetch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/kokugo-chronologia'
          mkdir -p /tmp/kokugo-public
          fetch_retry() {
            local url="$1" out="$2"
            for i in $(seq 1 18); do
              if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "${url}?verify=$(date +%s)-${i}" -o "$out"; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          for f in DATA_CATEGORY_AUDIT.json data.jsonl quiz-rank-select-v1.js taxonomy-quarantine-v1.json; do
            fetch_retry "$BASE/$f" "/tmp/kokugo-public/$f"
          done

      - name: Verify production category integrity
        id: verify
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: python scripts/verify-kokugo-quiz-public.py

      - name: Record fetch failure
        if: steps.fetch.outcome != 'success'
        shell: bash
        run: |
          mkdir -p kokugo-chronologia
          printf '%s\n' '{"result":"failure","reason":"production fetch failed"}' > kokugo-chronologia/PUBLIC_CATEGORY_VERIFY_STATUS.json

      - name: Commit verification record
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kokugo-chronologia/PUBLIC_CATEGORY_VERIFY_STATUS.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Kokugo quiz public category verification'
          for i in 1 2 3 4; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i*2))
          done
          exit 1

      - name: Enforce verification success
        if: always()
        shell: bash
        run: |
          test "${{ steps.fetch.outcome }}" = 'success'
          test "${{ steps.verify.outcome }}" = 'success'
