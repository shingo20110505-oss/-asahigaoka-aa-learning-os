name: Force GitHub Pages Source

on:
  push:
    paths:
      - '.force-pages-source-trigger'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  force-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point GitHub Pages to gh-pages root and record result
        id: force
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          PUT_STATUS=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          GET_STATUS=$(curl -sS -o /tmp/pages-get.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages")
          {
            echo "PUT_HTTP=${PUT_STATUS}"
            echo "GET_HTTP=${GET_STATUS}"
            echo "--- PUT RESPONSE ---"
            cat /tmp/pages-put.json 2>/dev/null || true
            echo
            echo "--- GET RESPONSE ---"
            cat /tmp/pages-get.json 2>/dev/null || true
            echo
          } > PAGES_SOURCE_STATUS.txt
          if [ "$PUT_STATUS" = "204" ] || [ "$PUT_STATUS" = "200" ]; then
            exit 0
          fi
          exit 1

      - name: Commit Pages status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAGES_SOURCE_STATUS.txt
          if git diff --cached --quiet; then
            echo "No status change"
          else
            git commit -m "Record GitHub Pages source status"
            git push
          fi

      - name: Fail if Pages source switch failed
        if: steps.force.outcome == 'failure'
        run: exit 1
