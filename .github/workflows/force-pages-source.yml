name: Force GitHub Pages Source

on:
  push:
    paths:
      - '.force-pages-source-trigger'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  force-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Point GitHub Pages to gh-pages root
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          cat /tmp/pages.json || true
          if [ "$status" != "204" ] && [ "$status" != "200" ]; then
            echo "Pages source update failed with HTTP $status"
            exit 1
          fi

      - name: Verify Pages source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" | tee /tmp/page-info.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/page-info.json'))
          src=x.get('source') or {}
          assert src.get('branch')=='gh-pages', src
          assert src.get('path')=='/', src
          print('PASS: GitHub Pages source = gh-pages /')
          PY
