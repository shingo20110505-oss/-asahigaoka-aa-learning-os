name: Prepare Kokugo Direct Translation
on:
  push:
    paths:
      - '.prepare-kokugo-direct-translation-trigger-2'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Prepare source chunks and overrides
        run: python3 .github/scripts/prepare_kokugo_direct_translation.py
      - name: Commit preparation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/translation-source kokugo-chronologia/meaning-ja-overrides.json kokugo-chronologia/meaning-ja-overrides.js kokugo-chronologia/meaning-ja-status.json kokugo-chronologia/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare Kokugo direct Japanese translation batches'
          git push origin HEAD:main
