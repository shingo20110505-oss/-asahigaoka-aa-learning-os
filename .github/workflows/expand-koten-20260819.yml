                      ch,ans=choices(desc,r_pool,seq+v)
                      lv,df=levels[(ri+v)%3]
                      items.append(dict(id=f'koten_{seq:03d}',subject='国語',area='古文',era=eras[(ri+1)%3],work='',category='和歌修辞',term=term,level=lv,difficulty=df,type='choice4',stem=r_stems[v].format(t=term),choices=ch,answer=ans,explanation=f'「{term}」は、{desc}。名称だけでなく、本文中でどの語が働いているかまで確認する。',tags=['古文','和歌修辞',df],source='アプリ内オリジナル問題（2026-08古文増補）'))
                      seq+=1

              # 13 reading skills x 5 = 65
              rd_pool=[x[1] for x in reading]+['現代語と同じ意味だと決めつける','人物名がなければ主語を考えない','文末だけを見て判断する','敬語はすべて聞き手への敬意と考える']
              rd_stems=['古文読解で「{t}」を処理する方法として適切なものを選べ。','「{t}」について、入試読解で有効な考え方はどれか。','古文の「{t}」で誤読を防ぐための基本として正しいものを選べ。','「{t}」を読むときに優先して確認することとして適切なものを選べ。','次のうち「{t}」の読解法として最も適切なものを選べ。']
              for ri,(term,desc) in enumerate(reading):
                  for v in range(5):
                      ch,ans=choices(desc,rd_pool,seq+v)
                      lv,df=levels[(ri+v)%3]
                      items.append(dict(id=f'koten_{seq:03d}',subject='国語',area='古文',era=eras[(ri+v)%3],work='',category='読解',term=term,level=lv,difficulty=df,type='choice4',stem=rd_stems[v].format(t=term),choices=ch,answer=ans,explanation=f'読解の基本：{desc}。設問では本文中の形・敬語・接続関係など、根拠を示せる読み方を優先する。',tags=['古文','読解',df],source='アプリ内オリジナル問題（2026-08古文増補）'))
                      seq+=1

              assert len(items)==700, len(items)
              assert seq==1401, seq
              assert len({x['id'] for x in items})==700
              OUT.write_text('window.AA_KOTEN_KANBUN_PAYLOAD_CHUNK_5='+json.dumps(items,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')

              # Add chunk 5 to the runtime concatenation without replacing existing data.
              ext = ROOT / 'koten-kanbun-extension.js'
              s = ext.read_text(encoding='utf-8')
              if 'AA_KOTEN_KANBUN_PAYLOAD_CHUNK_5' not in s:
                  needle = 'window.AA_KOTEN_KANBUN_PAYLOAD_CHUNK_4||[]'
                  if needle not in s:
                      raise SystemExit('Could not locate chunk 4 concatenation in extension loader')
                  s = s.replace(needle, needle + ',window.AA_KOTEN_KANBUN_PAYLOAD_CHUNK_5||[]', 1)
              s = s.replace('koten-kanbun-1000-20260213','koten-kanbun-1700-20260819')
              ext.write_text(s,encoding='utf-8')

              # Load bank 5 before the extension in every HTML page that loads bank 4.
              html_patched=0
              for hp in ROOT.rglob('*.html'):
                  hs=hp.read_text(encoding='utf-8')
                  if 'koten-kanbun-bank-4.js' in hs and 'koten-kanbun-extension.js' in hs and 'koten-kanbun-bank-5.js' not in hs:
                      lines=hs.splitlines(True)
                      out=[]
                      inserted=False
                      for line in lines:
                          if (not inserted) and 'koten-kanbun-extension.js' in line:
                              indent=line[:len(line)-len(line.lstrip())]
                              m=re.search(r'src=["\']([^"\']*koten-kanbun-extension\.js[^"\']*)["\']',line)
                              if not m: raise SystemExit(f'Cannot parse extension script tag in {hp}')
                              src=m.group(1)
                              base=src.rsplit('/',1)[0]+'/' if '/' in src else ''
                              out.append(f'{indent}<script src="{base}koten-kanbun-bank-5.js?v=20260819"></script>\n')
                              inserted=True
                          out.append(line)
                      if not inserted: raise SystemExit(f'Could not insert bank5 script in {hp}')
                      hp.write_text(''.join(out),encoding='utf-8')
                      html_patched+=1
              if html_patched==0:
                  # It may already have been inserted by a prior idempotent run.
                  found=any('koten-kanbun-bank-5.js' in p.read_text(encoding='utf-8') for p in ROOT.rglob('*.html'))
                  if not found: raise SystemExit('No HTML loader for bank5 was patched or found')

              # Keep offline cache lists in sync when they explicitly enumerate bank 4.
              for sp in list(ROOT.rglob('service-worker*.js')) + list(ROOT.rglob('sw.js')):
                  ss=sp.read_text(encoding='utf-8')
                  if 'koten-kanbun-bank-4.js' in ss and 'koten-kanbun-bank-5.js' not in ss:
                      ss=ss.replace('koten-kanbun-bank-4.js', 'koten-kanbun-bank-4.js')
                      # Add immediately after a quoted bank4 entry, preserving quote style where possible.
                      ss=re.sub(r'(["\'][^"\']*koten-kanbun-bank-4\.js[^"\']*["\']\s*,?)', lambda m: m.group(1) + '\n  "./koten-kanbun-bank-5.js?v=20260819",', ss, count=1)
                      sp.write_text(ss,encoding='utf-8')

          # Validate the effective source data after generation/patching.
          all_ids=[]
          for p in sorted(ROOT.glob('koten-kanbun-bank-*.js')):
              all_ids += re.findall(r'"id"\s*:\s*"(koten_\d+)"', p.read_text(encoding='utf-8'))
          uniq=set(all_ids)
          assert len(uniq)==1400, f'expected 1400 unique koten IDs, got {len(uniq)}'
          assert len(all_ids)==1400, f'duplicate koten IDs detected: total={len(all_ids)} unique={len(uniq)}'
          ext_text=(ROOT/'koten-kanbun-extension.js').read_text(encoding='utf-8')
          assert 'AA_KOTEN_KANBUN_PAYLOAD_CHUNK_5' in ext_text
          assert any('koten-kanbun-bank-5.js' in p.read_text(encoding='utf-8') for p in ROOT.rglob('*.html'))
          print('VALIDATION_OK koten=1400 added=700')
          PY
