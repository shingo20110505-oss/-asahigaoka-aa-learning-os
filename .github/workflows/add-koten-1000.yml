name: Add Koten Kanbun 1000

on:
  push:
    paths:
      - '.add-koten-1000-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Koten and Kanbun 1000
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          for f in .koten-payload-01 .koten-payload-02 .koten-payload-03 .koten-payload-04 .koten-payload-05 .koten-payload-06 .koten-payload-07; do
            test -s "$f"
          done
          cat .koten-payload-01 .koten-payload-02 .koten-payload-03 .koten-payload-04 .koten-payload-05 .koten-payload-06 .koten-payload-07 > /tmp/koten.b64
          echo "payload_bytes=$(wc -c < /tmp/koten.b64)"
          base64 -d /tmp/koten.b64 > /tmp/koten.tgz
          echo "archive_sha256=$(sha256sum /tmp/koten.tgz | awk '{print $1}')"
          mkdir -p /tmp/koten
          tar -xzf /tmp/koten.tgz -C /tmp/koten
          echo "bank_sha256=$(sha256sum /tmp/koten/koten-bank.js | awk '{print $1}')"
          echo "extension_sha256=$(sha256sum /tmp/koten/koten-extension.js | awk '{print $1}')"
          test "$(sha256sum /tmp/koten/koten-bank.js | awk '{print $1}')" = "8bae820a10028fddf11d76440d77763a5905341becf48330212a5a593cb7752e"
          test "$(sha256sum /tmp/koten/koten-extension.js | awk '{print $1}')" = "60dd926ba004c13eb1bfd4c22d4b308aa8da8954cbdc84e06597316c49693c64"
          cp /tmp/koten/koten-bank.js kokugo-chronologia/koten-bank.js
          cp /tmp/koten/koten-extension.js kokugo-chronologia/koten-extension.js
          python - <<'PY'
          from pathlib import Path
          p=Path('kokugo-chronologia/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./koten-extension.js?v=20260815-1"></script>'
          marker='<!-- KOKUGO_DIRECT_MEANING_OVERRIDE_V1 -->'
          if tag not in s:
              if marker not in s: raise SystemExit('index insertion marker not found')
              s=s.replace(marker,tag+marker,1)
              p.write_text(s,encoding='utf-8')
          assert tag in p.read_text(encoding='utf-8')
          PY
          node --check kokugo-chronologia/koten-bank.js
          node --check kokugo-chronologia/koten-extension.js
          node - <<'NODE'
          global.window=global;
          require('./kokugo-chronologia/koten-bank.js');
          const a=global.AA_KOTEN_BANK||[];
          if(a.length!==1000) throw new Error('count='+a.length);
          if(a.filter(x=>x.area==='kobun').length!==600) throw new Error('kobun count');
          if(a.filter(x=>x.area==='kanbun').length!==400) throw new Error('kanbun count');
          if(new Set(a.map(x=>x.id)).size!==1000) throw new Error('duplicate id');
          if(new Set(a.map(x=>x.word)).size!==1000) throw new Error('duplicate word');
          console.log('validated',a.length);
          NODE
          git rm -f .koten-payload-01 .koten-payload-02 .koten-payload-03 .koten-payload-04 .koten-payload-05 .koten-payload-06 .koten-payload-07 .add-koten-1000-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/index.html kokugo-chronologia/koten-bank.js kokugo-chronologia/koten-extension.js
          git commit -m 'Add Koten and Kanbun 1000-word quiz bank'
          for i in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
