name: Phase 1 runtime validator probe

on:
  push:
    branches: [phase1-architecture-cleanup-20260903]
    paths:
      - '.github/workflows/phase1-runtime-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-architecture-cleanup-20260903
          fetch-depth: 0
      - name: Apply transform in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/phase1-architecture-refactor.yml').read_text()
          marker="          python3 - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index('\n          PY',start)
          exec(compile(textwrap.dedent(src[start:end]),'phase1-transform.py','exec'),{'__name__':'__main__'})
          PY
      - name: Capture validator output
        run: |
          set +e
          node scripts/validate-runtime-assets.mjs > /tmp/runtime-output.txt 2>&1
          code=$?
          {
            echo "exit_code=$code"
            echo "---"
            cat /tmp/runtime-output.txt
          } > PHASE1_RUNTIME_VALIDATOR_RESULT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE1_RUNTIME_VALIDATOR_RESULT.txt
          git commit -m 'Record Phase 1 runtime validator result'
          git push origin HEAD:phase1-architecture-cleanup-20260903
          exit $code
