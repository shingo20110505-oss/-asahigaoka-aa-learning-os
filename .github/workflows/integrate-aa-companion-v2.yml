name: Integrate AA Companion V2

on:
  push:
    paths:
      - '.aa-companion-v2-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Integrate shared companion
        shell: python
        run: |
          from pathlib import Path
          
          # AA OS HOME / SPA
          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          tag='<script src="./aa-companion-v2.js?v=6.4.0"></script>'
          if tag not in h:
              h=h.replace('</body>',f'<!-- AA-COMPANION-V2 -->\n{tag}\n</body>')
          p.write_text(h,encoding='utf-8')
          
          # Chronologia: remove the old inaccurate flat-image pseudo layers and use the shared pet.
          p=Path('chronologia.html'); h=p.read_text(encoding='utf-8')
          h=h.replace('<title>Chronologia 6.3｜','<title>Chronologia 6.4｜')
          h=h.replace('const VERSION = "6.3.1";','const VERSION = "6.4.0";')
          h=h.replace('<script src="./chronologia-daily-companion.js?v=6.3.1"></script>','<script src="./chronologia-daily-companion.js?v=6.4.0"></script>')
          h=h.replace('<!-- CHRONOLOGIA-LIVE-COMPANION-LOADER -->\n<script src="./chronologia-live-companion.js?v=6.3.1"></script>','<!-- AA-COMPANION-V2 -->\n<script src="./aa-companion-v2.js?v=6.4.0"></script>')
          if 'aa-companion-v2.js?v=6.4.0' not in h:
              h=h.replace('</body>','<!-- AA-COMPANION-V2 -->\n<script src="./aa-companion-v2.js?v=6.4.0"></script>\n</body>')
          p.write_text(h,encoding='utf-8')
          
          # PWA cache: serve the same companion offline everywhere.
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('-c631`','-c640`')
          s=s.replace("  new URL('chronologia-live-companion.js', BASE).href,\n",'')
          if "new URL('aa-companion-v2.js', BASE).href" not in s:
              needle="  new URL('chronologia-daily-companion.js', BASE).href,\n"
              s=s.replace(needle,needle+"  new URL('aa-companion-v2.js', BASE).href,\n")
          p.write_text(s,encoding='utf-8')
          
          # Update Pages deploy guard for 6.4.
          p=Path('.github/workflows/deploy-pages.yml'); w=p.read_text(encoding='utf-8')
          w=w.replace('Verify Chronologia 6.3.1 before publish','Verify shared companion 6.4 before publish')
          start=w.index('      - name: Verify shared companion 6.4 before publish') if 'Verify shared companion 6.4 before publish' in w else -1
          if start>=0:
              nxt=w.find('\n      - name: Upload Pages artifact',start)
              block='''      - name: Verify shared companion 6.4 before publish
        shell: python
        run: |
          from pathlib import Path
          h=Path('chronologia.html').read_text(encoding='utf-8')
          i=Path('index.html').read_text(encoding='utf-8')
          d=Path('chronologia-daily-companion.js').read_text(encoding='utf-8')
          c=Path('aa-companion-v2.js').read_text(encoding='utf-8')
          s=Path('sw.js').read_text(encoding='utf-8')
          assert '<title>Chronologia 6.4' in h
          assert 'const VERSION = "6.4.0";' in h
          assert h.count('aa-companion-v2.js?v=6.4.0') == 1
          assert i.count('aa-companion-v2.js?v=6.4.0') == 1
          assert 'chronologia-live-companion.js?v=' not in h
          assert "const DAILY_KEY='chronologia-daily-v2'" in d
          assert '01_normal.png' in c and '12_rare.png' in c
          assert 'pointerdown' in c and 'importImages' in c and 'chronologia:voice' in c
          assert 'aa-companion-v2.js' in s
          print('AA shared companion 6.4 publish guard PASS')
'''
              w=w[:start]+block+w[nxt:]
          p.write_text(w,encoding='utf-8')
      - name: Validate
        run: |
          grep -q 'aa-companion-v2.js?v=6.4.0' index.html
          grep -q 'aa-companion-v2.js?v=6.4.0' chronologia.html
          ! grep -q 'chronologia-live-companion.js?v=' chronologia.html
          grep -q 'aa-companion-v2.js' sw.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html chronologia.html sw.js .github/workflows/deploy-pages.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate shared AA companion 6.4 across app"
          git push
