name: Integrate AA Companion V2

on:
  push:
    paths:
      - '.aa-companion-v2-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Integrate shared companion
        shell: python
        run: |
          from pathlib import Path
          import re

          tag = '<script src="./aa-companion-v2.js?v=6.5.0"></script>'

          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          h = re.sub(r'\n?<!-- AA-COMPANION-V2 -->\s*<script src="\./aa-companion-v2\.js\?v=[^"]+"></script>', '', h)
          h = h.replace('</body>', f'<!-- AA-COMPANION-V2 -->\n{tag}\n</body>')
          p.write_text(h, encoding='utf-8')

          p = Path('chronologia.html')
          h = p.read_text(encoding='utf-8')
          h = h.replace('<title>Chronologia 6.3｜', '<title>Chronologia 6.5｜').replace('<title>Chronologia 6.4｜', '<title>Chronologia 6.5｜')
          h = h.replace('const VERSION = "6.3.1";', 'const VERSION = "6.5.0";').replace('const VERSION = "6.4.0";', 'const VERSION = "6.5.0";')
          h = re.sub(r'<script src="\./chronologia-daily-companion\.js\?v=[^"]+"></script>', '<script src="./chronologia-daily-companion.js?v=6.5.0"></script>', h)
          h = re.sub(r'\n?<!-- CHRONOLOGIA-LIVE-COMPANION-LOADER -->\s*<script src="\./chronologia-live-companion\.js\?v=[^"]+"></script>', '', h)
          h = re.sub(r'\n?<!-- AA-COMPANION-V2 -->\s*<script src="\./aa-companion-v2\.js\?v=[^"]+"></script>', '', h)
          h = h.replace('</body>', f'<!-- AA-COMPANION-V2 -->\n{tag}\n</body>')
          p.write_text(h, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"const CACHE_NAME = `asahigaoka-aa-os-\$\{VERSION\}-[^`]+`;", "const CACHE_NAME = `asahigaoka-aa-os-${VERSION}-c650`;", s)
          s = s.replace("  new URL('chronologia-live-companion.js', BASE).href,\n", '')
          if "new URL('aa-companion-v2.js', BASE).href" not in s:
              needle = "  new URL('chronologia-daily-companion.js', BASE).href,\n"
              s = s.replace(needle, needle + "  new URL('aa-companion-v2.js', BASE).href,\n")
          p.write_text(s, encoding='utf-8')
      - name: Validate integration
        shell: python
        run: |
          from pathlib import Path
          import re
          i=Path('index.html').read_text(encoding='utf-8')
          h=Path('chronologia.html').read_text(encoding='utf-8')
          s=Path('sw.js').read_text(encoding='utf-8')
          pat=r'<script\s+src="\./aa-companion-v2\.js\?v=6\.5\.0"></script>'
          assert len(re.findall(pat,i)) == 1
          assert len(re.findall(pat,h)) == 1
          assert not re.search(r'<script\s+src="\./chronologia-live-companion\.js\?v=',h)
          assert '<title>Chronologia 6.5' in h
          assert 'const VERSION = "6.5.0";' in h
          assert "new URL('aa-companion-v2.js', BASE).href" in s
          assert 'c650' in s
          print('AA companion 6.5 integration PASS')
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html chronologia.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate shared AA companion 6.5 across app"
          git push
