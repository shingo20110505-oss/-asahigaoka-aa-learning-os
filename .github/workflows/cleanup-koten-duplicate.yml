name: Cleanup Duplicate Koten UI
on:
  push:
    paths:
      - '.cleanup-koten-duplicate-trigger'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep canonical koten-kanbun implementation only
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p=Path('kokugo-chronologia/index.html')
          s=p.read_text(encoding='utf-8')
          duplicate='<script src="./koten-extension.js?v=20260815-1"></script>'
          s=s.replace(duplicate,'')
          canonical='<script src="./koten-kanbun-extension.js?v=20260815-1"></script>'
          assert canonical in s
          assert duplicate not in s
          p.write_text(s,encoding='utf-8')
          PY
            rm -f kokugo-chronologia/koten-bank.js kokugo-chronologia/koten-extension.js
            rm -f .github/workflows/add-koten-1000.yml
            rm -f .github/workflows/cleanup-koten-duplicate.yml .cleanup-koten-duplicate-trigger
            test -f kokugo-chronologia/koten-kanbun-extension.js
            for n in 1 2 3 4; do test -f "kokugo-chronologia/koten-kanbun-bank-${n}.js"; done
            node --check kokugo-chronologia/koten-kanbun-extension.js
            python - <<'PY'
          from pathlib import Path
          import re
          pairs=[]
          for n in range(1,5):
              t=Path(f'kokugo-chronologia/koten-kanbun-bank-{n}.js').read_text(encoding='utf-8')
              pairs += [(int(a),b) for a,b in re.findall(r'^\[(\d+),"(古文|漢文)",',t,re.M)]
          assert len(pairs)==1000
          assert [a for a,_ in pairs]==list(range(1,1001))
          assert sum(b=='古文' for _,b in pairs)==700
          assert sum(b=='漢文' for _,b in pairs)==300
          PY
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Remove duplicate Koten UI and keep canonical 1000 bank'
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
