name: Remove legacy generic science generator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-science-generator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove only obsolete runtime generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('learning-engine-v23.js')
          s=p.read_text()
          original=s
          pattern=r"function science\(area='biology'\)\{.*?return science\(pick\(\['biology','chemistry','physics','earth'\]\)\)\}"
          s,n=re.subn(pattern,'',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'legacy science function removal count={n}')
          old="V.generators={japanese,math,science,social};window.AA_V23_GENERATORS=V.generators;"
          new="V.generators={japanese,math,social};window.AA_V23_GENERATORS=V.generators;"
          if old not in s:
              raise SystemExit('legacy V.generators registry not found')
          s=s.replace(old,new,1)
          hook="if(typeof makeScienceQ==='function'){const old=makeScienceQ;makeScienceQ=function(diff=7){return Math.random()<.62?science(pick(['biology','chemistry','physics','earth'])):old(diff)}}"
          if hook not in s:
              raise SystemExit('legacy makeScienceQ fallback hook not found')
          s=s.replace(hook,'',1)
          if "function science(area='biology')" in s or "Math.random()<.62?science(" in s or "V.generators={japanese,math,science,social}" in s:
              raise SystemExit('legacy science generator remains')
          if s==original:
              raise SystemExit('no changes made')
          p.write_text(s)
          PY
          node --check learning-engine-v23.js
          grep -q "science-exam/bridge.js" v23-loader.js
          grep -q "legacyGenericFallback:false" science-exam/bridge.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add learning-engine-v23.js
          git diff --cached --check
          git commit -m 'Remove legacy generic science runtime generator'
          git push origin main
