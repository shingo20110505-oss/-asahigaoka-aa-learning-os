name: Export validated Phase 1 transform

on:
  push:
    branches: [phase1-architecture-cleanup-20260903]
    paths:
      - '.github/workflows/phase1-export-transform.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-architecture-cleanup-20260903
          fetch-depth: 1

      - name: Apply Phase 1 transform in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/phase1-architecture-refactor.yml').read_text()
          marker="          python3 - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index('\n          PY',start)
          exec(compile(textwrap.dedent(src[start:end]),'phase1-transform.py','exec'),{'__name__':'__main__'})
          PY

      - name: Run full Phase 1 validation
        run: |
          set -euo pipefail
          for f in app/runtime-registry.js app/legacy/main-runtime.js app/app-shell.js app/state/state-manager.js app/learning/learning-engine.js app/subjects/subject-engines.js app/ui/ui-runtime.js app/pwa/pwa-runtime.js app/qa/qa-runtime.js companion-media-settings-v1.js aa-companion-mobile-fix.js v23-loader.js sw.js; do node --check "$f"; done
          node tests/architecture-boundaries.mjs
          node scripts/validate-review-bank.mjs
          node scripts/validate-review-ui.mjs
          node scripts/validate-runtime-assets.mjs
          node tests/ai-reading-contract.mjs
          node tests/japanese-exam.mjs
          node scripts/japanese-library.mjs
          node tests/reading-library.mjs
          node scripts/reading-library.mjs --validate
          node scripts/validate-math.mjs
          grep -q 'setLoginVoices' companion7-runtime.js
          grep -q 'setExplosionVoice' companion7-runtime.js
          grep -q 'showDailyVisual' login-companion-v1.js
          grep -q 'data-login-image-add' companion-media-settings-v1.js
          grep -q 'data-login-voice-file' companion-media-settings-v1.js

      - name: Package transformed workspace
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase1-export
          git status --short > /tmp/phase1-export/STATUS.txt
          git diff --binary > /tmp/phase1-export/phase1.patch
          git ls-files --others --exclude-standard -z | tar --null -T - -czf /tmp/phase1-export/untracked-files.tar.gz
          cp PHASE1_PROTECTED_HASHES.json /tmp/phase1-export/

      - uses: actions/upload-artifact@v4
        with:
          name: phase1-validated-transform
          path: /tmp/phase1-export
          if-no-files-found: error
          retention-days: 1
