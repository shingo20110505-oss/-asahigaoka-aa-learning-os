name: Publish review bank

on:
  push:
    branches: [main]
    paths:
      - review-bank-v1.js
      - scripts/validate-review-bank.mjs
      - .github/workflows/review-publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-bank-publish
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate review bank
        run: node scripts/validate-review-bank.mjs

      - name: Save review bank
        run: cp review-bank-v1.js "$RUNNER_TEMP/review-bank-v1.js"

      - name: Publish to gh-pages
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          cp "$RUNNER_TEMP/review-bank-v1.js" review-bank-v1.js
          git add review-bank-v1.js
          if git diff --cached --quiet; then
            echo "gh-pages is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync review bank from main ${SOURCE_SHA::7}"
          git push origin gh-pages
