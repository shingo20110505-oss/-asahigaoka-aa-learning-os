name: Fix wrong replay and add classical word-only view 20260909
on:
  push:
    paths:
      - '.fix-wrong-replay-koten-words-20260909-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch replay fidelity and classical word-only view
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_js_function(src,name,replacement):
              start=src.find(f'function {name}(')
              if start<0: raise SystemExit(f'{name}: function not found')
              op=src.find('{',start); depth=0
              for i in range(op,len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0: return src[:start]+replacement+src[i+1:]
              raise SystemExit(f'{name}: closing brace not found')

          # Integrated quiz: save the exact missed item, including reading passage container when needed.
          p=Path('app/legacy/main-runtime.js'); s=p.read_text(encoding='utf-8')
          record='''function recordAttempt(q,answer,correct,responseMs,meta={}){prepareQuestionReview(q);let replayQuestion=null;if(!correct){try{let read=currentReading();if(read){let r=JSON.parse(JSON.stringify(read));r.questions=[JSON.parse(JSON.stringify(q))];replayQuestion=r}else replayQuestion=JSON.parse(JSON.stringify(q))}catch(_){replayQuestion={id:q.id,type:q.type,subject:q.subject,stem:q.stem,choices:Array.isArray(q.choices)?q.choices.slice():[],answerIndex:q.answerIndex,skills:q.skills||[],reviewKey:q.reviewKey}}}let rec={attemptId:uid('a'),itemId:q.id,reviewKey:q.reviewKey,templateId:q.templateId||null,sourceTitle:q.source?.title||null,sourceAuthor:q.source?.author||null,timestamp:now(),answer,correct,partialCredit:meta.partial||0,responseMs,readingMs:meta.readingMs||0,confidenceResponse:meta.confidence??null,hintCount:meta.hint?1:0,glossCount:meta.glossCount||0,explanationOpened:true,errorType:meta.errorType||null,skills:q.skills||[],sessionId:state.session?.id||null,mode:state.session?.mode||'practice',appVersion:APP_VERSION,replayQuestion};state.attempts.push(rec);let keep=200;for(let i=state.attempts.length-1;i>=0;i--){if(state.attempts[i]?.replayQuestion){if(keep>0)keep--;else delete state.attempts[i].replayQuestion}}if(state.attempts.length>10000)state.attempts.splice(0,state.attempts.length-10000);let dk=dayKey();let d=state.stats.days[dk]||(state.stats.days[dk]={attempts:0,correct:0,ms:0});d.attempts++;if(correct)d.correct++;d.ms+=responseMs;for(let sk of q.skills||[])updateSkill(sk.id,correct,responseMs,{expectedMs:q.expectedMs||45000,transfer:sk.role==='primary'?1:(sk.role==='secondary'?.85:.7),errorType:meta.errorType,context:q.context||q.type});save()}'''
          s=replace_js_function(s,'recordAttempt',record)
          wrong='''function startWrongReview(){let wrong=state.attempts.filter(a=>!a.correct).slice(-30).reverse(),queue=[],used=[];for(let a of wrong){let replay=a.replayQuestion;if(replay&&typeof replay==='object'){let key=a.reviewKey||a.itemId||a.attemptId;if(used.includes(key))continue;used.push(key);try{queue.push(JSON.parse(JSON.stringify(replay)))}catch(_){queue.push(replay)}if(queue.length>=8)break;continue}let skill=a.skills?.[0]?.id;if(!skill||used.includes(skill))continue;used.push(skill);let sub=DATA.skills[skill]?.subject;if(skill.startsWith('en.vocab'))queue.push(makeVocabQ());else if(skill.startsWith('ja.kanji'))queue.push(makeKanjiQ());else if(sub==='english'){let r=generateReading(state.ui.subjectDifficulty||7,'micro');queue.push(r);registerReading(r)}else if(sub)queue.push(makeSubjectQ(sub,state.ui.subjectDifficulty||7));if(queue.length>=8)break}if(!queue.length){let m=pickMission();startSession({kind:m.kind,subject:m.subject,mode:'standard'});return}state.session={id:uid('review'),active:true,mode:'review',kind:'review',subject:'mixed',queue,index:0,subIndex:0,answers:{},feedback:null,startedAt:now(),accumulatedMs:0,lastActiveAt:now(),itemStartedAt:now(),scrollY:0,minimumDone:false,clockPaused:false,pausedAt:null};state.stats.sessions++;state.route='study';save();render();window.scrollTo(0,0);startTicker()}'''
          s=replace_js_function(s,'startWrongReview',wrong)
          p.write_text(s,encoding='utf-8')

          # Classical Japanese/Kanbun wrong-only: store exact direction/prompt/options.
          p=Path('kokugo-chronologia/koten-kanbun-extension.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r"const VERSION='[^']+';","const VERSION='2026-09-09.1';",s,count=1)
          add='''function addWrong(item,replayQuestion=null){const list=loadWrong(),k=wrongKey(item),snap=replayQuestion?{field:replayQuestion.field||'',prompt:replayQuestion.prompt||'',hint:replayQuestion.hint||'',answer:replayQuestion.answer||'',options:Array.isArray(replayQuestion.options)?replayQuestion.options.slice():[]}:null,idx=list.findIndex(x=>wrongKey(x)===k);if(idx>=0){if(snap)list[idx]={...list[idx],replayQuestion:snap}}else list.push({...item,...(snap?{replayQuestion:snap}:{}),createdAt:Date.now()});saveWrong(list)}'''
          s=replace_js_function(s,'addWrong',add)
          start='''function start(isWrong=false){const cat=$('#kkQuizCategory').value,want=$('#kkQuizMode').value,count=+$('#kkQuizCount').value||10,pool=bank.filter(x=>cat==='all'||x.category===cat);wrongOnly=isWrong;if(isWrong){const saved=compatibleWrong();if(!saved.length){$('#kkQuizBody').innerHTML='<div class="kk-center">この範囲に間違えた問題はありません。</div>';updateWrongCount();return}const out=[];for(const stored of saved){const item=live.get(wrongKey(stored))||stored;if(!item?.word||!item?.meaning)continue;const r=stored.replayQuestion;let q=null;if(r&&r.field&&r.answer&&Array.isArray(r.options)&&r.options.length)q={item,field:r.field,prompt:r.prompt,hint:r.hint,answer:r.answer,options:r.options.slice()};else q=question(item,want,pool);if(q)out.push(q);if(out.length===count)break}qset=out}else qset=makeSet(pool,want,pool,count,true);qi=0;score=0;if(!qset.length){$('#kkQuizBody').innerHTML='<div class="kk-center">この条件では四択を作れませんでした。</div>';return}showQ()}'''
          s=replace_js_function(s,'start',start)
          s=s.replace('else{addWrong(q.item);markReview(q.item)}','else{addWrong(q.item,q);markReview(q.item)}',1)

          # Word-only view: canonical 1-1000 = 古文700 + 漢文300, excluding duplicated expansion entries.
          tabs='<div class="kk-inner-tabs"><button class="kk-inner on" data-kk-view="list">出る順一覧</button><button class="kk-inner" data-kk-view="quiz">クイズ・解き直し</button></div>'
          if 'data-kk-view="words"' not in s:
              s=s.replace(tabs,'<div class="kk-inner-tabs"><button class="kk-inner on" data-kk-view="list">出る順一覧</button><button class="kk-inner" data-kk-view="words">単語のみ</button><button class="kk-inner" data-kk-view="quiz">クイズ・解き直し</button></div>',1)
          if 'id="kkWordsView"' not in s:
              marker=' <div id="kkQuizView" style="display:none">'
              html=' <div id="kkWordsView" style="display:none"><div class="note">英単語ページのように、古文・漢文の単語・語句だけを集中して確認できます。増補の重複語義を除いた基礎1000語句（古文700・漢文300）です。</div><div class="kk-wordonly-controls"><input id="kkWordOnlySearch" placeholder="単語・読み・意味を検索"><select id="kkWordOnlyCategory"><option value="all">古文＋漢文 1000</option><option value="古文">古文 700</option><option value="漢文">漢文 300</option></select></div><div class="kk-wordonly-meta" id="kkWordOnlyMeta"></div><div class="kk-wordonly-list" id="kkWordOnlyRows"></div></div>\n'
              if marker not in s: raise SystemExit('quiz marker missing')
              s=s.replace(marker,html+marker,1)
          css='.kk-center{text-align:center;padding:20px}.kk-center b{font-size:28px}'
          if '.kk-wordonly-controls{' not in s:
              addon=css+'.kk-wordonly-controls{display:grid;grid-template-columns:2fr 1fr;gap:7px;margin-top:10px}.kk-wordonly-controls input,.kk-wordonly-controls select{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}.kk-wordonly-meta{margin:9px 0;color:var(--sub);font-size:11px;font-weight:800}.kk-wordonly-list{display:grid;gap:7px}.kk-wordonly-row{display:grid;grid-template-columns:minmax(130px,1fr) minmax(90px,.7fr) minmax(220px,2fr);border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}.kk-wordonly-row>div{padding:10px;border-right:1px solid #e9edf3}.kk-wordonly-row>div:last-child{border-right:0}.kk-wordonly-term{font-weight:1000}.kk-wordonly-reading{font-size:11px;color:var(--sub)}.kk-wordonly-meaning{font-size:12px;line-height:1.55}@media(max-width:760px){.kk-wordonly-controls{grid-template-columns:1fr}.kk-wordonly-row{grid-template-columns:minmax(105px,34%) minmax(0,1fr);grid-template-rows:auto auto}.kk-wordonly-row>div{border:0}.kk-wordonly-term{grid-column:1;grid-row:1}.kk-wordonly-reading{grid-column:1;grid-row:2}.kk-wordonly-meaning{grid-column:2;grid-row:1/span 2;border-left:1px solid #e9edf3!important}}'
              if css not in s: raise SystemExit('css marker missing')
              s=s.replace(css,addon,1)
          setinner='''function setInner(v){sec.querySelectorAll('[data-kk-view]').forEach(b=>b.classList.toggle('on',b.dataset.kkView===v));$('#kkListView').style.display=v==='list'?'':'none';$('#kkWordsView').style.display=v==='words'?'':'none';$('#kkQuizView').style.display=v==='quiz'?'':'none';if(v==='words')renderWordOnly();if(v==='quiz')updateWrongCount()}'''
          s=replace_js_function(s,'setInner',setinner)
          hook=" sec.querySelectorAll('[data-kk-view]').forEach(b=>b.onclick=()=>setInner(b.dataset.kkView));"
          if 'const wordOnlyBank=bank.filter(x=>x.rank<=1000);' not in s:
              js='''\n const wordOnlyBank=bank.filter(x=>x.rank<=1000);\n function renderWordOnly(){const cat=$('#kkWordOnlyCategory')?.value||'all',q=($('#kkWordOnlySearch')?.value||'').trim().toLowerCase(),rows=wordOnlyBank.filter(x=>(cat==='all'||x.category===cat)&&(!q||(x.word+x.reading+x.meaning).toLowerCase().includes(q)));$('#kkWordOnlyMeta').textContent=`${rows.length}語句を表示（古文 ${rows.filter(x=>x.category==='古文').length}・漢文 ${rows.filter(x=>x.category==='漢文').length}）`;$('#kkWordOnlyRows').innerHTML=rows.map(x=>`<div class="kk-wordonly-row"><div class="kk-wordonly-term">${esc(x.word)}</div><div class="kk-wordonly-reading">${esc(x.reading||'—')}</div><div class="kk-wordonly-meaning">${esc(x.meaning)}</div></div>`).join('')||'<div class="kk-center">該当する単語はありません。</div>'}\n $('#kkWordOnlyCategory').onchange=renderWordOnly;$('#kkWordOnlySearch').oninput=renderWordOnly;\n'''
              if hook not in s: raise SystemExit('word-only hook missing')
              s=s.replace(hook,hook+js,1)
          p.write_text(s,encoding='utf-8')

          # Cache-bust changed JS.
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'href="\./app/legacy/main-runtime\.js(?:\?v=[^"]+)?"','href="./app/legacy/main-runtime.js?v=20260909-1"',s); s=re.sub(r'src="\./app/legacy/main-runtime\.js(?:\?v=[^"]+)?"','src="./app/legacy/main-runtime.js?v=20260909-1"',s); p.write_text(s,encoding='utf-8')
          p=Path('kokugo-chronologia/index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'<script src="\./koten-kanbun-extension\.js\?v=[^"]+"></script>','<script src="./koten-kanbun-extension.js?v=20260909-1"></script>',s); p.write_text(s,encoding='utf-8')

          main=Path('app/legacy/main-runtime.js').read_text(encoding='utf-8'); ext=Path('kokugo-chronologia/koten-kanbun-extension.js').read_text(encoding='utf-8')
          assert 'appVersion:APP_VERSION,replayQuestion' in main and 'let replay=a.replayQuestion' in main
          assert 'addWrong(q.item,q);markReview(q.item)' in ext and 'stored.replayQuestion' in ext
          assert 'data-kk-view="words"' in ext and 'wordOnlyBank=bank.filter(x=>x.rank<=1000)' in ext
          pairs=[]
          for f in sorted(Path('kokugo-chronologia').glob('koten-kanbun-bank-*.js')):
              pairs += [(int(a),b) for a,b in re.findall(r'^\[(\d+),"(古文|漢文)",',f.read_text(encoding='utf-8'),re.M)]
          base=[x for x in pairs if x[0]<=1000]
          assert len(base)==1000 and sum(b=='古文' for _,b in base)==700 and sum(b=='漢文' for _,b in base)==300
          print('contracts ok')
          PY
          node --check app/legacy/main-runtime.js
          node --check kokugo-chronologia/koten-kanbun-extension.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/legacy/main-runtime.js kokugo-chronologia/koten-kanbun-extension.js index.html kokugo-chronologia/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix wrong-only replay fidelity and add classical word-only view'
          git push origin HEAD:main
