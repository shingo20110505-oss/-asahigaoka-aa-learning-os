name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA package
        run: node tests/static-audit.mjs

      - name: Install isolated after-check runtime
        run: npm install --prefix "$RUNNER_TEMP/aa-after-check" --no-save happy-dom@20.0.11

      - name: Run migration and learning-engine after-check
        env:
          HAPPY_DOM_PATH: ${{ runner.temp }}/aa-after-check/node_modules/happy-dom/lib/index.js
        run: node tests/after-check.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
