name: Phase 1 architecture refactor

on:
  push:
    branches: [phase1-architecture-cleanup-20260903]
    paths:
      - '.github/workflows/phase1-architecture-refactor.yml'

permissions:
  contents: write

concurrency:
  group: phase1-architecture-refactor
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: phase1-architecture-cleanup-20260903
          fetch-depth: 0

      - name: Apply architecture boundaries and workflow cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil

          protected = [
              'v23-science.js', 'science-content-fix-v1.js', 'v23-social.js',
              'social-exam/bridge.js', 'social-exam/core.mjs', 'social-exam/application-pack.mjs',
              'review-bank-v1.js', 'review/index.html', 'aa-companion-v2.js',
              'aa-companion-mobile-fix.js', 'companion7-runtime.js', 'login-companion-v1.js',
              'answer-feedback-audio-v1.js', 'storage-resilience-v1.js'
          ]
          def sha(path):
              p=Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          before={p:sha(p) for p in protected}

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          scripts=list(re.finditer(r'<script(?![^>]*\bsrc=)([^>]*)>(.*?)</script>',html,re.I|re.S))
          main=max(scripts,key=lambda m:len(m.group(2)))
          if len(main.group(2))<50000: raise SystemExit('largest inline script unexpectedly small')
          Path('app/legacy').mkdir(parents=True,exist_ok=True)
          Path('app/legacy/main-runtime.js').write_text(main.group(2).strip('\n')+'\n',encoding='utf-8')
          html=html[:main.start()]+'<script src="./app/runtime-registry.js"></script>\n<script src="./app/legacy/main-runtime.js"></script>'+html[main.end():]

          styles=list(re.finditer(r'<style([^>]*)>(.*?)</style>',html,re.I|re.S))
          base=max(styles,key=lambda m:len(m.group(2)))
          if len(base.group(2))<10000: raise SystemExit('largest inline style unexpectedly small')
          Path('app/ui').mkdir(parents=True,exist_ok=True)
          Path('app/ui/base.css').write_text(base.group(2).strip('\n')+'\n',encoding='utf-8')
          html=html[:base.start()]+'<link rel="stylesheet" href="./app/ui/base.css">'+html[base.end():]

          anchor='<script src="./aa-companion-mobile-fix.js?v=6.5.2"></script>'
          if anchor not in html: raise SystemExit('companion anchor missing')
          layers='''\n<!-- PHASE-1 ARCHITECTURE: App Shell -> State -> Learning -> Subjects -> UI -> PWA -> QA -->
          <script src="./app/app-shell.js"></script>
          <script src="./app/state/state-manager.js"></script>
          <script src="./app/learning/learning-engine.js"></script>
          <script src="./app/subjects/subject-engines.js"></script>
          <script src="./app/ui/ui-runtime.js"></script>
          <script src="./app/pwa/pwa-runtime.js"></script>
          <script src="./app/qa/qa-runtime.js"></script>'''
          html=html.replace(anchor,anchor+layers,1)
          index.write_text(html,encoding='utf-8')

          for d in ['app/state','app/learning','app/subjects','app/pwa','app/qa']:
              Path(d).mkdir(parents=True,exist_ok=True)

          Path('app/runtime-registry.js').write_text("""(()=>{'use strict';if(window.AA_APP?.architectureVersion)return;const ORDER=['appShell','state','learning','subjects','ui','pwa','qa'],layers=Object.create(null),loaded=[];const root={architectureVersion:'1.0.0-phase1',order:Object.freeze([...ORDER]),layers,workInProgress:Object.freeze({scienceExam:true,socialExam:true}),protectedAssets:Object.freeze(['review-bank-v1.js','review/index.html','storage-resilience-v1.js','aa-companion-v2.js','aa-companion-mobile-fix.js','login-companion-v1.js','companion7-runtime.js','answer-feedback-audio-v1.js']),register(name,api){const expected=ORDER[loaded.length];if(name!==expected)throw new Error(`AA_APP layer order violation: expected ${expected}, got ${name}`);if(layers[name])throw new Error(`AA_APP duplicate layer: ${name}`);layers[name]=Object.freeze(api||{});loaded.push(name);return layers[name]},get(name){return layers[name]||null},status(){return{version:this.architectureVersion,loaded:[...loaded],complete:loaded.length===ORDER.length}},assertComplete(){if(loaded.length!==ORDER.length||ORDER.some((x,i)=>loaded[i]!==x))throw new Error(`AA_APP incomplete architecture: ${loaded.join(' > ')}`);return true}};window.AA_APP=Object.freeze(root)})();\n""",encoding='utf-8')
          Path('app/app-shell.js').write_text("""(()=>{'use strict';const A=window.AA_APP;if(!A)throw new Error('AA_APP registry missing');A.register('appShell',{getRoute:()=>typeof state==='object'?state.route:null,navigate:r=>typeof setRoute==='function'?setRoute(r):false,render:()=>typeof render==='function'?render():false,version:()=>typeof APP_VERSION!=='undefined'?APP_VERSION:null})})();\n""",encoding='utf-8')
          Path('app/state/state-manager.js').write_text("""(()=>{'use strict';const A=window.AA_APP;if(!A)throw new Error('AA_APP registry missing');A.register('state',{get:()=>typeof state==='object'?state:null,save:()=>typeof save==='function'?save():false,backup:()=>typeof backupPayload==='function'?backupPayload():null,merge:x=>typeof mergeState==='function'?mergeState(x):null,importText:t=>typeof importJSON==='function'?importJSON(t):false})})();\n""",encoding='utf-8')
          Path('app/learning/learning-engine.js').write_text("""(()=>{'use strict';const A=window.AA_APP;if(!A)throw new Error('AA_APP registry missing');A.register('learning',{mission:()=>typeof pickMission==='function'?pickMission():null,start:o=>typeof startSession==='function'?startSession(o):false,answer:i=>typeof selectAnswer==='function'?selectAnswer(i):false,next:()=>typeof nextQuestion==='function'?nextQuestion():false,reviewWrong:()=>typeof startWrongReview==='function'?startWrongReview():false})})();\n""",encoding='utf-8')
          Path('app/subjects/subject-engines.js').write_text("""(()=>{'use strict';const A=window.AA_APP;if(!A)throw new Error('AA_APP registry missing');const status=Object.freeze({english:'active',japanese:'active',math:'active',science:'work-in-progress',social:'work-in-progress'});A.register('subjects',{status,start:(subject,kind='subject',mode='standard')=>typeof startSession==='function'?startSession({kind,subject,mode}):false,mathExam:()=>window.AA_MATH_EXAM||window.AA_MATH_EXAM_ENGINE||null,japaneseExam:()=>window.AA_JAPANESE_EXAM||null,scienceExam:()=>({status:'work-in-progress'}),socialExam:()=>({status:'work-in-progress'})})})();\n""",encoding='utf-8')
          Path('app/ui/ui-runtime.js').write_text("""(()=>{'use strict';const A=window.AA_APP;if(!A)throw new Error('AA_APP registry missing');A.register('ui',{render:()=>typeof render==='function'?render():false,layout:(c,n=true)=>typeof layout==='function'?layout(c,n):c,header:()=>typeof header==='function'?header():'',nav:()=>typeof nav==='function'?nav():''})})();\n""",encoding='utf-8')
          Path('app/pwa/pwa-runtime.js').write_text("""(()=>{'use strict';const A=window.AA_APP;if(!A)throw new Error('AA_APP registry missing');A.register('pwa',{get:()=>typeof PWA==='object'?PWA:null,init:()=>typeof initPWA==='function'?initPWA():false,check:n=>typeof checkPWAUpdate==='function'?checkPWAUpdate(Boolean(n)):false,registration:()=>typeof PWA==='object'?PWA.registration:null})})();\n""",encoding='utf-8')
          Path('app/qa/qa-runtime.js').write_text("""(()=>{'use strict';const A=window.AA_APP;if(!A)throw new Error('AA_APP registry missing');A.register('qa',{run:()=>typeof qaRun==='function'?qaRun():false,architecture:()=>A.status(),assertArchitecture:()=>A.assertComplete()});A.assertComplete();document.documentElement.dataset.aaArchitecture='phase1'})();\n""",encoding='utf-8')
          Path('app/ARCHITECTURE.md').write_text('''# AA Learning OS architecture boundary — Phase 1\n\nRuntime ownership is explicit: App Shell -> State -> Learning -> Subject engines -> UI -> PWA -> QA.\n\n`app/legacy/main-runtime.js` is the compatibility island extracted from the former giant inline runtime. Phase 1 deliberately moves it without rewriting its behavior. New development should use `window.AA_APP` layer APIs rather than adding more same-name global overrides.\n\nProtected: learning history, review progress/data, PWA, Megumin/companion image display and local image storage, saved/replayed voice features, AI reading, Chronologia, Japanese 15,000-word content, and current adaptive learning. Science and Social exam development is work-in-progress and is not rewritten here.\n''',encoding='utf-8')

          loader=Path('v23-loader.js')
          lt=loader.read_text(encoding='utf-8').replace("'v23-pet-settings.js',",'')
          loader.write_text(lt,encoding='utf-8')
          pet=Path('v23-pet-settings.js')
          if pet.exists(): pet.unlink()

          sw=Path('sw.js')
          st=sw.read_text(encoding='utf-8')
          st=re.sub(r"const VERSION='([^']+)';",lambda m:f"const VERSION='{m.group(1)}-phase1-architecture-20260903';",st,count=1)
          st=st.replace("url('v23-pet-settings.js'),",'')
          assets="url('app/ui/base.css'),url('app/runtime-registry.js'),url('app/legacy/main-runtime.js'),url('app/app-shell.js'),url('app/state/state-manager.js'),url('app/learning/learning-engine.js'),url('app/subjects/subject-engines.js'),url('app/ui/ui-runtime.js'),url('app/pwa/pwa-runtime.js'),url('app/qa/qa-runtime.js'),"
          marker="url('index.html'),"
          if assets not in st:
              if marker not in st: raise SystemExit('SW index marker missing')
              st=st.replace(marker,marker+assets,1)
          sw.write_text(st,encoding='utf-8')

          repl=Path('.github/workflows/replenish-reading.yml')
          rt=repl.read_text(encoding='utf-8').replace('  actions: write\n','').replace("            gh workflow run deploy-pages.yml --ref main\n",'')
          repl.write_text(rt,encoding='utf-8')

          deploy=Path('.github/workflows/deploy-pages.yml')
          dt=deploy.read_text(encoding='utf-8')
          dt=dt.replace('  cancel-in-progress: true','  cancel-in-progress: false',1)
          dt=dt.replace('            sw.js; do',"            app/runtime-registry.js \\\n            app/legacy/main-runtime.js \\\n            app/app-shell.js \\\n            app/state/state-manager.js \\\n            app/learning/learning-engine.js \\\n            app/subjects/subject-engines.js \\\n            app/ui/ui-runtime.js \\\n            app/pwa/pwa-runtime.js \\\n            app/qa/qa-runtime.js \\\n            sw.js; do",1)
          dt=dt.replace('          node scripts/validate-math.mjs\n','          node scripts/validate-math.mjs\n          node tests/architecture-boundaries.mjs\n',1)
          deploy.write_text(dt,encoding='utf-8')

          keep={'deploy-pages.yml','deploy-ai-worker.yml','replenish-reading.yml','chronologia-63-qa.yml','chronologia-deep-audit.yml','content-v24-audit.yml','difficulty-5subject-audit.yml','kokugo-chronologia-audit.yml','kokugo-jukugo-advanced-audit.yml','reading-1000-audit.yml','social-exam-check.yml','phase1-architecture-refactor.yml'}
          wf=Path('.github/workflows'); archive=Path('.github/workflow-archive/legacy-one-shot'); archive.mkdir(parents=True,exist_ok=True)
          archived=[]
          for p in sorted(wf.glob('*.yml')):
              if p.name in keep or 'science' in p.name.lower(): continue
              shutil.move(str(p),str(archive/p.name)); archived.append(p.name)
          active=sorted(p.name for p in wf.glob('*.yml'))
          Path('.github/WORKFLOW_INVENTORY.md').write_text('# Workflow inventory after Phase 1\n\n## Active\n'+''.join(f'- `{x}`\n' for x in active)+'\n## Archived legacy / one-shot\n'+''.join(f'- `{x}`\n' for x in archived)+'\n## Policy\n- Keep only reusable CI/deploy/maintenance and protected work-in-progress workflows active.\n- Historical fixes/restores/reports/verifiers are archived outside `.github/workflows` and cannot trigger.\n- `deploy-pages.yml` is the single Pages publisher. Its own status-file commits remain path-ignored, while obsolete Pages observer/report writers are disabled by archival.\n- Reading replenishment no longer manually dispatches Pages after pushing content.\n- Science and Social exam work remains protected while in progress.\n',encoding='utf-8')

          Path('tests/architecture-boundaries.mjs').write_text("""import fs from 'node:fs';
          const index=fs.readFileSync('index.html','utf8');
          const order=['app/app-shell.js','app/state/state-manager.js','app/learning/learning-engine.js','app/subjects/subject-engines.js','app/ui/ui-runtime.js','app/pwa/pwa-runtime.js','app/qa/qa-runtime.js'];
          let last=-1;for(const f of order){const p=index.indexOf(f);if(p<0||p<=last)throw new Error(`Architecture order invalid: ${f}`);last=p}
          if(!index.includes('app/runtime-registry.js')||!index.includes('app/legacy/main-runtime.js'))throw new Error('Shell extraction missing');
          for(const m of index.matchAll(/<script(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)<\\/script>/gi))if(m[1].length>12000)throw new Error('Large inline runtime remains');
          for(const m of index.matchAll(/<style[^>]*>([\\s\\S]*?)<\\/style>/gi))if(m[1].length>12000)throw new Error('Large inline CSS remains');
          const loader=fs.readFileSync('v23-loader.js','utf8');if(loader.includes('v23-pet-settings.js')||fs.existsSync('v23-pet-settings.js'))throw new Error('Pet settings still active');
          const sw=fs.readFileSync('sw.js','utf8');for(const f of ['app/ui/base.css','app/runtime-registry.js','app/legacy/main-runtime.js',...order])if(!sw.includes(`url('${f}')`))throw new Error(`PWA core missing ${f}`);
          for(const f of ['review-bank-v1.js','review/index.html','storage-resilience-v1.js','aa-companion-v2.js','aa-companion-mobile-fix.js','login-companion-v1.js','companion7-runtime.js','answer-feedback-audio-v1.js'])if(!fs.existsSync(f))throw new Error(`Protected asset missing: ${f}`);
          const reg=fs.readFileSync('app/runtime-registry.js','utf8');if(!reg.includes('scienceExam:true')||!reg.includes('socialExam:true'))throw new Error('WIP guards missing');
          console.log('architecture-boundaries: PASS');
          """,encoding='utf-8')

          after={p:sha(p) for p in protected}; changed=[p for p in protected if before[p]!=after[p]]
          if changed: raise SystemExit('Protected files changed: '+', '.join(changed))
          Path('PHASE1_PROTECTED_HASHES.json').write_text(json.dumps(after,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('archived',len(archived),'active',len(active))
          PY

      - name: Validate refactor before commit
        run: |
          set -euo pipefail
          for f in app/runtime-registry.js app/legacy/main-runtime.js app/app-shell.js app/state/state-manager.js app/learning/learning-engine.js app/subjects/subject-engines.js app/ui/ui-runtime.js app/pwa/pwa-runtime.js app/qa/qa-runtime.js v23-loader.js sw.js; do node --check "$f"; done
          node tests/architecture-boundaries.mjs
          node scripts/validate-review-bank.mjs
          node scripts/validate-review-ui.mjs
          node scripts/validate-runtime-assets.mjs
          node tests/ai-reading-contract.mjs
          node tests/japanese-exam.mjs
          node scripts/japanese-library.mjs
          node tests/reading-library.mjs
          node scripts/reading-library.mjs --validate
          node scripts/validate-math.mjs
          grep -q 'setLoginVoices' companion7-runtime.js
          grep -q 'setExplosionVoice' companion7-runtime.js
          grep -q 'showDailyVisual' login-companion-v1.js
          grep -q 'answer-feedback-audio-v1.js' sw.js
          ! grep -q 'gh workflow run deploy-pages.yml' .github/workflows/replenish-reading.yml

      - name: Commit refactor branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 1: establish architecture boundaries and stabilize Actions'
          git push origin HEAD:phase1-architecture-cleanup-20260903
