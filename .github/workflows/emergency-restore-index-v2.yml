name: Emergency Restore Index V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-restore-index-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore known-good index
        run: |
          git fetch origin 5ad20b5bb4b662941ed91369d0c130a40170f4d9 --depth=1
          git show FETCH_HEAD:index.html > index.html
          test "$(wc -c < index.html)" -gt 10000
          grep -q 'function evidenceRefs' index.html
      - name: Commit restored index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Restore known-good index"
          git pull --rebase origin main
          git push origin main
