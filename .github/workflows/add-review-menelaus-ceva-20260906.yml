name: Add Menelaus and Ceva review cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-review-menelaus-ceva-20260906.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Add corrected review image and cards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          bank_path = Path('review-bank-v1.js')
          bank = bank_path.read_text(encoding='utf-8')
          target_ids = [
              'math-menelaus-theorem-20260906',
              'math-ceva-theorem-20260906',
          ]

          svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
          <title id="title">メネラウスの定理とチェバの定理</title>
          <desc id="desc">三角形で、一直線ならメネラウス、3本が1点で交わるならチェバ、と覚えるための図。</desc>
          <rect width="1200" height="900" fill="#ffffff"/>
          <text x="600" y="72" text-anchor="middle" font-size="48" font-weight="700" fill="#102a56" font-family="Noto Sans JP, Yu Gothic, sans-serif">高校数学　比の定理</text>
          <text x="600" y="120" text-anchor="middle" font-size="30" font-weight="700" fill="#334155" font-family="Noto Sans JP, Yu Gothic, sans-serif">メネラウスとチェバ</text>

          <rect x="40" y="155" width="540" height="635" rx="24" fill="#f8fbff" stroke="#4a9df8" stroke-width="4"/>
          <text x="310" y="212" text-anchor="middle" font-size="34" font-weight="700" fill="#0f2d5c" font-family="Noto Sans JP, Yu Gothic, sans-serif">メネラウスの定理</text>
          <path d="M300 280 L150 700 L550 700 Z" fill="none" stroke="#111827" stroke-width="5"/>
          <line x1="375" y1="70" x2="390" y2="700" stroke="#ef4444" stroke-width="6"/>
          <circle cx="300" cy="280" r="9" fill="#111827"/><text x="286" y="260" font-size="28" font-weight="700">A</text>
          <circle cx="150" cy="700" r="9" fill="#111827"/><text x="120" y="742" font-size="28" font-weight="700">B</text>
          <circle cx="550" cy="700" r="9" fill="#111827"/><text x="557" y="742" font-size="28" font-weight="700">C</text>
          <circle cx="390" cy="700" r="9" fill="#ef4444"/><text x="380" y="742" font-size="28" font-weight="700">D</text>
          <circle cx="383.333" cy="420" r="9" fill="#ef4444"/><text x="398" y="424" font-size="28" font-weight="700">E</text>
          <circle cx="375" cy="70" r="9" fill="#ef4444"/><text x="393" y="77" font-size="28" font-weight="700">F</text>
          <text x="310" y="765" text-anchor="middle" font-size="26" font-weight="700" fill="#9f1239" font-family="Noto Sans JP, Yu Gothic, sans-serif">D・E・F が一直線</text>
          <text x="310" y="820" text-anchor="middle" font-size="29" font-weight="700" fill="#111827" font-family="Noto Sans JP, Yu Gothic, sans-serif">BD/DC × CE/EA × AF/FB = 1</text>

          <rect x="620" y="155" width="540" height="635" rx="24" fill="#f8fff9" stroke="#42a865" stroke-width="4"/>
          <text x="890" y="212" text-anchor="middle" font-size="34" font-weight="700" fill="#164c2b" font-family="Noto Sans JP, Yu Gothic, sans-serif">チェバの定理</text>
          <path d="M900 280 L720 700 L1100 700 Z" fill="none" stroke="#111827" stroke-width="5"/>
          <line x1="900" y1="280" x2="910" y2="700" stroke="#ef4444" stroke-width="5"/>
          <line x1="720" y1="700" x2="1000" y2="490" stroke="#ef4444" stroke-width="5"/>
          <line x1="1100" y1="700" x2="810" y2="490" stroke="#ef4444" stroke-width="5"/>
          <circle cx="900" cy="280" r="9" fill="#111827"/><text x="887" y="260" font-size="28" font-weight="700">A</text>
          <circle cx="720" cy="700" r="9" fill="#111827"/><text x="690" y="742" font-size="28" font-weight="700">B</text>
          <circle cx="1100" cy="700" r="9" fill="#111827"/><text x="1107" y="742" font-size="28" font-weight="700">C</text>
          <circle cx="910" cy="700" r="9" fill="#111827"/><text x="899" y="742" font-size="28" font-weight="700">D</text>
          <circle cx="1000" cy="490" r="9" fill="#111827"/><text x="1014" y="495" font-size="28" font-weight="700">E</text>
          <circle cx="810" cy="490" r="9" fill="#111827"/><text x="777" y="495" font-size="28" font-weight="700">F</text>
          <circle cx="906.667" cy="560" r="10" fill="#ef4444"/><text x="920" y="566" font-size="28" font-weight="700">P</text>
          <text x="890" y="765" text-anchor="middle" font-size="26" font-weight="700" fill="#9f1239" font-family="Noto Sans JP, Yu Gothic, sans-serif">AD・BE・CF が1点 P で交わる</text>
          <text x="890" y="820" text-anchor="middle" font-size="29" font-weight="700" fill="#111827" font-family="Noto Sans JP, Yu Gothic, sans-serif">BD/DC × CE/EA × AF/FB = 1</text>

          <rect x="180" y="846" width="840" height="42" rx="18" fill="#fff5cc"/>
          <text x="600" y="876" text-anchor="middle" font-size="24" font-weight="700" fill="#5b3b00" font-family="Noto Sans JP, Yu Gothic, sans-serif">覚え方：一直線 → メネラウス　／　1点で交わる → チェバ</text>
          </svg>'''

          asset = Path('review/assets/20260906-menelaus-ceva-theorems.svg')
          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_text(svg, encoding='utf-8')
          ET.parse(asset)
          assert 'http://' not in svg.replace('http://www.w3.org/2000/svg','')
          assert 'https://' not in svg
          assert 'data:' not in svg

          entries = {
              'math-menelaus-theorem-20260906': "  {id:'math-menelaus-theorem-20260906',subject:'数学',unit:'高校数学・図形と比',title:'メネラウスの定理',question:'△ABCで、Dは辺BC上、Eは辺CA上、Fは辺ABの延長上にあり、D・E・Fが一直線上にある。成り立つ比の関係は？',image:'assets/20260906-menelaus-ceva-theorems.svg',imageAlt:'メネラウスの定理とチェバの定理を比較した図。左はD・E・Fが一直線になるメネラウス、右は3本の線が1点Pで交わるチェバ。',answer:'BD/DC × CE/EA × AF/FB = 1。',why:'三角形の3辺またはその延長を1本の直線が横切るときに使う定理です。D・E・Fが一直線上にあることがメネラウスを使う目印です。比は三角形の周りを一周するように BD/DC、CE/EA、AF/FB と並べて掛けると1になります。',examples:['D・E・Fが一直線 → メネラウス','BD/DC × CE/EA × AF/FB = 1','一直線が三角形の辺または延長を横切る形を探す'],memory:'一直線 → メネラウス。BD/DC × CE/EA × AF/FB = 1',tags:['数学','高校数学','メネラウスの定理','比','三角形','図形'],createdAt:'2026-09-06'},",
              'math-ceva-theorem-20260906': "  {id:'math-ceva-theorem-20260906',subject:'数学',unit:'高校数学・図形と比',title:'チェバの定理',question:'△ABCで、Dは辺BC上、Eは辺CA上、Fは辺AB上にあり、AD・BE・CFが1点Pで交わる。成り立つ比の関係は？',image:'assets/20260906-menelaus-ceva-theorems.svg',imageAlt:'メネラウスの定理とチェバの定理を比較した図。左はD・E・Fが一直線になるメネラウス、右は3本の線が1点Pで交わるチェバ。',answer:'BD/DC × CE/EA × AF/FB = 1。',why:'三角形の3つの頂点から反対側の辺へ引いた3本の線が1点で交わるときに使う定理です。AD・BE・CFが1点Pに集まることがチェバを使う目印です。比は BD/DC、CE/EA、AF/FB を三角形の周りに沿って掛けると1になります。',examples:['AD・BE・CFが1点で交わる → チェバ','BD/DC × CE/EA × AF/FB = 1','1点に集まる3本の線を見つける'],memory:'1点で交わる → チェバ。BD/DC × CE/EA × AF/FB = 1',tags:['数学','高校数学','チェバの定理','比','三角形','図形'],createdAt:'2026-09-06'},",
          }

          missing = [i for i in target_ids if i not in bank]
          if missing:
              marker = '\n];\nfunction normalize'
              assert marker in bank, 'review bank insertion marker not found'
              addition = '\n'.join(entries[i] for i in missing) + '\n'
              bank = bank.replace(marker, '\n' + addition + '];\nfunction normalize', 1)

              m = re.search(r"window\.AA_REVIEW_BANK_VERSION='(\d+)\.(\d+)\.(\d+)'", bank)
              assert m, 'AA_REVIEW_BANK_VERSION not found'
              old_version = '.'.join(m.groups())
              new_version = f"{m.group(1)}.{m.group(2)}.{int(m.group(3)) + 1}"
              bank = bank.replace(f"window.AA_REVIEW_BANK_VERSION='{old_version}'", f"window.AA_REVIEW_BANK_VERSION='{new_version}'", 1)
              bank_path.write_text(bank, encoding='utf-8')
              print(f'version {old_version} -> {new_version}')
          else:
              print('review items already present; bank left unchanged')

          final = bank_path.read_text(encoding='utf-8')
          for item_id in target_ids:
              assert final.count(f"id:'{item_id}'") == 1, item_id
          assert final.count("image:'assets/20260906-menelaus-ceva-theorems.svg'") >= 2
          print('review cards and image validated')
          PY

          node --check review-bank-v1.js
          node scripts/validate-review-bank.mjs

      - name: Commit review update and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-review-menelaus-ceva-20260906.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Add Menelaus and Ceva review cards'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch production Pages verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches -f ref=main
