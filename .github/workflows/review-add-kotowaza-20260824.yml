name: Add marked proverbs to Review v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-add-kotowaza-20260824.yml'

permissions:
  contents: write
  actions: write

jobs:
  update-review-bank:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main and verify source blob
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD:review-bank-v1.js)" = "40530a918b5716f2f4e65fa324d8c5ebfdac8d78"

      - name: Append 14 review cards and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('review-bank-v1.js')
          s=p.read_text(encoding='utf-8')
          expected="window.AA_REVIEW_BANK_VERSION='1.0.48';"
          replacement="window.AA_REVIEW_BANK_VERSION='1.0.49';"
          if expected not in s:
              raise SystemExit('expected review version 1.0.48 not found')

          items = [
          "  {id:'ja-kotowaza-ame-futte-ji-katamaru-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'雨降って地固まる',question:'「雨降って地固まる」の意味は？',answer:'もめ事や争いのあと、かえって物事がうまくいったり、関係がよくなったりすること。',why:'雨が降ったあとに地面が締まって固くなることから、問題が起きたあとに以前よりよい状態になることを表します。',examples:['けんかをしたあとに本音を話せて、前より仲が深まった。まさに「雨降って地固まる」だ。'],memory:'雨のあと地面が固まる → もめ事のあと関係がよくなる',tags:['国語','ことわざ','雨降って地固まる','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kotowaza-i-no-naka-no-kawazu-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'井の中の蛙大海を知らず',question:'「井の中の蛙大海を知らず」の意味は？',answer:'狭い世界にいて、広い世界のことを知らないこと。',why:'井戸の中にいる蛙は大きな海を知らないことから、自分の狭い知識や経験だけで物事を判断することを表します。',examples:['自分の学校だけを基準に考えるのは「井の中の蛙大海を知らず」になりやすい。'],memory:'井戸の蛙は海を知らない → 狭い世界しか知らない',tags:['国語','ことわざ','井の中の蛙大海を知らず','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kotowaza-kareki-mo-yama-no-nigiwai-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'枯れ木も山のにぎわい',question:'「枯れ木も山のにぎわい」の意味は？',answer:'つまらないものや役に立たないものでも、何もないよりはましだということ。',why:'枯れ木でも山にあれば、何もない山よりにぎやかに見えることから生まれたことわざです。',examples:['人数が少ない会なので、私でも「枯れ木も山のにぎわい」と参加した。'],memory:'枯れ木でも無いよりはにぎやか → 何もないよりまし',tags:['国語','ことわざ','枯れ木も山のにぎわい','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kotowaza-kusai-mono-ni-futa-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'臭いものに蓋をする',question:'「臭いものに蓋をする」の意味は？',answer:'悪いことや都合の悪いことを隠し、一時しのぎで取り繕うこと。',why:'嫌なにおいのするものに蓋をして、原因を解決せずに見えなくすることから生まれた表現です。',examples:['問題を報告せず隠すだけでは「臭いものに蓋をする」ことになる。'],memory:'臭い原因を直さず蓋 → 悪いことを隠して一時しのぎ',tags:['国語','ことわざ','臭いものに蓋をする','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kotowaza-suki-koso-mono-no-jouzu-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'好きこそものの上手なれ',question:'「好きこそものの上手なれ」の意味は？',answer:'好きなことは自分から工夫したり努力したりするので、自然に上達するということ。',why:'好きなことなら熱心に続けやすく、練習や工夫を重ねるため上手になりやすい、という考えを表します。',examples:['毎日楽しんで絵を描いて上達した。まさに「好きこそものの上手なれ」だ。'],memory:'好き → 自分から努力する → 上手になる',tags:['国語','ことわざ','好きこそものの上手なれ','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kotowaza-suzume-hyaku-made-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'雀百まで踊り忘れず',question:'「雀百まで踊り忘れず」の意味は？',answer:'子どものころに身についた習慣や癖は、年をとってもなかなか変わらないということ。',why:'雀は年をとっても若いころからの動きを忘れない、というたとえから生まれたことわざです。',examples:['幼いころからの早起きが今も続くのは「雀百まで踊り忘れず」だ。'],memory:'雀は百歳でも踊りを忘れない → 幼いころの習慣は残る',tags:['国語','ことわざ','雀百まで踊り忘れず','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kotowaza-seite-wa-koto-o-shisonjiru-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'急いてはことを仕損じる',question:'「急いてはことを仕損じる」の意味は？',answer:'あわてて物事をすると、かえって失敗しやすいということ。',why:'急いで慎重さを失うと、やり直しが必要になるような失敗を招きやすいことへの戒めです。',examples:['提出前に見直さず急ぐとミスが増える。「急いてはことを仕損じる」だ。'],memory:'急ぐ → 雑になる → 失敗する',tags:['国語','ことわざ','急いてはことを仕損じる','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kanyoku-tateita-ni-mizu-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'立て板に水',question:'「立て板に水」の意味は？',answer:'よどみなく、すらすらと話すようす。',why:'立てた板に水を流すと、つかえず滑らかに流れることから、話し方が非常に流暢なようすを表します。',examples:['彼は質問に「立て板に水」のようにすらすら答えた。'],memory:'立てた板を水がスーッと流れる → すらすら話す',tags:['国語','慣用句','立て板に水','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kotowaza-momokuri-sannen-kaki-hachinen-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'桃栗三年柿八年',question:'「桃栗三年柿八年」の意味は？',answer:'物事が成果を出すまでには、それぞれ必要な年月や時間がかかるということ。',why:'桃や栗は実がなるまで三年、柿は八年ほどかかるとされることから、成果には相応の時間が必要だというたとえです。',examples:['すぐ結果が出なくても焦らない。「桃栗三年柿八年」だ。'],memory:'桃・栗3年、柿8年 → 成果にはそれぞれ時間がかかる',tags:['国語','ことわざ','桃栗三年柿八年','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kotowaza-yanagi-no-shita-dojou-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'柳の下にいつもどじょうはおらぬ',question:'「柳の下にいつもどじょうはおらぬ」の意味は？',answer:'一度うまくいったからといって、同じ方法でいつも成功するとは限らないということ。',why:'一度柳の下でどじょうを捕まえられても、同じ場所にいつもどじょうがいるわけではないことから生まれたことわざです。',examples:['前回と同じやり方なら必ず成功すると思うのは、「柳の下にいつもどじょうはおらぬ」だ。'],memory:'一度どじょうがいた ≠ いつもいる → 成功は毎回同じとは限らない',tags:['国語','ことわざ','柳の下にいつもどじょうはおらぬ','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kanyoku-koshi-ga-hikui-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'腰が低い',question:'「腰が低い」の意味は？',answer:'相手に対して謙虚で、ていねいな態度をとること。',why:'体を低くして相手に敬意を示す姿勢から、威張らず謙虚に接する態度を表す慣用句になりました。',examples:['有名になっても誰にでも丁寧で、腰が低い人だ。'],memory:'腰を低くする姿勢 → 謙虚でていねい',tags:['国語','慣用句','腰が低い','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kanyoku-teshio-ni-kakeru-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'手塩にかける',question:'「手塩にかける」の意味は？',answer:'時間や手間をかけて、大切に育てたり世話をしたりすること。',why:'自分の手元で細かく世話をするイメージから、愛情をもって丹念に育てることを表します。',examples:['祖父が手塩にかけて育てた野菜が実った。'],memory:'自分の手で手間をかける → 大切に育てる',tags:['国語','慣用句','手塩にかける','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kanyoku-tora-no-ko-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'虎の子',question:'「虎の子」の意味は？',answer:'とても大切にして、手放さないもの。特に大切に蓄えているお金など。',why:'虎が子どもを非常に大切に守ると考えられたことから、手放したくない貴重なものを表します。',examples:['旅行のために、虎の子の貯金には手をつけなかった。'],memory:'虎が子を大切に守る → 手放したくない大切なもの',tags:['国語','慣用句','虎の子','意味'],createdAt:'2026-08-24'},",
          "  {id:'ja-kanyoku-neko-no-hitai-20260824',subject:'国語',unit:'ことわざ・慣用句',title:'猫の額',question:'「猫の額」の意味は？',answer:'非常に狭い場所のこと。',why:'猫の額が小さく狭いことにたとえて、ごく狭い土地や場所を表します。',examples:['猫の額ほどの庭だが、花を育てている。'],memory:'猫の額は小さい → とても狭い場所',tags:['国語','慣用句','猫の額','意味'],createdAt:'2026-08-24'},",
          ]

          ids=[]
          for line in items:
              marker="id:'"
              a=line.index(marker)+len(marker)
              b=line.index("'",a)
              ids.append(line[a:b])
          for i in ids:
              if f"id:'{i}'" in s:
                  raise SystemExit(f'duplicate id: {i}')

          marker="];\nfunction normalize"
          if marker not in s:
              raise SystemExit('array closing marker not found')
          s=s.replace(marker, "\n"+"\n".join(items)+"\n];\nfunction normalize", 1)
          s=s.replace(expected,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY

          node --check review-bank-v1.js
          node scripts/validate-review-bank.mjs
          grep -q "window.AA_REVIEW_BANK_VERSION='1.0.49';" review-bank-v1.js
          for id in \
            ja-kotowaza-ame-futte-ji-katamaru-20260824 \
            ja-kotowaza-i-no-naka-no-kawazu-20260824 \
            ja-kotowaza-kareki-mo-yama-no-nigiwai-20260824 \
            ja-kotowaza-kusai-mono-ni-futa-20260824 \
            ja-kotowaza-suki-koso-mono-no-jouzu-20260824 \
            ja-kotowaza-suzume-hyaku-made-20260824 \
            ja-kotowaza-seite-wa-koto-o-shisonjiru-20260824 \
            ja-kanyoku-tateita-ni-mizu-20260824 \
            ja-kotowaza-momokuri-sannen-kaki-hachinen-20260824 \
            ja-kotowaza-yanagi-no-shita-dojou-20260824 \
            ja-kanyoku-koshi-ga-hikui-20260824 \
            ja-kanyoku-teshio-ni-kakeru-20260824 \
            ja-kanyoku-tora-no-ko-20260824 \
            ja-kanyoku-neko-no-hitai-20260824; do
            test "$(grep -o "$id" review-bank-v1.js | wc -l)" -eq 1
          done

      - name: Commit canonical review bank and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/review-add-kotowaza-20260824.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review-bank-v1.js .github/workflows/review-add-kotowaza-20260824.yml
          git commit -m "Add 14 marked proverbs to Review v2"
          git pull --rebase origin main
          git push origin main

      - name: Dispatch verified Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}'
