name: Extract Kokugo A Rank Pending
on:
  push:
    paths:
      - '.extract-kokugo-a-pending-trigger'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Extract first A-rank English meanings
        shell: python
        run: |
          import json,re
          from collections import Counter
          from pathlib import Path
          src=Path('kokugo-chronologia/data.jsonl')
          rows=[json.loads(x) for x in src.read_text(encoding='utf-8').splitlines() if x.strip()]
          def needs_ja(s):
              s=str(s or '').strip()
              jp=len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]',s))
              latin=len(re.findall(r'[A-Za-z]',s))
              return bool(s) and latin>=3 and jp==0
          pending=[r for r in rows if needs_ja(r.get('meaning'))]
          rank_counts=Counter(str(r.get('rank','')).strip() or '(blank)' for r in pending)
          a=[r for r in pending if str(r.get('rank','')).strip().upper()=='A']
          keys=('id','term','reading','meaning','rank','type')
          targets=[{k:r.get(k) for k in keys} for r in a[:60]]
          out={
            'total_rows':len(rows),
            'english_only_total':len(pending),
            'english_only_rank_counts':dict(rank_counts),
            'a_rank_total':len(a),
            'batch_size':len(targets),
            'targets':targets,
          }
          Path('kokugo-chronologia/a-rank-english-pending.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k!='targets'},ensure_ascii=False))
      - name: Commit extraction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/a-rank-english-pending.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Extract A-rank English meanings for direct Japanese translation'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
