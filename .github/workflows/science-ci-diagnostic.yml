name: Science CI diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/science-ci-diagnostic.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair template delimiters and prove QA
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('science-exam/generator.mjs')
          s=p.read_text()
          before=s
          s=s.replace('}))],\n','})],\n')
          s=s.replace('}))}],\n','})}],\n')
          s=s.replace('}))]\n];','})]\n];')
          if s==before:
              raise SystemExit('no template delimiter changes made')
          p.write_text(s)
          PY
          node --check science-exam/core.mjs
          node --check science-exam/generator.mjs
          node --check science-exam/bridge.js
          node tests/science-exam.mjs | tee SCIENCE_CI_DIAGNOSTIC.txt
          grep -q '"ok":true' SCIENCE_CI_DIAGNOSTIC.txt
          grep -q '"legacyGenericRemoved":true' SCIENCE_CI_DIAGNOSTIC.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add science-exam/generator.mjs SCIENCE_CI_DIAGNOSTIC.txt
          git diff --cached --check
          git commit -m 'Fix science generator syntax and pass QA'
          git push origin main
