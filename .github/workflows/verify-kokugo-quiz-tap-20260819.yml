name: Verify Kokugo Quiz Tap 20260819

on:
  push:
    paths:
      - '.github/workflows/verify-kokugo-quiz-tap-20260819.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check source wiring
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'quiz-interaction-fix.js?v=20260819-1' kokugo-chronologia/index.html | wc -l)" = 1
          grep -Fq "const VERSION='2026-08-16.1'" kokugo-chronologia/quiz-interaction-fix.js
          grep -Fq "window.addEventListener('touchend',captureTouch" kokugo-chronologia/quiz-interaction-fix.js
          grep -Fq "window.addEventListener('pointerup',capturePointer" kokugo-chronologia/quiz-interaction-fix.js
          grep -Fq "STATE_KEY='kokugoChronologiaStateV2'" kokugo-chronologia/jukugo-extension.js

      - name: Wait for this Pages release
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 72); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${BASE}release.json?kokugo_tap_verify=${SOURCE_SHA}-${n}" -o /tmp/release.json && grep -q "${SOURCE_SHA}" /tmp/release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Verify public source and asset
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
        run: |
          set -euo pipefail
          curl -fsSL "${BASE}kokugo-chronologia/?kokugo_tap_verify=${SOURCE_SHA}" -o /tmp/public-index.html
          curl -fsSL "${BASE}kokugo-chronologia/quiz-interaction-fix.js?kokugo_tap_verify=${SOURCE_SHA}" -o /tmp/public-fix.js
          test "$(grep -o 'quiz-interaction-fix.js?v=20260819-1' /tmp/public-index.html | wc -l)" = 1
          test "$(sha256sum kokugo-chronologia/quiz-interaction-fix.js | awk '{print $1}')" = "$(sha256sum /tmp/public-fix.js | awk '{print $1}')"
          grep -Fq "const VERSION='2026-08-16.1'" /tmp/public-fix.js

      - name: Run live mobile quiz tap audit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          rm -rf "/tmp/aa-kokugo-quiz-ui-${SOURCE_SHA}"
          timeout 180s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --user-data-dir="/tmp/aa-kokugo-quiz-ui-${SOURCE_SHA}" \
            --virtual-time-budget=110000 \
            --dump-dom "${BASE}kokugo-chronologia/?aa_quiz_ui_ci=1&verify=${SOURCE_SHA}" > /tmp/kokugo-runtime.html
          grep -o 'AA_KOKUGO_QUIZ_UI=[^<]*' /tmp/kokugo-runtime.html || true
          grep -q 'data-aa-kokugo-quiz-ui="PASS"' /tmp/kokugo-runtime.html
          grep -q 'AA_KOKUGO_QUIZ_UI=PASS' /tmp/kokugo-runtime.html
          grep -q '"graded":true' /tmp/kokugo-runtime.html
          grep -q '"nextVisible":true' /tmp/kokugo-runtime.html
          grep -q '"realTouchCapture":true' /tmp/kokugo-runtime.html

      - name: Record success
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > KOKUGO_QUIZ_TAP_VERIFY_STATUS.txt <<EOF
          status=success
          public_verify=success
          live_mobile_quiz_tap=PASS
          graded=true
          nextVisible=true
          realTouchCapture=true
          verified_source_sha=${SOURCE_SHA}
          verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KOKUGO_QUIZ_TAP_VERIFY_STATUS.txt
          git commit -m 'Record Kokugo quiz tap production verification'
          git push origin HEAD:main
