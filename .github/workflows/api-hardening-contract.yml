name: Rise AI API hardening contract

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'tests/ai-*.mjs'
      - '.github/workflows/api-hardening-contract.yml'
  push:
    branches:
      - rise-api-hardening-20260905
    paths:
      - 'worker/**'
      - 'tests/ai-*.mjs'
      - '.github/workflows/api-hardening-contract.yml'

permissions:
  contents: read

concurrency:
  group: rise-ai-api-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check hardened Worker modules
        run: |
          set -euo pipefail
          node --check worker/src/entry-hardened.mjs
          node --check worker/src/exam-platform-hardened.mjs
          node --check worker/src/subject-verifier-hardened.mjs
          node --check worker/src/providers/gemini.mjs
          node --check worker/src/providers/groq.mjs
      - name: Hardened API contract
        run: node tests/ai-api-hardening-contract.mjs
      - name: Legacy compatibility contracts
        run: |
          set -euo pipefail
          node tests/ai-provider-contract.mjs
          node tests/ai-reading-contract.mjs
          node tests/ai-reading-groq-contract.mjs
          node tests/ai-subject-verifier-contract.mjs
          node tests/ai-exam-platform-contract.mjs
