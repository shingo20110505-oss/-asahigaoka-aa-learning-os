name: Fix legacy wrong replay stability 20260909
on:
  push:
    paths:
      - '.fix-wrong-replay-legacy-stability-20260909-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve legacy wrong-answer question formats across all subjects
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_js_function(src,name,replacement):
              start=src.find(f'function {name}(')
              if start<0: raise SystemExit(f'{name}: function not found')
              paren=src.find('(',start)
              pdepth=0; close=-1
              for i in range(paren,len(src)):
                  if src[i]=='(': pdepth+=1
                  elif src[i]==')':
                      pdepth-=1
                      if pdepth==0:
                          close=i; break
              if close<0: raise SystemExit(f'{name}: signature close not found')
              op=src.find('{',close)
              if op<0: raise SystemExit(f'{name}: body open not found')
              depth=0
              for i in range(op,len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0: return src[:start]+replacement+src[i+1:]
              raise SystemExit(f'{name}: closing brace not found')

          p=Path('app/legacy/main-runtime.js')
          s=p.read_text(encoding='utf-8')
          replacement=r'''function legacyWrongTemplatePrefix(itemId){let id=String(itemId||'');let m=id.match(/^(math|sci|soc):([^:]+):/);return m?`${m[1]}:${m[2]}:`:''}
function legacyWrongReplayQuestion(a,skill,sub){let id=String(a?.itemId||''),m=id.match(/^vocab:([^:]+):([^:]+):/);if(m){let v=DATA.vocab.find(x=>String(x.id)===m[1]);if(v)return makeVocabQ(v,m[2])}m=id.match(/^kanji:([^:]+):([^:]+):/);if(m){let k=DATA.kanji.find(x=>String(x.id)===m[1]);if(k)return makeKanjiQ(k,m[2])}if(sub==='english'){let r=generateReading(state.ui.subjectDifficulty||7,'micro');registerReading(r);return r}let prefix=legacyWrongTemplatePrefix(id);if(prefix&&sub){for(let i=0;i<240;i++){let q=makeSubjectQ(sub,state.ui.subjectDifficulty||7);if(q&&String(q.id||'').startsWith(prefix))return q}}if(skill?.startsWith('en.vocab'))return makeVocabQ();if(skill?.startsWith('ja.kanji'))return makeKanjiQ();return sub?makeSubjectQ(sub,state.ui.subjectDifficulty||7):null}
function startWrongReview(){let wrong=state.attempts.filter(a=>!a.correct).slice(-30).reverse(),queue=[],used=[],migrated=false;for(let a of wrong){let replay=a.replayQuestion,key=a.reviewKey||a.itemId||a.attemptId||a.skills?.[0]?.id;if(!key||used.includes(key))continue;if(replay&&typeof replay==='object'){used.push(key);try{queue.push(JSON.parse(JSON.stringify(replay)))}catch(_){queue.push(replay)}if(queue.length>=8)break;continue}let skill=a.skills?.[0]?.id;if(!skill)continue;let sub=DATA.skills[skill]?.subject,q=legacyWrongReplayQuestion(a,skill,sub);if(!q)continue;try{a.replayQuestion=JSON.parse(JSON.stringify(q));replay=a.replayQuestion;migrated=true}catch(_){replay=q}used.push(key);try{queue.push(JSON.parse(JSON.stringify(replay)))}catch(_){queue.push(replay)}if(queue.length>=8)break}if(migrated)save();if(!queue.length){let m=pickMission();startSession({kind:m.kind,subject:m.subject,mode:'standard'});return}state.session={id:uid('review'),active:true,mode:'review',kind:'review',subject:'mixed',queue,index:0,subIndex:0,answers:{},feedback:null,startedAt:now(),accumulatedMs:0,lastActiveAt:now(),itemStartedAt:now(),scrollY:0,minimumDone:false,clockPaused:false,pausedAt:null};state.stats.sessions++;state.route='study';save();render();window.scrollTo(0,0);startTicker()}'''
          s=replace_js_function(s,'startWrongReview',replacement)
          p.write_text(s,encoding='utf-8')

          # Force iPhone/PWA/browser to request the fixed runtime instead of a cached 20260909-1 copy.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(app/legacy/main-runtime\.js\?v=)[^"\']+',r'\g<1>20260909-2',s)
          p.write_text(s,encoding='utf-8')

          main=Path('app/legacy/main-runtime.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          assert 'function legacyWrongReplayQuestion' in main
          assert "id.match(/^vocab:([^:]+):([^:]+):/)" in main
          assert "id.match(/^kanji:([^:]+):([^:]+):/)" in main
          assert 'legacyWrongTemplatePrefix(id)' in main
          assert 'for(let i=0;i<240;i++)' in main
          assert 'a.replayQuestion=JSON.parse(JSON.stringify(q))' in main
          assert 'if(migrated)save()' in main
          assert 'main-runtime.js?v=20260909-2' in index
          print('legacy wrong-replay migration contracts ok')
          PY
          node --check app/legacy/main-runtime.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/legacy/main-runtime.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix legacy wrong-only format stability across subjects'
          git push origin HEAD:main