name: Merge Kokugo Direct Japanese Meanings
on:
  push:
    paths:
      - 'kokugo-chronologia/meaning-ja-patches/**'
permissions:
  contents: write
  actions: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Merge direct Japanese meanings
        run: python3 .github/scripts/merge_kokugo_direct_meanings.py
      - name: Commit merged meanings safely
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/meaning-ja-overrides.json kokugo-chronologia/meaning-ja-overrides.js kokugo-chronologia/meaning-ja-status.json sw.js
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Merge direct Japanese Kokugo meanings'
          pushed=0
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          test "$pushed" = 1
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Dispatch Pages and exact Kokugo public verification
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          gh workflow run verify-kokugo-direct-public.yml --ref main
