name: Rise production visual verification

on:
  workflow_run:
    workflows: ["Deploy AA Learning OS to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rise-production-visual
  cancel-in-progress: true

jobs:
  visual:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve published source
        id: source
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${WORKFLOW_SHA:-$GITHUB_SHA}"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "PAGE_URL=https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/" >> "$GITHUB_ENV"

      - name: Wait for exact production release
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 24); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${PAGE_URL}release.json?visual=${SOURCE_SHA}-${n}" -o /tmp/release.json && grep -q "${SOURCE_SHA}" /tmp/release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          grep -q '"management": "validated-main-direct-to-pages"' /tmp/release.json
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}app/ui/rise-ui-v4.js?visual_asset=${SOURCE_SHA}" -o /tmp/rise-ui-v4.js
          grep -q "version:'4.2.0'" /tmp/rise-ui-v4.js
          grep -q 'function homeHTML' /tmp/rise-ui-v4.js
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}app/ui/rise-stable-root-v4.js?visual_asset=${SOURCE_SHA}" -o /tmp/rise-stable-root-v4.js
          grep -q "version:'1.0.0'" /tmp/rise-stable-root-v4.js
          grep -q "host.id='riseStableMain'" /tmp/rise-stable-root-v4.js
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}index.html?visual_asset=${SOURCE_SHA}" -o /tmp/index.html
          grep -q 'rise-stable-root-v4.js?v=1.0.0' /tmp/index.html

      - name: Install Japanese rendering fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'sans-serif:lang=ja'

      - name: Capture mobile and desktop production screenshots
        id: capture
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          mkdir -p visual-evidence
          IPHONE_UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'

          capture(){
            name="$1"; width="$2"; height="$3"; ua="$4"
            out="visual-evidence/${name}.png"
            dom="visual-evidence/${name}.html"
            profile="/tmp/rise-visual-${name}-${SOURCE_SHA}"
            target="${PAGE_URL}?visual_verify=1&verify=${SOURCE_SHA}&viewport=${name}"
            rm -rf "$profile"
            common=(
              --headless=new
              --no-sandbox
              --disable-gpu
              --disable-dev-shm-usage
              --hide-scrollbars
              --force-device-scale-factor=1
              --window-size="${width},${height}"
              --user-data-dir="$profile"
              --virtual-time-budget=18000
              --run-all-compositor-stages-before-draw
            )
            if [ -n "$ua" ]; then common+=(--user-agent="$ua"); fi

            timeout 120s "$CHROME" "${common[@]}" --dump-dom "$target" > "$dom"
            timeout 120s "$CHROME" "${common[@]}" --screenshot="$out" "$target"
            test -s "$out"
            python3 - "$out" "$width" "$height" <<'PY'
          import os, struct, sys
          path=sys.argv[1]; expected=(int(sys.argv[2]),int(sys.argv[3]))
          with open(path,'rb') as f:
              head=f.read(24)
          if head[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit(f'not png: {path}')
          actual=struct.unpack('>II',head[16:24])
          if actual != expected:
              raise SystemExit(f'bad dimensions: {path} {actual} != {expected}')
          size=os.path.getsize(path)
          if size < 10000:
              raise SystemExit(f'screenshot too small: {path} {size} bytes')
          print(f'VISUAL_CAPTURED {path} {actual[0]}x{actual[1]} {size} bytes')
          PY
          }

          capture rise-mobile-390x844 390 844 "$IPHONE_UA"
          capture rise-desktop-1440x1000 1440 1000 ''

          {
            echo "source_sha=${SOURCE_SHA}"
            echo "page_url=${PAGE_URL}"
            echo "captured_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "mobile=rise-mobile-390x844.png"
            echo "desktop=rise-desktop-1440x1000.png"
            sha256sum visual-evidence/rise-mobile-390x844.png
            sha256sum visual-evidence/rise-desktop-1440x1000.png
          } > visual-evidence/manifest.txt

      - name: Validate stable hydrated production UI
        run: |
          set -euo pipefail
          python3 - visual-evidence/rise-mobile-390x844.html visual-evidence/rise-desktop-1440x1000.html <<'PY'
          from html.parser import HTMLParser
          import sys

          class RiseParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack=[]
                  self.skip=0
                  self.html_attrs={}
                  self.stable_depth=None
                  self.stable_hidden=False
                  self.hydrated_in_stable=False
                  self.login_setup=False
                  self.text=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  self.stack.append((tag,a))
                  if tag in ('script','style'):
                      self.skip += 1
                  if tag=='html':
                      self.html_attrs=a
                  if a.get('id')=='aaLoginSetup':
                      self.login_setup=True
                  if tag=='main' and a.get('id')=='riseStableMain':
                      self.stable_depth=len(self.stack)
                      self.stable_hidden='hidden' in a
                  if tag=='section' and self.stable_depth is not None and len(self.stack)>self.stable_depth:
                      classes=set((a.get('class') or '').split())
                      if 'riseHomeV4' in classes and a.get('data-ui-ver')=='4.2.0':
                          self.hydrated_in_stable=True
              def handle_endtag(self,tag):
                  if tag in ('script','style') and self.skip:
                      self.skip -= 1
                  if self.stable_depth is not None and len(self.stack)==self.stable_depth and tag=='main':
                      self.stable_depth=None
                  if self.stack:
                      self.stack.pop()
              def handle_data(self,data):
                  if not self.skip:
                      s=' '.join(data.split())
                      if s:
                          self.text.append(s)

          required_text=['Rise','今日の学習','教科別の達成度','ホーム','学習','復習','記録']
          for path in sys.argv[1:]:
              p=RiseParser()
              with open(path,encoding='utf-8') as f:
                  p.feed(f.read())
              text=' '.join(p.text)
              errors=[]
              if p.html_attrs.get('data-rise-structure')!='optimized-4': errors.append('optimized-4 missing')
              if p.html_attrs.get('data-rise-stable-ready')!='1': errors.append('stable-ready missing')
              if p.html_attrs.get('data-rise-runtime-error'): errors.append('runtime-error present')
              if not p.hydrated_in_stable: errors.append('hydrated Rise home is not inside #riseStableMain')
              if p.stable_hidden: errors.append('#riseStableMain is hidden')
              if p.login_setup: errors.append('login setup overlay present')
              for token in required_text:
                  if token not in text: errors.append(f'text missing: {token}')
              if errors:
                  raise SystemExit(f'{path}: ' + '; '.join(errors))
              print(f'STABLE_DOM_OK {path}')
          PY
          echo 'result=success' >> visual-evidence/manifest.txt
          echo 'dom_gate=Rise+stable-root+hydrated-4.2-dashboard+today+subjects+four-nav+no-runtime-error+no-login-setup' >> visual-evidence/manifest.txt
          cat visual-evidence/manifest.txt

      - name: Upload production screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rise-production-screenshots-${{ steps.source.outputs.source_sha }}
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Visual verification summary
        if: success()
        run: |
          {
            echo '## Rise production visual evidence'
            echo ''
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Mobile: \`390x844\` / iPhone User-Agent"
            echo "- Desktop: \`1440x1000\`"
            echo '- Japanese Noto CJK fonts installed before rendering.'
            echo '- DOM parser requires the hydrated Rise 4.2 dashboard to exist inside the independent stable root.'
            echo '- PNG signature, exact dimensions, and minimum file size validated.'
            echo '- Screenshots and rendered DOM are stored in the rise-production-screenshots artifact.'
            echo ''
            echo '> UI changes are not considered visually complete until these screenshots are reviewed.'
          } >> "$GITHUB_STEP_SUMMARY"
