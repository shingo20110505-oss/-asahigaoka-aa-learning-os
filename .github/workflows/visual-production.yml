name: Rise production visual verification

on:
  workflow_run:
    workflows: ["Deploy AA Learning OS to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rise-production-visual
  cancel-in-progress: true

jobs:
  visual:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve published source
        id: source
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${WORKFLOW_SHA:-$GITHUB_SHA}"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "PAGE_URL=https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/" >> "$GITHUB_ENV"

      - name: Checkout exact published source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 1

      - name: Wait for exact production release
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 24); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${PAGE_URL}release.json?visual=${SOURCE_SHA}-${n}" -o /tmp/release.json && grep -q "${SOURCE_SHA}" /tmp/release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          grep -q '"management": "validated-main-direct-to-pages"' /tmp/release.json
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}app/ui/rise-ui-v4.js?visual_asset=${SOURCE_SHA}" -o /tmp/rise-ui-v4.js
          grep -q "version:'4.2.0'" /tmp/rise-ui-v4.js
          grep -q 'function homeHTML' /tmp/rise-ui-v4.js
          grep -q 'function subjectsHTML' /tmp/rise-ui-v4.js
          grep -q 'function analyticsHTML' /tmp/rise-ui-v4.js
          grep -q 'function settingsHTML' /tmp/rise-ui-v4.js
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}app/ui/rise-stable-root-v4.js?visual_asset=${SOURCE_SHA}" -o /tmp/rise-stable-root-v4.js
          grep -q "version:'2.3.0'" /tmp/rise-stable-root-v4.js
          grep -q "prewarm:'none-on-demand'" /tmp/rise-stable-root-v4.js
          ! grep -q 'warmPrimary' /tmp/rise-stable-root-v4.js
          ! grep -q 'clickUnderlying' /tmp/rise-stable-root-v4.js
          grep -q "reviewNavigation:'canonical-page'" /tmp/rise-stable-root-v4.js
          grep -q 'goReview' /tmp/rise-stable-root-v4.js
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}index.html?visual_asset=${SOURCE_SHA}" -o /tmp/index.html
          grep -q 'rise-stable-root-v4.js?v=2.3.0' /tmp/index.html
          grep -q 'pwa-runtime.js?v=4.2.1' /tmp/index.html
          node --check scripts/rise-visual-cdp.mjs

      - name: Install Japanese rendering fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'sans-serif:lang=ja'

      - name: Capture and validate all production screens via CDP
        env:
          VISUAL_OUT: visual-evidence
        run: |
          set -euo pipefail
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME_PATH"
          export CHROME_PATH
          rm -rf visual-evidence
          node scripts/rise-visual-cdp.mjs
          grep -q '^result=success$' visual-evidence/manifest.txt
          grep -q '^cold_start_home=success$' visual-evidence/manifest.txt
          grep -q '^settings_menu_navigation=success$' visual-evidence/manifest.txt
          grep -q '^review_canonical_click_navigation=success$' visual-evidence/manifest.txt
          test "$(find visual-evidence -maxdepth 1 -name '*.png' | wc -l)" -eq 10
          test "$(find visual-evidence -maxdepth 1 -name '*.html' | wc -l)" -eq 10
          cat visual-evidence/manifest.txt

      - name: Upload production screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rise-production-all-screens-${{ steps.source.outputs.source_sha }}
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Visual verification summary
        if: success()
        run: |
          {
            echo '## Rise production visual evidence'
            echo ''
            echo "- Source: \`${SOURCE_SHA}\`"
            echo '- Screens: home / study / record / settings / review'
            echo '- Mobile: `390x844` / iPhone User-Agent'
            echo '- Desktop: `1440x1000`'
            echo '- Chrome DevTools Protocol waits for the actual visible Rise ready state.'
            echo '- No hidden route-prewarm clicks are allowed; HOME must remain HOME on cold start.'
            echo '- Study and Record are opened by their real bottom-navigation buttons.'
            echo '- Settings is opened through the real hamburger menu and Settings item.'
            echo '- Review is clicked from the main app and must navigate to the canonical `/review/` page.'
            echo '- Each route starts from a fresh browser profile and stores both DOM HTML and PNG evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
