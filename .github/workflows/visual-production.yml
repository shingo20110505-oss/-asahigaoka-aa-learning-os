name: Rise production visual verification

on:
  workflow_run:
    workflows: ["Deploy AA Learning OS to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rise-production-visual
  cancel-in-progress: true

jobs:
  visual:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve published source
        id: source
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${WORKFLOW_SHA:-$GITHUB_SHA}"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "PAGE_URL=https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/" >> "$GITHUB_ENV"

      - name: Checkout exact published source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 1

      - name: Wait for exact production release
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 24); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${PAGE_URL}release.json?visual=${SOURCE_SHA}-${n}" -o /tmp/release.json && grep -q "${SOURCE_SHA}" /tmp/release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          grep -q '"management": "validated-main-direct-to-pages"' /tmp/release.json
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}index.html?visual_asset=${SOURCE_SHA}" -o /tmp/index.html
          grep -q 'navigation-runtime-v1.js?v=1.0.3' /tmp/index.html
          grep -q 'pwa-runtime.js?v=4.3.0' /tmp/index.html
          grep -q 'legacy-controller-reload-guard-v1.js?v=1.0.0' /tmp/index.html
          grep -q 'rise-legacy-shell-guard-v1.js?v=1.0.0' /tmp/index.html
          ! grep -q '<script src="./app/ui/rise-stable-root-v4.js' /tmp/index.html
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}app/navigation/navigation-runtime-v1.js?visual_asset=${SOURCE_SHA}" -o /tmp/rise-nav.js
          grep -q "version:'1.0.3'" /tmp/rise-nav.js
          grep -q "uiSync:'preconceal-all-settings-legacy-renders-and-deterministic-multiphase-rise-recovery'" /tmp/rise-nav.js
          grep -q 'stopImmediatePropagation' /tmp/rise-nav.js
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}app/ui/rise-information-architecture-v1.js?visual_asset=${SOURCE_SHA}" -o /tmp/rise-ia.js
          grep -q "version:'1.0.0'" /tmp/rise-ia.js
          grep -q "publicTabs:\['ホーム','入試','学習','復習'\]" /tmp/rise-ia.js
          grep -q "generalPractice:'removed-from-public-ui'" /tmp/rise-ia.js
          curl -fsSL --connect-timeout 10 --max-time 30 "${PAGE_URL}social-exam/bridge.js?visual_asset=${SOURCE_SHA}" -o /tmp/social-bridge.js
          grep -q 'legacyGenericFallback:false' /tmp/social-bridge.js
          node --check scripts/rise-visual-ia-v1.mjs

      - name: Install Japanese rendering fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match 'sans-serif:lang=ja'

      - name: Capture final Rise information architecture via CDP
        env:
          VISUAL_OUT: visual-evidence
        run: |
          set -euo pipefail
          CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME_PATH"
          export CHROME_PATH
          rm -rf visual-evidence
          node scripts/rise-visual-ia-v1.mjs
          grep -q '^result=success$' visual-evidence/manifest.txt
          grep -q '^cold_start_home=success$' visual-evidence/manifest.txt
          grep -q '^single_navigation_owner=success$' visual-evidence/manifest.txt
          grep -q '^single_live_dom=success$' visual-evidence/manifest.txt
          grep -q '^no_unexpected_document_navigation=success$' visual-evidence/manifest.txt
          grep -q '^route_switch_stress=success$' visual-evidence/manifest.txt
          grep -q '^settings_menu_navigation=success$' visual-evidence/manifest.txt
          grep -q '^legacy_shell_never_visible=success$' visual-evidence/manifest.txt
          grep -q '^review_canonical_click_navigation=success$' visual-evidence/manifest.txt
          grep -q '^unique_screen_pixels=success$' visual-evidence/manifest.txt
          grep -q '^public_navigation=ホーム/入試/学習/復習$' visual-evidence/manifest.txt
          grep -q '^general_practice_public_ui=removed$' visual-evidence/manifest.txt
          test "$(find visual-evidence -maxdepth 1 -name '*.png' | wc -l)" -eq 10
          test "$(find visual-evidence -maxdepth 1 -name '*.html' | wc -l)" -eq 10
          cat visual-evidence/manifest.txt

      - name: Upload production screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rise-production-all-screens-${{ steps.source.outputs.source_sha }}
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Visual verification summary
        if: success()
        run: |
          {
            echo '## Rise production visual evidence'
            echo ''
            echo "- Source: \`${SOURCE_SHA}\`"
            echo '- Navigation owner: `app/navigation/navigation-runtime-v1.js` only'
            echo '- Public navigation: `ホーム / 入試 / 学習 / 復習`'
            echo '- Home is the analytics and next-action command center.'
            echo '- Entrance exam contains learner-facing exam practice; low-quality generic middle-school practice is not exposed.'
            echo '- Learning contains fixed-data vocabulary and Chronologia resources.'
            echo '- Review remains the canonical `/review/` page.'
            echo '- Mobile: `390x844` / iPhone User-Agent'
            echo '- Desktop: `1440x1000`'
          } >> "$GITHUB_STEP_SUMMARY"
