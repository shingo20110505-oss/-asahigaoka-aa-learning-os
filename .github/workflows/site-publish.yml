name: Validate and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-os-pages
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0

      - name: Validate review data and routing
        working-directory: source
        run: |
          node scripts/validate-review-bank.mjs
          node scripts/validate-review-ui.mjs

      - name: Validate login voice, images and runtime assets
        working-directory: source
        run: node scripts/validate-runtime-assets.mjs

      - name: Syntax-check critical runtime JavaScript
        working-directory: source
        run: |
          for f in \
            aa-companion-v2.js \
            aa-companion-mobile-fix.js \
            companion7-runtime.js \
            login-companion-v1.js \
            login-production-test-v1.js \
            review-bank-v1.js \
            review-page-v1.js \
            sw.js; do
            node --check "$f"
          done

      - name: Publish the exact validated commit
        working-directory: source
        run: git push origin HEAD:refs/heads/gh-pages --force

      - name: Verify branch identity
        working-directory: source
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')
          echo "validated main: $LOCAL"
          echo "published gh-pages: $REMOTE"
          test "$LOCAL" = "$REMOTE"
