name: Add review item - kuchi ji atawazu 20260822

on:
  push:
    paths:
      - '.github/workflows/review-add-kuchi-atawazu-20260822.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-review-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Add review item safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('review-bank-v1.js')
          s = path.read_text(encoding='utf-8')
          item_id = 'ja-kanbun-kuchi-ji-atawazu-20260822'
          if item_id in s:
              raise SystemExit('ID already exists; refusing duplicate')
          old_version = "window.AA_REVIEW_BANK_VERSION='1.0.40';"
          new_version = "window.AA_REVIEW_BANK_VERSION='1.0.41';"
          if old_version not in s:
              raise SystemExit('Expected review bank version 1.0.40 not found; refusing unsafe edit')
          image_path = Path('review/assets/20260822-kobun-kuchi-atawazu.jpg')
          if not image_path.is_file() or image_path.stat().st_size == 0:
              raise SystemExit('Review image is missing or empty')
          item = "  {id:'ja-kanbun-kuchi-ji-atawazu-20260822',subject:'国語',unit:'漢文・語句・書き下し',title:'「口、辞を出だすこと能はず」の意味',question:'「口、辞を出だすこと能はず」の意味として最も適当なものを選びなさい。ア：言葉を出すことができないように無口だった。イ：自分から去っていった。ウ：将軍をやめることはできなかった。エ：いつも何か話したがった。',image:'assets/20260822-kobun-kuchi-atawazu.jpg',imageAlt:'問題集の該当箇所。「口、辞を出だすこと能はず」の意味をア〜エから選ぶ問題。',answer:'ア。「言葉を出すことができないように無口だった。」',why:'「辞」はここでは「ことば」、「出だす」は「出す」、「能はず（あたはず）」は「〜することができない」という意味です。したがって「口、辞を出だすこと能はず」＝「口から言葉を出すことができない」＝「何も言えない・無口である」となります。',examples:['辞（ことば）＝言葉','出だす＝出す','能はず（あたはず）＝〜することができない','口、辞を出だすこと能はず → 口から言葉を出すことができない'],memory:'能はず＝できない。辞＝ことば。→「口から言葉を出せない」のでア',tags:['国語','漢文','辞','ことば','能はず','あたはず','書き下し','語句','選択問題'],createdAt:'2026-08-22'},\n"
          marker = "\n];\nfunction normalize"
          if marker not in s:
              raise SystemExit('Review bank insertion marker not found')
          s = s.replace(marker, "\n" + item + "];\nfunction normalize", 1)
          s = s.replace(old_version, new_version, 1)
          path.write_text(s, encoding='utf-8')
          out = path.read_text(encoding='utf-8')
          if out.count(item_id) != 1:
              raise SystemExit('New review ID count is not exactly 1')
          if "id:'sci-kanji-haihou-20260822'" not in out:
              raise SystemExit('Latest existing review item disappeared; refusing commit')
          if new_version not in out:
              raise SystemExit('Version bump failed')
          print('review-bank update validated')
          PY

      - name: Commit review-bank update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-bank-v1.js
          git diff --cached --check
          git commit -m "Add review: 口、辞を出だすこと能はず"
          git pull --rebase origin main
          git push origin HEAD:main
