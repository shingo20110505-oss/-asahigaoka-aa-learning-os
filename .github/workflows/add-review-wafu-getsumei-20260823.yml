name: Add review card - wafu month names 20260823

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-review-wafu-getsumei-20260823.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  add-review-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard and patch canonical review bank
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BLOB_SHA='22385df78522ff755865e931d036591cbc5e7785'
          ACTUAL_BLOB_SHA="$(git hash-object review-bank-v1.js)"
          test "$ACTUAL_BLOB_SHA" = "$EXPECTED_BLOB_SHA" || { echo "review-bank-v1.js changed: expected $EXPECTED_BLOB_SHA got $ACTUAL_BLOB_SHA"; exit 1; }

          python3 - <<'PY'
          from pathlib import Path

          path = Path('review-bank-v1.js')
          text = path.read_text(encoding='utf-8')
          item_id = 'ja-koten-wafu-getsumei-20260823'
          old_version = "window.AA_REVIEW_BANK_VERSION='1.0.42';"
          new_version = "window.AA_REVIEW_BANK_VERSION='1.0.43';"
          marker = "\n];\nfunction normalize"

          if item_id in text:
              raise SystemExit(f'duplicate id already exists: {item_id}')
          if text.count(old_version) != 1:
              raise SystemExit('expected AA_REVIEW_BANK_VERSION 1.0.42 exactly once')
          if text.count(marker) != 1:
              raise SystemExit('review-bank insertion marker not unique')

          item = "  {id:'ja-koten-wafu-getsumei-20260823',subject:'国語',unit:'古文・暦・和風月名',title:'和風月名（睦月〜師走）と旧暦のずれ',question:'旧暦の1月〜12月の和風月名を順に答えなさい。また、現代の新暦の1月〜12月とそのまま一致するか。',answer:'1月 睦月（むつき）、2月 如月（きさらぎ）、3月 弥生（やよい）、4月 卯月（うづき）、5月 皐月（さつき）、6月 水無月（みなづき）、7月 文月（ふみづき）、8月 葉月（はづき）、9月 長月（ながつき）、10月 神無月（かんなづき）、11月 霜月（しもつき）、12月 師走（しわす）。これらは旧暦の月名なので、現代の新暦の同じ月と日付・季節感が完全に一致するわけではない。',why:'睦月・如月などの和風月名は、もともと旧暦（太陰太陽暦）の各月を表す名称です。旧暦の月初は新暦の月初と一致せず、年によって対応する新暦の日付も変わります。さらに旧暦には閏月が入る年もあります。そのため、学校で「1月＝睦月、2月＝如月…」と覚えるのは旧暦での月番号の対応であり、「新暦1月の全期間＝睦月」という意味ではありません。',examples:['旧暦1月＝睦月、旧暦2月＝如月、…、旧暦12月＝師走','順番：睦月→如月→弥生→卯月→皐月→水無月→文月→葉月→長月→神無月→霜月→師走','旧暦1月（睦月）は、現代の新暦1月そのものではない。対応する新暦の日付は年によってずれる。','旧暦には閏月が入る年があるため、新暦との対応は固定できない。'],memory:'睦・如・弥・卯・皐・水・文・葉・長・神・霜・師。和風月名は旧暦なので、新暦の同じ月と完全一致しない。',tags:['国語','古文','旧暦','和風月名','睦月','如月','弥生','卯月','皐月','水無月','文月','葉月','長月','神無月','霜月','師走'],createdAt:'2026-08-23'},"

          text = text.replace(marker, '\n' + item + marker, 1)
          text = text.replace(old_version, new_version, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node - <<'NODE'
          global.window = {};
          require('./review-bank-v1.js');
          const id = 'ja-koten-wafu-getsumei-20260823';
          if (!window.AA_REVIEW_BANK_BY_ID[id]) throw new Error('new review item missing');
          if (window.AA_REVIEW_BANK_VERSION !== '1.0.43') throw new Error('review bank version mismatch');
          const ids = window.AA_REVIEW_BANK.map(x => x.id);
          if (new Set(ids).size !== ids.length) throw new Error('duplicate review IDs detected');
          console.log('review card validated:', id, 'version', window.AA_REVIEW_BANK_VERSION, 'items', ids.length);
          NODE

      - name: Commit canonical update and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-review-wafu-getsumei-20260823.yml
          git add -A review-bank-v1.js .github/workflows/add-review-wafu-getsumei-20260823.yml
          git commit -m 'review: add Japanese traditional month names and lunar-calendar offset'
          git push origin HEAD:main
          echo "PATCH_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch Pages deploy for patched main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" -f ref=main
          echo "Dispatched deploy-pages.yml for ${PATCH_COMMIT}"
