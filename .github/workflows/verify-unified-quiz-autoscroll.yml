name: Verify unified quiz auto-scroll on Pages

on:
  push:
    branches: [main]
    paths:
      - '.verify-unified-quiz-autoscroll-trigger'
      - 'quiz/index.html'
      - 'quiz/auto-scroll-v1.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify production unified quiz auto-scroll
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
        run: |
          set -euo pipefail
          EXPECTED_JS_SHA=$(sha256sum quiz/auto-scroll-v1.js | awk '{print $1}')

          ready=0
          for n in $(seq 1 48); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${BASE}release.json?unified-quiz=${SOURCE_SHA}-${n}" -o /tmp/release.json \
              && grep -q "${SOURCE_SHA}" /tmp/release.json; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1

          curl -fsSL --connect-timeout 10 --max-time 25 "${BASE}quiz/?unified-quiz=${SOURCE_SHA}" -o /tmp/quiz.html
          grep -q './auto-scroll-v1.js?v=1.2.0' /tmp/quiz.html
          grep -q 'id="studyCard"' /tmp/quiz.html
          grep -q 'id="nextQuestion"' /tmp/quiz.html

          curl -fsSL --connect-timeout 10 --max-time 25 "${BASE}quiz/auto-scroll-v1.js?unified-quiz=${SOURCE_SHA}" -o /tmp/auto-scroll.js
          ACTUAL_JS_SHA=$(sha256sum /tmp/auto-scroll.js | awk '{print $1}')
          test "$ACTUAL_JS_SHA" = "$EXPECTED_JS_SHA"
          grep -q "document.addEventListener('click',event=>" /tmp/auto-scroll.js
          grep -q "scrollAfterQuestionChanges(marker())" /tmp/auto-scroll.js
          grep -q "requestAnimationFrame" /tmp/auto-scroll.js

          echo "Unified quiz production auto-scroll verification succeeded."
