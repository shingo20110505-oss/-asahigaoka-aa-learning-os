name: Temporary final math ownership patch

on:
  push:
    branches: [fix-math-ownership-final-20260903]
    paths: ['.github/workflows/fix-math-ownership-final-temp.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-math-ownership-final-20260903
          fetch-depth: 0
      - name: Enforce verified math ownership across legacy layers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('question-quality-v1.js')
          s=p.read_text()
          old="if(typeof makeMathQ==='function')makeMathQ=(d=7)=>adaptive('math',d);"
          new="if(typeof makeMathQ==='function'&&window.AAMathFullReplacement?.ok!==true)makeMathQ=(d=7)=>adaptive('math',d);"
          if s.count(old)!=1: raise SystemExit(f'question-quality math hook count={s.count(old)}')
          p.write_text(s.replace(old,new))

          p=Path('difficulty-engine-v1.js')
          s=p.read_text()
          old="if(originals.math)makeMathQ=(d=currentD())=>exactQuestion('math',d)||originals.math(d);"
          new="if(originals.math&&window.AAMathFullReplacement?.ok!==true)makeMathQ=(d=currentD())=>exactQuestion('math',d)||originals.math(d);"
          if s.count(old)!=1: raise SystemExit(f'difficulty math hook count={s.count(old)}')
          p.write_text(s.replace(old,new))

          p=Path('tests/architecture-boundaries.mjs')
          s=p.read_text()
          marker="console.log('architecture-boundaries: PASS');"
          guard="""const qQuality=fs.readFileSync('question-quality-v1.js','utf8');\nif(!qQuality.includes(\"typeof makeMathQ==='function'&&window.AAMathFullReplacement?.ok!==true\"))throw new Error('Question quality may override verified mathematics ownership');\nconst difficulty=fs.readFileSync('difficulty-engine-v1.js','utf8');\nif(!difficulty.includes(\"originals.math&&window.AAMathFullReplacement?.ok!==true\"))throw new Error('Difficulty engine may override verified mathematics ownership');\n"""
          if guard.strip() not in s:
              if marker not in s: raise SystemExit('architecture marker missing')
              s=s.replace(marker,guard+marker)
              p.write_text(s)
          PY
          node --check question-quality-v1.js
          node --check difficulty-engine-v1.js
          node tests/architecture-boundaries.mjs
          node scripts/validate-math.mjs
      - name: Verify exact browser runtime locally
        run: |
          set -euo pipefail
          python3 -m http.server 8123 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          timeout 120s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --user-data-dir=/tmp/aa-math-final --virtual-time-budget=60000 --dump-dom 'http://127.0.0.1:8123/?aa_quality_ci=1&verify=math-final' > /tmp/dom.html
          grep -o 'AA_QUALITY_CI=[^<]*' /tmp/dom.html
          grep -q 'data-aa-quality-ci="PASS"' /tmp/dom.html
      - name: Commit final ownership patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question-quality-v1.js difficulty-engine-v1.js tests/architecture-boundaries.mjs
          git commit -m 'Lock verified math ownership across legacy quality layers'
          git push origin HEAD:fix-math-ownership-final-20260903
