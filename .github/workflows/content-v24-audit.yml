name: Content V24 Five Subject Audit

on:
  push:
    branches: [main]
    paths:
      - 'curriculum-expansion-v24.js'
      - 'source-quote-bank-v1.js'
      - 'scripts/content-v24-audit.js'
      - 'v23-loader.js'
      - '.github/workflows/content-v24-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check content banks
        run: |
          node --check curriculum-expansion-v24.js
          node --check source-quote-bank-v1.js
          node --check scripts/content-v24-audit.js
      - name: Audit five-subject expansion
        run: node scripts/content-v24-audit.js | tee CONTENT_V24_AUDIT.txt
      - name: Persist audit report
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CONTENT_V24_AUDIT.txt || true
          git diff --cached --quiet || git commit -m "Record V24 five-subject content audit"
          git push || true
