name: RISE authenticated PC relay
on:
  push:
    branches: [main, codex/rise-rebuild]
    paths: ['relay/**', 'bridge/**', 'src/**', 'data/**', 'scripts/**', 'tests/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/relay.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rise-pc-relay
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Publish relay and static allowlist, provision private host secret via stdin
        run: node scripts/deploy-relay.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RISE_RELAY_TOKEN: ${{ secrets.RISE_RELAY_TOKEN }}
