name: Verify Kokugo Quiz Tap 20260819 V2

on:
  push:
    paths:
      - '.github/workflows/verify-kokugo-quiz-tap-20260819-v2.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify and record production behavior
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BASE: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
        run: |
          set +e
          STATUS=success
          DETAIL=all_checks_passed
          PUBLIC_HTML=unknown
          PUBLIC_ASSET_HASH=unknown
          LIVE_AUDIT=unknown
          AUDIT_LINE=''

          # Wait until GitHub Pages identifies this exact source commit.
          RELEASE_OK=0
          for n in $(seq 1 60); do
            curl -fsSL --connect-timeout 8 --max-time 20 "${BASE}release.json?kokugo_tap_v2=${SOURCE_SHA}-${n}" -o /tmp/release.json
            if [ $? -eq 0 ] && grep -q "${SOURCE_SHA}" /tmp/release.json; then
              RELEASE_OK=1
              break
            fi
            sleep 5
          done
          if [ "$RELEASE_OK" != 1 ]; then STATUS=failure; DETAIL=release_marker_timeout; fi

          if [ "$STATUS" = success ]; then
            curl -fsSL "${BASE}kokugo-chronologia/?kokugo_tap_v2=${SOURCE_SHA}" -o /tmp/public-index.html
            if [ $? -eq 0 ] && [ "$(grep -o 'quiz-interaction-fix.js?v=20260819-1' /tmp/public-index.html | wc -l)" = 1 ]; then
              PUBLIC_HTML=pass
            else
              PUBLIC_HTML=fail; STATUS=failure; DETAIL=public_html_loader_missing
            fi
          fi

          if [ "$STATUS" = success ]; then
            curl -fsSL "${BASE}kokugo-chronologia/quiz-interaction-fix.js?kokugo_tap_v2=${SOURCE_SHA}" -o /tmp/public-fix.js
            SRC_HASH=$(sha256sum kokugo-chronologia/quiz-interaction-fix.js | awk '{print $1}')
            PUB_HASH=$(sha256sum /tmp/public-fix.js 2>/dev/null | awk '{print $1}')
            if [ -n "$PUB_HASH" ] && [ "$SRC_HASH" = "$PUB_HASH" ]; then
              PUBLIC_ASSET_HASH=pass
            else
              PUBLIC_ASSET_HASH=fail; STATUS=failure; DETAIL=public_asset_hash_mismatch
            fi
          fi

          if [ "$STATUS" = success ]; then
            CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
            if [ -z "$CHROME" ]; then
              LIVE_AUDIT=fail; STATUS=failure; DETAIL=chrome_not_found
            else
              rm -rf "/tmp/aa-kokugo-quiz-ui-v2-${SOURCE_SHA}"
              timeout 120s "$CHROME" \
                --headless=new \
                --no-sandbox \
                --disable-gpu \
                --disable-dev-shm-usage \
                --window-size=390,844 \
                --user-data-dir="/tmp/aa-kokugo-quiz-ui-v2-${SOURCE_SHA}" \
                --virtual-time-budget=80000 \
                --dump-dom "${BASE}kokugo-chronologia/?aa_quiz_ui_ci=1&verify=${SOURCE_SHA}&v2=1" > /tmp/kokugo-runtime.html 2>/tmp/chrome.err
              RC=$?
              AUDIT_LINE=$(grep -o 'AA_KOKUGO_QUIZ_UI=[^<]*' /tmp/kokugo-runtime.html | tail -1 | tr '\n' ' ')
              if [ $RC -eq 0 ] && grep -q 'AA_KOKUGO_QUIZ_UI=PASS' /tmp/kokugo-runtime.html && grep -q '"graded":true' /tmp/kokugo-runtime.html && grep -q '"nextVisible":true' /tmp/kokugo-runtime.html && grep -q '"realTouchCapture":true' /tmp/kokugo-runtime.html; then
                LIVE_AUDIT=pass
              else
                LIVE_AUDIT=fail; STATUS=failure; DETAIL=live_mobile_audit_failed
              fi
            fi
          fi

          cat > KOKUGO_QUIZ_TAP_VERIFY_STATUS.txt <<EOF
          status=${STATUS}
          public_verify=$([ "$STATUS" = success ] && echo success || echo failure)
          release_marker=$([ "$RELEASE_OK" = 1 ] && echo pass || echo fail)
          public_html_loader=${PUBLIC_HTML}
          public_asset_hash=${PUBLIC_ASSET_HASH}
          live_mobile_quiz_tap=${LIVE_AUDIT}
          audit=${AUDIT_LINE}
          detail=${DETAIL}
          verified_source_sha=${SOURCE_SHA}
          verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add KOKUGO_QUIZ_TAP_VERIFY_STATUS.txt
          git commit -m "Record Kokugo quiz tap production verification V2 (${STATUS})"
          git push origin HEAD:main

          [ "$STATUS" = success ]
