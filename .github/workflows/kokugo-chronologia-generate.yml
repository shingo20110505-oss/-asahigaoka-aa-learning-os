name: Generate Kokugo Chronologia Data

on:
  push:
    paths:
      - '.kokugo-chronologia-generate-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 15000-entry local dataset
        run: |
          python - <<'PY'
          import json, re, urllib.request, pathlib, datetime
          urls=[
            'https://raw.githubusercontent.com/jpndium/jmdict/main/data/001.jsonl',
            'https://raw.githubusercontent.com/jpndium/jmdict/main/data/002.jsonl',
            'https://raw.githubusercontent.com/jpndium/jmdict/main/data/003.jsonl',
          ]
          TARGET=15000; all_items={}
          def text(x):
            if isinstance(x,str): return x
            if isinstance(x,dict): return str(x.get('text') or x.get('value') or x.get('keb') or x.get('reb') or '')
            return ''
          def arr(o,*keys):
            if not isinstance(o,dict): return []
            for k in keys:
              if isinstance(o.get(k),list): return o[k]
            return []
          def is_han(c):
            n=ord(c); return 0x3400<=n<=0x4DBF or 0x4E00<=n<=0x9FFF or 0xF900<=n<=0xFAFF or 0x20000<=n<=0x2FA1F
          def four_han(s): return len(s)==4 and all(is_han(c) for c in s)
          def gloss(e):
            for s in arr(e,'sense','senses'):
              g=[text(x) for x in arr(s,'gloss','glosses')]; g=[x for x in g if x]
              if g:return ' / '.join(g[:3])
            return ''
          for url in urls:
            req=urllib.request.Request(url,headers={'User-Agent':'AA-Learning-OS-Kokugo-Generator/1.2'})
            with urllib.request.urlopen(req,timeout=120) as r:
              for raw in r:
                line=raw.decode('utf-8').strip()
                if not line:continue
                e=json.loads(line)
                ks=[text(x) for x in arr(e,'k_ele','kanji','kanjiElements')]; ks=[x for x in ks if x]
                rs=[text(x) for x in arr(e,'r_ele','kana','kanaElements','reading')]; rs=[x for x in rs if x]
                term=ks[0] if ks else (rs[0] if rs else '')
                if not term:continue
                reading=rs[0] if rs else ''; labels=[]
                for s in arr(e,'sense','senses'): labels.extend(text(x) for x in arr(s,'misc','miscellaneous'))
                m=' | '.join(x for x in labels if x).lower()
                strict=bool('&yoji;' in m or 'four-character idiomatic' in m or 'yojijukugo' in m or re.search(r'(^|[^a-z])yoji([^a-z]|$)',m))
                idiom=bool('&id;' in m or 'idiomatic expression' in m or 'idiom' in m)
                four=four_han(term)
                if not(strict or idiom or four):continue
                key=term+'|'+reading
                all_items.setdefault(key,{'id':str(e.get('ent_seq') or key),'term':term,'reading':reading,'meaning':gloss(e),'type':'yoji' if strict else ('idiom' if idiom else 'four'),'strict':strict,'idiom':idiom,'four':four})
          vals=list(all_items.values()); keyfn=lambda x:(x.get('reading') or x['term'],x['term'])
          strict=sorted((x for x in vals if x['strict']),key=keyfn)
          idioms=sorted((x for x in vals if x['idiom'] and not x['strict']),key=keyfn)
          broad=sorted((x for x in vals if x['four'] and not x['strict'] and not x['idiom']),key=keyfn)
          selected=(strict+idioms+broad)[:TARGET]; selected.sort(key=keyfn)
          if len(selected)<10000:raise SystemExit(f'eligible dataset too small: {len(selected)}')
          out=pathlib.Path('kokugo-chronologia'); out.mkdir(exist_ok=True)
          (out/'data.jsonl').write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in selected)+'\n',encoding='utf-8')
          old=out/'data.json'
          if old.exists():old.unlink()
          stats={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'jpndium/jmdict (JMdict/EDRDG derived)','eligible_total':len(vals),'selected_total':len(selected),'selected_strict_yojijukugo':sum(x['strict'] for x in selected),'selected_idiomatic_expression':sum(x['idiom'] for x in selected),'selected_four_han':sum(x['four'] for x in selected),'minimum_required':10000,'result':'success'}
          (out/'KOKUGO_CHRONOLOGIA_STATUS.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding='utf-8')
          page=out/'index.html'
          s=page.read_text(encoding='utf-8')
          oldconst="const TARGET=10000,KEEP=14000,SOURCES=['https://raw.githubusercontent.com/jpndium/jmdict/main/data/001.jsonl','https://raw.githubusercontent.com/jpndium/jmdict/main/data/002.jsonl','https://raw.githubusercontent.com/jpndium/jmdict/main/data/003.jsonl'];"
          newconst="const TARGET=10000,KEEP=15000,SOURCES=['./data.jsonl'];"
          if oldconst in s:
            s=s.replace(oldconst,newconst)
          elif newconst not in s:
            raise SystemExit('index source declaration did not match expected text')
          s=s.replace('監査済み候補25,314件から最大${KEEP.toLocaleString()}件を軽量表示用に読み込みます。','ローカル収録データ${KEEP.toLocaleString()}件を読み込みました。')
          page.write_text(s,encoding='utf-8')
          print(json.dumps(stats,ensure_ascii=False))
          PY

      - name: Commit generated dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A kokugo-chronologia
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use local 15000-entry Kokugo Chronologia dataset'
          git pull --rebase origin main
          git push origin HEAD:main
