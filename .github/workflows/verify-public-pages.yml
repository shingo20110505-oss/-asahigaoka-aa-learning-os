name: Verify Public GitHub Pages

on:
  push:
    paths:
      - '.verify-public-pages-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Wait for Pages propagation
        run: sleep 30
      - name: Fetch public Chronologia with cache buster
        run: |
          set -euo pipefail
          URL="https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/chronologia.html?cb=$(date +%s)"
          curl -fsSL -H 'Cache-Control: no-cache' "$URL" -o /tmp/public.html
          python - <<'PY'
          import re, hashlib
          h=open('/tmp/public.html',encoding='utf-8',errors='ignore').read()
          title=re.search(r'<title>(.*?)</title>',h,re.S)
          version=re.search(r'const VERSION\s*=\s*["\']([^"\']+)',h)
          ok=('Chronologia 6.3' in h and '6.3.1' in h and 'chronologia-live-companion.js?v=6.3.1' in h and 'chronologia-daily-companion.js?v=6.3.1' in h)
          with open('PUBLIC_PAGE_STATUS.txt','w') as f:
              f.write('OK='+str(ok)+'\n')
              f.write('TITLE='+(title.group(1).strip() if title else 'NONE')+'\n')
              f.write('VERSION='+(version.group(1) if version else 'NONE')+'\n')
              f.write('SHA256='+hashlib.sha256(h.encode()).hexdigest()+'\n')
              f.write('HAS_DAILY_631='+str('chronologia-daily-companion.js?v=6.3.1' in h)+'\n')
              f.write('HAS_LIVE_631='+str('chronologia-live-companion.js?v=6.3.1' in h)+'\n')
          if not ok: raise SystemExit('Public page is not 6.3.1 yet')
          PY
      - name: Commit public verification to gh-pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PUBLIC_PAGE_STATUS.txt
          git commit -m "Record public Chronologia deployment status" || exit 0
          git push origin HEAD:gh-pages
