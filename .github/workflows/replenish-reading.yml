name: Replenish Gemini reading library
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.reading-library-bootstrap']
permissions:
  contents: write
  actions: write
concurrency:
  group: gemini-reading-replenishment
  cancel-in-progress: false
jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing library
        run: node scripts/reading-library.mjs --validate
      - name: Generate and independently verify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          # One candidate can use up to four calls (author + blind verifier,
          # with one retry). Keep daily capacity for the future Japanese bank.
          READING_LIMIT: '1'
        run: node scripts/reading-library.mjs
      - name: Save accepted content and publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/reading-library.mjs --validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-reading-library
          if ! git diff --cached --quiet; then
            git commit -m 'Add verified Gemini readings and replenishment status'
            for n in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$n" = 3 ]; then exit 1; fi
            done
            gh workflow run deploy-pages.yml --ref main
          fi
