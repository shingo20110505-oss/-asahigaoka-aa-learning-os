name: Reading 1000 Naturalness Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reading-1000-audit.js'
      - 'reading-natural-v2.js'
      - 'v23-english-main.js'
      - 'index.html'
      - '.github/workflows/reading-1000-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate and audit 1000 passages
        run: node scripts/reading-1000-audit.js | tee READING_1000_AUDIT.txt
      - name: Persist audit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add READING_1000_AUDIT.txt
          git diff --cached --quiet || git commit -m "Record 1000-pass reading naturalness audit"
          git push
