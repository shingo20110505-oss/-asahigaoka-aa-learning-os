name: Reading 1000 Naturalness Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reading-1000-audit.js'
      - 'reading-natural-v2.js'
      - 'v23-english-main.js'
      - 'index.html'
      - '.github/workflows/reading-1000-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate and audit 1000 passages
        run: node scripts/reading-1000-audit.js
