name: Apply Direct Kokugo Japanese Meanings
on:
  push:
    paths:
      - '.apply-kokugo-direct-ja-trigger'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply assistant-written Japanese meanings
        shell: python
        run: |
          import json,re
          from pathlib import Path
          src=Path('kokugo-chronologia/data.jsonl')
          ov_path=Path('kokugo-chronologia/meaning-overrides-ja.json')
          rows=[json.loads(x) for x in src.read_text(encoding='utf-8').splitlines() if x.strip()]
          overrides=json.loads(ov_path.read_text(encoding='utf-8'))
          before={str(r.get('id')):str(r.get('meaning','')) for r in rows if str(r.get('id')) in overrides}
          seen=set()
          for r in rows:
              k=str(r.get('id'))
              if k in overrides:
                  r['meaning']=overrides[k]
                  seen.add(k)
          missing=set(overrides)-seen
          if missing:
              raise SystemExit(f'override IDs not found: {sorted(missing)[:20]}')
          def english_only(s):
              s=str(s or '')
              return len(re.findall(r'[A-Za-z]',s))>=3 and len(re.findall(r'[ぁ-んァ-ヶ一-龠々〆ヵヶ]',s))==0
          bad=[(k,overrides[k]) for k in overrides if english_only(overrides[k])]
          if bad:
              raise SystemExit(f'Japanese validation failed: {bad[:10]}')
          changed=sum(1 for k,v in before.items() if v!=overrides[k])
          if changed != len(overrides):
              print('warning changed',changed,'overrides',len(overrides))
          src.write_text('\n'.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in rows)+'\n',encoding='utf-8')
          print('Applied',len(overrides),'direct Japanese meanings; changed',changed)
          page=Path('kokugo-chronologia/index.html')
          s=page.read_text(encoding='utf-8')
          s=s.replace("fetch('./data.jsonl',{cache:'force-cache'})","fetch('./data.jsonl?v=direct-ja-1',{cache:'no-cache'})")
          page.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=re.sub(r"const VERSION='[^']+';","const VERSION='2.4.2-quality2-chronologia1000-kokugo-direct-ja-1';",t,count=1)
          sw.write_text(t,encoding='utf-8')
      - name: Validate applied batch
        shell: python
        run: |
          import json,re
          from pathlib import Path
          rows=[json.loads(x) for x in Path('kokugo-chronologia/data.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          overrides=json.loads(Path('kokugo-chronologia/meaning-overrides-ja.json').read_text(encoding='utf-8'))
          by_id={str(r.get('id')):r for r in rows}
          assert len(rows)==15000, len(rows)
          for k,v in overrides.items():
              assert k in by_id, k
              assert by_id[k].get('meaning')==v, (k,by_id[k].get('meaning'),v)
          assert "quality2-chronologia1000" in Path('sw.js').read_text(encoding='utf-8')
          print('Verified',len(overrides),'direct Japanese meanings in 15000-row data')
      - name: Commit and push safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kokugo-chronologia/data.jsonl kokugo-chronologia/index.html sw.js
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'Apply first direct Japanese Kokugo meaning batch'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
