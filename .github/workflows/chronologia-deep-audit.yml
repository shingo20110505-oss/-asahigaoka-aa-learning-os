name: Chronologia Deep Explanation Audit

on:
  push:
    paths:
      - 'chronologia.html'
      - 'chronologia-v7-data-*.js'
      - 'chronologia-v7-overrides.js'
      - 'chronologia-deep-explanations-v3.js'
      - 'chronologia-deep-polish-v1.js'
      - 'chronologia-curated-*.js'
      - 'chronologia-live-companion.js'
      - 'scripts/chronologia-deep-audit.js'
      - 'scripts/chronologia-supplement-export.js'
      - 'scripts/chronologia-core-export.js'
      - '.github/workflows/chronologia-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check runtime syntax
        run: |
          node --check chronologia-live-companion.js
          node --check chronologia-deep-explanations-v3.js
          node --check chronologia-deep-polish-v1.js
          node --check chronologia-curated-501-600.js
          node --check chronologia-curated-601-700.js
          node --check chronologia-curated-701-800.js
          node --check chronologia-curated-801-900.js
          node --check chronologia-curated-901-1000.js
          node --check chronologia-curated-final-fixes.js
          node --check scripts/chronologia-deep-audit.js
          node --check scripts/chronologia-supplement-export.js
          node --check scripts/chronologia-core-export.js
      - name: Expand timeline exports
        run: |
          node scripts/chronologia-supplement-export.js
          node scripts/chronologia-core-export.js
      - name: Audit every timeline explanation
        run: |
          set +e
          node scripts/chronologia-deep-audit.js 2>&1 | tee CHRONOLOGIA_DEEP_AUDIT.txt
          echo "node_exit=${PIPESTATUS[0]}" >> CHRONOLOGIA_DEEP_AUDIT.txt
          exit 0
      - name: Upload audit reports and timeline lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronologia-deep-audit
          path: |
            CHRONOLOGIA_DEEP_AUDIT.txt
            CHRONOLOGIA_SUPPLEMENT_ITEMS.tsv
            CHRONOLOGIA_CORE_ITEMS.tsv
            CHRONOLOGIA_CORE_*.tsv
          if-no-files-found: warn
          retention-days: 14
      - name: Gate detailed explanations
        run: |
          grep -q '"pass":true' CHRONOLOGIA_DEEP_AUDIT.txt
          grep -q '"handCuratedSupplementItems":500' CHRONOLOGIA_DEEP_AUDIT.txt
          grep -q '"curatedDetailUnder70":0' CHRONOLOGIA_DEEP_AUDIT.txt
          grep -q '"curatedTagsUnder3":0' CHRONOLOGIA_DEEP_AUDIT.txt
          grep -q '"supplementGenericDetails":0' CHRONOLOGIA_DEEP_AUDIT.txt
