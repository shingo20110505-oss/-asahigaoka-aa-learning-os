name: Chronologia Deep Explanation Audit

on:
  push:
    paths:
      - 'chronologia.html'
      - 'chronologia-v7-data-*.js'
      - 'chronologia-v7-overrides.js'
      - 'chronologia-deep-explanations-v3.js'
      - 'chronologia-deep-polish-v1.js'
      - 'scripts/chronologia-deep-audit.js'
      - 'scripts/chronologia-supplement-export.js'
      - '.github/workflows/chronologia-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check runtime syntax
        run: |
          node --check chronologia-deep-explanations-v3.js
          node --check chronologia-deep-polish-v1.js
          node --check scripts/chronologia-deep-audit.js
          node --check scripts/chronologia-supplement-export.js
      - name: Expand compressed 500-item supplement
        run: node scripts/chronologia-supplement-export.js
      - name: Audit every timeline explanation
        run: |
          set +e
          node scripts/chronologia-deep-audit.js 2>&1 | tee CHRONOLOGIA_DEEP_AUDIT.txt
          echo "node_exit=${PIPESTATUS[0]}" >> CHRONOLOGIA_DEEP_AUDIT.txt
          exit 0
      - name: Record audit result and supplement list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHRONOLOGIA_DEEP_AUDIT.txt CHRONOLOGIA_SUPPLEMENT_ITEMS.tsv
          git commit -m "Record Chronologia detailed explanation audit" || exit 0
          git pull --rebase origin main
          git push
      - name: Gate detailed explanations
        run: grep -q '"pass":true' CHRONOLOGIA_DEEP_AUDIT.txt
