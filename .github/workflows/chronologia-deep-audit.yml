name: Chronologia Deep Explanation Audit

on:
  push:
    paths:
      - 'chronologia.html'
      - 'chronologia-v7-data-*.js'
      - 'chronologia-v7-overrides.js'
      - 'chronologia-deep-explanations-v1.js'
      - 'scripts/chronologia-deep-audit.js'
      - '.github/workflows/chronologia-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check runtime syntax
        run: |
          node --check chronologia-deep-explanations-v1.js
          node --check scripts/chronologia-deep-audit.js
      - name: Audit every timeline explanation
        run: |
          node scripts/chronologia-deep-audit.js | tee CHRONOLOGIA_DEEP_AUDIT.txt
          grep -q '"pass":true' CHRONOLOGIA_DEEP_AUDIT.txt
      - name: Record audit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHRONOLOGIA_DEEP_AUDIT.txt
          git commit -m "Record Chronologia detailed explanation audit" || exit 0
          git pull --rebase origin main
          git push
