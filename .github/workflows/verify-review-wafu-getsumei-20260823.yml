name: Verify review wafu month names deployment 20260823

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-review-wafu-getsumei-20260823.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-public:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for exact public review bank and deployment verification
        shell: bash
        run: |
          set -euo pipefail
          ID='ja-koten-wafu-getsumei-20260823'
          PUBLIC='https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/review-bank-v1.js'
          EXPECTED_SHA256="$(sha256sum review-bank-v1.js | awk '{print $1}')"
          echo "expected_sha256=$EXPECTED_SHA256"

          ok=0
          for i in $(seq 1 60); do
            tmp="$(mktemp)"
            if curl -fsSL --retry 2 --retry-delay 1 "${PUBLIC}?cb=$(date +%s)-${RANDOM}" -o "$tmp"; then
              got="$(sha256sum "$tmp" | awk '{print $1}')"
              if [ "$got" = "$EXPECTED_SHA256" ] && grep -Fq "$ID" "$tmp" && grep -Fq "AA_REVIEW_BANK_VERSION='1.0.43'" "$tmp"; then
                echo "public review bank matches source and contains $ID"
                ok=1
                rm -f "$tmp"
                break
              fi
              echo "attempt $i public sha=$got expected=$EXPECTED_SHA256"
            fi
            rm -f "$tmp"
            sleep 5
          done
          test "$ok" = 1

          status_ok=0
          for i in $(seq 1 60); do
            git fetch origin main --quiet
            deploy="$(git show origin/main:DEPLOY_STATUS.txt 2>/dev/null || true)"
            public_status="$(git show origin/main:PUBLIC_VERIFY_STATUS.txt 2>/dev/null || true)"
            if printf '%s\n' "$deploy" | grep -Fxq 'public_verify=success' \
              && printf '%s\n' "$deploy" | grep -Fxq 'public_verify_stage=complete' \
              && printf '%s\n' "$public_status" | grep -Eiq '(^|[=_: -])success($|[[:space:]])|status=success|public_verify=success'; then
              echo 'DEPLOY_STATUS and PUBLIC_VERIFY_STATUS report success'
              status_ok=1
              break
            fi
            echo "status attempt $i not complete yet"
            sleep 5
          done
          test "$status_ok" = 1

      - name: Remove one-off verification workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/verify-review-wafu-getsumei-20260823.yml
          git add -A .github/workflows/verify-review-wafu-getsumei-20260823.yml
          git commit -m 'chore: remove one-off review deployment verifier'
          git push origin HEAD:main
