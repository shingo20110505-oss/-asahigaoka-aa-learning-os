name: Unified vocabulary browser audit

on:
  pull_request:
    paths:
      - 'quiz/**'
      - 'kokugo-chronologia/data.jsonl'
      - 'kokugo-chronologia/meaning-ja-overrides.js'
      - 'scripts/verify-unified-vocabulary-public.mjs'
      - 'scripts/audit-unified-vocabulary-quiz.mjs'
      - '.github/workflows/unified-vocabulary-browser-audit.yml'
  push:
    branches: [main]
    paths:
      - 'quiz/**'
      - 'kokugo-chronologia/data.jsonl'
      - 'kokugo-chronologia/meaning-ja-overrides.js'
      - 'scripts/verify-unified-vocabulary-public.mjs'
      - 'scripts/audit-unified-vocabulary-quiz.mjs'
      - '.github/workflows/unified-vocabulary-browser-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Resolve Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Start PR test server
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/unified-vocabulary-server.log 2>&1 &
          echo $! >/tmp/unified-vocabulary-server.pid
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/quiz/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/unified-vocabulary-server.log || true
          exit 1
      - name: Audit PR unified quiz locally
        if: github.event_name == 'pull_request'
        env:
          PAGE_URL: http://127.0.0.1:4173/
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-unified-vocabulary-public.mjs
      - name: Wait for matching Pages release
        if: github.event_name == 'push'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE='https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/'
          for n in $(seq 1 48); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${BASE}release.json?unified=${SOURCE_SHA}-${n}" -o /tmp/unified-release.json; then
              if node -e "const x=require('/tmp/unified-release.json');process.exit(x.sourceSha===process.env.SOURCE_SHA?0:1)"; then
                exit 0
              fi
            fi
            sleep 5
          done
          cat /tmp/unified-release.json 2>/dev/null || true
          exit 1
      - name: Audit deployed unified quiz
        if: github.event_name == 'push'
        env:
          PAGE_URL: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/verify-unified-vocabulary-public.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-vocabulary-browser-qa-${{ github.run_id }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
