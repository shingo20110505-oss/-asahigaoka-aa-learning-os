name: Manual verified pool refill once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-refill-once.yml'

permissions:
  contents: write

concurrency:
  group: manual-verified-pool-refill-once
  cancel-in-progress: false

jobs:
  refill-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RISE_AI_WORKER_URL: https://asahigaoka-aa-ai-reading.shingo-20110505.workers.dev
      AI_ACCESS_TOKEN: ${{ secrets.AI_ACCESS_TOKEN }}
      PUBLIC_POOL_URL: https://shingo20110505-oss.github.io/-asahigaoka-aa-learning-os/verified-question-pool-v1.json
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate pool before refill
        run: node scripts/validate-verified-question-pool.mjs

      - name: Refill all five subjects once
        shell: bash
        run: |
          set -euo pipefail
          for subject in math science social english japanese; do
            echo "=== REFILL ${subject} ==="
            RISE_SUBJECT="$subject" RISE_MAX_PER_RUN=3 node scripts/fill-verified-question-pool.mjs
          done

      - name: Validate updated pool
        run: node scripts/validate-verified-question-pool.mjs

      - name: Commit verified pool
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- verified-question-pool-v1.json; then
            echo 'No verified items were added.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXPECTED_SHA256=$(sha256sum verified-question-pool-v1.json | awk '{print $1}')
          git config user.name 'rise-verified-pool-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add verified-question-pool-v1.json
          git commit -m 'chore(pool): seed verified questions now'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "sha256=$EXPECTED_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify exact pool published on GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.commit.outputs.sha256 }}
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 36); do
            if curl -fsSL --connect-timeout 10 --max-time 25 "${PUBLIC_POOL_URL}?verify=${GITHUB_RUN_ID}-${n}" -o /tmp/public-pool.json; then
              ACTUAL_SHA256=$(sha256sum /tmp/public-pool.json | awk '{print $1}')
              if [ "$ACTUAL_SHA256" = "$EXPECTED_SHA256" ]; then
                node scripts/validate-verified-question-pool.mjs /tmp/public-pool.json
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" = 1

      - name: Refill summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('verified-question-pool-v1.json','utf8'));
          console.log('## One-time verified pool refill');
          for(const s of ['math','science','social','english','japanese']) console.log(`- ${s}: ${p.subjects[s].length}/${p.targetPerSubject}`);
          NODE
