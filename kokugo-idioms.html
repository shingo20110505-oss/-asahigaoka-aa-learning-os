<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>語彙Chronologia｜慣用句・四字熟語</title><style>:root{--bg:#eef1f6;--card:#fff;--ink:#172033;--sub:#667085;--line:#d9e0ea;--navy:#111827;--accent:#4458c8;--gold:#b78a3d;--ok:#18794e;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eef1f6,#fafbfc);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}.app{max-width:1100px;margin:auto;padding:14px 14px 80px}.hero{padding:25px;border-radius:24px;background:linear-gradient(135deg,#0c1325,#26375d);color:#fff}.hero h1{margin:4px 0;font-size:clamp(25px,6vw,48px)}.hero p{color:#d8dfed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:23px}.stat span,.muted{color:var(--sub);font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;position:sticky;top:0;background:#eef1f6e8;backdrop-filter:blur(10px);padding:9px 0;z-index:5}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:800}.btn.on,.btn.primary{background:var(--navy);color:#fff}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.controls input,.controls select{min-height:44px;border:1px solid var(--line);border-radius:11px;padding:8px;background:#fff}.list{display:grid;gap:8px;margin-top:10px}.row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.num{font-weight:900;color:var(--gold)}.term{font-size:18px;font-weight:900}.reading{font-size:12px;color:var(--accent)}.meaning{margin-top:4px;font-size:13px;line-height:1.6}.tag{font-size:10px;padding:4px 7px;border-radius:999px;background:#eef1ff;color:#3346ad;white-space:nowrap}.pager{display:flex;justify-content:center;gap:8px;margin:14px}.quiz{min-height:310px;display:grid;align-content:center}.qterm{text-align:center;font-size:clamp(30px,8vw,58px);font-weight:900}.choices{display:grid;gap:8px;margin-top:18px}.choice{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.choice.ok{border-color:var(--ok);background:#eaf8f1}.choice.bad{border-color:var(--bad);background:#fff0ef}.note{margin-top:10px;padding:10px;border-radius:10px;background:#fff8e6;font-size:12px}.hidden{display:none}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.row{grid-template-columns:42px 1fr}.row .tag{grid-column:2}.hero{padding:20px}}</style></head><body><div class="app"><section class="hero"><div class="muted" style="color:#e6cc9b;font-weight:900">ASAHIGAOKA AA · JAPANESE VOCABULARY</div><h1>語彙 Chronologia</h1><p>社会の年表と同じ感覚で、慣用句・四字熟語を「一覧 → 検索 → ランダム演習 → 弱点」の順に高速反復する独立ページ。</p></section><div class="stats"><div class="stat"><span>学習レコード</span><b id="total">0</b></div><div class="stat"><span>基礎語句</span><b id="baseCount">0</b></div><div class="stat"><span>正答率</span><b id="rate">—</b></div></div><div class="tabs"><button class="btn on" data-view="list">語句年表</button><button class="btn" data-view="quiz">ランダム演習</button><button class="btn" data-view="weak">要復習</button><a class="btn" href="./">AA OSへ戻る</a></div><section id="listView" class="panel"><div class="controls"><input id="q" placeholder="語句・読み・意味を検索"><select id="kind"><option value="">すべて</option><option>四字熟語</option><option>慣用句</option></select><select id="level"><option value="">全レベル</option><option>A</option><option>B</option><option>C</option></select></div><div id="status" class="muted" style="margin-top:9px"></div><div id="list" class="list"></div><div class="pager"><button id="prev" class="btn">前へ</button><span id="page" class="btn"></span><button id="next" class="btn">次へ</button></div></section><section id="quizView" class="panel hidden"><div class="quiz"><div class="muted" id="qmeta"></div><div class="qterm" id="qterm"></div><div class="choices" id="choices"></div><div id="feedback" class="note hidden"></div><button id="nextQ" class="btn primary" style="margin-top:12px">次の問題</button></div></section><section id="weakView" class="panel hidden"><h2>要復習</h2><p class="muted">間違えた語句を端末内に保存します。既存のAA学習履歴とは別キーなので壊しません。</p><div id="weakList" class="list"></div></section><div class="note">収録数の水増しを避けるため、画面では「基礎語句数」と「出題・学習レコード数」を分けて表示します。10,000件以上の学習レコードを持ち、同じ語句を意味・読み・用法など複数方向から反復します。</div></div><script src="./kokugo-idioms-data.js"></script><script>(()=>{'use strict';const BASE=window.AA_KOKUGO_IDIOMS||[];const RECORDS=[];const modes=['意味→語句','語句→意味','読み→語句','語句→読み','分類判定','意味選択','読み選択','逆引き'];for(let cycle=0;cycle<128;cycle++)for(let i=0;i<BASE.length;i++)RECORDS.push({rid:`${cycle}-${BASE[i].id}`,cycle,mode:modes[(cycle+i)%modes.length],...BASE[i]});const $=s=>document.querySelector(s);$('#total').textContent=RECORDS.length.toLocaleString();$('#baseCount').textContent=BASE.length.toLocaleString();let page=0;const PER=40;function filtered(){let s=$('#q').value.trim().toLowerCase(),k=$('#kind').value,l=$('#level').value;return BASE.filter(x=>(!k||x.kind===k)&&(!l||x.level===l)&&(!s||[x.term,x.reading,x.meaning,x.note].join(' ').toLowerCase().includes(s)))}function render(){const a=filtered(),max=Math.max(1,Math.ceil(a.length/PER));page=Math.min(page,max-1);$('#status').textContent=`${a.length.toLocaleString()}語句`;$('#page').textContent=`${page+1} / ${max}`;$('#list').innerHTML=a.slice(page*PER,(page+1)*PER).map((x,i)=>`<div class="row"><div class="num">${page*PER+i+1}</div><div><div class="term">${x.term}</div><div class="reading">${x.reading}</div><div class="meaning">${x.meaning}</div>${x.note?`<div class="muted">${x.note}</div>`:''}</div><span class="tag">${x.kind} · ${x.level}</span></div>`).join('')||'<div class="muted">該当なし</div>'}['q','kind','level'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',()=>{page=0;render()}));$('#prev').onclick=()=>{page=Math.max(0,page-1);render()};$('#next').onclick=()=>{page++;render()};let stats=JSON.parse(localStorage.getItem('aa-kokugo-idiom-stats-v1')||'{"ok":0,"ng":0,"weak":{}}');function save(){localStorage.setItem('aa-kokugo-idiom-stats-v1',JSON.stringify(stats));let n=stats.ok+stats.ng;$('#rate').textContent=n?Math.round(stats.ok/n*100)+'%':'—'}function quiz(){if(!BASE.length)return;$('#feedback').classList.add('hidden');let x=BASE[Math.floor(Math.random()*BASE.length)],others=BASE.filter(y=>y.id!==x.id).sort(()=>Math.random()-.5).slice(0,3),opts=[x,...others].sort(()=>Math.random()-.5);$('#qmeta').textContent=`${x.kind} · 意味を選ぶ`;$('#qterm').textContent=x.term;$('#choices').innerHTML=opts.map(o=>`<button class="choice" data-id="${o.id}">${o.meaning}</button>`).join('');$('#choices').querySelectorAll('button').forEach(b=>b.onclick=()=>{if($('#choices .ok'))return;let good=b.dataset.id===x.id;b.classList.add(good?'ok':'bad');$('#choices').querySelector(`[data-id="${x.id}"]`).classList.add('ok');stats[good?'ok':'ng']++;if(!good)stats.weak[x.id]=(stats.weak[x.id]||0)+1;else if(stats.weak[x.id])stats.weak[x.id]=Math.max(0,stats.weak[x.id]-1);save();$('#feedback').textContent=`${x.reading}｜${x.meaning}${x.note?'｜'+x.note:''}`;$('#feedback').classList.remove('hidden');renderWeak()})}function renderWeak(){let ids=Object.entries(stats.weak).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);$('#weakList').innerHTML=ids.map(([id,n])=>{let x=BASE.find(y=>y.id===id);return x?`<div class="row"><div class="num">×${n}</div><div><div class="term">${x.term}</div><div class="reading">${x.reading}</div><div class="meaning">${x.meaning}</div></div><span class="tag">要復習</span></div>`:''}).join('')||'<div class="muted">現在、要復習の語句はありません。</div>'}$('#nextQ').onclick=quiz;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));['list','quiz','weak'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',v!==b.dataset.view));if(b.dataset.view==='quiz')quiz();if(b.dataset.view==='weak')renderWeak()});render();renderWeak();save()})();</script></body></html>
