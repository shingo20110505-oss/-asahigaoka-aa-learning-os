<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>オフライン｜旭丘AA Learning OS</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#edf1f6;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}.card{max-width:520px;background:#fff;border:1px solid #d9e0ea;border-radius:20px;padding:24px;box-shadow:0 14px 34px rgba(16,24,40,.08)}.mark{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#111827;color:#fff;font-weight:900}h1{font-size:22px;margin:18px 0 8px}p{line-height:1.75;color:#667085}.btn{border:0;border-radius:13px;padding:12px 16px;background:#111827;color:#fff;font:inherit;font-weight:800;min-height:46px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">AA</div>
    <h1>オフラインです</h1>
    <p>一度オンラインで旭丘AA Learning OSを開くと、次回から学習画面をオフラインでも利用できます。通信が戻ったら再読み込みしてください。</p>
    <button class="btn" onclick="location.reload()">もう一度開く</button>
  </main>
</body>
</html>
