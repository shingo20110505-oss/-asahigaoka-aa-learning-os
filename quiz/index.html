<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1832"><title>全語彙クイズ｜Rise</title><style>:root{color-scheme:dark;--bg:#071226;--panel:#102247;--line:#2b4774;--text:#f6f8ff;--sub:#b9c8e2;--accent:#7894ff;--ok:#72deb3;--bad:#ff909d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1d386a 0,#08152d 46%,#061022 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;min-height:100vh}.wrap{max-width:880px;margin:auto;padding:18px 16px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back,.filter,.choice,.next{border:1px solid var(--line);background:#0f2246;color:#eef3ff;border-radius:14px;padding:10px 13px;text-decoration:none;font-weight:800}.hero,.quiz,.source{border:1px solid rgba(139,168,232,.22);background:linear-gradient(145deg,rgba(25,50,94,.96),rgba(11,29,59,.97));border-radius:22px;box-shadow:0 18px 45px rgba(0,0,0,.17)}.hero{margin-top:16px;padding:23px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#abc1ff;font-weight:900}.hero h1{font-size:clamp(28px,6vw,42px);margin:7px 0}.hero p{color:var(--sub);line-height:1.72;margin:0}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.source{padding:12px;background:rgba(7,22,49,.52)}.source b{font-size:18px;display:block}.source span{font-size:11px;color:var(--sub)}.filters{display:flex;gap:8px;overflow:auto;padding:16px 0 5px}.filter{white-space:nowrap}.filter.on{background:#6f8bf0;border-color:#93a9ff}.quiz{margin-top:14px;padding:22px}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--sub);font-size:12px}.prompt{font-size:clamp(23px,5vw,34px);line-height:1.45;margin:24px 0}.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;font-size:15px;font-weight:650}.choice.ok{border-color:var(--ok);background:rgba(114,222,179,.12)}.choice.bad{border-color:var(--bad);background:rgba(255,144,157,.1)}.feedback{margin:13px 0;padding:14px;border-radius:15px;background:#091a38;color:var(--sub);line-height:1.7}.feedback b{color:#fff}.next{background:#718cf0;border-color:#94a9ff;min-height:48px;width:100%;font-size:15px}.status{margin-top:13px;color:var(--sub);font-size:12px;line-height:1.6}.hidden{display:none!important}iframe{display:none}@media(max-width:650px){.counts{grid-template-columns:1fr 1fr}.hero,.quiz{padding:18px}.prompt{margin:20px 0}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../">← Rise</a><strong>全語彙クイズ</strong></div><section class="hero"><div class="eyebrow">UNIFIED VOCABULARY QUIZ</div><h1>語彙を、1か所で。</h1><p>英語・国語・理科・社会の既存語彙資産を横断して出題します。元データは変更せず、このページの成績だけを別保存します。</p><div class="counts"><div class="source"><b id="enCount">接続中</b><span>英語</span></div><div class="source"><b id="jaCount">—</b><span>国語</span></div><div class="source"><b id="scCount">—</b><span>理科</span></div><div class="source"><b id="soCount">—</b><span>社会</span></div></div><div class="status" id="status">英単語履歴を読み取り専用で接続しています。</div></section><nav class="filters" id="filters"><button class="filter on" data-s="all">すべて</button><button class="filter" data-s="english">英語</button><button class="filter" data-s="japanese">国語</button><button class="filter" data-s="science">理科</button><button class="filter" data-s="social">社会</button></nav><section class="quiz"><div class="meta"><span id="kind">—</span><span id="score">0 / 0</span></div><h2 class="prompt" id="prompt">問題を準備中…</h2><div id="choices"></div><div class="feedback hidden" id="feedback"></div><button class="next" id="next">次の問題</button></section></main><iframe id="bridge" src="../index.html?vocab_quiz_bridge=1" title="" aria-hidden="true"></iframe><script src="../japanese-vocabulary-10000.js"></script><script src="../curriculum-v2-data.js"></script><script>(()=>{'use strict';const KEY='rise-unified-vocab-quiz-v1',label={english:'英語',japanese:'国語',science:'理科',social:'社会'};let pools={english:[],japanese:[],science:[],social:[]},subject='all',current=null,locked=false,state={seen:0,correct:0,by:{}};try{state=Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(_){}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s??'').trim();function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){}}function add(sub,id,prompt,answer,explain,weight=1){prompt=norm(prompt);answer=norm(answer);if(!prompt||!answer||prompt===answer)return;pools[sub].push({id:`${sub}:${id}`,sub,prompt,answer,explain:norm(explain)||`${prompt} = ${answer}`,weight})}function dedupe(a){const seen=new Set;return a.filter(x=>{const k=(x.prompt+'\u0000'+x.answer).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}function seed(){const cur=window.AA_V2_CURRICULUM||{};(cur.japanese||[]).forEach(r=>add('japanese',r[0],r[2],r[3],r[4]));(cur.science||[]).forEach(r=>add('science',r[0],r[2],r[3],r[4]));(cur.social||[]).forEach(r=>add('social',r[0],r[2],r[3],r[4]));const ja=window.AA_JA_VOCAB_10000?.entries||[];ja.forEach((r,i)=>{if(r[1])add('japanese','ninjal-'+i,r[0],r[1],`${r[0]} の読みは「${r[1]}」。`)});for(const k of ['japanese','science','social'])pools[k]=dedupe(pools[k]);counts()}function counts(){$('#enCount').textContent=pools.english.length?pools.english.length.toLocaleString():'接続中';$('#jaCount').textContent=pools.japanese.length.toLocaleString();$('#scCount').textContent=pools.science.length.toLocaleString();$('#soCount').textContent=pools.social.length.toLocaleString()}function active(){return subject==='all'?[...pools.english,...pools.japanese,...pools.science,...pools.social]:pools[subject]}function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pickWeighted(a){if(!a.length)return null;const expanded=[];for(const x of a){const n=Math.max(1,Math.min(5,+x.weight||1));for(let i=0;i<n;i++)expanded.push(x)}return expanded[Math.floor(Math.random()*expanded.length)]}function next(){locked=false;$('#feedback').classList.add('hidden');const a=active();current=pickWeighted(a);if(!current){$('#prompt').textContent='この教科の語彙データを準備中です。';$('#choices').innerHTML='';return}$('#kind').textContent=`${label[current.sub]} · ${current.sub==='japanese'&&current.id.includes('ninjal-')?'読み':'語彙'}`;$('#prompt').textContent=current.prompt;let candidates=pools[current.sub].filter(x=>x.id!==current.id&&x.answer!==current.answer);if(candidates.length<3)candidates=a.filter(x=>x.id!==current.id&&x.answer!==current.answer);const opts=shuffle([current,...shuffle(candidates).slice(0,3)]);$('#choices').innerHTML=opts.map(x=>`<button class="choice" data-id="${esc(x.id)}">${esc(x.answer)}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b))}function answer(b){if(locked||!current)return;locked=true;const ok=b.dataset.id===current.id;document.querySelectorAll('.choice').forEach(x=>{if(x.dataset.id===current.id)x.classList.add('ok')});if(!ok)b.classList.add('bad');state.seen=(+state.seen||0)+1;if(ok)state.correct=(+state.correct||0)+1;state.by=state.by||{};const s=state.by[current.sub]||(state.by[current.sub]={seen:0,correct:0});s.seen++;if(ok)s.correct++;save();$('#score').textContent=`${state.correct} / ${state.seen}`;const f=$('#feedback');f.innerHTML=`<b>${ok?'正解':'要復習'}</b><br>${esc(current.prompt)} → ${esc(current.answer)}<br>${esc(current.explain)}`;f.classList.remove('hidden')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));subject=b.dataset.s;next()});$('#next').onclick=next;const frame=$('#bridge');function inject(){try{const d=frame.contentDocument;if(!d?.body||d.getElementById('rise-vocab-quiz-bridge'))return;const s=d.createElement('script');s.id='rise-vocab-quiz-bridge';s.textContent=`(()=>{function go(n=0){try{if(!window.AA_API_READING_ONLY||typeof vocabPool!=='function'||typeof state==='undefined')throw 0;const snap=v=>{const sid=v.srsId||'v:'+v.id,it=state.items?.[sid]||null,r=it?.lastReviewAt&&typeof retention==='function'?retention(it):0,u=state.profile?.unknownWords?.[String(v.word||'').toLowerCase()],fr=!!u&&(!it?.lastReviewAt||(+u.lastSeenAt||0)>=(+it.lastReviewAt||0));return{id:String(v.id),word:String(v.word||''),meaning:String(v.meaning||''),level:String(v.level||''),progress:it?{seen:+it.seen||0,lapses:+it.lapses||0,retention:+r||0,due:!!it.lastReviewAt&&(+it.dueAt||0)<=Date.now(),fromReading:fr}:{seen:0,lapses:0,retention:0,due:false,fromReading:fr}}};window.AA_RISE_VOCAB_QUIZ_API={list:()=>vocabPool().map(snap)}}catch(_){if(n<180)setTimeout(()=>go(n+1),100)}}go()})();`;d.body.appendChild(s)}catch(_){}}function connect(n=0){inject();try{const api=frame.contentWindow.AA_RISE_VOCAB_QUIZ_API;if(api){const list=api.list();pools.english=dedupe(list.filter(v=>v.word&&v.meaning).map(v=>({id:'english:'+v.id,sub:'english',prompt:v.word,answer:v.meaning,explain:`${v.word} = ${v.meaning}`,weight:(v.progress?.fromReading||v.progress?.due||(+v.progress?.lapses||0)>=2)?5:(!(+v.progress?.seen||0)?2:1)})));counts();const weak=list.filter(v=>v.progress?.fromReading||v.progress?.due||(+v.progress?.lapses||0)>=2).length;$('#status').textContent=`英語 ${pools.english.length.toLocaleString()}語句を接続済み。要復習語 ${weak.toLocaleString()}語は出題優先度を高くしています。国語・理科・社会はローカル固定データです。`;if(!current)next();return}}catch(_){}if(n<200)setTimeout(()=>connect(n+1),120);else{$('#enCount').textContent='未接続';$('#status').textContent='英語履歴は取得できませんでした。国語・理科・社会の統合クイズは利用できます。'}}frame.addEventListener('load',()=>connect());seed();$('#score').textContent=`${state.correct||0} / ${state.seen||0}`;next();connect()})();</script></body></html>
