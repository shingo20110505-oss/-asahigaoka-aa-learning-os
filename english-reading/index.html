<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1832"><title>語彙連動 英文長文｜Rise</title><style>:root{color-scheme:dark;--bg:#071329;--panel:#102348;--line:#2a4775;--text:#f6f8ff;--sub:#b8c8e5;--accent:#7995ff;--hint:#ffd98a;--ok:#73ddb5;--bad:#ff929e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1c3565 0,#08152d 45%,#061022 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}.wrap{max-width:930px;margin:auto;padding:18px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back,.pill,.tool,.choice,.next{border:1px solid var(--line);background:#0e2246;color:#edf3ff;border-radius:14px;text-decoration:none;padding:10px 13px;font-weight:800}.hero,.panel{margin-top:16px;border:1px solid rgba(140,170,235,.22);border-radius:22px;background:linear-gradient(145deg,rgba(25,50,94,.95),rgba(11,29,59,.97));box-shadow:0 18px 45px rgba(0,0,0,.17)}.hero{padding:23px}.eyebrow{font-size:12px;color:#aac0ff;letter-spacing:.12em;font-weight:900}.hero h1{margin:7px 0;font-size:clamp(27px,6vw,42px)}.hero p{margin:0;color:var(--sub);line-height:1.75}.sync{margin-top:13px;padding:11px 13px;border-radius:14px;background:#0a1d3d;color:var(--sub);font-size:13px}.sync strong{color:#dfe9ff}.passages{display:flex;gap:8px;overflow:auto;padding:16px 0 4px}.pill{white-space:nowrap}.pill.on{background:#6f8bf0;border-color:#93a9ff}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tool[aria-pressed="true"]{background:#405d9f}.panel{padding:21px}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--sub);font-size:12px}.reading{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.95;letter-spacing:.01em}.reading .vocab{border-bottom:2px dotted var(--hint);color:#fff3cc}.vocabBox,.structure,.summary{margin-top:14px;padding:14px;border-radius:16px;background:#091b39;border:1px solid #24416d;color:var(--sub);line-height:1.7}.vocabBox b,.structure b,.summary b{color:#fff}.hidden{display:none!important}.questions{margin-top:18px}.qcard{padding:16px 0;border-top:1px solid rgba(255,255,255,.1)}.qcard h3{font-size:15px;line-height:1.6}.choice{display:block;width:100%;text-align:left;margin:7px 0;font-weight:600}.choice.ok{border-color:var(--ok);background:rgba(115,221,181,.12)}.choice.bad{border-color:var(--bad);background:rgba(255,146,158,.1)}.explain{font-size:13px;color:var(--sub);line-height:1.65;margin-top:8px}.score{font-weight:900;color:#dce7ff}.target{display:inline-block;margin:3px;padding:5px 8px;border-radius:999px;background:rgba(255,217,138,.09);border:1px solid rgba(255,217,138,.2);font-size:12px}.target.weak{border-color:#ffb2ba;background:rgba(255,146,158,.09)}iframe{display:none}@media(max-width:620px){.panel,.hero{padding:18px}.reading{font-size:17px;line-height:1.9}.meta{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../">← Rise</a><strong>語彙連動 英文長文</strong></div><section class="hero"><div class="eyebrow">VOCABULARY-AWARE READING</div><h1>知っている単語を、読める力へ。</h1><p>既存の英単語学習履歴を読み取り、要復習・未定着語を含む長文を優先します。単語ヒント・文構造・段落要約は必要なときだけ表示できます。</p><div class="sync" id="sync"><strong>語彙履歴を接続中</strong>｜接続できるまでは固定長文をそのまま利用できます。</div></section><nav class="passages" id="passages"></nav><div class="tools"><button class="tool" id="vocabTool" aria-pressed="true">単語ヒント</button><button class="tool" id="structureTool" aria-pressed="false">文構造</button><button class="tool" id="summaryTool" aria-pressed="false">段落要約</button></div><section class="panel"><div class="meta"><span id="level"></span><span class="score" id="personal"></span></div><h2 id="title"></h2><div class="reading" id="reading"></div><div class="vocabBox" id="vocabBox"></div><div class="structure hidden" id="structure"></div><div class="summary hidden" id="summary"></div><div class="questions" id="questions"></div></section></main><iframe id="bridge" src="../index.html?vocab_read_bridge=1" title="" aria-hidden="true"></iframe><script>(()=>{'use strict';const KEY='rise-assisted-reading-v1';const DATA=[{id:'community-library',title:'A Library That Changed Its Role',level:'入試〜高校基礎 · 約190語',targets:{community:'地域社会',access:'利用する機会',resource:'資源・資料',provide:'提供する',opportunity:'機会',digital:'デジタルの',support:'支援する',local:'地域の'},text:`For many years, people thought of a library mainly as a quiet place to borrow books. However, one community library has gradually changed its role. It still provides books, but it now offers many other resources. Students can use digital tools, older people can learn how to access online services, and local groups can hold small meetings there. The change began when the library staff asked residents what they needed most. Many people said that they wanted a safe place to study, learn, and meet others. In response, the library created free classes and opened a room where students could work together after school. These services do not replace books. Instead, they give people more opportunities to use information in different ways. The library has become especially important for people who do not have reliable internet access at home. By listening to the community and providing practical support, the library has shown that a public building can change while keeping its original purpose: helping people learn.`,structure:'However で従来像と現在を対比。when the staff asked... が変化のきっかけ、By listening... が結論の手段を示す。',summary:'図書館が住民の必要を聞き、本だけでなくデジタル利用・学習場所・地域活動の機会を提供する施設へ役割を広げた。',qs:[['What caused the library to begin changing?',['The staff asked residents about their needs.','It stopped lending books.','A new school was built nearby.','Residents lost interest in learning.'],0,'The change began when the staff asked residents what they needed most.'],['Who especially benefits from the new services?',['People without reliable internet at home.','Only professional researchers.','Only library staff.','People who never use information.'],0,'本文後半で internet access が安定しない人に特に重要とある。'],['What is the main idea?',['The library expanded how it supports learning.','Printed books are no longer useful.','Meetings should replace studying.','Libraries should become private businesses.'],0,'本を残しながら学習支援の方法を広げたことが中心。']]},{id:'urban-trees',title:'Why Cities Need More Trees',level:'入試〜高校基礎 · 約180語',targets:{temperature:'気温',reduce:'減らす',surface:'表面',energy:'エネルギー',environment:'環境',benefit:'利益・恩恵',shade:'日陰',absorb:'吸収する'},text:`On a hot summer day, the temperature in a city can be much higher than in the countryside around it. Roads and buildings absorb heat during the day and release it slowly at night. One simple way to reduce this effect is to plant more trees. Trees provide shade, so sidewalks and building surfaces receive less direct sunlight. They also release water into the air through their leaves, which can help cool the environment. The benefits are not limited to temperature. Trees can absorb some air pollutants, provide homes for birds and insects, and make streets more pleasant for people walking or cycling. In some neighborhoods, well-placed trees can even reduce the amount of energy used for air conditioning. However, planting trees is not enough by itself. Cities must choose suitable species, give young trees enough water, and protect their roots when roads are repaired. A tree that survives for many years can provide far more benefit than one that is planted quickly but poorly maintained.`,structure:'One simple way... が課題への解決策。The benefits are not limited... で効果を追加。However 以降で「植えるだけでは不十分」という条件を示す。',summary:'都市の樹木は日陰・蒸散で暑さを和らげ、環境や省エネにも役立つが、樹種選びや長期管理が必要。',qs:[['Why can cities stay hot at night?',['Roads and buildings release stored heat slowly.','Trees produce too much heat.','Birds warm the streets.','The countryside has more buildings.'],0,'第1段落で道路・建物が日中の熱を吸収し夜にゆっくり放出すると説明。'],['What does the writer say is necessary besides planting?',['Long-term care of trees.','Removing all roads.','Using more air conditioners.','Choosing only one tree species.'],0,'最後で水や根の保護など管理の必要性を述べる。'],['Which title best matches the passage?',['Trees as Long-Term Urban Infrastructure','Why Cities Should Remove Nature','The History of Air Conditioning','How to Build Taller Roads'],0,'都市の樹木の複数の効果と維持が主題。']]},{id:'language-mistakes',title:'Mistakes Can Help Language Learning',level:'入試〜高校基礎 · 約185語',targets:{mistake:'間違い',communicate:'伝える',improve:'改善する',notice:'気づく',practice:'練習',confidence:'自信',avoid:'避ける',effective:'効果的な'},text:`Many language learners want to speak perfectly, so they sometimes avoid speaking until they are sure that every sentence is correct. This may feel safe, but it can slow improvement. When learners try to communicate, they discover which words and grammar they can use easily and which parts still need practice. A mistake can therefore provide useful information. It shows a gap between what a learner wants to say and what the learner can currently express. Feedback is most effective when the learner first notices that gap and then tries again. This does not mean that every mistake must be corrected immediately. Too much correction can interrupt communication and reduce confidence. A teacher or study partner can instead focus on errors that change the meaning or appear repeatedly. Learners can also keep a short record of these errors and review them later. The goal is not to make as many mistakes as possible. The goal is to use necessary communication as a chance to notice problems, practice better forms, and gradually become more accurate.`,structure:'so で「完璧に話したい→話すのを避ける」。but でその弱点を反転。This does not mean... で誤解を限定し、The goal is... で結論。',summary:'間違いを避けて話さないより、実際に伝えようとして不足に気づき、重要な誤りを修正する方が学習に効果的。',qs:[['Why can speaking help learners improve?',['It reveals what they still need to practice.','It guarantees perfect grammar.','It removes the need for feedback.','It prevents all mistakes.'],0,'communicate することで使える部分と不足部分が分かる。'],['Why should not every mistake be corrected immediately?',['Too much correction can interrupt communication and reduce confidence.','Teachers cannot hear mistakes.','All mistakes are equally useful.','Correction makes vocabulary disappear.'],0,'本文で過度な訂正の弊害を明示。'],['What is the writer’s goal for learners?',['Use communication to notice and improve problems.','Make as many errors as possible.','Wait until every sentence is perfect.','Avoid speaking with other people.'],0,'最終文が主張を要約している。']]},{id:'food-waste',title:'A Small Change Against Food Waste',level:'入試〜高校基礎 · 約180語',targets:{waste:'無駄・廃棄',measure:'測る',amount:'量',reduce:'減らす',customer:'客',choice:'選択',instead:'その代わりに',result:'結果'},text:`A school cafeteria wanted to reduce food waste, but the staff did not know where to begin. Instead of guessing, they measured the amount of food left on students' trays for two weeks. The result surprised them. Vegetables were often left, but the largest amount of waste came from side dishes served in the same size to every student. The cafeteria then made a small change. Students could choose a regular or small portion and return for more if they were still hungry. This gave each student a simple choice without reducing the number of foods offered. After one month, the total amount of waste had fallen. The staff also noticed that students who chose small portions often returned for a little more, so they were not simply eating less. The project showed that collecting information before taking action can lead to a more effective solution. The cafeteria did not need an expensive machine or a complicated rule. It needed a way to match the amount of food more closely to each student's needs.`,structure:'Instead of guessing が方法の転換。but で「野菜より大きな原因」を提示。After one month が結果、The project showed... が一般化された教訓。',summary:'給食の残量を測定して原因を特定し、量を選べるようにした結果、食べる量を不当に減らさず食品廃棄を減らせた。',qs:[['What did the cafeteria do first?',['It measured leftover food for two weeks.','It bought a new machine.','It stopped serving vegetables.','It made every portion smaller.'],0,'推測せず2週間測定したのが最初の行動。'],['What change was introduced?',['Students could choose regular or small portions.','Students could eat only vegetables.','All side dishes were removed.','Students had to bring lunch.'],0,'regular or small portion を選び、おかわり可能にした。'],['What lesson does the project suggest?',['Collecting information can lead to a better solution.','Complicated rules always work best.','Food waste cannot be reduced.','Students should always eat less.'],0,'最後の段落で測定してから行動する有効性を述べる。']]}];let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}let vocab=[],order=DATA.slice(),idx=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function vstate(w){const v=vocab.find(x=>x.word.toLowerCase()===w.toLowerCase());if(!v)return null;const p=v.progress||{};if(p.fromReading||p.due||(+p.lapses||0)>=2)return'weak';if(!(+p.seen||0))return'new';if((+p.retention||0)<.72)return'learning';return'mastered'}function score(d){return Object.keys(d.targets).reduce((n,w)=>n+(vstate(w)==='weak'?4:vstate(w)==='new'?2:vstate(w)==='learning'?1:0),0)}function decorate(text,targets){const set=new Set(Object.keys(targets).map(x=>x.toLowerCase()));return text.split(/(\s+)/).map(t=>{const n=t.replace(/[^A-Za-z-]/g,'').toLowerCase();return set.has(n)?`<span class="vocab" title="${esc(targets[n])}">${esc(t)}</span>`:esc(t)}).join('')}function tabs(){order.sort((a,b)=>score(b)-score(a));$('#passages').innerHTML=order.map((d,i)=>`<button class="pill ${i===idx?'on':''}" data-i="${i}">${i===0&&vocab.length?'おすすめ · ':''}${esc(d.title)}</button>`).join('');document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render()})}function render(){tabs();const d=order[idx];$('#title').textContent=d.title;$('#level').textContent=d.level;const s=score(d);$('#personal').textContent=vocab.length?`あなたの要復習候補スコア ${s}`:'固定教材モード';$('#reading').innerHTML=decorate(d.text,d.targets);$('#vocabBox').innerHTML='<b>語彙ヒント</b><br>'+Object.entries(d.targets).map(([w,m])=>`<span class="target ${vstate(w)==='weak'?'weak':''}">${esc(w)} = ${esc(m)}${vstate(w)==='weak'?' · 要復習':''}</span>`).join('');$('#structure').innerHTML='<b>文構造ヒント</b><br>'+esc(d.structure);$('#summary').innerHTML='<b>段落要約</b><br>'+esc(d.summary);$('#questions').innerHTML=d.qs.map((q,qi)=>`<div class="qcard" data-q="${qi}"><h3>Q${qi+1}. ${esc(q[0])}</h3>${q[1].map((o,oi)=>`<button class="choice" data-o="${oi}">${esc(o)}</button>`).join('')}<div class="explain hidden"></div></div>`).join('');document.querySelectorAll('.qcard').forEach(card=>card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(card,b,d)))}function answer(card,b,d){if(card.dataset.locked)return;card.dataset.locked='1';const qi=+card.dataset.q,correct=d.qs[qi][2],ok=+b.dataset.o===correct;card.querySelectorAll('.choice').forEach(x=>{if(+x.dataset.o===correct)x.classList.add('ok')});if(!ok)b.classList.add('bad');const ex=card.querySelector('.explain');ex.textContent=(ok?'正解。':'要確認。')+d.qs[qi][3];ex.classList.remove('hidden');progress[d.id]=progress[d.id]||{seen:0,correct:0};progress[d.id].seen++;if(ok)progress[d.id].correct++;progress[d.id].last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(_){}}function toggle(id,target){const b=$(id);b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));$(target).classList.toggle('hidden',!on)}}toggle('#vocabTool','#vocabBox');toggle('#structureTool','#structure');toggle('#summaryTool','#summary');const frame=$('#bridge');function inject(){try{const d=frame.contentDocument;if(!d?.body||d.getElementById('rise-vocab-read-bridge'))return;const s=d.createElement('script');s.id='rise-vocab-read-bridge';s.textContent=`(()=>{function go(n=0){try{if(!window.AA_API_READING_ONLY||typeof vocabPool!=='function'||typeof state==='undefined')throw 0;const snap=v=>{const sid=v.srsId||'v:'+v.id,it=state.items?.[sid]||null,r=it?.lastReviewAt&&typeof retention==='function'?retention(it):0,u=state.profile?.unknownWords?.[String(v.word||'').toLowerCase()],fr=!!u&&(!it?.lastReviewAt||(+u.lastSeenAt||0)>=(+it.lastReviewAt||0));return{id:String(v.id),word:String(v.word||''),meaning:String(v.meaning||''),progress:it?{seen:+it.seen||0,lapses:+it.lapses||0,retention:+r||0,due:!!it.lastReviewAt&&(+it.dueAt||0)<=Date.now(),fromReading:fr}:{seen:0,lapses:0,retention:0,due:false,fromReading:fr}}};window.AA_RISE_VOCAB_READ_API={list:()=>vocabPool().map(snap)}}catch(_){if(n<180)setTimeout(()=>go(n+1),100)}}go()})();`;d.body.appendChild(s)}catch(_){}}function connect(n=0){inject();try{const api=frame.contentWindow.AA_RISE_VOCAB_READ_API;if(api){vocab=api.list().filter(v=>v.word);const weak=vocab.filter(v=>v.progress?.fromReading||v.progress?.due||(+v.progress?.lapses||0)>=2).length;$('#sync').innerHTML=`<strong>語彙履歴 接続済み</strong>｜${vocab.length.toLocaleString()}語句を参照・要復習候補 ${weak.toLocaleString()}語。履歴は読み取り専用です。`;idx=0;render();return}}catch(_){}if(n<200)setTimeout(()=>connect(n+1),120);else $('#sync').innerHTML='<strong>固定教材モード</strong>｜語彙履歴を取得できませんでしたが、長文と補助機能は利用できます。'}frame.addEventListener('load',()=>connect());render();connect()})();</script></body></html>
